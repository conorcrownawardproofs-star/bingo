      const rcy = h * (0.4 + 0.1 * Math.sin(t * 0.000035 + 0.6));
      for (const f of s.rasboras) {
        let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, n = 0;
        for (const o of s.rasboras) {
          if (o === f) continue;
          const dx = o.x - f.x, dy = o.y - f.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > 180 * 180) continue;
          const d = Math.sqrt(d2) || 0.0001;
          if (d < 54) {
            const push = (54 - d) / 54;
            sepX -= (dx / d) * push; sepY -= (dy / d) * push;
          }
          aliX += o.vx; aliY += o.vy; cohX += o.x; cohY += o.y; n++;
        }
        if (n) {
          aliX /= n; aliY /= n; cohX /= n; cohY /= n;
          f.vx += sepX * 0.1 + (aliX - f.vx) * 0.035 + (cohX - f.x) * 0.00045;
          f.vy += sepY * 0.1 + (aliY - f.vy) * 0.035 + (cohY - f.y) * 0.00045;
        }
        f.vx += (rcx - f.x) * 0.00013 + (Math.random() - 0.5) * 0.04;
        f.vy += (rcy - f.y) * 0.00013 + (Math.random() - 0.5) * 0.03;
        const RM = 28;
        if (f.x < RM) f.vx += (RM - f.x) * 0.004;
        if (f.x > w - RM) f.vx -= (f.x - (w - RM)) * 0.004;
        if (f.y < h * 0.18) f.vy += (h * 0.18 - f.y) * 0.004;
        if (f.y > sandTop - 30) f.vy -= (f.y - (sandTop - 30)) * 0.006;
        f.vx *= 0.986; f.vy *= 0.986;
        let rsp = Math.hypot(f.vx, f.vy);
        if (rsp > 1.15) { f.vx *= 1.15 / rsp; f.vy *= 1.15 / rsp; rsp = 1.15; }
        if (rsp < 0.26) {
          const a = Math.atan2(f.vy, f.vx || 0.001);
          f.vx = Math.cos(a) * 0.26; f.vy = Math.sin(a) * 0.26;
        }
        f.x += f.vx; f.y += f.vy;
        if (Math.abs(f.vx) > 0.15) f.dir = f.vx > 0 ? 1 : -1;
        f.wob += 0.09;

        const L = f.size;
        ctx.save();
        ctx.translate(f.x, f.y + Math.sin(f.wob) * 0.7);
        ctx.scale(f.dir, 1);
        ctx.fillStyle = '#d98a4a';                 // warm copper body
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.46, L * 0.27, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(240, 170, 110, 0.75)';
        ctx.beginPath();                           // forked tail
        ctx.moveTo(-L * 0.42, 0);
        ctx.lineTo(-L * 0.68, -L * 0.2);
        ctx.lineTo(-L * 0.56, 0);
        ctx.lineTo(-L * 0.68, L * 0.2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#22262b';                 // the signature black wedge
        ctx.beginPath();
        ctx.moveTo(-L * 0.04, -L * 0.16);
        ctx.lineTo(-L * 0.42, -L * 0.05);
        ctx.lineTo(-L * 0.42, L * 0.06);
        ctx.lineTo(-L * 0.16, L * 0.2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 214, 150, 0.5)';
        ctx.beginPath();                           // dorsal
        ctx.moveTo(0, -L * 0.25);
        ctx.lineTo(L * 0.12, -L * 0.4);
        ctx.lineTo(-L * 0.1, -L * 0.24);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.32, -L * 0.04, L * 0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Dwarf gourami — the calm centrepiece, feelers trailing underneath
      {
        const g = s.gourami;
        g.turnTimer -= 16;
        if (g.turnTimer <= 0) {                    // picks a new depth, sometimes turns
          g.targetY = h * (0.3 + Math.random() * 0.35);
          if (Math.random() < 0.45) g.dir *= -1;
          g.turnTimer = Math.random() * 3400 + 2200;
        }
        g.vy += (g.targetY - g.y) * 0.0006;
        g.vy *= 0.94;
        g.y += g.vy;
        g.x += g.speed * g.dir;
        g.wob += 0.045;
        if (g.x > w - 50) { g.x = w - 50; g.dir = -1; }
        if (g.x < 50) { g.x = 50; g.dir = 1; }

        const L = g.size;
        const yy = g.y + Math.sin(g.wob) * 1.6;
        ctx.save();
        ctx.translate(g.x, yy);
        ctx.scale(g.dir, 1);
        // tall, laterally compressed body
        const bg = ctx.createLinearGradient(0, -L * 0.42, 0, L * 0.42);
        bg.addColorStop(0, '#4aa8d8');
        bg.addColorStop(0.5, '#3f7fc4');
        bg.addColorStop(1, '#e07a4a');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.44, L * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();                                // turquoise banding
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.44, L * 0.36, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.strokeStyle = 'rgba(230, 130, 80, 0.55)';
        ctx.lineWidth = L * 0.06;
        for (let i = -3; i <= 3; i++) {
          ctx.beginPath();
          ctx.moveTo(i * L * 0.14 - L * 0.1, -L * 0.4);
          ctx.lineTo(i * L * 0.14 + L * 0.1, L * 0.4);
          ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle = 'rgba(90, 170, 210, 0.6)';
        ctx.beginPath();                           // dorsal sail
        ctx.moveTo(-L * 0.28, -L * 0.3);
        ctx.quadraticCurveTo(0, -L * 0.56, L * 0.24, -L * 0.26);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();                           // anal fin
        ctx.moveTo(-L * 0.3, L * 0.28);
        ctx.quadraticCurveTo(0, L * 0.56, L * 0.2, L * 0.24);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();                           // tail
        ctx.moveTo(-L * 0.4, 0);
        ctx.lineTo(-L * 0.66, -L * 0.24);
        ctx.lineTo(-L * 0.66, L * 0.24);
        ctx.closePath();
        ctx.fill();
        // the two thread-like pelvic feelers, drifting out of sync
        ctx.strokeStyle = 'rgba(240, 150, 90, 0.85)';
        ctx.lineWidth = L * 0.035;
        ctx.lineCap = 'round';
        for (let i = 0; i < 2; i++) {
          const ph = g.wob * 1.3 + i * 1.1;
          ctx.beginPath();
          ctx.moveTo(L * 0.1, L * 0.28);
          ctx.quadraticCurveTo(
            L * 0.02 + Math.sin(ph) * L * 0.1, L * 0.55,
            -L * 0.12 + Math.sin(ph + 0.6) * L * 0.16, L * 0.72);
          ctx.stroke();
        }
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.3, -L * 0.08, L * 0.055, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(L * 0.315, -L * 0.095, L * 0.02, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Otocinclus — park on the glass, rasp, scoot to the next patch
      for (const o of s.otos) {
        o.restTimer -= 16;
        if (o.restTimer <= 0) {
          o.moving = !o.moving;
          o.restTimer = o.moving ? Math.random() * 700 + 350 : Math.random() * 2200 + 1100;
          if (o.moving && Math.random() < 0.4) o.dir *= -1;
        }
        if (o.moving) {
          o.vx += (o.dir * 0.7 - o.vx) * 0.06;
          o.vy += ((Math.random() - 0.5) * 0.5 - o.vy) * 0.05;
        } else {
          o.vx *= 0.86; o.vy *= 0.86;
          o.rasp += 0.3;                           // little grazing wiggle
        }
        o.x += o.vx; o.y += o.vy;
        if (o.x < 18) { o.x = 18; o.dir = 1; }
        if (o.x > w - 18) { o.x = w - 18; o.dir = -1; }
        if (o.y < h * 0.2) o.y = h * 0.2;
        if (o.y > sandTop - 12) o.y = sandTop - 12;

        const L = o.size;
        ctx.save();
        ctx.translate(o.x, o.y + (o.moving ? 0 : Math.sin(o.rasp) * 0.5));
        ctx.scale(o.dir, 1);
        ctx.fillStyle = '#8f8674';                 // drab, flat-bellied little thing
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.48, L * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4b4438';                 // dark lateral band
        ctx.fillRect(-L * 0.42, -L * 0.035, L * 0.82, L * 0.07);
        ctx.fillStyle = 'rgba(190, 182, 165, 0.75)';
        ctx.beginPath();                           // small dorsal
        ctx.moveTo(-L * 0.02, -L * 0.13);
        ctx.lineTo(L * 0.1, -L * 0.3);
        ctx.lineTo(-L * 0.14, -L * 0.12);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();                           // tail
        ctx.moveTo(-L * 0.44, 0);
        ctx.lineTo(-L * 0.66, -L * 0.15);
        ctx.lineTo(-L * 0.66, L * 0.15);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#2c2820';                 // sucker mouth
        ctx.beginPath();
        ctx.arc(L * 0.45, L * 0.02, L * 0.075, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.3, -L * 0.05, L * 0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Glass catfish: translucent ribbon bodies hovering into the current
      for (const g of s.glassCats) {
        g.bob += 0.012;
        const gx = g.hx + Math.sin(g.bob) * 14;
        const gy = g.hy + Math.sin(g.bob * 1.6) * 8;
        const N = 8;
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const frac = i / N;
          pts.push({
            x: gx - frac * g.len,
            y: gy + Math.sin(t * 0.008 * g.wspd + i * 0.85) * frac * 3,
            half: 4.6 * (1 - frac) + 0.4
          });
        }
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0].x + 3, pts[0].y);
        for (const p of pts) ctx.lineTo(p.x, p.y - p.half);
        for (let i = N; i >= 0; i--) ctx.lineTo(pts[i].x, pts[i].y + pts[i].half);
        ctx.closePath();
        ctx.fillStyle = 'rgba(223, 233, 238, 0.26)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(88, 108, 120, 0.55)'; // the visible spine
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (const p of pts) ctx.lineTo(p.x, p.y);
        ctx.stroke();
        for (let i = 1; i < N - 1; i++) { // little bone ticks
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y - pts[i].half * 0.55);
          ctx.lineTo(pts[i].x, pts[i].y + pts[i].half * 0.55);
          ctx.stroke();
        }
        ctx.fillStyle = '#10151a'; // eye + barbels
        ctx.beginPath();
        ctx.arc(gx + 1.5, gy - 0.5, 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(200, 214, 222, 0.7)';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(gx + 2.5, gy);
        ctx.lineTo(gx + 11, gy - 4);
        ctx.moveTo(gx + 2.5, gy + 1);
        ctx.lineTo(gx + 10, gy + 3);
        ctx.stroke();
        ctx.restore();
      }

      // Corydoras working the sand — with the occasional dash up for air
      for (const c of s.corys) {
        c.bob += 0.05;
        if (c.mode === 'bottom') {
          c.x += c.speed * c.dir;
          if (c.x > w * 0.9) c.dir = -1;
          if (c.x < w * 0.1) c.dir = 1;
          if (--c.airTimer <= 0) { c.mode = 'up'; c.vy = -9; }
        } else if (c.mode === 'up') {
          c.vy *= 0.988;
          if (c.x > 30 && c.x < w - 30) c.x += c.dir * 1.6;
          if (c.vy > -0.8 || c.y < 14) {
            c.mode = 'down';
            c.vy = Math.max(c.vy, -0.5); // gulp taken — don't sail off-screen
          }
        } else {
          c.vy = Math.min(c.vy + 0.05, 1.4);
        }
        let cyPos;
        if (c.mode === 'bottom') {
          c.y = sandTop - 7;
          cyPos = c.y + Math.sin(c.bob) * 1.2;
        } else {
          c.y += c.vy;
          if (c.mode === 'down' && c.y >= sandTop - 7) {
            c.y = sandTop - 7;
            c.mode = 'bottom';
            c.airTimer = Math.random() * 1600 + 1100;
          }
          cyPos = c.y;
        }
        const L = c.size;
        ctx.save();
        ctx.translate(c.x, cyPos);
        ctx.scale(c.dir, 1);
        ctx.fillStyle = '#d9c49a';
        ctx.beginPath(); // arched back, flat belly, snout down
        ctx.moveTo(L * 0.5, L * 0.12);
        ctx.quadraticCurveTo(L * 0.3, -L * 0.4, -L * 0.15, -L * 0.32);
        ctx.quadraticCurveTo(-L * 0.5, -L * 0.18, -L * 0.52, L * 0.1);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(214, 224, 230, 0.75)'; // tail
        ctx.beginPath();
        ctx.moveTo(-L * 0.48, 0);
        ctx.lineTo(-L * 0.7, -L * 0.2);
        ctx.lineTo(-L * 0.68, L * 0.14);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#4a4234'; // speckles
        for (const sp of c.spots) {
          ctx.beginPath();
          ctx.arc(sp.dx * L * 0.4, sp.dy * L * 0.3 - L * 0.08, Math.max(0.6, sp.r * L), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = '#b09a72'; // barbels
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(L * 0.46, L * 0.1);
        ctx.lineTo(L * 0.56, L * 0.2);
        ctx.moveTo(L * 0.4, L * 0.12);
        ctx.lineTo(L * 0.47, L * 0.24);
        ctx.stroke();
        ctx.fillStyle = '#171512';
        ctx.beginPath();
        ctx.arc(L * 0.28, -L * 0.12, L * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Bristlenose pleco suckered onto the driftwood
      const pl = s.pleco;
      pl.tail += 0.015;
      ctx.save();
      ctx.translate(w * 0.255, h * 0.685);
      ctx.rotate(-0.62);
      const PL = 35;
      ctx.fillStyle = '#42301f';
      ctx.beginPath(); // flat-bellied wedge body
      ctx.moveTo(PL * 0.5, 0);
      ctx.quadraticCurveTo(PL * 0.2, -PL * 0.3, -PL * 0.3, -PL * 0.16);
      ctx.quadraticCurveTo(-PL * 0.55 + Math.sin(pl.tail) * 1.6, -PL * 0.05, -PL * 0.52 + Math.sin(pl.tail) * 2, PL * 0.1);
      ctx.lineTo(PL * 0.45, PL * 0.09);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#5d452c'; // splayed pectorals
      ctx.beginPath();
      ctx.ellipse(PL * 0.08, PL * 0.1, PL * 0.2, PL * 0.09, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(PL * 0.08, -PL * 0.16, PL * 0.18, PL * 0.08, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7a6242'; // mottling
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.arc((i * 53 % 26) - 13, ((i * 31 % 12) - 6) * 0.6, 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = '#7a6242'; // the bristles
      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(PL * 0.46, i * 1.3);
        ctx.quadraticCurveTo(PL * 0.56, i * 2 - 1, PL * 0.62, i * 2.6);
        ctx.stroke();
      }
      ctx.fillStyle = '#14110d';
      ctx.beginPath();
      ctx.arc(PL * 0.24, -PL * 0.1, 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Cherry shrimp picking across the sand
      for (const sh of s.shrimp) {
        sh.bob += 0.08;
        if (--sh.hopTimer <= 0) { sh.hop = 6; sh.hopTimer = Math.random() * 600 + 260; sh.dir = Math.random() < 0.5 ? -1 : 1; }
        if (sh.hop > 0) { sh.hop -= 0.25; sh.x += sh.dir * 1.4; }
        else sh.x += sh.dir * sh.speed;
        if (sh.x > w * 0.92) sh.dir = -1;
        if (sh.x < w * 0.08) sh.dir = 1;
        const sy = sandTop + 2 - (sh.hop > 0 ? Math.sin((6 - sh.hop) / 6 * Math.PI) * 9 : 0);
        ctx.save();
        ctx.translate(sh.x, sy);
        ctx.scale(sh.dir * sh.sc, sh.sc);
        ctx.strokeStyle = '#e34646';
        ctx.fillStyle = '#e34646';
        ctx.lineWidth = 2.6;
        ctx.lineCap = 'round';
        ctx.beginPath(); // comma-curved body
        ctx.arc(0, -2.5, 4, -0.2, Math.PI * 0.75);
        ctx.stroke();
        ctx.beginPath(); // tail fan
        ctx.moveTo(-3.4, 0.8);
        ctx.lineTo(-5.6, -0.6);
        ctx.lineTo(-4.6, 2);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 0.6; // legs + antennae
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.moveTo(1.5 - i * 1.3, 0.5);
          ctx.lineTo(1.2 - i * 1.3, 2.6);
        }
        ctx.moveTo(3.8, -3.5); ctx.lineTo(9, -6);
        ctx.moveTo(3.8, -3); ctx.lineTo(9.5, -3.6);
        ctx.stroke();
        ctx.restore();
      }

      // The snails, each on its own schedule
      for (const sn of s.snails) {
        sn.x += sn.speed * sn.dir;
        if (sn.x > w * 0.85) sn.dir = -1;
        if (sn.x < w * 0.15) sn.dir = 1;
        ctx.save();
        ctx.translate(sn.x, sandTop + 4);
        ctx.scale(sn.dir * sn.sc, sn.sc);
        ctx.fillStyle = '#e3c49c'; // foot
        ctx.beginPath();
        ctx.ellipse(1.5, 2.5, 7.5, 2.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c98f3f'; // shell
        ctx.beginPath();
        ctx.arc(-1, -3, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8a5c22';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc(-1, -3, 4, 0.5, Math.PI * 1.9);
        ctx.stroke();
        ctx.strokeStyle = '#e3c49c'; // antennae
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(6.5, 0.8); ctx.lineTo(9.5, -3);
        ctx.moveTo(7.2, 1.2); ctx.lineTo(10.5, -1);
        ctx.stroke();
        ctx.restore();
      }

      // Foreground planting: swords + vallisneria in front of the fish
      for (const p of s.swords) drawAquaPlant(ctx, p, sandTop, t, 0.95);
      for (const p of s.frontPlants) drawAquaPlant(ctx, p, sandTop, t, 0.9);

      // Bubbles: the airstone column + pearling off the plants
      for (const b of s.bubbles) {
        b.wob += 0.05;
        b.y -= b.speed;
        b.x += Math.sin(b.wob) * (b.pearl ? 0.15 : 0.4);
        if (b.y < -8) {
          b.y = sandTop - 2;
          b.x = b.pearl ? Math.random() * w : w * 0.82 + Math.random() * 12 - 6;
          if (b.pearl) b.y = sandTop - Math.random() * h * 0.35; // off a leaf, not the sand
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.28, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* =====================================================================
       NIGHT DRIVE — first-person city cruise.
       Sky with moon, stars and a blinking red-eye flight; three parallax
       skyline layers with lit windows and antenna beacons; a perspective
       road with lane dashes and streetlights rushing past; a car ahead on
       its taillights, oncoming headlights; then the cab: dashboard, glowing
       gauges, a steering wheel that leans into the curves, and a rearview
       mirror with traffic falling behind.
       ===================================================================== */

    /* Shared night sky: gradient, moon, twinkling stars, and a red-eye flight.
       Used by both City Nights and Night Drive. */
    function drawNightSky(ctx, s, t, w, h, horizon, rate = 1) {
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, '#04060f');
      sky.addColorStop(0.45, '#0d1230');
      sky.addColorStop(0.75, '#2a1745');
      sky.addColorStop(0.92, '#5b2a52');
      sky.addColorStop(1, '#8a4358');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, horizon + 2);

      // Moon with a soft halo
      const mx = w * 0.78, my = h * 0.13;
      const halo = ctx.createRadialGradient(mx, my, 6, mx, my, 70);
      halo.addColorStop(0, 'rgba(235, 240, 255, 0.5)');
      halo.addColorStop(1, 'rgba(235, 240, 255, 0)');
      ctx.fillStyle = halo;
      ctx.fillRect(mx - 70, my - 70, 140, 140);
      ctx.fillStyle = '#e8ecf7';
      ctx.beginPath();
      ctx.arc(mx, my, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(178, 188, 210, 0.55)';
      for (const [cdx, cdy, cr] of [[-5, -3, 3], [4, 5, 2.4], [6, -6, 1.8]]) {
        ctx.beginPath();
        ctx.arc(mx + cdx, my + cdy, cr, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const st of s.stars) {
        st.tw += 0.04 * rate;
        ctx.globalAlpha = 0.25 + Math.abs(Math.sin(st.tw)) * 0.6;
        ctx.fillStyle = '#e8edf7';
        ctx.fillRect(st.x | 0, st.y | 0, st.s, st.s);
      }
      ctx.globalAlpha = 1;

      // A red-eye flight crossing the sky
      const pn = s.plane;
      pn.x += 0.3 * rate * pn.dir;
      pn.blink += 0.09 * rate;
      if (pn.x > w + 80) { pn.x = -80; pn.y = h * (0.04 + Math.random() * 0.07); }
      ctx.fillStyle = 'rgba(190, 198, 214, 0.65)';
      ctx.fillRect(pn.x, pn.y, 8, 2);
      if (Math.sin(pn.blink) > 0.55) {
        ctx.fillStyle = '#ff5252';
        ctx.fillRect(pn.x + 8, pn.y, 2, 2);
      }
      if (Math.sin(pn.blink * 0.37) > 0.985) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(pn.x + 3, pn.y - 1, 3, 3);
      }
    }

    function makeSkylineLayer(w, h, opts) {
      const buildings = [];
      let x = 0;
      while (x < w * 1.5 + 240) {
        const bw = opts.wMin + Math.random() * (opts.wMax - opts.wMin);
        const bh = h * (opts.hMin + Math.random() * (opts.hMax - opts.hMin));
        const b = { x, w: bw, h: bh, antenna: Math.random() < opts.antenna, blink: Math.random() * Math.PI * 2 };
        if (opts.windows) {
          b.cols = Math.max(1, Math.floor(bw / 17));
          b.rows = Math.max(2, Math.floor(bh / 21));
          b.lit = Array.from({ length: b.cols * b.rows }, () => Math.random() < opts.lit);
        }
        buildings.push(b);
        x += bw + Math.random() * 16 + 5;
      }
      return { buildings, span: x, offset: Math.random() * x, speed: opts.speed, color: opts.color, win: opts.win };
    }

    function buildCityDrive(canvas) {
      const w = canvas.width, h = canvas.height;
      const horizon = h * 0.5;
      return {
        w, h, horizon,
        stars: Array.from({ length: 60 }, () => ({
          x: Math.random() * w, y: Math.random() * horizon * 0.7,
          s: Math.random() < 0.3 ? 2 : 1, tw: Math.random() * Math.PI * 2
        })),
        layers: [
          makeSkylineLayer(w, h, { speed: 0.12, wMin: 26, wMax: 70, hMin: 0.05, hMax: 0.15, color: '#171d3a', windows: true, win: 'rgba(90, 110, 175, 0.55)', lit: 0.2, antenna: 0.04 }),
          makeSkylineLayer(w, h, { speed: 0.3, wMin: 40, wMax: 100, hMin: 0.1, hMax: 0.26, color: '#0e1226', windows: true, win: '#f6c453', lit: 0.3, antenna: 0.1 }),
          makeSkylineLayer(w, h, { speed: 0.62, wMin: 60, wMax: 150, hMin: 0.16, hMax: 0.34, color: '#070912', windows: true, win: '#8fd4ff', lit: 0.16, antenna: 0.14 })
        ],
        plane: { x: -60, y: h * 0.07, dir: 1, blink: 0 },
        roadOff: 0,
        signBig: { active: false, x: 0, kind: 0, timer: 300 },
        signSmall: { active: false, x: 0, kind: 0, timer: 140 }
      };
    }

    function drawCityDrive(ctx, canvas, s, t) {
      const { w, h, horizon } = s;

      ctx.clearRect(0, 0, w, h);
      drawNightSky(ctx, s, t, w, h, horizon);

      // --- Skyline layers, far to near ---
      for (const layer of s.layers) {
        layer.offset += layer.speed;
        const baseX = -(layer.offset % layer.span);
        for (const pass of [baseX, baseX + layer.span]) {
          for (const b of layer.buildings) {
            const px = pass + b.x;
            if (px > w + 60 || px + b.w < -60) continue;
            ctx.fillStyle = layer.color;
            ctx.fillRect(px, horizon - b.h, b.w, b.h + 2);
            if (b.lit) {
              ctx.fillStyle = layer.win;
              for (let ci = 0; ci < b.cols; ci++) {
                for (let ri = 0; ri < b.rows; ri++) {
                  if (!b.lit[ri * b.cols + ci]) continue;
                  // A rare window flickers on/off as its office empties out
                  if (Math.sin(t * 0.001 + ci * 7 + ri * 13 + b.x) > 0.998) continue;
                  ctx.fillRect(px + 4 + ci * (b.w - 8) / b.cols, horizon - b.h + 5 + ri * (b.h - 8) / b.rows, 2.5, 3.5);
                }
              }
            }
            if (b.antenna) {
              b.blink += 0.012;
              ctx.strokeStyle = 'rgba(120, 130, 155, 0.8)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(px + b.w / 2, horizon - b.h);
              ctx.lineTo(px + b.w / 2, horizon - b.h - 14);
              ctx.stroke();
              if (Math.sin(b.blink * 6) > 0) {
                ctx.fillStyle = '#ff3b3b';
                ctx.beginPath();
                ctx.arc(px + b.w / 2, horizon - b.h - 15, 1.6, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        }
      }

      // Warm haze where the streets meet the sky
      const haze = ctx.createLinearGradient(0, horizon - 44, 0, horizon);
      haze.addColorStop(0, 'rgba(138, 67, 88, 0)');
      haze.addColorStop(1, 'rgba(160, 84, 96, 0.3)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizon - 44, w, 44);

      // --- Side-on highway streaming past in the foreground ---
      const speed = 9;
      s.roadOff += speed;
      const railY = h * 0.565;
      const roadTop = h * 0.605;

      // Dark embankment between the waterfront and the rail
      ctx.fillStyle = '#0b0e18';
      ctx.fillRect(0, horizon, w, railY - horizon);

      // Asphalt
      const roadGrad = ctx.createLinearGradient(0, roadTop, 0, h);
      roadGrad.addColorStop(0, '#181a24');
      roadGrad.addColorStop(1, '#0a0b10');
      ctx.fillStyle = roadGrad;
      ctx.fillRect(0, roadTop, w, h - roadTop);

      // Edge + shoulder lines
      ctx.fillStyle = 'rgba(230, 232, 240, 0.75)';
      ctx.fillRect(0, roadTop + 8, w, 3);
      ctx.fillRect(0, h - 14, w, 3);

      // Lane dashes streaming past
      ctx.fillStyle = '#e8e8ee';
      for (const laneY of [h * 0.735, h * 0.865]) {
        for (let x = -(s.roadOff % 130); x < w; x += 130) {
          ctx.fillRect(x, laneY, 74, 4);
        }
      }

      // Faint speed streaks on the tarmac
      ctx.fillStyle = 'rgba(200, 210, 230, 0.05)';
      for (let i = 0; i < 6; i++) {
        const sx = w - ((s.roadOff * 1.35 + i * 337) % (w + 220)) + 110;
        ctx.fillRect(sx, roadTop + 20 + (i * 83 % (h - roadTop - 40)), 90, 2);
      }

      // Roadside signs gliding by (drawn behind the guardrail).
      // Big boards rotate on a ~12-15s cycle; small signs on a ~6s cycle.
      const drawPost = (px2, topY, pw2) => {
        ctx.fillStyle = '#3a404c';
        ctx.fillRect(px2, topY, pw2, railY - topY + 10);
      };

      const sg = s.signBig;
      if (!sg.active) {
        if (--sg.timer <= 0) { sg.active = true; sg.x = w + 180; }
      } else {
        sg.x -= speed;
        if (sg.x < -440) {
          sg.active = false;
          sg.kind = (sg.kind + 1) % 4; // rotate through the four big boards
          sg.timer = 560 + Math.random() * 160; // next pass lands ~12-15s apart
        }
      }
      if (sg.active) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (sg.kind === 0) {
          // Big green board
          const pw = 310, ph = 96, px = sg.x, py = railY - 172;
          drawPost(px + 34, py + ph, 6);
          drawPost(px + pw - 40, py + ph, 6);
          ctx.fillStyle = '#0d6b35';
          ctx.strokeStyle = '#f2f4f8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 7); else ctx.rect(px, py, pw, ph);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 24px Arial, sans-serif';
          ctx.fillText('Welcome to Manhattan!', px + pw / 2, py + 32);
          ctx.font = 'italic 21px Georgia, serif';
          ctx.fillText('\u201CHello Gorgeous!\u201D', px + pw / 2, py + 67);
        } else if (sg.kind === 1) {
          // I-278 interstate shield
          const sw2 = 96, sh2 = 104, px = sg.x + 80, py = railY - 178;
          drawPost(px + sw2 / 2 - 3, py + sh2 - 4, 6);
          const shield = (inset) => {
            const x0 = px + inset, y0 = py + inset, ww = sw2 - inset * 2, hh = sh2 - inset * 2;
            ctx.beginPath();
            ctx.moveTo(x0, y0 + 8);
            ctx.quadraticCurveTo(x0 + ww / 2, y0 - 6, x0 + ww, y0 + 8);
            ctx.lineTo(x0 + ww, y0 + hh * 0.48);
            ctx.quadraticCurveTo(x0 + ww, y0 + hh * 0.82, x0 + ww / 2, y0 + hh);
            ctx.quadraticCurveTo(x0, y0 + hh * 0.82, x0, y0 + hh * 0.48);
            ctx.closePath();
          };
          shield(0);
          ctx.fillStyle = '#f2f4f8';
          ctx.fill();
          ctx.save();
          shield(4);
          ctx.clip();
          ctx.fillStyle = '#1d4fa1';
          ctx.fillRect(px, py, sw2, sh2);
          ctx.fillStyle = '#c8262d';
          ctx.fillRect(px, py, sw2, 30);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px Arial, sans-serif';
          ctx.fillText('INTERSTATE', px + sw2 / 2, py + 20);
          ctx.font = 'bold 38px Arial, sans-serif';
          ctx.fillText('278', px + sw2 / 2, py + 68);
          ctx.restore();
        } else if (sg.kind === 2) {
          // George Washington Bridge / I-95 North
          const pw = 320, ph = 96, px = sg.x, py = railY - 172;
          drawPost(px + 34, py + ph, 6);
          drawPost(px + pw - 40, py + ph, 6);
          ctx.fillStyle = '#0d6b35';
          ctx.strokeStyle = '#f2f4f8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 7); else ctx.rect(px, py, pw, ph);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 22px Arial, sans-serif';
          ctx.fillText('George Washington Bridge', px + pw / 2, py + 30);
          ctx.font = 'bold 24px Arial, sans-serif';
          ctx.fillText('\u2191 I-95 NORTH', px + pw / 2, py + 66);
        } else {
          // Distance board
          const pw = 290, ph = 100, px = sg.x, py = railY - 176;
          drawPost(px + 34, py + ph, 6);
          drawPost(px + pw - 40, py + ph, 6);
          ctx.fillStyle = '#0d6b35';
          ctx.strokeStyle = '#f2f4f8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 7); else ctx.rect(px, py, pw, ph);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 23px Arial, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('Yonkers', px + 26, py + 32);
          ctx.fillText('New York City', px + 26, py + 70);
          ctx.textAlign = 'right';
          ctx.fillText('1', px + pw - 26, py + 32);
          ctx.fillText('11', px + pw - 26, py + 70);
        }
        ctx.restore();
      }

      const sm = s.signSmall;
      if (!sm.active) {
        // Hold briefly if a big board is about to spawn on top of us
        const bigCrowding = sg.active && sg.x > w - 340;
        if (!bigCrowding && --sm.timer <= 0) { sm.active = true; sm.x = w + 140; }
      } else {
        sm.x -= speed;
        if (sm.x < -220) {
          sm.active = false;
          sm.kind = 1 - sm.kind;
          sm.timer = 120 + Math.random() * 35; // next pass ~6s after this one
        }
      }
      if (sm.active) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (sm.kind === 0) {
          // Speed limit
          const pw2 = 54, ph2 = 66, px = sm.x + 40, py = railY - 106;
          drawPost(px + pw2 / 2 - 3, py + ph2 - 3, 6);
          ctx.fillStyle = '#f2f4f8';
          ctx.strokeStyle = '#1a1d24';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px, py, pw2, ph2, 5); else ctx.rect(px, py, pw2, ph2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#1a1d24';
          ctx.font = 'bold 11px Arial, sans-serif';
          ctx.fillText('SPEED', px + pw2 / 2, py + 13);
          ctx.fillText('LIMIT', px + pw2 / 2, py + 26);
          ctx.font = 'bold 27px Arial, sans-serif';
          ctx.fillText('50', px + pw2 / 2, py + 48);
        } else {
          // Yellow diamond: curve ahead
          const d2 = 62, cx2 = sm.x + 70, cy2 = railY - 108;
          drawPost(cx2 - 3, cy2 + d2 * 0.6, 6);
          ctx.save();
          ctx.translate(cx2, cy2);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = '#f2c744';
          ctx.strokeStyle = '#1a1d24';
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(-d2 / 2, -d2 / 2, d2, d2, 7); else ctx.rect(-d2 / 2, -d2 / 2, d2, d2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          ctx.strokeStyle = '#1a1d24'; // the curving arrow
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(cx2 - 8, cy2 + 15);
          ctx.quadraticCurveTo(cx2 - 9, cy2 - 4, cx2 + 6, cy2 - 9);
          ctx.stroke();
          ctx.fillStyle = '#1a1d24';
          ctx.beginPath();
          ctx.moveTo(cx2 + 14, cy2 - 11);
          ctx.lineTo(cx2 + 2, cy2 - 16);
          ctx.lineTo(cx2 + 4, cy2 - 2);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      // Guardrail over the sign posts: uprights, then the W-beam rails
      ctx.fillStyle = '#343a46';
      for (let x = -(s.roadOff % 92); x < w; x += 92) {
        ctx.fillRect(x, railY - 8, 6, 24);
      }
      ctx.fillStyle = '#5c6472';
      ctx.fillRect(0, railY - 7, w, 6);
      ctx.fillStyle = '#4a515e';
      ctx.fillRect(0, railY + 2, w, 5);
      ctx.fillStyle = 'rgba(205, 215, 232, 0.3)';
      ctx.fillRect(0, railY - 7, w, 1.5);
    }

    /* =====================================================================
       NIGHT DRIVE — first-person run up to the George Washington Bridge.
       Same cab, road and streetlights; the skyline is swapped for the GWB
       looming ahead with lit cables, a low Manhattan shoreline behind it,
       and dark trees rushing past on both shoulders.
       ===================================================================== */

    function buildGwbDrive(canvas) {
      const w = canvas.width, h = canvas.height;
      const horizon = h * 0.5;
      const shoreline = [];
      let sx2 = 0;
      while (sx2 < w * 0.46) {
        const bw = 14 + Math.random() * 30;
        const bh = 10 + Math.random() * 34;
        shoreline.push({
          x: sx2, w: bw, h: bh,
          lit: Array.from({ length: Math.max(1, Math.floor(bw * bh / 150)) }, () => ({
            dx: Math.random() * (bw - 4) + 2, dy: Math.random() * (bh - 6) + 3
          }))
        });
        sx2 += bw + Math.random() * 8 + 2;
      }
      return {
        w, h, horizon, shoreline,
        shoreTrees: Array.from({ length: 42 }, () => ({
          x: Math.random() * w * 0.5, r: Math.random() * 11 + 5
        })),
        cliffs: (() => {
          const pts = [];
          let cx3 = w * 0.545;
          while (cx3 < w + 40) {
            pts.push({ x: cx3, top: 24 + Math.random() * 26 });
            cx3 += 24 + Math.random() * 28;
          }
          return pts;
        })(),
        loneTower: {
          x: w * 0.86, w: 20, h: 88,
          lit: Array.from({ length: 14 }, () => ({
            dx: Math.random() * 16 + 2, dy: Math.random() * 80 + 4
          }))
        },
        waves: Array.from({ length: 14 }, () => ({
          fx: Math.random(), fy: Math.random(),
          len: Math.random() * 18 + 12, ph: Math.random() * Math.PI * 2
        })),
        stars: Array.from({ length: 60 }, () => ({
          x: Math.random() * w, y: Math.random() * horizon * 0.7,
          s: Math.random() < 0.3 ? 2 : 1, tw: Math.random() * Math.PI * 2
        })),
        plane: { x: -60, y: h * 0.07, dir: 1, blink: 0 },
        tufts: Array.from({ length: 26 }, () => ({
          p: Math.random(), side: Math.random() < 0.5 ? -1 : 1,
          lat: Math.random(), size: Math.random() * 0.7 + 0.6,
          shade: ['#0d1a12', '#101f16', '#0b1710'][Math.floor(Math.random() * 3)]
        })),
        trees: Array.from({ length: 32 }, () => {
          const blobs = Array.from({ length: 6 }, () => ({
            ox: Math.random() * 2 - 0.45,     // biased outward, away from the road
            oy: -(Math.random() * 0.9),
            rf: Math.random() * 0.45 + 0.5
          }));
          return {
            p: Math.random(), side: Math.random() < 0.5 ? -1 : 1,
            jit: Math.random() * 200,
            size: Math.random() * 0.7 + 0.9,
            shade: ['#07130c', '#0a1a10', '#0d2014'][Math.floor(Math.random() * 3)],
            blobs,
            inner: Math.min(...blobs.map(b => b.ox - b.rf)) // innermost edge, in r units
          };
        }),
        dashes: Array.from({ length: 10 }, (_, i) => ({ p: i / 10 })),
        poles: Array.from({ length: 6 }, (_, i) => ({ p: i / 6 })),
        carAhead: { sway: Math.random() * Math.PI * 2 },
        oncoming: { active: false, p: 0, timer: 260 },
        deckTraffic: Array.from({ length: 16 }, () => ({
          f: Math.random(), dir: Math.random() < 0.5 ? -1 : 1,
          speed: Math.random() * 0.0005 + 0.0004,
          deck: Math.random() < 0.5 ? 1 : 0,
          truck: Math.random() < 0.25
        }))
      };
    }

    function drawGwbDrive(ctx, canvas, s, t) {
      const { w, h, horizon } = s;
      const curve = Math.sin(t * 0.000065) * 70; // the road's slow S-bends
      const xc = (u) => w / 2 + curve * Math.pow(Math.max(0, 1 - u), 1.5);
      const half = (u) => 3 + (w * 0.46 - 3) * Math.pow(u, 1.7);
      const Y = (u) => horizon + (h - horizon) * u * u;

      ctx.clearRect(0, 0, w, h);
      drawNightSky(ctx, s, t, w, h, horizon, 0.5);

      // Left bank: the darker city shore — low blocks with trees between
      for (const b of s.shoreline) {
        ctx.fillStyle = '#0a0e1e';
        ctx.fillRect(b.x, horizon - b.h, b.w, b.h + 1);
        ctx.fillStyle = 'rgba(140, 158, 205, 0.3)';
        for (const li of b.lit) ctx.fillRect(b.x + li.dx, horizon - b.h + li.dy, 1.5, 2);
      }
      ctx.fillStyle = '#0a140e'; // shore trees crowding the blocks
      ctx.fillRect(0, horizon - 3, w * 0.5, 6); // solid band so the seam never shows
      ctx.beginPath();
      for (const st2 of s.shoreTrees) {
        ctx.moveTo(st2.x + st2.r, horizon - st2.r * 0.55);
        ctx.arc(st2.x, horizon - st2.r * 0.55, st2.r, 0, Math.PI * 2);
      }
      ctx.fill();

      // Right bank: the Palisades — one lone tower behind the cliff line
      const tw1 = s.loneTower;
      ctx.fillStyle = '#131a30';
      ctx.fillRect(tw1.x, horizon - tw1.h, tw1.w, tw1.h);
      ctx.fillStyle = 'rgba(150, 170, 220, 0.45)';
      for (const li of tw1.lit) ctx.fillRect(tw1.x + li.dx, horizon - tw1.h + li.dy, 1.5, 2);
      ctx.fillStyle = '#231c15'; // the cliff face
      ctx.beginPath();
      ctx.moveTo(s.cliffs[0].x, horizon + 2);
      for (const cp of s.cliffs) ctx.lineTo(cp.x, horizon - cp.top);
      ctx.lineTo(w + 40, horizon + 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(64, 50, 36, 0.8)'; // rock strata
      ctx.lineWidth = 1;
      for (const off of [8, 15, 22]) {
        ctx.beginPath();
        let started = false;
        for (const cp of s.cliffs) {
          const yy = horizon - cp.top + off;
          if (yy < horizon - 1) {
            if (!started) { ctx.moveTo(cp.x, yy); started = true; }
            else ctx.lineTo(cp.x, yy);
          } else started = false;
        }
        ctx.stroke();
      }
      ctx.fillStyle = '#0a120c'; // tree fuzz along the clifftop
      ctx.beginPath();
      for (const cp of s.cliffs) {
        const fr = 4 + (cp.top % 5);
        ctx.moveTo(cp.x + fr, horizon - cp.top - 2);
        ctx.arc(cp.x, horizon - cp.top - 2, fr, 0, Math.PI * 2);
      }
      ctx.fill();

      // --- The George Washington Bridge ahead, slowly filling the view ---
      const sBr = 0.88 + 0.2 * (0.5 + 0.5 * Math.sin(t * 0.00002 - Math.PI / 2));
      const bx = w / 2 + curve * 0.9;
      const gap = w * 0.17 * sBr;
      const tx1 = bx - gap, tx2 = bx + gap;
      const towerTop = horizon - h * 0.28 * sBr;
      const deckY = horizon - 3;
      const ax1 = tx1 - gap * 1.35, ax2 = tx2 + gap * 1.35;

      const drawTower = (tx) => {
        const legOff = 13 * sBr, legW = 6 * sBr;
        const th2 = horizon + 8 - towerTop;
        ctx.fillStyle = '#252c3b';
        ctx.fillRect(tx - legOff - legW / 2, towerTop, legW, th2);
        ctx.fillRect(tx + legOff - legW / 2, towerTop, legW, th2);
        ctx.strokeStyle = '#2c3445';
        ctx.lineWidth = 3.5 * sBr;
        ctx.beginPath();
        ctx.moveTo(tx - legOff, towerTop + 2);
        ctx.lineTo(tx + legOff, towerTop + 2);
        ctx.stroke();
        ctx.lineWidth = 2 * sBr; // lattice bracing
        for (let seg = 0; seg < 4; seg++) {
          const yA = towerTop + th2 * (seg / 4) + 4;
          const yB = towerTop + th2 * ((seg + 1) / 4);
          ctx.beginPath();
          ctx.moveTo(tx - legOff, yA); ctx.lineTo(tx + legOff, yB);
          ctx.moveTo(tx + legOff, yA); ctx.lineTo(tx - legOff, yB);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(tx - legOff, yB); ctx.lineTo(tx + legOff, yB);
          ctx.stroke();
        }
        if (Math.sin(t * 0.0015 + tx) > 0) { // red aircraft beacon
          ctx.fillStyle = '#ff4040';
          ctx.beginPath();
          ctx.arc(tx, towerTop - 4, 2.2 * sBr, 0, Math.PI * 2);
          ctx.fill();
        }
      };
      drawTower(tx1);
      drawTower(tx2);

      // Main cables: two side spans + the sagging center span
      const yCtrl = 2 * (deckY - 12 * sBr) - towerTop;
      const spans = [
        [ax1, deckY - 2, (ax1 + tx1) / 2, deckY - (deckY - towerTop) * 0.12, tx1, towerTop],
        [tx1, towerTop, bx, yCtrl, tx2, towerTop],
        [tx2, towerTop, (tx2 + ax2) / 2, deckY - (deckY - towerTop) * 0.12, ax2, deckY - 2]
      ];
      const qx = (sp, f) => { const a = 1 - f; return a * a * sp[0] + 2 * a * f * sp[2] + f * f * sp[4]; };
      const qy = (sp, f) => { const a = 1 - f; return a * a * sp[1] + 2 * a * f * sp[3] + f * f * sp[5]; };
      // Four main cables: a far pair behind the deck, a near pair in front
      for (const [dy3, sep, colr, lw2] of [
        [-4 * sBr, 2.2 * sBr, '#2e3542', 1.5 * sBr],
        [0, 3 * sBr, '#39414f', 2 * sBr]
      ]) {
        ctx.strokeStyle = colr;
        ctx.lineWidth = lw2;
        for (const off2 of [0, sep]) {
          for (const sp of spans) {
            ctx.beginPath();
            ctx.moveTo(sp[0], sp[1] + dy3 + off2);
            ctx.quadraticCurveTo(sp[2], sp[3] + dy3 + off2, sp[4], sp[5] + dy3 + off2);
            ctx.stroke();
          }
        }
      }
      ctx.strokeStyle = 'rgba(120, 132, 152, 0.5)'; // suspender cables
      ctx.lineWidth = 1;
      for (let f = 0.08; f < 0.93; f += 0.075) {
        ctx.beginPath();
        ctx.moveTo(qx(spans[1], f), qy(spans[1], f));
        ctx.lineTo(qx(spans[1], f), deckY);
        ctx.stroke();
      }
      let ni = 0; // necklace lights along all three spans
      ctx.fillStyle = '#ffe9b0';
      for (const sp of spans) {
        for (let f = 0; f <= 1.001; f += 1 / 15) {
          ctx.globalAlpha = 0.5 + 0.4 * Math.abs(Math.sin(t * 0.0008 + ni * 0.7));
          ctx.beginPath();
          ctx.arc(qx(sp, f), qy(sp, f), 1.6 * sBr, 0, Math.PI * 2);
          ctx.fill();
          ni++;
        }
      }
      ctx.globalAlpha = 1;
      // The long double-deck steel truss spanning shore to shore
      const trussH = 10 * sBr;
      ctx.fillStyle = 'rgba(15, 20, 31, 0.94)';
      ctx.fillRect(ax1, deckY, ax2 - ax1, trussH);
      ctx.strokeStyle = '#39414f';
      ctx.lineWidth = 1.6 * sBr;
      ctx.beginPath(); // top, mid and bottom chords
      ctx.moveTo(ax1, deckY); ctx.lineTo(ax2, deckY);
      ctx.moveTo(ax1, deckY + trussH * 0.52); ctx.lineTo(ax2, deckY + trussH * 0.52);
      ctx.moveTo(ax1, deckY + trussH); ctx.lineTo(ax2, deckY + trussH);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(70, 80, 98, 0.7)'; // lattice diagonals
      ctx.lineWidth = 1 * sBr;
      ctx.beginPath();
      const latStep = 14 * sBr;
      for (let lx2 = ax1; lx2 < ax2 - latStep; lx2 += latStep) {
        ctx.moveTo(lx2, deckY);
        ctx.lineTo(lx2 + latStep, deckY + trussH);
        ctx.moveTo(lx2, deckY + trussH);
        ctx.lineTo(lx2 + latStep, deckY);
      }
      ctx.stroke();
      // Cars and trucks streaming across the upper and lower decks
      for (const v of s.deckTraffic) {
        v.f += v.speed * v.dir;
        if (v.f > 1.03) v.f -= 1.06;
        if (v.f < -0.03) v.f += 1.06;
        const vx = ax1 + v.f * (ax2 - ax1);
        const vy = deckY + (v.deck ? trussH * 0.76 : trussH * 0.24);
        ctx.globalAlpha = v.deck ? 0.75 : 0.95;
        ctx.fillStyle = v.dir > 0 ? '#f8e8c0' : '#ff5a5a'; // headlights vs taillights
        ctx.fillRect(vx, vy - 1 * sBr, (v.truck ? 4.5 : 2.5) * sBr, 2 * sBr);
        if (v.truck) { // trailer marker light
          ctx.fillStyle = '#ffb84d';
          ctx.fillRect(vx - v.dir * 6 * sBr, vy - 0.8 * sBr, 2 * sBr, 1.6 * sBr);
        }
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffd9a0'; // roadway lights along the top chord
      for (let dx2 = ax1 + 8; dx2 < ax2; dx2 += 30) {
        ctx.fillRect(dx2, deckY - 1.5, 2, 2);
      }

      // Warm haze where the riverbank meets the sky
      const haze = ctx.createLinearGradient(0, horizon - 44, 0, horizon);
      haze.addColorStop(0, 'rgba(138, 67, 88, 0)');
      haze.addColorStop(1, 'rgba(160, 84, 96, 0.3)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizon - 44, w, 44);

      // --- Road ---
      // Riverbank ground: faintly sky-lit at the water's edge, darkening down
      const bank = ctx.createLinearGradient(0, horizon, 0, h * 0.82);
      bank.addColorStop(0, '#1b1f2e');
      bank.addColorStop(0.3, '#141826');
      bank.addColorStop(1, '#0d1015');
      ctx.fillStyle = bank;
      ctx.fillRect(0, horizon, w, h - horizon);

      // The Hudson: a dark water band under the far shore
      const waterH = h * 0.075;
      const water = ctx.createLinearGradient(0, horizon, 0, horizon + waterH);
      water.addColorStop(0, '#0e1424');
      water.addColorStop(1, '#111520');
      ctx.fillStyle = water;
      ctx.fillRect(0, horizon, w, waterH);

      // The right bank falls away — open water widening below
      const wedgeDepth = (x2) => waterH + Math.max(0, (x2 - w * 0.52) / (w * 0.48)) * (h * 0.23 - waterH);
      const water2 = ctx.createLinearGradient(0, horizon, 0, horizon + h * 0.24);
      water2.addColorStop(0, '#0e1424');
      water2.addColorStop(1, '#0f131d');
      ctx.fillStyle = water2;
      ctx.beginPath();
      ctx.moveTo(w * 0.5, horizon);
      ctx.lineTo(w + 2, horizon);
      ctx.lineTo(w + 2, horizon + h * 0.23);
      ctx.lineTo(w * 0.52, horizon + waterH);
      ctx.closePath();
      ctx.fill();
      // Faint wave glints drifting across the open water
      ctx.fillStyle = 'rgba(165, 185, 220, 0.1)';
      for (const wv of s.waves) {
        wv.fx -= 0.00006;
        if (wv.fx < 0) wv.fx += 1;
        const wx = w * 0.55 + wv.fx * (w * 0.44);
        const wy = horizon + 5 + wv.fy * (wedgeDepth(wx) - 10);
        ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.0009 + wv.ph));
        ctx.fillRect(wx, wy, wv.len, 1.4);
      }
      ctx.globalAlpha = 1;

      // Shimmering reflections of the city windows
      ctx.fillStyle = '#8fa0d0';
      for (const b of s.shoreline) {
        for (const li of b.lit) {
          const rx = b.x + li.dx;
          const shim = Math.abs(Math.sin(t * 0.0011 + rx * 0.63));
          ctx.globalAlpha = 0.06 + shim * 0.2;
          ctx.fillRect(rx, horizon + 2 + (li.dy % 5), 1.5, 4 + (li.dy % 9));
        }
      }
      // Amber smear of the bridge necklace on the water
      ctx.fillStyle = '#c9a06a';
      for (let rxx = ax1; rxx < ax2; rxx += 26) {
        ctx.globalAlpha = 0.06 + 0.09 * Math.abs(Math.sin(t * 0.0009 + rxx * 0.2));
        ctx.fillRect(rxx + Math.sin(t * 0.0005 + rxx) * 2, horizon + 3, 10, 2);
      }
      // The lone tower's lights on the water below the cliffs
      ctx.fillStyle = '#9aa8d4';
      for (const li of tw1.lit) {
        const rx = tw1.x + li.dx;
        ctx.globalAlpha = 0.08 + 0.2 * Math.abs(Math.sin(t * 0.001 + rx));
        ctx.fillRect(rx, horizon + 3 + (li.dy % 6), 1.5, 6 + (li.dy % 10));
      }
      // Moonlight glitter trailing down the open river
      ctx.fillStyle = '#dfe7f5';
      for (let gi = 0; gi < 13; gi++) {
        const gy = horizon + 3 + gi * 8.5;
        const sway2 = Math.sin(t * 0.0006 + gi * 1.7) * (3 + gi * 1.6);
        ctx.globalAlpha = Math.max(0.03, 0.3 - gi * 0.019) * (0.55 + 0.45 * Math.abs(Math.sin(t * 0.0013 + gi)));
        ctx.fillRect(w * 0.78 + sway2 - (5 + gi), gy, 10 + gi * 2, 1.6);
      }
      ctx.globalAlpha = 1;

      // The near tower's legs run down into the Hudson
      const legOff2 = 13 * sBr, legW2 = 6 * sBr;
      const pierY = horizon + h * 0.115;
      ctx.fillStyle = '#20283a';
      ctx.fillRect(tx2 - legOff2 - legW2 / 2, horizon - 2, legW2, pierY - horizon + 2);
      ctx.fillRect(tx2 + legOff2 - legW2 / 2, horizon - 2, legW2, pierY - horizon + 2);
      ctx.strokeStyle = '#242c3f'; // brace between the legs
      ctx.lineWidth = 2 * sBr;
      ctx.beginPath();
      ctx.moveTo(tx2 - legOff2, horizon + 8);
      ctx.lineTo(tx2 + legOff2, pierY - 6);
      ctx.moveTo(tx2 + legOff2, horizon + 8);
      ctx.lineTo(tx2 - legOff2, pierY - 6);
      ctx.stroke();
      ctx.fillStyle = '#1a2231'; // the pier at the waterline
      ctx.fillRect(tx2 - 21 * sBr, pierY - 5 * sBr, 42 * sBr, 7 * sBr);
      ctx.strokeStyle = 'rgba(26, 34, 49, 0.55)'; // rippled reflection below
      ctx.lineWidth = 3 * sBr;
      for (const lo of [-legOff2, legOff2]) {
        ctx.beginPath();
        for (let ry = 0; ry <= 24; ry += 5) {
          const wob = Math.sin(t * 0.0011 + ry * 0.8 + lo) * 2.5;
          if (ry === 0) ctx.moveTo(tx2 + lo + wob, pierY + 3);
          else ctx.lineTo(tx2 + lo + wob, pierY + 3 + ry);
        }
        ctx.stroke();
      }

      // Scattered scrub dotting the banks as they slide past
      for (const tf of s.tufts) {
        tf.p += 0.0013 + tf.p * 0.005;
        if (tf.p > 1.06) { tf.p -= 1.06; tf.side = Math.random() < 0.5 ? -1 : 1; tf.lat = Math.random(); }
        const u2 = tf.p;
        if (u2 < 0.04) continue;
        const ty2 = Y(u2);
        const tx2 = xc(u2) + tf.side * (half(u2) + 24 + tf.lat * (60 + 520 * u2));
        const r2 = (1.5 + 11 * Math.pow(u2, 1.7)) * tf.size;
        if (tf.side > 0 && tx2 > w * 0.52 && ty2 < horizon + wedgeDepth(tx2)) continue;
        ctx.globalAlpha = Math.min(0.9, u2 * 4);
        ctx.fillStyle = tf.shade;
        ctx.beginPath();
        ctx.ellipse(tx2, ty2 - r2 * 0.35, r2, r2 * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      const roadGrad = ctx.createLinearGradient(0, horizon, 0, h);
      roadGrad.addColorStop(0, '#12141c');
      roadGrad.addColorStop(1, '#07080c');
      ctx.fillStyle = roadGrad;
      ctx.beginPath();
      ctx.moveTo(xc(0), horizon);
      for (let u = 0; u <= 1.001; u += 0.1) ctx.lineTo(xc(u) - half(u), Y(u));
      for (let u = 1; u >= -0.001; u -= 0.1) ctx.lineTo(xc(u) + half(u), Y(u));
      ctx.closePath();
      ctx.fill();

      // Solid edge lines, stroked segment-by-segment so they taper with distance
      ctx.strokeStyle = 'rgba(226, 228, 238, 0.5)';
      ctx.lineCap = 'round';
      for (const side of [-1, 1]) {
        let prevU = 0.03;
        for (let u = 0.1; u <= 1.001; u += 0.07) {
          ctx.lineWidth = 0.5 + u * 3;
          ctx.beginPath();
          ctx.moveTo(xc(prevU) + side * half(prevU) * 0.94, Y(prevU));
          ctx.lineTo(xc(u) + side * half(u) * 0.94, Y(u));
          ctx.stroke();
          prevU = u;
        }
      }

      // Lane dashes rushing underneath
      ctx.fillStyle = '#f2d271';
      for (const d of s.dashes) {
        d.p += 0.002 + d.p * 0.007;
        if (d.p > 1) d.p -= 1;
        const u1 = d.p, u2 = Math.min(1, d.p + 0.035 * (1 - d.p * 0.4));
        const wd1 = 1 + 12 * Math.pow(u1, 1.7), wd2 = 1 + 12 * Math.pow(u2, 1.7);
        ctx.globalAlpha = Math.min(1, u1 * 6);
        ctx.beginPath();
        ctx.moveTo(xc(u1) - wd1 / 2, Y(u1));
        ctx.lineTo(xc(u1) + wd1 / 2, Y(u1));
        ctx.lineTo(xc(u2) + wd2 / 2, Y(u2));
        ctx.lineTo(xc(u2) - wd2 / 2, Y(u2));
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // --- Continuous foliage walls ---
      // Discrete clusters alone always leave momentary gaps when their spacing
      // lines up, so the base coverage is two layered silhouette ribbons per
      // side: a taller, lighter canopy behind and a darker one in front, each
      // a single filled path whose scalloped top contour streams toward the
      // viewer. The clusters then ride on top for the whizzing parallax.
      const flow = t * 0.0005;
      const edgeX = (u, side) => xc(u) + side * (half(u) + 30 + 88 * u);
      const foliageTop = (u, back) => {
        const d = 1 / (1.15 - Math.min(u, 1.1)); // pseudo inverse distance
        const fmul = back ? 0.6 : 1;
        const b = Math.sin(d * 2.1 - flow * 6 * fmul) * 0.5
                + Math.sin(d * 4.7 - flow * 11 * fmul + 2.3) * 0.3
                + Math.sin(d * 9.3 - flow * 19 * fmul + 4.1) * 0.2;
        const hgt = (10 + h * (back ? 0.22 : 0.155) * Math.pow(u, 1.75)) * (1 + 0.3 * b);
        return Y(u) - hgt;
      };
      for (const side of [-1, 1]) {
        for (const back of [true, false]) {
          const u0 = 0.07, u1 = 1.12, du = 0.055;
          ctx.fillStyle = back ? '#0c1f12' : '#07130c';
          ctx.beginPath();
          ctx.moveTo(edgeX(u0, side), Y(u0) + 2);
          // Down the inner-bottom edge toward the viewer
          for (let u = u0; u <= u1 + 0.001; u += du) ctx.lineTo(edgeX(u, side), Y(u) + 4);
          // Out past the screen corner and up the outer edge
          const outX = side > 0 ? w + 80 : -80;
          ctx.lineTo(outX, h + 80);
          ctx.lineTo(outX, foliageTop(u1, back) - 40);
          // Back along the scalloped canopy top toward the horizon
          let px2 = null, py2 = null;
          for (let u = u1; u >= u0 - 0.001; u -= du) {
            const x2 = edgeX(u, side), y2 = foliageTop(u, back);
            if (px2 === null) {
              ctx.lineTo(x2, y2);
            } else {
              const lift = 4 + 22 * Math.pow(Math.max(u, 0), 1.8);
              ctx.quadraticCurveTo((px2 + x2) / 2, Math.min(py2, y2) - lift, x2, y2);
            }
            px2 = x2; py2 = y2;
          }
          ctx.closePath();
          ctx.fill();
        }
      }

      // Roadside: foliage walls + streetlights, depth-sorted together so a
      // near tree properly hides a far lamp and a near lamp stands in front
      // of far greenery. Foliage is anchored by its innermost edge just
      // beyond the lamp corridor, so at equal depth they never collide.
      const drawTreeCluster = (tr) => {
        tr.p += 0.0016 + tr.p * 0.006;
        if (tr.p > 1.12) {
          tr.p -= 1.12;
          tr.side = Math.random() < 0.5 ? -1 : 1;
          tr.jit = Math.random() * 200;
          tr.size = Math.random() * 0.7 + 0.9;
        }
        const u = tr.p;
        if (u < 0.03) return;
        const ty = Y(u) + 6;
        const r = (6 + 95 * Math.pow(u, 1.85)) * tr.size;
        const clearance = half(u) + 34 + 92 * u + tr.jit * u * 0.5;
        const tx = xc(u) + tr.side * (clearance - tr.inner * r);
        ctx.globalAlpha = Math.min(1, u * 5);
        ctx.fillStyle = tr.shade;
        ctx.beginPath();
        for (const b of tr.blobs) {
          const bx2 = tx + tr.side * b.ox * r, by2 = ty - r * 0.45 + b.oy * r;
          ctx.moveTo(bx2 + b.rf * r, by2);
          ctx.arc(bx2, by2, b.rf * r, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.globalAlpha = 1;
      };

      const drawStreetlight = (pole) => {
        pole.p += 0.0015 + pole.p * 0.0055;
        if (pole.p > 1.05) pole.p -= 1.05;
        const u = pole.p;
        if (u < 0.02) return;
        const py = Y(u);
        const ph = (h * 0.36) * Math.pow(u, 1.8) + 3;
        for (const side of [-1, 1]) {
          const px = xc(u) + side * (half(u) + 10 + 60 * u);
          ctx.strokeStyle = 'rgba(90, 96, 112, ' + Math.min(0.9, u * 3) + ')';
          ctx.lineWidth = 0.5 + u * 4;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px, py - ph);
          ctx.lineTo(px - side * (6 + 18 * u), py - ph);
          ctx.stroke();
          const lampX = px - side * (6 + 18 * u);
          const glow = ctx.createRadialGradient(lampX, py - ph, 0, lampX, py - ph, 8 + 26 * u);
          glow.addColorStop(0, 'rgba(255, 214, 150, 0.85)');
          glow.addColorStop(1, 'rgba(255, 214, 150, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(lampX, py - ph, 8 + 26 * u, 0, Math.PI * 2);
          ctx.fill();
        }
      };

      const roadside = [
        ...s.trees.map(o => ({ p: o.p, o, tree: true })),
        ...s.poles.map(o => ({ p: o.p, o, tree: false }))
      ].sort((a, b) => a.p - b.p);
      for (const item of roadside) {
        if (item.tree) drawTreeCluster(item.o); else drawStreetlight(item.o);
      }

      // The car we're following
      const ca = s.carAhead;
      ca.sway += 0.004;
      const cap = 0.34 + Math.sin(ca.sway) * 0.05 + Math.sin(ca.sway * 3.4) * 0.012;
      const cax = xc(cap) + Math.sin(t * 0.0003) * half(cap) * 0.2;
      const cay = Y(cap);
      const cw = half(cap) * 0.36;
      ctx.fillStyle = '#0b0d13';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cax - cw / 2, cay - cw * 0.46, cw, cw * 0.42, cw * 0.08)
                    : ctx.rect(cax - cw / 2, cay - cw * 0.46, cw, cw * 0.42);
      ctx.fill();
      ctx.fillStyle = '#131722'; // cabin
      ctx.fillRect(cax - cw * 0.34, cay - cw * 0.66, cw * 0.68, cw * 0.26);
      const brake = 0.65 + Math.abs(Math.sin(t * 0.00055)) * 0.35;
      for (const sd of [-1, 1]) {
        const tlx = cax + sd * cw * 0.36, tly = cay - cw * 0.3;
        const tg = ctx.createRadialGradient(tlx, tly, 0, tlx, tly, cw * 0.2 + 2);
        tg.addColorStop(0, 'rgba(255, 70, 70, ' + brake + ')');
        tg.addColorStop(1, 'rgba(255, 70, 70, 0)');
        ctx.fillStyle = tg;
        ctx.beginPath();
        ctx.arc(tlx, tly, cw * 0.2 + 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff4646';
        ctx.fillRect(tlx - cw * 0.07, tly - cw * 0.035, cw * 0.14, cw * 0.07);
      }
      ctx.fillStyle = 'rgba(240, 240, 255, 0.75)'; // plate light
      ctx.fillRect(cax - 1.5, cay - cw * 0.14, 3, 1.6);

      // Oncoming headlights in the opposite lane
      const on = s.oncoming;
      if (!on.active) {
        if (--on.timer <= 0) { on.active = true; on.p = 0.03; }
      } else {
        on.p += 0.002 + on.p * 0.01;
        if (on.p > 1.08) { on.active = false; on.timer = Math.random() * 420 + 240; }
        else {
          const ox = xc(on.p) - half(on.p) * 0.55;
          const oy = Y(on.p);
          const sep = half(on.p) * 0.16 + 2;
          if (on.p > 0.4) {
            ctx.fillStyle = '#0a0c12';
            ctx.fillRect(ox - sep - 4, oy - sep * 0.8, sep * 2 + 8, sep * 0.8);
          }
          for (const sd of [-1, 1]) {
            const hx = ox + sd * sep;
            const hg = ctx.createRadialGradient(hx, oy - 2, 0, hx, oy - 2, 4 + on.p * 26);
            hg.addColorStop(0, 'rgba(255, 250, 225, 0.95)');
            hg.addColorStop(0.25, 'rgba(255, 240, 190, 0.55)');
            hg.addColorStop(1, 'rgba(255, 240, 190, 0)');
            ctx.fillStyle = hg;
            ctx.beginPath();
            ctx.arc(hx, oy - 2, 4 + on.p * 26, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Windshield vignette + tint strip (world only — cab stays crisp)
      const vig = ctx.createRadialGradient(w / 2, h * 0.45, h * 0.3, w / 2, h * 0.45, h * 0.85);
      vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vig.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
      const tint = ctx.createLinearGradient(0, 0, 0, h * 0.09);
      tint.addColorStop(0, 'rgba(8, 10, 20, 0.5)');
      tint.addColorStop(1, 'rgba(8, 10, 20, 0)');
      ctx.fillStyle = tint;
      ctx.fillRect(0, 0, w, h * 0.09);

      // --- The cab ---
      const sc = Math.min(1.1, Math.max(0.7, w / 1200));

      // Dashboard shell
      ctx.beginPath();
      ctx.moveTo(0, h * 0.9);
      ctx.quadraticCurveTo(w * 0.25, h * 0.84, w * 0.5, h * 0.825);
      ctx.quadraticCurveTo(w * 0.75, h * 0.84, w, h * 0.9);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      const dashGrad = ctx.createLinearGradient(0, h * 0.82, 0, h);
      dashGrad.addColorStop(0, '#141826');
      dashGrad.addColorStop(1, '#05060a');
      ctx.fillStyle = dashGrad;
      ctx.fill();
      ctx.strokeStyle = '#2a3044'; // rim catchlight
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.9);
      ctx.quadraticCurveTo(w * 0.25, h * 0.84, w * 0.5, h * 0.825);
      ctx.quadraticCurveTo(w * 0.75, h * 0.84, w, h * 0.9);
      ctx.stroke();

      // Glowing gauges
      const gaugeY = h * 0.93;
      const drawGauge = (gx, frac, accent) => {
        const R = 34 * sc;
        ctx.save();
        ctx.fillStyle = '#05070c';
        ctx.beginPath();
        ctx.arc(gx, gaugeY, R, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2a3140';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(gx, gaugeY, R - 3, Math.PI * 0.75, Math.PI * 0.75 + Math.PI * 1.5 * frac);
        ctx.stroke();
        ctx.strokeStyle = '#5b647a'; // ticks
        ctx.lineWidth = 1.4;
        for (let i = 0; i <= 8; i++) {
          const a = Math.PI * 0.75 + (Math.PI * 1.5 * i) / 8;
          ctx.beginPath();
          ctx.moveTo(gx + Math.cos(a) * (R - 7), gaugeY + Math.sin(a) * (R - 7));
          ctx.lineTo(gx + Math.cos(a) * (R - 12), gaugeY + Math.sin(a) * (R - 12));
          ctx.stroke();
        }
        const na = Math.PI * 0.75 + Math.PI * 1.5 * frac; // needle
        ctx.strokeStyle = 'rgba(255, 93, 93, 0.35)';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(gx, gaugeY);
        ctx.lineTo(gx + Math.cos(na) * (R - 10), gaugeY + Math.sin(na) * (R - 10));
        ctx.stroke();
        ctx.strokeStyle = '#ff5d5d';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#242b3a';
        ctx.beginPath();
        ctx.arc(gx, gaugeY, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };
      const speedFrac = 0.55 + Math.sin(t * 0.00035) * 0.04 + Math.sin(t * 0.00155) * 0.012;
      const revFrac = 0.42 + Math.sin(t * 0.00035) * 0.05 + Math.sin(t * 0.00235) * 0.02;
      drawGauge(w / 2 - 118 * sc, speedFrac, 'rgba(56, 189, 248, 0.55)');
      drawGauge(w / 2 + 118 * sc, revFrac, 'rgba(251, 191, 36, 0.55)');

      // Dash LEDs
      for (const [lx, lc] of [[w * 0.16, '#38bdf8'], [w * 0.2, '#fbbf24'], [w * 0.8, '#4ade80'], [w * 0.84, '#f472b6']]) {
        ctx.fillStyle = lc;
        ctx.globalAlpha = 0.5 + Math.abs(Math.sin(t * 0.001 + lx)) * 0.5;
        ctx.beginPath();
        ctx.arc(lx, h * 0.95, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Steering wheel, leaning into the curve
      const hubX = w / 2, hubY = h * 1.05;
      const R = Math.min(260, Math.max(150, w * 0.17));
      ctx.save();
      ctx.translate(hubX, hubY);
      ctx.rotate(-curve * 0.0028);
      ctx.strokeStyle = '#181b24';
      ctx.lineWidth = 17;
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#2e3547';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, R - 6, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.fillStyle = '#14171f'; // three spokes
      for (const ang of [Math.PI, 0, Math.PI / 2]) {
        ctx.save();
        ctx.rotate(ang);
        ctx.fillRect(0, -9, R - 6, 18);
        ctx.restore();
      }
      ctx.fillStyle = '#1e2330'; // hub
      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#333b50';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

    }


    /* =====================================================================
       IN ORBIT — low Earth orbit. The planet fills the lower third of the
       window: sunlit ocean, drifting continents and cloud decks, a thin
       cyan atmosphere hugging the limb, city lights glittering past the
       terminator. The Moon hangs out the window, a satellite makes its
       lap, and the odd meteor skims by.
       ===================================================================== */

    function buildOrbit(canvas) {
      const w = canvas.width, h = canvas.height;
      const R = Math.max(w, h) * 1.4;      // planet radius: huge, so the limb is a gentle arc
      const limbY = h * 0.6;               // where the limb crests at screen centre
      const cx = w * 0.5, cy = limbY + R;
      const band = h - limbY;              // visible depth of the disc

      const stars = Array.from({ length: 160 }, () => ({
        x: Math.random() * w,
        y: Math.random() * limbY,
        r: Math.random() * 1.3 + 0.4,
        phase: Math.random() * Math.PI * 2,
        tw: Math.random() * 0.0016 + 0.0005
      }));

      const blobCluster = (baseR, spreadX, spreadY, nMin, nExtra) => {
        const blobs = [];
        const n = Math.floor(Math.random() * nExtra) + nMin;
        for (let b = 0; b < n; b++) {
          blobs.push({
            dx: (Math.random() - 0.5) * baseR * spreadX,
            dy: (Math.random() - 0.5) * baseR * spreadY,
            r: baseR * (Math.random() * 0.5 + 0.35)
          });
        }
        return blobs;
      };

      const landTones = ['#3f7a3a', '#4c8a40', '#6f8f45', '#8a8a4d', '#b09a5e'];
      const continents = Array.from({ length: 7 }, (_, i) => ({
        lon: Math.random(),
        lat: Math.random() * 0.6 + 0.1,
        blobs: blobCluster(Math.random() * 55 + 50, 2.6, 1.1, 5, 5),
        color: landTones[i % landTones.length]
      }));

      const clouds = Array.from({ length: 15 }, () => ({
        lon: Math.random(),
        lat: Math.random() * 0.85 + 0.04,
        puffs: blobCluster(Math.random() * 36 + 24, 3.2, 0.9, 3, 4),
        alpha: Math.random() * 0.22 + 0.34
      }));

      const cityLights = Array.from({ length: 70 }, () => ({
        lon: Math.random(),
        lat: Math.random() * 0.55 + 0.04,
        r: Math.random() * 1.5 + 0.7,
        phase: Math.random() * Math.PI * 2
      }));

      const moonR = Math.min(w, h) * 0.075;
      const craters = Array.from({ length: 10 }, () => {
        const a = Math.random() * Math.PI * 2;
        const d = Math.random() * 0.72;
        return { x: Math.cos(a) * d, y: Math.sin(a) * d, r: Math.random() * 0.14 + 0.045 };
      });

      return {
        w, h, R, cx, cy, limbY, band, stars, continents, clouds, cityLights,
        moon: { x: w * 0.78, y: h * 0.17, r: moonR, craters },
        sat: { period: 34000, y: limbY * 0.42 },
        meteor: null,
        nextMeteor: 3000 + Math.random() * 6000
      };
    }

    function drawOrbit(ctx, canvas, s, t) {
      const { w, h, R, cx, cy, limbY, band } = s;
      ctx.clearRect(0, 0, w, h);

      // Twinkling starfield above the limb
      ctx.fillStyle = '#eef3ff';
      for (const st of s.stars) {
        ctx.globalAlpha = 0.35 + Math.abs(Math.sin(t * st.tw + st.phase)) * 0.6;
        ctx.fillRect(st.x, st.y, st.r, st.r);
      }
      ctx.globalAlpha = 1;

      // The odd meteor skimming past
      if (!s.meteor && t > s.nextMeteor) {
        s.meteor = { x: Math.random() * w * 0.6 + w * 0.1, y: Math.random() * limbY * 0.4, life: 1 };
      }
      if (s.meteor) {
        const m = s.meteor;
        m.x += 7; m.y += 2.6; m.life -= 0.02;
        ctx.strokeStyle = `rgba(226, 236, 255, ${Math.max(m.life, 0) * 0.85})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - 46, m.y - 17);
        ctx.stroke();
        if (m.life <= 0 || m.x > w + 60) {
          s.meteor = null;
          s.nextMeteor = t + 6000 + Math.random() * 14000;
        }
      }

      // The Moon, a quarter-million miles out
      const mo = s.moon;
      const mg = ctx.createRadialGradient(mo.x - mo.r * 0.4, mo.y - mo.r * 0.45, mo.r * 0.15, mo.x, mo.y, mo.r);
      mg.addColorStop(0, '#e8e8e4');
      mg.addColorStop(0.65, '#b9bab6');
      mg.addColorStop(1, '#7e7f7d');
      ctx.save();
      ctx.shadowColor = 'rgba(230, 233, 240, 0.5)';
      ctx.shadowBlur = 22;
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.arc(mo.x, mo.y, mo.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(90, 92, 92, 0.4)';
      for (const c of mo.craters) {
        ctx.beginPath();
        ctx.arc(mo.x + c.x * mo.r, mo.y + c.y * mo.r, c.r * mo.r, 0, Math.PI * 2);
        ctx.fill();
      }
      const ms = ctx.createLinearGradient(mo.x - mo.r, 0, mo.x + mo.r, 0);
      ms.addColorStop(0, 'rgba(0, 0, 0, 0)');
      ms.addColorStop(1, 'rgba(8, 10, 18, 0.55)');
      ctx.fillStyle = ms;
      ctx.beginPath();
      ctx.arc(mo.x, mo.y, mo.r, 0, Math.PI * 2);
      ctx.fill();

      // ---- The planet ----
      // Surface features live on a wrapping longitude strip; "place" maps a
      // (lon, lat) onto the visible limb with the current rotation applied.
      const loop = w + 700;
      const scroll = (t * 0.0000045) % 1;       // one lap every few minutes
      const cloudScroll = (t * 0.0000062) % 1;  // clouds ride a faster wind
      const place = (lon, lat, sc) => {
        const x = ((lon + sc) % 1) * loop - (loop - w) / 2;
        const dx = x - cx;
        if (Math.abs(dx) >= R * 0.999) return null;
        return { x, y: cy - Math.sqrt(R * R - dx * dx) + lat * band };
      };

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.clip();

      // Ocean, bright at the sunlit limb fading into depth
      const og = ctx.createLinearGradient(0, limbY, 0, h);
      og.addColorStop(0, '#5aa7e0');
      og.addColorStop(0.35, '#2f6fb5');
      og.addColorStop(1, '#123e77');
      ctx.fillStyle = og;
      ctx.fillRect(0, limbY - 6, w, h - limbY + 6);

      // Continents drifting with the planet's rotation (foreshortened flat)
      ctx.globalAlpha = 0.92;
      for (const cont of s.continents) {
        const p = place(cont.lon, cont.lat, scroll);
        if (!p) continue;
        ctx.fillStyle = cont.color;
        for (const b of cont.blobs) {
          ctx.beginPath();
          ctx.ellipse(p.x + b.dx, p.y + b.dy * 0.6, b.r, b.r * 0.52, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // Cloud decks
      ctx.fillStyle = '#f4f8fc';
      for (const cl of s.clouds) {
        const p = place(cl.lon, cl.lat, cloudScroll);
        if (!p) continue;
        ctx.globalAlpha = cl.alpha;
        for (const b of cl.puffs) {
          ctx.beginPath();
          ctx.ellipse(p.x + b.dx, p.y + b.dy * 0.55, b.r, b.r * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // Day/night terminator creeping in from the right
      const night = ctx.createLinearGradient(w * 0.45, 0, w, 0);
      night.addColorStop(0, 'rgba(2, 4, 12, 0)');
      night.addColorStop(1, 'rgba(2, 4, 12, 0.82)');
      ctx.fillStyle = night;
      ctx.fillRect(0, limbY - 6, w, h - limbY + 6);

      // City lights glittering on the night side
      ctx.fillStyle = '#ffd97a';
      for (const li of s.cityLights) {
        const p = place(li.lon, li.lat, scroll);
        if (!p) continue;
        const dark = Math.min(Math.max((p.x - w * 0.5) / (w * 0.5), 0), 1);
        if (dark < 0.25) continue;
        ctx.globalAlpha = dark * (0.5 + Math.abs(Math.sin(t * 0.001 + li.phase)) * 0.5) * 0.85;
        ctx.beginPath();
        ctx.arc(p.x, p.y, li.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      // Atmosphere: thin cyan glow hugging the limb
      const atm = ctx.createRadialGradient(cx, cy, R * 0.985, cx, cy, R * 1.05);
      atm.addColorStop(0, 'rgba(125, 211, 252, 0)');
      atm.addColorStop(0.28, 'rgba(147, 216, 255, 0.55)');
      atm.addColorStop(0.55, 'rgba(96, 165, 250, 0.18)');
      atm.addColorStop(1, 'rgba(59, 130, 246, 0)');
      ctx.fillStyle = atm;
      ctx.fillRect(0, limbY - h * 0.18, w, h * 0.55);

      // A satellite on its lap around the planet
      const sp = (t % s.sat.period) / s.sat.period;
      const sx = -70 + sp * (w + 140);
      const sy = s.sat.y - Math.sin(sp * Math.PI) * h * 0.05;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(-0.12);
      ctx.fillStyle = '#31384a';                       // panel truss
      ctx.fillRect(-26, -1.5, 52, 3);
      ctx.fillStyle = '#2e5fa8';                       // solar wings
      ctx.fillRect(-30, -7, 16, 14);
      ctx.fillRect(14, -7, 16, 14);
      ctx.strokeStyle = 'rgba(180, 205, 255, 0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-30, -7, 16, 14);
      ctx.strokeRect(14, -7, 16, 14);
      ctx.fillStyle = '#c8cfdd';                       // bus
      ctx.fillRect(-7, -6, 14, 12);
      ctx.fillStyle = '#8f99ad';
      ctx.fillRect(-7, -6, 14, 4);
      const blink = Math.sin(t * 0.009) > 0.86 ? 1 : 0.12;
      ctx.fillStyle = `rgba(255, 84, 84, ${blink})`;
      ctx.beginPath();
      ctx.arc(0, -9, 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* =====================================================================
       THE BACKROOMS — one-point-perspective hallway that never ends.
       Mono-yellow wallpaper, damp carpet, drop-ceiling rows of humming
       fluorescents (one of them dying), film grain, a vignette, the whole
       hall stuttering now and then — and, rarely, something standing at
       the far end that is gone when the lights settle.
       ===================================================================== */

    function buildBackrooms(canvas) {
      const w = canvas.width, h = canvas.height;
      const vp = { x: w * 0.5, y: h * 0.44 };

      // Receding depth stops: light rows every few tiles, seams in between
      const rows = [];
      for (let i = 1; i <= 9; i++) {
        rows.push({
          k: 1 - Math.pow(0.76, i),
          panels: [-1, 0, 1].map(off => ({
            off,
            base: 0.82 + Math.random() * 0.14,
            buzz: Math.random() * Math.PI * 2,
            dead: false
          }))
        });
      }
      rows[3].panels[Math.floor(Math.random() * 3)].dead = true;

      const seams = [];
      for (let i = 1; i <= 14; i++) seams.push(1 - Math.pow(0.83, i));

      // Pre-rendered grain tile, re-offset every frame for VHS crawl
      const tile = document.createElement('canvas');
      tile.width = tile.height = 160;
      const tctx = tile.getContext('2d');
      const img = tctx.createImageData(160, 160);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.floor(Math.random() * 255);
        img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v;
        img.data[i + 3] = 26;
      }
      tctx.putImageData(img, 0, 0);

      return {
        w, h, vp, rows, seams,
        grain: tile,
        flickerUntil: 0,
        nextFlicker: 5000 + Math.random() * 9000,
        figure: { visibleUntil: 0, next: 16000 + Math.random() * 24000, off: 0 }
      };
    }

    function drawBackrooms(ctx, canvas, s, t) {
      const { w, h, vp } = s;
      const lerp = (a, b, k) => a + (b - a) * k;
      const px = (x, k) => lerp(x, vp.x, k);
      const py = (y, k) => lerp(y, vp.y, k);
      const kFar = 0.975;

      // Whole-hall brown-out stutter
      if (t > s.nextFlicker) {
        s.flickerUntil = t + 260 + Math.random() * 240;
        s.nextFlicker = t + 6000 + Math.random() * 12000;
      }
      const dim = t < s.flickerUntil ? 0.35 + Math.random() * 0.4 : 1;

      ctx.clearRect(0, 0, w, h);

      // Ceiling
      let g = ctx.createLinearGradient(0, 0, 0, vp.y);
      g.addColorStop(0, '#97874a');
      g.addColorStop(1, '#4a3f16');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(w, 0);
      ctx.lineTo(px(w, kFar), py(0, kFar)); ctx.lineTo(px(0, kFar), py(0, kFar));
      ctx.closePath(); ctx.fill();

      // Carpet
      g = ctx.createLinearGradient(0, h, 0, vp.y);
      g.addColorStop(0, '#6b5c26');
      g.addColorStop(1, '#332a0c');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, h); ctx.lineTo(w, h);
      ctx.lineTo(px(w, kFar), py(h, kFar)); ctx.lineTo(px(0, kFar), py(h, kFar));
      ctx.closePath(); ctx.fill();

      // Walls
      g = ctx.createLinearGradient(0, 0, vp.x, 0);
      g.addColorStop(0, '#b7a44f');
      g.addColorStop(1, '#544818');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(px(0, kFar), py(0, kFar));
      ctx.lineTo(px(0, kFar), py(h, kFar)); ctx.lineTo(0, h);
      ctx.closePath(); ctx.fill();
      g = ctx.createLinearGradient(w, 0, vp.x, 0);
      g.addColorStop(0, '#b7a44f');
      g.addColorStop(1, '#544818');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(w, 0); ctx.lineTo(px(w, kFar), py(0, kFar));
      ctx.lineTo(px(w, kFar), py(h, kFar)); ctx.lineTo(w, h);
      ctx.closePath(); ctx.fill();

      // Two-stripe wallpaper trim running down both walls
      for (const yf of [0.7, 0.74]) {
        ctx.strokeStyle = yf === 0.7 ? 'rgba(60, 50, 14, 0.6)' : 'rgba(230, 214, 150, 0.35)';
        ctx.lineWidth = yf === 0.7 ? 3 : 1.5;
        for (const side of [0, w]) {
          ctx.beginPath();
          ctx.moveTo(side, h * yf);
