<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Bingo Card</title>
  <style>
    :root {
      --dabber-color: #04ff00;

      /* Dynamic Theme Variables (Default: Dark Metallic) */
      --bg-gradient: 
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.85) 85%),
        linear-gradient(135deg, #111215 0%, #22252a 25%, #0d0e10 50%, #2a2e35 75%, #08090a 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 4px);
      --card-bg: rgba(0, 155, 227, 0.85);
      --card-shadow-color: rgba(0, 155, 227, 0.4);
    }

    /* 80s Retro Theme */
    body.theme-retro {
      --bg-gradient: linear-gradient(180deg, #090014 0%, #1a002c 60%, #38004d 100%);
      --card-bg: rgba(255, 0, 127, 0.85);
      --card-shadow-color: rgba(255, 0, 127, 0.6);
    }

    /* Pink Girly Theme */
    body.theme-pink {
      --bg-gradient: 
        radial-gradient(circle at 50% 50%, #ffe4e6 0%, #f472b6 60%, #db2777 100%),
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.4) 0%, transparent 40%);
      --card-bg: rgba(244, 114, 182, 0.9);
      --card-shadow-color: rgba(219, 39, 119, 0.4);
    }

    /* Green Metallic Theme */
    body.theme-green {
      --bg-gradient: 
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.85) 85%),
        linear-gradient(135deg, #022c22 0%, #064e3b 25%, #022c22 50%, #047857 75%, #022c22 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 4px);
      --card-bg: rgba(16, 185, 129, 0.85);
      --card-shadow-color: rgba(16, 185, 129, 0.4);
    }

    /* Blue Metallic Theme */
    body.theme-blue {
      --bg-gradient: 
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.85) 85%),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 25%, #0f172a 50%, #1d4ed8 75%, #0f172a 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 4px);
      --card-bg: rgba(37, 99, 235, 0.85);
      --card-shadow-color: rgba(37, 99, 235, 0.4);
    }

    /* Blood Red Metallic Theme */
    body.theme-red {
      --bg-gradient: 
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.9) 85%),
        linear-gradient(135deg, #2a0808 0%, #450a0a 25%, #180303 50%, #7f1d1d 75%, #0f0202 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 4px);
      --card-bg: rgba(225, 29, 72, 0.85);
      --card-shadow-color: rgba(225, 29, 72, 0.5);
    }

    /* Dynamic Sakura Blossom Theme */
    body.theme-sakura {
      --bg-gradient: linear-gradient(135deg, #2a1b2d 0%, #3a2238 40%, #1a101f 100%);
      --card-bg: rgba(255, 182, 193, 0.25);
      --card-shadow-color: rgba(255, 182, 193, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: clamp(15px, 3vh, 30px);
      background: var(--bg-gradient);
      background-blend-mode: overlay, normal, normal;
      background-attachment: fixed;
      color: #ffffff;
      position: relative;
      transition: background 0.5s ease;
      overflow-x: hidden;
    }

    /* Background Animation Canvas Element */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      display: none;
    }

    body.theme-sakura #sakuraCanvas {
      display: block;
    }

    body.theme-retro #retroCanvas {
      display: block;
    }

    /* Top Left Date */
    .top-date {
      position: absolute;
      top: 24px;
      left: 24px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      user-select: none;
      z-index: 2;
    }

    /* Top Right Theme Button */
    .btn-theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      width: auto;
      height: auto;
      background: rgba(15, 17, 21, 0.85);
      color: #ffffff !important;
      padding: 10px 18px;
      font-size: 0.85rem !important;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
      opacity: 0.75;
      transition: opacity 0.3s ease, transform 0.2s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    .btn-theme-toggle:hover {
      opacity: 1;
      transform: translateY(-2px);
      background: rgba(0, 0, 0, 0.95);
    }

    /* Bottom Left Credit Tagline */
    .bottom-credit {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.35);
      user-select: none;
      z-index: 2;
    }

    /* Initial Circular Preloader Screen */
    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0c0e;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loader-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #00f0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Main App Layout */
    .app-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vw, 40px);
      width: 100%;
      max-width: 850px;
      margin-top: 20px;
      z-index: 2;
    }

    /* Responsive Bingo Card with Dynamic Background */
    .bingo-card {
      width: clamp(280px, 80vw, 420px);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: clamp(12px, 3.5vw, 22px);
      padding: clamp(10px, 2.8vw, 20px);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.6),
        0 0 20px var(--card-shadow-color),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      user-select: none;
      flex-shrink: 0;
      transition: background 0.5s ease, box-shadow 0.5s ease, border-color 0.3s ease;
    }

    /* Visual Indicator during Edit Mode */
    .bingo-card.editing-mode {
      border: 2px solid #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.6);
    }

    .header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      font-weight: 900;
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: clamp(1px, 0.8vw, 4px);
      margin-bottom: clamp(6px, 1.5vw, 12px);
      font-family: 'Arial Black', 'Trebuchet MS', 'Arial', sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(2px, 0.6vw, 4px);
      background-color: rgba(0, 0, 0, 0.15);
      border: clamp(2px, 0.6vw, 4px) solid transparent;
      border-radius: 6px;
      overflow: hidden;
    }

    .cell {
      background-color: #ffffff;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 4vw, 2rem);
      font-weight: 800;
      color: #000000;
      cursor: pointer;
      position: relative;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
      padding: 2px;
      text-align: center;
    }

    .cell.free {
      color: #009be3;
      font-size: clamp(0.75rem, 2.6vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* Target Indicator */
    .cell.target {
      box-shadow: inset 0 0 0 clamp(3px, 0.9vw, 4.5px) #ff007f;
      z-index: 2;
    }

    /* Editable Input styling for Edit Mode */
    .cell input.edit-input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: #0d1117;
      outline: none;
      text-transform: uppercase;
      padding: 0;
      margin: 0;
    }

    .cell input.edit-input:focus {
      background: rgba(250, 204, 21, 0.25);
    }

    /* Translucent Dabber Marks */
    body[data-dabber="circle"] .cell.marked::after {
      content: '';
      position: absolute;
      width: 70%;
      height: 70%;
      background-color: var(--dabber-color);
      opacity: 0.55;
      border-radius: 50%;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    body[data-dabber="star"] .cell.marked::after {
      content: '★';
      position: absolute;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: var(--dabber-color);
      opacity: 0.65;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
      pointer-events: none;
    }

    body[data-dabber="stamp"] .cell.marked::after {
      content: '';
      position: absolute;
      width: 65%;
      height: 65%;
      background-color: var(--dabber-color);
      opacity: 0.45;
      border: 3px solid var(--dabber-color);
      border-radius: 4px;
      transform: rotate(-12deg);
      box-shadow: 0 0 6px var(--dabber-color);
      pointer-events: none;
    }

    body[data-dabber="heart"] .cell.marked::after {
      content: '♥';
      position: absolute;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: var(--dabber-color);
      opacity: 0.65;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
      pointer-events: none;
    }

    body[data-dabber="diamond"] .cell.marked::after {
      content: '◆';
      position: absolute;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: var(--dabber-color);
      opacity: 0.65;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
      pointer-events: none;
    }

    body[data-dabber="crosshair"] .cell.marked::after {
      content: '🎯';
      position: absolute;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      opacity: 0.65;
      line-height: 1;
      filter: drop-shadow(0 0 3px var(--dabber-color));
      pointer-events: none;
    }

    /* Side Control Panel */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 230px;
      align-items: stretch;
      background: rgba(20, 22, 28, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Selector Row */
    .selector-row {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .selector-row select.btn-select {
      flex: 1;
    }

    /* Compact Color Picker Input */
    input[type="color"].btn-color-compact {
      -webkit-appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 38px;
      height: 42px;
      border-radius: 10px;
      cursor: pointer;
      background: none;
      padding: 0;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }

    input[type="color"].btn-color-compact:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    input[type="color"].btn-color-compact::-webkit-color-swatch-wrapper {
      padding: 3px;
    }

    input[type="color"].btn-color-compact::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    /* Uniform Control Styling */
    button, label.btn-file, select.btn-select, select.btn-layouts {
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      height: 42px;
      padding: 0 14px;
      font-size: 0.85rem !important;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      outline: none;
    }

    button:hover, label.btn-file:hover, select.btn-select:hover, select.btn-layouts:hover {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }

    button:active, label.btn-file:active, select.btn-select:active, select.btn-layouts:active {
      transform: translateY(0);
    }

    /* Color Gradients */
    .btn-mode { 
      background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%); 
    }
    .btn-mode.active { 
      background: linear-gradient(135deg, #ff007f 0%, #9f1239 100%);
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.6);
    }

    .btn-edit {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
    .btn-edit.active {
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.6);
    }

    .btn-export { 
      background: linear-gradient(135deg, #10b981 0%, #047857 100%); 
    }
    .btn-import { 
      background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%); 
      color: #1a1a1a !important;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    /* Layout Dropdown Styling Matching Cyan Theme */
    select.btn-layouts {
      background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%);
      appearance: none;
      -webkit-appearance: none;
      text-align-last: center;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 18px;
      padding-right: 28px;
    }
    select.btn-layouts option {
      background-color: #1e293b;
      color: #ffffff;
    }

    .btn-reset { 
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); 
    }

    select.btn-select {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      appearance: none;
      -webkit-appearance: none;
      text-align-last: center;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 18px;
      padding-right: 28px;
    }

    select.btn-select option {
      background-color: #1e293b;
      color: #ffffff;
    }

    /* Fixed Low-Opacity Victory Button */
    .btn-victory {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: auto;
      height: auto;
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      color: #ffffff !important;
      padding: 10px 18px;
      font-size: 0.85rem !important;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 10;
      opacity: 0.75;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    .btn-victory:hover {
      opacity: 1;
    }

    #fileInput {
      display: none;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
      height: 20px;
      text-align: center;
      z-index: 2;
    }

    /* Overlay & Victory Modal */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .winner-card {
      background: linear-gradient(135deg, #1e1b4b, #311042);
      border: 2px solid #ff007f;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 0, 127, 0.5);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay.show .winner-card {
      transform: scale(1);
    }

    .winner-title {
      font-family: 'Arial Black', sans-serif;
      font-size: 3.5rem;
      background: linear-gradient(180deg, #fff 0%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 10px 0;
    }

    .winner-desc {
      font-size: 1.2rem;
      color: #e2e8f0;
      margin-bottom: 24px;
    }

    #confettiCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @media (max-width: 680px) {
      .app-container {
        flex-direction: column;
      }
      .controls {
        width: clamp(280px, 80vw, 420px);
      }
      .top-date {
        top: 12px;
        left: 16px;
      }
      .btn-theme-toggle {
        top: 12px;
        right: 16px;
      }
      .bottom-credit {
        bottom: 12px;
        left: 16px;
      }
    }
  </style>
</head>
<body data-dabber="stamp">

  <!-- Sakura Falling Petals Animation Canvas -->
  <canvas id="sakuraCanvas" class="bg-canvas"></canvas>

  <!-- 80s Retro Synthwave Grid Canvas -->
  <canvas id="retroCanvas" class="bg-canvas"></canvas>

  <!-- Preloader Screen -->
  <div class="loader-overlay" id="preloader">
    <div class="spinner"></div>
  </div>

  <div class="top-date" id="currentDate"></div>

  <!-- Top Right Theme Switcher Button -->
  <button class="btn-theme-toggle" id="themeBtn" onclick="cycleTheme()">🎨 Theme: Dark</button>

  <div class="app-container">
    <div class="bingo-card" id="bingoCardElement">
      <div class="header">
        <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
      </div>
      <div class="grid" id="bingoGrid">
        <!-- Cells generated via JavaScript -->
      </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls">
      <!-- 1. Default Layouts Dropdown -->
      <select class="btn-layouts" id="layoutSelect" onchange="loadPresetLayout(this.value)">
        <option value="" disabled selected>Default Layouts</option>
        <option value="CONOR">CONOR</option>
      </select>

      <!-- 2. Pattern + Color Selector Row -->
      <div class="selector-row">
        <select class="btn-select" id="dabberSelect" onchange="changeDabber(this.value)">
          <option value="stamp" selected>Stamp</option>
          <option value="circle">Circle</option>
          <option value="star">Star</option>
          <option value="heart">Heart</option>
          <option value="diamond">Diamond</option>
          <option value="crosshair">Target</option>
        </select>
        <input type="color" id="dabberColorPicker" class="btn-color-compact" value="#04ff00" onchange="changeDabberColor(this.value)" title="Choose Dabber Color">
      </div>

      <!-- 3. Mode Toggle -->
      <button class="btn-mode" id="toggleToolBtn" onclick="toggleMode()">Mode: Mark Spot</button>

      <!-- 4. Edit Card Layout -->
      <button class="btn-edit" id="toggleEditBtn" onclick="toggleEditCard()">Edit Card Layout</button>
      
      <!-- 5. File Actions & Reset -->
      <button class="btn-export" onclick="exportToFile()">Save File</button>
      <label class="btn-file btn-import">
        Open File
        <input type="file" id="fileInput" accept=".bingo,.json" onchange="importFromFile(event)">
      </label>
      <button class="btn-reset" onclick="resetCard()">Reset Card</button>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <!-- Bottom Left Tagline -->
  <div class="bottom-credit">Made by CM, free time, August 2026.</div>

  <!-- Victory Button -->
  <button class="btn-victory" onclick="triggerVictory(true)">🏆 Victory</button>

  <!-- Winner Overlay -->
  <div class="overlay" id="victoryOverlay">
    <canvas id="confettiCanvas"></canvas>
    <div class="winner-card">
      <h1 class="winner-title">VICTORY!</h1>
      <p class="winner-desc" id="victoryDesc">Target pattern complete!</p>
      <button class="btn-export" onclick="closeVictory()">Continue Playing</button>
    </div>
  </div>

  <script>
    // Theme Presets List (Dark Theme is main default)
    const THEMES = [
      { id: '', name: 'Dark' },
      { id: 'theme-sakura', name: 'Sakura Blossom 🌸' },
      { id: 'theme-retro', name: '80s Retro ⚡' },
      { id: 'theme-pink', name: 'Pink Girly' },
      { id: 'theme-green', name: 'Green Metallic' },
      { id: 'theme-blue', name: 'Blue Metallic' },
      { id: 'theme-red', name: 'Blood Red' }
    ];
    let currentThemeIndex = 0;

    // Hardcoded Preset Card Layouts
    const PRESET_LAYOUTS = {
      CONOR: [
        { id: "1", text: "2", marked: false, target: false },
        { id: "2", text: "27", marked: false, target: false },
        { id: "3", text: "36", marked: false, target: false },
        { id: "4", text: "50", marked: false, target: false },
        { id: "5", text: "74", marked: false, target: false },

        { id: "6", text: "3", marked: false, target: false },
        { id: "7", text: "26", marked: false, target: false },
        { id: "8", text: "37", marked: false, target: false },
        { id: "9", text: "46", marked: false, target: false },
        { id: "10", text: "75", marked: false, target: false },

        { id: "11", text: "14", marked: false, target: false },
        { id: "12", text: "28", marked: false, target: false },
        { id: "13", text: "FREE", marked: true, target: false, free: true },
        { id: "14", text: "58", marked: false, target: false },
        { id: "15", text: "71", marked: false, target: false },

        { id: "16", text: "10", marked: false, target: false },
        { id: "17", text: "24", marked: false, target: false },
        { id: "18", text: "43", marked: false, target: false },
        { id: "19", text: "53", marked: false, target: false },
        { id: "20", text: "65", marked: false, target: false },

        { id: "21", text: "6", marked: false, target: false },
        { id: "22", text: "22", marked: false, target: false },
        { id: "23", text: "45", marked: false, target: false },
        { id: "24", text: "59", marked: false, target: false },
        { id: "25", text: "61", marked: false, target: false }
      ]
    };

    let currentMode = 'mark'; // 'mark' | 'target'
    let isEditingCard = false;

    // Fade out preloader on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        const preloader = document.getElementById('preloader');
        if (preloader) preloader.classList.add('fade-out');
      }, 300);
    });

    document.addEventListener('DOMContentLoaded', () => {
      const dateEl = document.getElementById('currentDate');
      const now = new Date();
      dateEl.innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      initSakuraAnimation();
      initRetroAnimation();

      renderGrid(PRESET_LAYOUTS.CONOR);
      loadFromLocalStorage();
    });

    /* Theme Cycler Function */
    function cycleTheme() {
      currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
      applyTheme(THEMES[currentThemeIndex].id);
    }

    function applyTheme(themeId) {
      const themeObj = THEMES.find(t => t.id === themeId) || THEMES[0];
      currentThemeIndex = THEMES.indexOf(themeObj);

      // Remove existing theme classes
      THEMES.forEach(t => { if (t.id) document.body.classList.remove(t.id); });

      // Apply new theme class
      if (themeObj.id) {
        document.body.classList.add(themeObj.id);
      }

      document.getElementById('themeBtn').innerText = `🎨 Theme: ${themeObj.name}`;
      localStorage.setItem('bingoTheme', themeObj.id);

      // Explicitly stop all dynamic background animations first
      stopSakura();
      stopRetro();

      // Trigger animations only for explicit matching themes
      if (themeObj.id === 'theme-sakura') {
        startSakura();
      } else if (themeObj.id === 'theme-retro') {
        startRetro();
      }
    }

    /* Renders Grid Cells dynamically from state */
    function renderGrid(cellDataArray) {
      const gridContainer = document.getElementById('bingoGrid');
      gridContainer.innerHTML = '';

      cellDataArray.forEach((item) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.id = item.id;

        if (item.text.trim().toUpperCase() === 'FREE') {
          cell.classList.add('free');
        }
        if (item.marked) cell.classList.add('marked');
        if (item.target) cell.classList.add('target');

        cell.innerText = item.text;

        // Interaction Handlers
        cell.addEventListener('click', (e) => {
          if (isEditingCard) return;

          if (currentMode === 'mark') {
            cell.classList.toggle('marked');
          } else {
            cell.classList.toggle('target');
          }
          saveToLocalStorage();
          checkAutoVictory();
        });

        cell.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (isEditingCard) return;
          cell.classList.toggle('target');
          saveToLocalStorage();
          checkAutoVictory();
        });

        gridContainer.appendChild(cell);
      });
    }

    /* Load Preset Hardcoded Layout */
    function loadPresetLayout(key) {
      if (!PRESET_LAYOUTS[key]) return;

      if (isEditingCard) toggleEditCard(); // Close edit mode if open

      const cleanPreset = PRESET_LAYOUTS[key].map(cell => ({
        ...cell,
        marked: cell.text.toUpperCase() === 'FREE',
        target: false
      }));

      renderGrid(cleanPreset);
      saveToLocalStorage();
      showStatus(`Loaded "${key}" Layout!`);

      setTimeout(() => {
        document.getElementById('layoutSelect').selectedIndex = 0;
      }, 1000);
    }

    /* Toggle Editing State */
    function toggleEditCard() {
      const btn = document.getElementById('toggleEditBtn');
      const bingoCard = document.getElementById('bingoCardElement');
      const cells = document.querySelectorAll('.cell');

      isEditingCard = !isEditingCard;

      if (isEditingCard) {
        btn.innerText = 'Save Layout';
        btn.classList.add('active');
        bingoCard.classList.add('editing-mode');
        showStatus('Editing Mode: Type cell values below');

        cells.forEach(cell => {
          const currentText = cell.innerText.trim();
          cell.innerText = '';
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'edit-input';
          input.value = currentText;

          input.addEventListener('focus', () => input.select());
          cell.appendChild(input);
        });
      } else {
        btn.innerText = 'Edit Card Layout';
        btn.classList.remove('active');
        bingoCard.classList.remove('editing-mode');

        cells.forEach(cell => {
          const input = cell.querySelector('input.edit-input');
          if (input) {
            const val = input.value.trim() || '';
            cell.innerText = val;
            if (val.toUpperCase() === 'FREE') cell.classList.add('free');
            else cell.classList.remove('free');
          }
        });

        saveToLocalStorage();
        showStatus('Layout updated & saved!');
      }
    }

    function toggleMode() {
      if (isEditingCard) toggleEditCard();

      const btn = document.getElementById('toggleToolBtn');
      if (currentMode === 'mark') {
        currentMode = 'target';
        btn.innerText = 'Mode: Set Target';
        btn.classList.add('active');
      } else {
        currentMode = 'mark';
        btn.innerText = 'Mode: Mark Spot';
        btn.classList.remove('active');
      }
    }

    function changeDabber(style) {
      document.body.setAttribute('data-dabber', style);
      localStorage.setItem('bingoDabberStyle', style);
    }

    function changeDabberColor(colorHex) {
      document.documentElement.style.setProperty('--dabber-color', colorHex);
      localStorage.setItem('bingoDabberColor', colorHex);
    }

    function checkAutoVictory() {
      const targets = document.querySelectorAll('.cell.target');
      if (targets.length === 0) return;

      const allTargetsMarked = Array.from(targets).every(cell => cell.classList.contains('marked'));
      if (allTargetsMarked) {
        triggerVictory(false);
      }
    }

    function getCardData() {
      const state = [];
      document.querySelectorAll('.cell').forEach(cell => {
        let cellText = '';
        if (isEditingCard) {
          const input = cell.querySelector('input.edit-input');
          cellText = input ? input.value.trim() : cell.innerText.trim();
        } else {
          cellText = cell.innerText.trim();
        }

        state.push({
          id: cell.dataset.id,
          text: cellText,
          marked: cell.classList.contains('marked'),
          target: cell.classList.contains('target')
        });
      });

      return {
        version: "2.0",
        dabber: document.body.getAttribute('data-dabber') || 'stamp',
        dabberColor: getComputedStyle(document.documentElement).getPropertyValue('--dabber-color').trim() || '#04ff00',
        theme: THEMES[currentThemeIndex].id,
        timestamp: new Date().toISOString(),
        cells: state
      };
    }

    function applyCardData(data) {
      if (!data || !Array.isArray(data.cells)) return false;
      
      if (data.dabber) {
        changeDabber(data.dabber);
        document.getElementById('dabberSelect').value = data.dabber;
      }

      if (data.dabberColor) {
        changeDabberColor(data.dabberColor);
        document.getElementById('dabberColorPicker').value = data.dabberColor;
      }

      if (data.theme !== undefined) {
        applyTheme(data.theme);
      } else {
        applyTheme('');
      }

      renderGrid(data.cells);
      saveToLocalStorage();
      return true;
    }

    function saveToLocalStorage() {
      localStorage.setItem('bingoCardAutoSave', JSON.stringify(getCardData()));
    }

    function loadFromLocalStorage() {
      const savedTheme = localStorage.getItem('bingoTheme');
      applyTheme(savedTheme !== null ? savedTheme : '');

      const savedDabber = localStorage.getItem('bingoDabberStyle');
      if (savedDabber) {
        changeDabber(savedDabber);
        document.getElementById('dabberSelect').value = savedDabber;
      } else {
        changeDabber('stamp');
      }

      const savedColor = localStorage.getItem('bingoDabberColor');
      if (savedColor) {
        changeDabberColor(savedColor);
        document.getElementById('dabberColorPicker').value = savedColor;
      }

      const saved = localStorage.getItem('bingoCardAutoSave');
      if (saved) {
        try {
          applyCardData(JSON.parse(saved));
        } catch (e) {
          console.error("Failed to load auto-save state", e);
        }
      }
    }

    async function exportToFile() {
      if (isEditingCard) toggleEditCard();

      const cardData = getCardData();
      const jsonString = JSON.stringify(cardData, null, 2);
      const defaultFilename = `bingo-layout-${new Date().toISOString().slice(0, 10)}.bingo`;

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: defaultFilename,
            types: [{
              description: 'Bingo Layout File',
              accept: { 'application/json': ['.bingo', '.json'] },
            }],
          });
          const writable = await handle.createWritable();
          await writable.write(jsonString);
          await writable.close();
          showStatus('Layout saved successfully!');
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const blob = new Blob([jsonString], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = defaultFilename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);

      showStatus(`Saved: ${defaultFilename}`);
    }

    function importFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (applyCardData(data)) {
            showStatus(`Loaded "${file.name}"!`);
          } else {
            showStatus('Error: Invalid file format.');
          }
        } catch (err) {
          showStatus('Error reading file.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function resetCard() {
      if (isEditingCard) toggleEditCard();

      renderGrid(PRESET_LAYOUTS.CONOR);
      saveToLocalStorage();
      showStatus('Reset to default CONOR layout.');
    }

    function showStatus(msg) {
      const el = document.getElementById('statusMsg');
      el.innerText = msg;
      setTimeout(() => { el.innerText = ''; }, 3000);
    }

    function triggerVictory(manualClick = false) {
      const targets = document.querySelectorAll('.cell.target');
      const descEl = document.getElementById('victoryDesc');

      if (targets.length === 0) {
        descEl.innerText = "Bonus Victory Unlocked!";
      } else {
        const unmarkedTargets = Array.from(targets).filter(cell => !cell.classList.contains('marked'));
        if (unmarkedTargets.length === 0) {
          descEl.innerText = "Target pattern completed!";
        } else if (manualClick) {
          descEl.innerText = `Victory claimed! (${unmarkedTargets.length} target spot(s) remaining)`;
        } else {
          return;
        }
      }

      document.getElementById('victoryOverlay').classList.add('show');
      startConfetti();
    }

    function closeVictory() {
      document.getElementById('victoryOverlay').classList.remove('show');
      stopConfetti();
    }

    let confettiAnimationId = null;
    let particles = [];

    function startConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#ff007f', '#00f0ff', '#facc15', '#10b981', '#a855f7'];
      particles = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: Math.random() * 3 + 2,
        speedX: Math.random() * 2 - 1,
        angle: Math.random() * 360
      }));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.angle += 2;
          if (p.y > canvas.height) p.y = -10;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.angle * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        confettiAnimationId = requestAnimationFrame(render);
      }
      render();
    }

    function stopConfetti() {
      if (confettiAnimationId) {
        cancelAnimationFrame(confettiAnimationId);
      }
    }

    /* Sakura Petals Animation System */
    let sakuraCanvas, sakuraCtx;
    let sakuraPetals = [];
    let sakuraAnimationId = null;

    function initSakuraAnimation() {
      sakuraCanvas = document.getElementById('sakuraCanvas');
      sakuraCtx = sakuraCanvas.getContext('2d');
      resizeSakuraCanvas();
      window.addEventListener('resize', resizeSakuraCanvas);
    }

    function resizeSakuraCanvas() {
      if (sakuraCanvas) {
        sakuraCanvas.width = window.innerWidth;
        sakuraCanvas.height = window.innerHeight;
      }
    }

    function createSakuraPetals() {
      sakuraPetals = [];
      const colors = ['#ffb7c5', '#ff9ebb', '#ffe4e1', '#f3a4b5', '#ffd1dc'];
      const w = sakuraCanvas.width || window.innerWidth;
      const h = sakuraCanvas.height || window.innerHeight;

      for (let i = 0; i < 55; i++) {
        sakuraPetals.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() * 7 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 1.5 + 0.8,
          speedX: Math.random() * 0.8 + 0.2,
          angle: Math.random() * 360,
          spin: (Math.random() - 0.5) * 1.5,
          oscillation: Math.random() * Math.PI * 2
        });
      }
    }

    function drawPetal(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.angle * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.8;

      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.bezierCurveTo(p.size / 2, -p.size, p.size, -p.size / 3, p.size / 2, p.size);
      ctx.bezierCurveTo(0, p.size / 2, -p.size / 2, p.size / 2, -p.size / 2, p.size);
      ctx.bezierCurveTo(-p.size, -p.size / 3, -p.size / 2, -p.size, 0, -p.size);
      ctx.fill();
      ctx.restore();
    }

    function animateSakura() {
      if (!sakuraCtx || !sakuraCanvas) return;
      sakuraCtx.clearRect(0, 0, sakuraCanvas.width, sakuraCanvas.height);

      sakuraPetals.forEach(p => {
        p.y += p.speedY;
        p.oscillation += 0.02;
        p.x += p.speedX + Math.sin(p.oscillation) * 0.7;
        p.angle += p.spin;

        if (p.y > sakuraCanvas.height + 20) {
          p.y = -20;
          p.x = Math.random() * sakuraCanvas.width;
        }
        if (p.x > sakuraCanvas.width + 20) {
          p.x = -20;
        }

        drawPetal(sakuraCtx, p);
      });

      sakuraAnimationId = requestAnimationFrame(animateSakura);
    }

    function startSakura() {
      if (!sakuraAnimationId) {
        resizeSakuraCanvas();
        createSakuraPetals();
        animateSakura();
      }
    }

    function stopSakura() {
      if (sakuraAnimationId) {
        cancelAnimationFrame(sakuraAnimationId);
        sakuraAnimationId = null;
      }
      if (sakuraCtx && sakuraCanvas) {
        sakuraCtx.clearRect(0, 0, sakuraCanvas.width, sakuraCanvas.height);
      }
    }

    /* 80s Retro Moving Grid & Sun Canvas Animation */
    let retroCanvas, retroCtx;
    let retroAnimationId = null;
    let gridOffset = 0;
    let retroStars = [];

    function initRetroAnimation() {
      retroCanvas = document.getElementById('retroCanvas');
      retroCtx = retroCanvas.getContext('2d');
      resizeRetroCanvas();
      window.addEventListener('resize', resizeRetroCanvas);
    }

    function resizeRetroCanvas() {
      if (retroCanvas) {
        retroCanvas.width = window.innerWidth;
        retroCanvas.height = window.innerHeight;
      }
    }

    function createRetroStars(horizon) {
      retroStars = [];
      const colors = ['#00f0ff', '#ff007f', '#ffffff', '#e2e8f0'];
      for (let i = 0; i < 110; i++) {
        retroStars.push({
          x: Math.random() * retroCanvas.width,
          y: Math.random() * horizon,
          size: Math.random() * 2 + 0.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function drawRetroSun(w, h, horizon) {
      const sunRadius = Math.min(w, h) * 0.2;
      const sunX = w / 2;
      const sunY = horizon - 5;

      const sunGradient = retroCtx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY + sunRadius);
      sunGradient.addColorStop(0, '#facc15');
      sunGradient.addColorStop(0.5, '#ff007f');
      sunGradient.addColorStop(1, '#6b21a8');

      retroCtx.save();
      
      retroCtx.shadowBlur = 50;
      retroCtx.shadowColor = '#ff007f';

      retroCtx.beginPath();
      retroCtx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
      retroCtx.fillStyle = sunGradient;
      retroCtx.fill();

      retroCtx.shadowBlur = 0;
      const lineCount = 9;
      for (let i = 0; i < lineCount; i++) {
        const lineThickness = (i + 1) * 1.8;
        const lineY = sunY + (i * (sunRadius / lineCount)) + 2;

        retroCtx.clearRect(sunX - sunRadius - 20, lineY, (sunRadius + 20) * 2, lineThickness);
      }

      retroCtx.restore();
    }

    function animateRetro() {
      if (!retroCtx || !retroCanvas) return;
      const w = retroCanvas.width;
      const h = retroCanvas.height;
      const horizon = h * 0.52;

      retroCtx.clearRect(0, 0, w, h);

      // Render Floating Synthwave Stars
      retroStars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0.2) star.speed = -star.speed;

        retroCtx.save();
        retroCtx.globalAlpha = Math.max(0, Math.min(1, star.alpha));
        retroCtx.fillStyle = star.color;
        retroCtx.fillRect(star.x, star.y, star.size, star.size);
        retroCtx.restore();
      });

      // Render Neon Sun
      drawRetroSun(w, h, horizon);

      // Render Moving Flat Full-Width Grid
      retroCtx.save();
      retroCtx.strokeStyle = '#00f0ff';
      retroCtx.lineWidth = 2;
      retroCtx.shadowBlur = 12;
      retroCtx.shadowColor = '#00f0ff';

      const speed = 0.015;
      gridOffset = (gridOffset + speed) % 1;

      // Moving Horizontal Lines
      const maxLines = 16;
      for (let i = 0; i < maxLines; i++) {
        const lineProgress = (i + gridOffset) / maxLines;
        const lineY = horizon + lineProgress * (h - horizon);

        if (lineY >= horizon && lineY <= h) {
          retroCtx.beginPath();
          retroCtx.moveTo(0, lineY);
          retroCtx.lineTo(w, lineY);
          retroCtx.stroke();
        }
      }

      // Straight Parallel Vertical Lines across screen width
      const spacing = 45;
      for (let x = 0; x <= w; x += spacing) {
        retroCtx.beginPath();
        retroCtx.moveTo(x, horizon);
        retroCtx.lineTo(x, h);
        retroCtx.stroke();
      }

      retroCtx.restore();

      retroAnimationId = requestAnimationFrame(animateRetro);
    }

    function startRetro() {
      if (!retroAnimationId) {
        resizeRetroCanvas();
        createRetroStars(retroCanvas.height * 0.52);
        animateRetro();
      }
    }

    function stopRetro() {
      if (retroAnimationId) {
        cancelAnimationFrame(retroAnimationId);
        retroAnimationId = null;
      }
      if (retroCtx && retroCanvas) {
        retroCtx.clearRect(0, 0, retroCanvas.width, retroCanvas.height);
      }
    }
  </script>
