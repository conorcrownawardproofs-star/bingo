        for (const li of b.lit) ctx.fillRect(b.x + li.dx, horizon - b.h + li.dy, 1.5, 2);
      }
      ctx.fillStyle = '#0a140e'; // shore trees crowding the blocks
      ctx.fillRect(0, horizon - 3, w * 0.5, 6); // solid band so the seam never shows
      ctx.beginPath();
      for (const st2 of s.shoreTrees) {
        ctx.moveTo(st2.x + st2.r, horizon - st2.r * 0.55);
        ctx.arc(st2.x, horizon - st2.r * 0.55, st2.r, 0, Math.PI * 2);
      }
      ctx.fill();

      // Right bank: the Palisades — one lone tower behind the cliff line
      const tw1 = s.loneTower;
      ctx.fillStyle = '#131a30';
      ctx.fillRect(tw1.x, horizon - tw1.h, tw1.w, tw1.h);
      ctx.fillStyle = 'rgba(150, 170, 220, 0.45)';
      for (const li of tw1.lit) ctx.fillRect(tw1.x + li.dx, horizon - tw1.h + li.dy, 1.5, 2);
      ctx.fillStyle = '#231c15'; // the cliff face
      ctx.beginPath();
      ctx.moveTo(s.cliffs[0].x, horizon + 2);
      for (const cp of s.cliffs) ctx.lineTo(cp.x, horizon - cp.top);
      ctx.lineTo(w + 40, horizon + 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(64, 50, 36, 0.8)'; // rock strata
      ctx.lineWidth = 1;
      for (const off of [8, 15, 22]) {
        ctx.beginPath();
        let started = false;
        for (const cp of s.cliffs) {
          const yy = horizon - cp.top + off;
          if (yy < horizon - 1) {
            if (!started) { ctx.moveTo(cp.x, yy); started = true; }
            else ctx.lineTo(cp.x, yy);
          } else started = false;
        }
        ctx.stroke();
      }
      ctx.fillStyle = '#0a120c'; // tree fuzz along the clifftop
      ctx.beginPath();
      for (const cp of s.cliffs) {
        const fr = 4 + (cp.top % 5);
        ctx.moveTo(cp.x + fr, horizon - cp.top - 2);
        ctx.arc(cp.x, horizon - cp.top - 2, fr, 0, Math.PI * 2);
      }
      ctx.fill();

      // --- The George Washington Bridge ahead, slowly filling the view ---
      const sBr = 0.88 + 0.2 * (0.5 + 0.5 * Math.sin(t * 0.00002 - Math.PI / 2));
      const bx = w / 2 + curve * 0.9;
      const gap = w * 0.17 * sBr;
      const tx1 = bx - gap, tx2 = bx + gap;
      const towerTop = horizon - h * 0.28 * sBr;
      const deckY = horizon - 3;
      const ax1 = tx1 - gap * 1.35, ax2 = tx2 + gap * 1.35;

      const drawTower = (tx) => {
        const legOff = 13 * sBr, legW = 6 * sBr;
        const th2 = horizon + 8 - towerTop;
        ctx.fillStyle = '#252c3b';
        ctx.fillRect(tx - legOff - legW / 2, towerTop, legW, th2);
        ctx.fillRect(tx + legOff - legW / 2, towerTop, legW, th2);
        ctx.strokeStyle = '#2c3445';
        ctx.lineWidth = 3.5 * sBr;
        ctx.beginPath();
        ctx.moveTo(tx - legOff, towerTop + 2);
        ctx.lineTo(tx + legOff, towerTop + 2);
        ctx.stroke();
        ctx.lineWidth = 2 * sBr; // lattice bracing
        for (let seg = 0; seg < 4; seg++) {
          const yA = towerTop + th2 * (seg / 4) + 4;
          const yB = towerTop + th2 * ((seg + 1) / 4);
          ctx.beginPath();
          ctx.moveTo(tx - legOff, yA); ctx.lineTo(tx + legOff, yB);
          ctx.moveTo(tx + legOff, yA); ctx.lineTo(tx - legOff, yB);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(tx - legOff, yB); ctx.lineTo(tx + legOff, yB);
          ctx.stroke();
        }
        if (Math.sin(t * 0.0015 + tx) > 0) { // red aircraft beacon
          ctx.fillStyle = '#ff4040';
          ctx.beginPath();
          ctx.arc(tx, towerTop - 4, 2.2 * sBr, 0, Math.PI * 2);
          ctx.fill();
        }
      };
      drawTower(tx1);
      drawTower(tx2);

      // Main cables: two side spans + the sagging center span
      const yCtrl = 2 * (deckY - 12 * sBr) - towerTop;
      const spans = [
        [ax1, deckY - 2, (ax1 + tx1) / 2, deckY - (deckY - towerTop) * 0.12, tx1, towerTop],
        [tx1, towerTop, bx, yCtrl, tx2, towerTop],
        [tx2, towerTop, (tx2 + ax2) / 2, deckY - (deckY - towerTop) * 0.12, ax2, deckY - 2]
      ];
      const qx = (sp, f) => { const a = 1 - f; return a * a * sp[0] + 2 * a * f * sp[2] + f * f * sp[4]; };
      const qy = (sp, f) => { const a = 1 - f; return a * a * sp[1] + 2 * a * f * sp[3] + f * f * sp[5]; };
      // Four main cables: a far pair behind the deck, a near pair in front
      for (const [dy3, sep, colr, lw2] of [
        [-4 * sBr, 2.2 * sBr, '#2e3542', 1.5 * sBr],
        [0, 3 * sBr, '#39414f', 2 * sBr]
      ]) {
        ctx.strokeStyle = colr;
        ctx.lineWidth = lw2;
        for (const off2 of [0, sep]) {
          for (const sp of spans) {
            ctx.beginPath();
            ctx.moveTo(sp[0], sp[1] + dy3 + off2);
            ctx.quadraticCurveTo(sp[2], sp[3] + dy3 + off2, sp[4], sp[5] + dy3 + off2);
            ctx.stroke();
          }
        }
      }
      ctx.strokeStyle = 'rgba(120, 132, 152, 0.5)'; // suspender cables
      ctx.lineWidth = 1;
      for (let f = 0.08; f < 0.93; f += 0.075) {
        ctx.beginPath();
        ctx.moveTo(qx(spans[1], f), qy(spans[1], f));
        ctx.lineTo(qx(spans[1], f), deckY);
        ctx.stroke();
      }
      let ni = 0; // necklace lights along all three spans
      ctx.fillStyle = '#ffe9b0';
      for (const sp of spans) {
        for (let f = 0; f <= 1.001; f += 1 / 15) {
          ctx.globalAlpha = 0.5 + 0.4 * Math.abs(Math.sin(t * 0.0008 + ni * 0.7));
          ctx.beginPath();
          ctx.arc(qx(sp, f), qy(sp, f), 1.6 * sBr, 0, Math.PI * 2);
          ctx.fill();
          ni++;
        }
      }
      ctx.globalAlpha = 1;
      // The long double-deck steel truss spanning shore to shore
      const trussH = 10 * sBr;
      ctx.fillStyle = 'rgba(15, 20, 31, 0.94)';
      ctx.fillRect(ax1, deckY, ax2 - ax1, trussH);
      ctx.strokeStyle = '#39414f';
      ctx.lineWidth = 1.6 * sBr;
      ctx.beginPath(); // top, mid and bottom chords
      ctx.moveTo(ax1, deckY); ctx.lineTo(ax2, deckY);
      ctx.moveTo(ax1, deckY + trussH * 0.52); ctx.lineTo(ax2, deckY + trussH * 0.52);
      ctx.moveTo(ax1, deckY + trussH); ctx.lineTo(ax2, deckY + trussH);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(70, 80, 98, 0.7)'; // lattice diagonals
      ctx.lineWidth = 1 * sBr;
      ctx.beginPath();
      const latStep = 14 * sBr;
      for (let lx2 = ax1; lx2 < ax2 - latStep; lx2 += latStep) {
        ctx.moveTo(lx2, deckY);
        ctx.lineTo(lx2 + latStep, deckY + trussH);
        ctx.moveTo(lx2, deckY + trussH);
        ctx.lineTo(lx2 + latStep, deckY);
      }
      ctx.stroke();
      // Cars and trucks streaming across the upper and lower decks
      for (const v of s.deckTraffic) {
        v.f += v.speed * v.dir;
        if (v.f > 1.03) v.f -= 1.06;
        if (v.f < -0.03) v.f += 1.06;
        const vx = ax1 + v.f * (ax2 - ax1);
        const vy = deckY + (v.deck ? trussH * 0.76 : trussH * 0.24);
        ctx.globalAlpha = v.deck ? 0.75 : 0.95;
        ctx.fillStyle = v.dir > 0 ? '#f8e8c0' : '#ff5a5a'; // headlights vs taillights
        ctx.fillRect(vx, vy - 1 * sBr, (v.truck ? 4.5 : 2.5) * sBr, 2 * sBr);
        if (v.truck) { // trailer marker light
          ctx.fillStyle = '#ffb84d';
          ctx.fillRect(vx - v.dir * 6 * sBr, vy - 0.8 * sBr, 2 * sBr, 1.6 * sBr);
        }
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffd9a0'; // roadway lights along the top chord
      for (let dx2 = ax1 + 8; dx2 < ax2; dx2 += 30) {
        ctx.fillRect(dx2, deckY - 1.5, 2, 2);
      }

      // Warm haze where the riverbank meets the sky
      const haze = ctx.createLinearGradient(0, horizon - 44, 0, horizon);
      haze.addColorStop(0, 'rgba(138, 67, 88, 0)');
      haze.addColorStop(1, 'rgba(160, 84, 96, 0.3)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizon - 44, w, 44);

      // --- Road ---
      // Riverbank ground: faintly sky-lit at the water's edge, darkening down
      const bank = ctx.createLinearGradient(0, horizon, 0, h * 0.82);
      bank.addColorStop(0, '#1b1f2e');
      bank.addColorStop(0.3, '#141826');
      bank.addColorStop(1, '#0d1015');
      ctx.fillStyle = bank;
      ctx.fillRect(0, horizon, w, h - horizon);

      // The Hudson: a dark water band under the far shore
      const waterH = h * 0.075;
      const water = ctx.createLinearGradient(0, horizon, 0, horizon + waterH);
      water.addColorStop(0, '#0e1424');
      water.addColorStop(1, '#111520');
      ctx.fillStyle = water;
      ctx.fillRect(0, horizon, w, waterH);

      // The right bank falls away — open water widening below
      const wedgeDepth = (x2) => waterH + Math.max(0, (x2 - w * 0.52) / (w * 0.48)) * (h * 0.23 - waterH);
      const water2 = ctx.createLinearGradient(0, horizon, 0, horizon + h * 0.24);
      water2.addColorStop(0, '#0e1424');
      water2.addColorStop(1, '#0f131d');
      ctx.fillStyle = water2;
      ctx.beginPath();
      ctx.moveTo(w * 0.5, horizon);
      ctx.lineTo(w + 2, horizon);
      ctx.lineTo(w + 2, horizon + h * 0.23);
      ctx.lineTo(w * 0.52, horizon + waterH);
      ctx.closePath();
      ctx.fill();
      // Faint wave glints drifting across the open water
      ctx.fillStyle = 'rgba(165, 185, 220, 0.1)';
      for (const wv of s.waves) {
        wv.fx -= 0.00006;
        if (wv.fx < 0) wv.fx += 1;
        const wx = w * 0.55 + wv.fx * (w * 0.44);
        const wy = horizon + 5 + wv.fy * (wedgeDepth(wx) - 10);
        ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.0009 + wv.ph));
        ctx.fillRect(wx, wy, wv.len, 1.4);
      }
      ctx.globalAlpha = 1;

      // Shimmering reflections of the city windows
      ctx.fillStyle = '#8fa0d0';
      for (const b of s.shoreline) {
        for (const li of b.lit) {
          const rx = b.x + li.dx;
          const shim = Math.abs(Math.sin(t * 0.0011 + rx * 0.63));
          ctx.globalAlpha = 0.06 + shim * 0.2;
          ctx.fillRect(rx, horizon + 2 + (li.dy % 5), 1.5, 4 + (li.dy % 9));
        }
      }
      // Amber smear of the bridge necklace on the water
      ctx.fillStyle = '#c9a06a';
      for (let rxx = ax1; rxx < ax2; rxx += 26) {
        ctx.globalAlpha = 0.06 + 0.09 * Math.abs(Math.sin(t * 0.0009 + rxx * 0.2));
        ctx.fillRect(rxx + Math.sin(t * 0.0005 + rxx) * 2, horizon + 3, 10, 2);
      }
      // The lone tower's lights on the water below the cliffs
      ctx.fillStyle = '#9aa8d4';
      for (const li of tw1.lit) {
        const rx = tw1.x + li.dx;
        ctx.globalAlpha = 0.08 + 0.2 * Math.abs(Math.sin(t * 0.001 + rx));
        ctx.fillRect(rx, horizon + 3 + (li.dy % 6), 1.5, 6 + (li.dy % 10));
      }
      // Moonlight glitter trailing down the open river
      ctx.fillStyle = '#dfe7f5';
      for (let gi = 0; gi < 13; gi++) {
        const gy = horizon + 3 + gi * 8.5;
        const sway2 = Math.sin(t * 0.0006 + gi * 1.7) * (3 + gi * 1.6);
        ctx.globalAlpha = Math.max(0.03, 0.3 - gi * 0.019) * (0.55 + 0.45 * Math.abs(Math.sin(t * 0.0013 + gi)));
        ctx.fillRect(w * 0.78 + sway2 - (5 + gi), gy, 10 + gi * 2, 1.6);
      }
      ctx.globalAlpha = 1;

      // The near tower's legs run down into the Hudson
      const legOff2 = 13 * sBr, legW2 = 6 * sBr;
      const pierY = horizon + h * 0.115;
      ctx.fillStyle = '#20283a';
      ctx.fillRect(tx2 - legOff2 - legW2 / 2, horizon - 2, legW2, pierY - horizon + 2);
      ctx.fillRect(tx2 + legOff2 - legW2 / 2, horizon - 2, legW2, pierY - horizon + 2);
      ctx.strokeStyle = '#242c3f'; // brace between the legs
      ctx.lineWidth = 2 * sBr;
      ctx.beginPath();
      ctx.moveTo(tx2 - legOff2, horizon + 8);
      ctx.lineTo(tx2 + legOff2, pierY - 6);
      ctx.moveTo(tx2 + legOff2, horizon + 8);
      ctx.lineTo(tx2 - legOff2, pierY - 6);
      ctx.stroke();
      ctx.fillStyle = '#1a2231'; // the pier at the waterline
      ctx.fillRect(tx2 - 21 * sBr, pierY - 5 * sBr, 42 * sBr, 7 * sBr);
      ctx.strokeStyle = 'rgba(26, 34, 49, 0.55)'; // rippled reflection below
      ctx.lineWidth = 3 * sBr;
      for (const lo of [-legOff2, legOff2]) {
        ctx.beginPath();
        for (let ry = 0; ry <= 24; ry += 5) {
          const wob = Math.sin(t * 0.0011 + ry * 0.8 + lo) * 2.5;
          if (ry === 0) ctx.moveTo(tx2 + lo + wob, pierY + 3);
          else ctx.lineTo(tx2 + lo + wob, pierY + 3 + ry);
        }
        ctx.stroke();
      }

      // Scattered scrub dotting the banks as they slide past
      for (const tf of s.tufts) {
        tf.p += 0.0013 + tf.p * 0.005;
        if (tf.p > 1.06) { tf.p -= 1.06; tf.side = Math.random() < 0.5 ? -1 : 1; tf.lat = Math.random(); }
        const u2 = tf.p;
        if (u2 < 0.04) continue;
        const ty2 = Y(u2);
        const tx2 = xc(u2) + tf.side * (half(u2) + 24 + tf.lat * (60 + 520 * u2));
        const r2 = (1.5 + 11 * Math.pow(u2, 1.7)) * tf.size;
        if (tf.side > 0 && tx2 > w * 0.52 && ty2 < horizon + wedgeDepth(tx2)) continue;
        ctx.globalAlpha = Math.min(0.9, u2 * 4);
        ctx.fillStyle = tf.shade;
        ctx.beginPath();
        ctx.ellipse(tx2, ty2 - r2 * 0.35, r2, r2 * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      const roadGrad = ctx.createLinearGradient(0, horizon, 0, h);
      roadGrad.addColorStop(0, '#12141c');
      roadGrad.addColorStop(1, '#07080c');
      ctx.fillStyle = roadGrad;
      ctx.beginPath();
      ctx.moveTo(xc(0), horizon);
      for (let u = 0; u <= 1.001; u += 0.1) ctx.lineTo(xc(u) - half(u), Y(u));
      for (let u = 1; u >= -0.001; u -= 0.1) ctx.lineTo(xc(u) + half(u), Y(u));
      ctx.closePath();
      ctx.fill();

      // Solid edge lines, stroked segment-by-segment so they taper with distance
      ctx.strokeStyle = 'rgba(226, 228, 238, 0.5)';
      ctx.lineCap = 'round';
      for (const side of [-1, 1]) {
        let prevU = 0.03;
        for (let u = 0.1; u <= 1.001; u += 0.07) {
          ctx.lineWidth = 0.5 + u * 3;
          ctx.beginPath();
          ctx.moveTo(xc(prevU) + side * half(prevU) * 0.94, Y(prevU));
          ctx.lineTo(xc(u) + side * half(u) * 0.94, Y(u));
          ctx.stroke();
          prevU = u;
        }
      }

      // Lane dashes rushing underneath
      ctx.fillStyle = '#f2d271';
      for (const d of s.dashes) {
        d.p += 0.002 + d.p * 0.007;
        if (d.p > 1) d.p -= 1;
        const u1 = d.p, u2 = Math.min(1, d.p + 0.035 * (1 - d.p * 0.4));
        const wd1 = 1 + 12 * Math.pow(u1, 1.7), wd2 = 1 + 12 * Math.pow(u2, 1.7);
        ctx.globalAlpha = Math.min(1, u1 * 6);
        ctx.beginPath();
        ctx.moveTo(xc(u1) - wd1 / 2, Y(u1));
        ctx.lineTo(xc(u1) + wd1 / 2, Y(u1));
        ctx.lineTo(xc(u2) + wd2 / 2, Y(u2));
        ctx.lineTo(xc(u2) - wd2 / 2, Y(u2));
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // --- Continuous foliage walls ---
      // Discrete clusters alone always leave momentary gaps when their spacing
      // lines up, so the base coverage is two layered silhouette ribbons per
      // side: a taller, lighter canopy behind and a darker one in front, each
      // a single filled path whose scalloped top contour streams toward the
      // viewer. The clusters then ride on top for the whizzing parallax.
      const flow = t * 0.0005;
      const edgeX = (u, side) => xc(u) + side * (half(u) + 30 + 88 * u);
      const foliageTop = (u, back) => {
        const d = 1 / (1.15 - Math.min(u, 1.1)); // pseudo inverse distance
        const fmul = back ? 0.6 : 1;
        const b = Math.sin(d * 2.1 - flow * 6 * fmul) * 0.5
                + Math.sin(d * 4.7 - flow * 11 * fmul + 2.3) * 0.3
                + Math.sin(d * 9.3 - flow * 19 * fmul + 4.1) * 0.2;
        const hgt = (10 + h * (back ? 0.22 : 0.155) * Math.pow(u, 1.75)) * (1 + 0.3 * b);
        return Y(u) - hgt;
      };
      for (const side of [-1, 1]) {
        for (const back of [true, false]) {
          const u0 = 0.07, u1 = 1.12, du = 0.055;
          ctx.fillStyle = back ? '#0c1f12' : '#07130c';
          ctx.beginPath();
          ctx.moveTo(edgeX(u0, side), Y(u0) + 2);
          // Down the inner-bottom edge toward the viewer
          for (let u = u0; u <= u1 + 0.001; u += du) ctx.lineTo(edgeX(u, side), Y(u) + 4);
          // Out past the screen corner and up the outer edge
          const outX = side > 0 ? w + 80 : -80;
          ctx.lineTo(outX, h + 80);
          ctx.lineTo(outX, foliageTop(u1, back) - 40);
          // Back along the scalloped canopy top toward the horizon
          let px2 = null, py2 = null;
          for (let u = u1; u >= u0 - 0.001; u -= du) {
            const x2 = edgeX(u, side), y2 = foliageTop(u, back);
            if (px2 === null) {
              ctx.lineTo(x2, y2);
            } else {
              const lift = 4 + 22 * Math.pow(Math.max(u, 0), 1.8);
              ctx.quadraticCurveTo((px2 + x2) / 2, Math.min(py2, y2) - lift, x2, y2);
            }
            px2 = x2; py2 = y2;
          }
          ctx.closePath();
          ctx.fill();
        }
      }

      // Roadside: foliage walls + streetlights, depth-sorted together so a
      // near tree properly hides a far lamp and a near lamp stands in front
      // of far greenery. Foliage is anchored by its innermost edge just
      // beyond the lamp corridor, so at equal depth they never collide.
      const drawTreeCluster = (tr) => {
        tr.p += 0.0016 + tr.p * 0.006;
        if (tr.p > 1.12) {
          tr.p -= 1.12;
          tr.side = Math.random() < 0.5 ? -1 : 1;
          tr.jit = Math.random() * 200;
          tr.size = Math.random() * 0.7 + 0.9;
        }
        const u = tr.p;
        if (u < 0.03) return;
        const ty = Y(u) + 6;
        const r = (6 + 95 * Math.pow(u, 1.85)) * tr.size;
        const clearance = half(u) + 34 + 92 * u + tr.jit * u * 0.5;
        const tx = xc(u) + tr.side * (clearance - tr.inner * r);
        ctx.globalAlpha = Math.min(1, u * 5);
        ctx.fillStyle = tr.shade;
        ctx.beginPath();
        for (const b of tr.blobs) {
          const bx2 = tx + tr.side * b.ox * r, by2 = ty - r * 0.45 + b.oy * r;
          ctx.moveTo(bx2 + b.rf * r, by2);
          ctx.arc(bx2, by2, b.rf * r, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.globalAlpha = 1;
      };

      const drawStreetlight = (pole) => {
        pole.p += 0.0015 + pole.p * 0.0055;
        if (pole.p > 1.05) pole.p -= 1.05;
        const u = pole.p;
        if (u < 0.02) return;
        const py = Y(u);
        const ph = (h * 0.36) * Math.pow(u, 1.8) + 3;
        for (const side of [-1, 1]) {
          const px = xc(u) + side * (half(u) + 10 + 60 * u);
          ctx.strokeStyle = 'rgba(90, 96, 112, ' + Math.min(0.9, u * 3) + ')';
          ctx.lineWidth = 0.5 + u * 4;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px, py - ph);
          ctx.lineTo(px - side * (6 + 18 * u), py - ph);
          ctx.stroke();
          const lampX = px - side * (6 + 18 * u);
          const glow = ctx.createRadialGradient(lampX, py - ph, 0, lampX, py - ph, 8 + 26 * u);
          glow.addColorStop(0, 'rgba(255, 214, 150, 0.85)');
          glow.addColorStop(1, 'rgba(255, 214, 150, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(lampX, py - ph, 8 + 26 * u, 0, Math.PI * 2);
          ctx.fill();
        }
      };

      const roadside = [
        ...s.trees.map(o => ({ p: o.p, o, tree: true })),
        ...s.poles.map(o => ({ p: o.p, o, tree: false }))
      ].sort((a, b) => a.p - b.p);
      for (const item of roadside) {
        if (item.tree) drawTreeCluster(item.o); else drawStreetlight(item.o);
      }

      // The car we're following
      const ca = s.carAhead;
      ca.sway += 0.004;
      const cap = 0.34 + Math.sin(ca.sway) * 0.05 + Math.sin(ca.sway * 3.4) * 0.012;
      const cax = xc(cap) + Math.sin(t * 0.0003) * half(cap) * 0.2;
      const cay = Y(cap);
      const cw = half(cap) * 0.36;
      ctx.fillStyle = '#0b0d13';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cax - cw / 2, cay - cw * 0.46, cw, cw * 0.42, cw * 0.08)
                    : ctx.rect(cax - cw / 2, cay - cw * 0.46, cw, cw * 0.42);
      ctx.fill();
      ctx.fillStyle = '#131722'; // cabin
      ctx.fillRect(cax - cw * 0.34, cay - cw * 0.66, cw * 0.68, cw * 0.26);
      const brake = 0.65 + Math.abs(Math.sin(t * 0.00055)) * 0.35;
      for (const sd of [-1, 1]) {
        const tlx = cax + sd * cw * 0.36, tly = cay - cw * 0.3;
        const tg = ctx.createRadialGradient(tlx, tly, 0, tlx, tly, cw * 0.2 + 2);
        tg.addColorStop(0, 'rgba(255, 70, 70, ' + brake + ')');
        tg.addColorStop(1, 'rgba(255, 70, 70, 0)');
        ctx.fillStyle = tg;
        ctx.beginPath();
        ctx.arc(tlx, tly, cw * 0.2 + 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff4646';
        ctx.fillRect(tlx - cw * 0.07, tly - cw * 0.035, cw * 0.14, cw * 0.07);
      }
      ctx.fillStyle = 'rgba(240, 240, 255, 0.75)'; // plate light
      ctx.fillRect(cax - 1.5, cay - cw * 0.14, 3, 1.6);

      // Oncoming headlights in the opposite lane
      const on = s.oncoming;
      if (!on.active) {
        if (--on.timer <= 0) { on.active = true; on.p = 0.03; }
      } else {
        on.p += 0.002 + on.p * 0.01;
        if (on.p > 1.08) { on.active = false; on.timer = Math.random() * 420 + 240; }
        else {
          const ox = xc(on.p) - half(on.p) * 0.55;
          const oy = Y(on.p);
          const sep = half(on.p) * 0.16 + 2;
          if (on.p > 0.4) {
            ctx.fillStyle = '#0a0c12';
            ctx.fillRect(ox - sep - 4, oy - sep * 0.8, sep * 2 + 8, sep * 0.8);
          }
          for (const sd of [-1, 1]) {
            const hx = ox + sd * sep;
            const hg = ctx.createRadialGradient(hx, oy - 2, 0, hx, oy - 2, 4 + on.p * 26);
            hg.addColorStop(0, 'rgba(255, 250, 225, 0.95)');
            hg.addColorStop(0.25, 'rgba(255, 240, 190, 0.55)');
            hg.addColorStop(1, 'rgba(255, 240, 190, 0)');
            ctx.fillStyle = hg;
            ctx.beginPath();
            ctx.arc(hx, oy - 2, 4 + on.p * 26, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Windshield vignette + tint strip (world only — cab stays crisp)
      const vig = ctx.createRadialGradient(w / 2, h * 0.45, h * 0.3, w / 2, h * 0.45, h * 0.85);
      vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vig.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
      const tint = ctx.createLinearGradient(0, 0, 0, h * 0.09);
      tint.addColorStop(0, 'rgba(8, 10, 20, 0.5)');
      tint.addColorStop(1, 'rgba(8, 10, 20, 0)');
      ctx.fillStyle = tint;
      ctx.fillRect(0, 0, w, h * 0.09);

      // --- The cab ---
      const sc = Math.min(1.1, Math.max(0.7, w / 1200));

      // Dashboard shell
      ctx.beginPath();
      ctx.moveTo(0, h * 0.9);
      ctx.quadraticCurveTo(w * 0.25, h * 0.84, w * 0.5, h * 0.825);
      ctx.quadraticCurveTo(w * 0.75, h * 0.84, w, h * 0.9);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      const dashGrad = ctx.createLinearGradient(0, h * 0.82, 0, h);
      dashGrad.addColorStop(0, '#141826');
      dashGrad.addColorStop(1, '#05060a');
      ctx.fillStyle = dashGrad;
      ctx.fill();
      ctx.strokeStyle = '#2a3044'; // rim catchlight
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.9);
      ctx.quadraticCurveTo(w * 0.25, h * 0.84, w * 0.5, h * 0.825);
      ctx.quadraticCurveTo(w * 0.75, h * 0.84, w, h * 0.9);
      ctx.stroke();

      // Glowing gauges
      const gaugeY = h * 0.93;
      const drawGauge = (gx, frac, accent) => {
        const R = 34 * sc;
        ctx.save();
        ctx.fillStyle = '#05070c';
        ctx.beginPath();
        ctx.arc(gx, gaugeY, R, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2a3140';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(gx, gaugeY, R - 3, Math.PI * 0.75, Math.PI * 0.75 + Math.PI * 1.5 * frac);
        ctx.stroke();
        ctx.strokeStyle = '#5b647a'; // ticks
        ctx.lineWidth = 1.4;
        for (let i = 0; i <= 8; i++) {
          const a = Math.PI * 0.75 + (Math.PI * 1.5 * i) / 8;
          ctx.beginPath();
          ctx.moveTo(gx + Math.cos(a) * (R - 7), gaugeY + Math.sin(a) * (R - 7));
          ctx.lineTo(gx + Math.cos(a) * (R - 12), gaugeY + Math.sin(a) * (R - 12));
          ctx.stroke();
        }
        const na = Math.PI * 0.75 + Math.PI * 1.5 * frac; // needle
        ctx.strokeStyle = 'rgba(255, 93, 93, 0.35)';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(gx, gaugeY);
        ctx.lineTo(gx + Math.cos(na) * (R - 10), gaugeY + Math.sin(na) * (R - 10));
        ctx.stroke();
        ctx.strokeStyle = '#ff5d5d';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#242b3a';
        ctx.beginPath();
        ctx.arc(gx, gaugeY, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };
      const speedFrac = 0.55 + Math.sin(t * 0.00035) * 0.04 + Math.sin(t * 0.00155) * 0.012;
      const revFrac = 0.42 + Math.sin(t * 0.00035) * 0.05 + Math.sin(t * 0.00235) * 0.02;
      drawGauge(w / 2 - 118 * sc, speedFrac, 'rgba(56, 189, 248, 0.55)');
      drawGauge(w / 2 + 118 * sc, revFrac, 'rgba(251, 191, 36, 0.55)');

      // Dash LEDs
      for (const [lx, lc] of [[w * 0.16, '#38bdf8'], [w * 0.2, '#fbbf24'], [w * 0.8, '#4ade80'], [w * 0.84, '#f472b6']]) {
        ctx.fillStyle = lc;
        ctx.globalAlpha = 0.5 + Math.abs(Math.sin(t * 0.001 + lx)) * 0.5;
        ctx.beginPath();
        ctx.arc(lx, h * 0.95, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Steering wheel, leaning into the curve
      const hubX = w / 2, hubY = h * 1.05;
      const R = Math.min(260, Math.max(150, w * 0.17));
      ctx.save();
      ctx.translate(hubX, hubY);
      ctx.rotate(-curve * 0.0028);
      ctx.strokeStyle = '#181b24';
      ctx.lineWidth = 17;
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#2e3547';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, R - 6, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.fillStyle = '#14171f'; // three spokes
      for (const ang of [Math.PI, 0, Math.PI / 2]) {
        ctx.save();
        ctx.rotate(ang);
        ctx.fillRect(0, -9, R - 6, 18);
        ctx.restore();
      }
      ctx.fillStyle = '#1e2330'; // hub
      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#333b50';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

    }

    const EFFECTS = {
      'theme-sakura': new PetalSystem('sakuraCanvas', 55, makeSakuraPetal),
      'theme-retro': new PetalSystem('vaporwavePetals', 80, makeVaporPetal),
      'theme-pink': new PetalSystem('pinkCanvas', 60, makeHeartSpark),
      'theme-green': new PetalSystem('luckyCanvas', 45, makeShamrock),
      'theme-red': new PetalSystem('redCanvas', 55, makeBatEmber),
      'theme-blue': new PetalSystem('blueCanvas', 34, makeChromeOrb),
      'theme-aqua': new SceneSystem('aquaCanvas', buildAquarium, drawAquarium),
      'theme-portal': new PetalSystem('portalDust', 45, makeDustMote),
      'theme-space': new PetalSystem('spaceCanvas', 150, makePixelStar),
      'theme-city': new SceneSystem('cityCanvas', buildCityDrive, drawCityDrive),
      'theme-drive': new SceneSystem('driveCanvas', buildGwbDrive, drawGwbDrive)
    };

    // One shared resize handler for all effect canvases
    window.addEventListener('resize', () => {
      Object.values(EFFECTS).forEach(fx => fx.resize());
    });

  </script>
</body>
</html>
