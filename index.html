<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Bingo Card</title>
  <style>
    :root {
      --dabber-color: #04ff00;
      --dabber-opacity: 0.55;
      --dabber-scale: 1;
      --target-color: #ff007f;

      /* Background brightness veil (set by the Backdrop button) */
      --bg-veil-color: #000000;
      --bg-veil-opacity: 0;

      /* Slider accent — themes override below */
      --tune-accent: #d4d4d8;

      /* Shared dropdown arrow, layered above each button gradient */
      --select-arrow: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");

      /* Dynamic Theme Variables (Default: Monochrome / Dark Metallic).
         Every other theme overrides all of these, so edits here only
         change the Monochrome look. */
      --bg-gradient: 
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.85) 85%),
        linear-gradient(135deg, #111215 0%, #22252a 25%, #0d0e10 50%, #2a2e35 75%, #08090a 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 4px);
      /* Black metallic card: brushed-steel highlight, deep black core */
      --card-bg: linear-gradient(145deg, #33343a 0%, #0a0a0c 45%, #43444c 100%);
      --card-shadow-color: rgba(203, 213, 225, 0.35);

      /* Streak used by the 12s metallic card shine (green/blue/mono/red) */
      --card-shine: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.32) 50%, transparent 60%);

      /* Vaporwave Theme Colors */
      --arizona-cyan: #85d1c9;
      --vapor-pink: #ff007f;
      --vapor-yellow: #ffde00;
      --grid-color: #ff00aa;

      /* Per-theme button palette (defaults = Monochrome).
         Polished black metal: dark crown, bright bevel band, hard shadow
         at the midline, then a rising reflection toward the base. Four
         tones keep the buttons distinguishable without leaving near-black. */
      --metal-1: linear-gradient(180deg, #4a4a54 0%, #2a2a31 16%, #17171c 47%, #0b0b0e 51%, #1e1e24 84%, #3a3a43 100%);
      --metal-2: linear-gradient(180deg, #3a3a43 0%, #202027 16%, #101014 47%, #060608 51%, #17171c 84%, #2c2c34 100%);
      --metal-3: linear-gradient(180deg, #2c2c34 0%, #18181d 16%, #0b0b0e 47%, #040405 51%, #101014 84%, #212128 100%);
      --metal-4: linear-gradient(180deg, #202027 0%, #101014 16%, #070709 47%, #010102 51%, #0a0a0d 84%, #17171c 100%);
      --metal-red: linear-gradient(180deg, #e05252 0%, #a51d1d 16%, #5e0f0f 47%, #340707 51%, #8a1717 84%, #c93636 100%);

      --btn-layouts: var(--metal-2);
      --btn-select: var(--metal-3);
      --btn-mode: var(--metal-3);
      --btn-mode-active: var(--metal-1);
      --btn-edit: var(--metal-3);
      --btn-edit-active: var(--metal-1);
      --btn-export: var(--metal-2);
      --btn-import: var(--metal-2);
      --btn-import-text: #ffffff;
      --btn-clear: var(--metal-4);
      --btn-bright: var(--metal-3);
      --btn-reset: var(--metal-red);
      --btn-victory: var(--metal-2);
      --btn-active-glow: rgba(255, 255, 255, 0.45);
      --btn-active-text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: clamp(15px, 3vh, 30px);
      background: var(--bg-gradient);
      background-size: 100% 100%;
      background-blend-mode: overlay, normal, normal;
      background-attachment: fixed;
      color: #ffffff;
      position: relative;
      transition: background 0.5s ease;
      overflow-x: hidden;
    }

    /* Modern Vaporwave Theme */
    body.theme-retro {
      --tune-accent: #ff007f;
      --bg-gradient: var(--arizona-cyan);
      --card-bg: rgba(255, 0, 127, 0.25);
      --card-shadow-color: rgba(255, 0, 127, 0.6);
      --btn-layouts: linear-gradient(135deg, #22d3ee 0%, #0e7490 100%);
      --btn-select: linear-gradient(135deg, #ff2d95 0%, #9f1239 100%);
      --btn-mode: linear-gradient(135deg, #fb923c 0%, #c2410c 100%);
      --btn-mode-active: linear-gradient(135deg, #ff007f 0%, #9f1239 100%);
      --btn-edit: linear-gradient(135deg, #67e8f9 0%, #0891b2 100%);
      --btn-edit-active: linear-gradient(135deg, #fb923c 0%, #9a3412 100%);
      --btn-export: linear-gradient(135deg, #ec4899 0%, #be123c 100%);
      --btn-import: linear-gradient(135deg, #ffde00 0%, #f59e0b 100%);
      --btn-import-text: #1a1a1a;
      --btn-clear: linear-gradient(135deg, #06b6d4 0%, #155e75 100%);
      --btn-bright: linear-gradient(135deg, #a78bfa 0%, #6d28d9 100%);
      --btn-reset: linear-gradient(135deg, #f43f5e 0%, #9f1239 100%);
      --btn-victory: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
      --btn-active-glow: rgba(0, 240, 255, 0.6);
      --btn-active-text: #ffffff;
    }

    /* ============ Arizona Midnight: the vaporwave desert after dark ============
       Same scene as Arizona Vaporwave — sun, grid plane, sakura branches —
       but repainted for night. The background's own CSS vars are overridden
       here, so the shared #vaporwaveBg markup restyles itself wholesale
       without a second copy of the DOM. */
    body.theme-retro-dark {
      --arizona-cyan: #1b2a4a;
      --vapor-pink: #b5179e;
      --vapor-yellow: #f72585;
      --grid-color: #7b2cbf;

      --tune-accent: #c77dff;
      --bg-gradient: linear-gradient(180deg, #0a0a18 0%, #14162e 45%, #1b2a4a 100%);
      --card-bg: rgba(94, 23, 132, 0.32);
      --card-shadow-color: rgba(199, 125, 255, 0.55);
      --btn-layouts: linear-gradient(135deg, #4361ee 0%, #1a1a56 100%);
      --btn-select: linear-gradient(135deg, #b5179e 0%, #560bad 100%);
      --btn-mode: linear-gradient(135deg, #5a189a 0%, #240046 100%);
      --btn-mode-active: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
      --btn-edit: linear-gradient(135deg, #4cc9f0 0%, #1f6f8b 100%);
      --btn-edit-active: linear-gradient(135deg, #90e0ef 0%, #4361ee 100%);
      --btn-export: linear-gradient(135deg, #7209b7 0%, #2d0b4e 100%);
      --btn-import: linear-gradient(135deg, #e0aaff 0%, #9d4edd 100%);
      --btn-import-text: #1a0b2e;
      --btn-clear: linear-gradient(135deg, #3f4470 0%, #1a1c33 100%);
      --btn-bright: linear-gradient(135deg, #c77dff 0%, #7209b7 100%);
      --btn-reset: linear-gradient(135deg, #e5383b 0%, #6a040f 100%);
      --btn-victory: linear-gradient(135deg, #ffb703 0%, #9d0208 100%);
      --btn-active-glow: rgba(199, 125, 255, 0.75);
      --btn-active-text: #ffffff;
    }
    body.theme-retro-dark .header {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 18px rgba(199, 125, 255, 0.8);
    }
    /* A bruised magenta sun sinking into the horizon instead of the hot
       yellow one, with its glow pulled in tighter against the dark sky. */
    body.theme-retro-dark #vaporwaveBg .sun {
      background: linear-gradient(to bottom, #f72585 0%, #7209b7 60%, #3a0ca3 100%);
      box-shadow: 0 0 120px rgba(183, 33, 158, 0.75);
    }
    /* Ground plane fades from deep indigo at the horizon into near-black. */
    body.theme-retro-dark #vaporwaveBg .grid-container {
      background: linear-gradient(to bottom, #1b2a4a 0%, #07070f 100%);
      box-shadow: inset 0 80px 100px rgba(27, 42, 74, 0.9);
    }
    /* Night sky behind the scene, so the sun has something to sit against. */
    body.theme-retro-dark #vaporwaveBg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 62%, rgba(114, 9, 183, 0.35) 0%, transparent 55%),
        linear-gradient(180deg, #07070f 0%, #14162e 55%, #24244a 100%);
      z-index: 0;
    }

    /* Pink Girly Theme with Idle Animation */
    @keyframes pinkIdle {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Pink Girly — kawaii pastel gradient + floating hearts & sparkles canvas */
    body.theme-pink {
      --tune-accent: #e0218a;
      --bg-gradient: linear-gradient(-45deg, #ffd1e8, #ffaad4, #f3b8ff, #c1e7ff, #ffc9de);
      background-size: 300% 300%;
      animation: pinkIdle 15s ease-in-out infinite;
      --card-bg: linear-gradient(145deg, #ffb6d9 0%, #ff8fc7 55%, #ffd1e6 100%);
      --card-shadow-color: rgba(255, 95, 162, 0.55);
      --btn-layouts: linear-gradient(135deg, #ff9fce 0%, #ff5fa2 100%);
      --btn-select: linear-gradient(135deg, #cba6ff 0%, #8e5cf7 100%);
      --btn-mode: linear-gradient(135deg, #ff6fb5 0%, #e0218a 100%);
      --btn-mode-active: linear-gradient(135deg, #ffffff 0%, #ffb6d9 100%);
      --btn-edit: linear-gradient(135deg, #b388ff 0%, #7c4dff 100%);
      --btn-edit-active: linear-gradient(135deg, #ffd6ef 0%, #ff9fce 100%);
      --btn-export: linear-gradient(135deg, #ff9ff3 0%, #f368e0 100%);
      --btn-import: linear-gradient(135deg, #f472b6 0%, #c2186f 100%);
      --btn-import-text: #ffffff;
      --btn-clear: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
      --btn-bright: linear-gradient(135deg, #f0abfc 0%, #c026d3 100%);
      --btn-reset: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
      --btn-victory: linear-gradient(135deg, #ff8fc7 0%, #e0218a 100%);
      --btn-active-glow: rgba(255, 111, 181, 0.7);
      --btn-active-text: #a80d64;
    }

    /* Bubblegum BINGO lettering on the pink theme */
    body.theme-pink .header {
      text-shadow: 0 3px 0 rgba(255, 95, 162, 0.9), 0 6px 14px rgba(255, 0, 127, 0.35);
    }

    /* Frosted-glass control panel + readable corner text on the pastel bg */
    body.theme-pink .controls {
      background: rgba(255, 255, 255, 0.45);
      border-color: rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 25px rgba(224, 33, 138, 0.25);
    }
    body.theme-pink .top-date { color: rgba(168, 13, 100, 0.55); }
    body.theme-pink .bottom-credit { color: rgba(168, 13, 100, 0.45); }

    /* Green Metallic Theme — the unofficial "lucky" screen */
    body.theme-green {
      --tune-accent: #34d399;
      --bg-gradient:
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.85) 85%),
        linear-gradient(135deg, #022c22 0%, #064e3b 25%, #022c22 50%, #047857 75%, #022c22 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 4px);
      --card-bg: linear-gradient(145deg, #05603f 0%, #12b981 45%, #044e35 100%);
      --card-shadow-color: rgba(16, 185, 129, 0.55);
      --btn-layouts: linear-gradient(135deg, #34d399 0%, #047857 100%);
      --btn-select: linear-gradient(135deg, #86efac 0%, #16a34a 100%);
      --btn-mode: linear-gradient(135deg, #10b981 0%, #065f46 100%);
      --btn-mode-active: linear-gradient(135deg, #fbbf24 0%, #b45309 100%);
      --btn-edit: linear-gradient(135deg, #4ade80 0%, #15803d 100%);
      --btn-edit-active: linear-gradient(135deg, #fde047 0%, #ca8a04 100%);
      --btn-export: linear-gradient(135deg, #059669 0%, #064e3b 100%);
      --btn-import: linear-gradient(135deg, #fde68a 0%, #f59e0b 100%);
      --btn-import-text: #3f2d04;
      --btn-clear: linear-gradient(135deg, #2dd4bf 0%, #0f766e 100%);
      --btn-bright: linear-gradient(135deg, #a3e635 0%, #4d7c0f 100%);
      --btn-reset: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%);
      --btn-victory: linear-gradient(135deg, #f59e0b 0%, #92400e 100%);
      --btn-active-glow: rgba(250, 204, 21, 0.6);
      --btn-active-text: #ffffff;
    }

    /* Metallic shine: a light streak sweeps the card every 12s (green + blue).
       The pseudo stays pinned to the card (so it clips to the rounded corners)
       and only its gradient's background-position moves. */
    @keyframes cardShine {
      0% { background-position: 0% 0; }
      9% { background-position: 100% 0; }
      100% { background-position: 100% 0; }
    }

    body.theme-green .bingo-card::before,
    body.theme-blue .bingo-card::before,
    body.theme-mono .bingo-card::before,
    body.theme-red .bingo-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-image: var(--card-shine);
      background-size: 300% 100%;
      background-repeat: no-repeat;
      background-position: 0% 0;
      animation: cardShine 12s linear infinite;
      pointer-events: none;
      z-index: 10;
    }

    /* Blue Metallic Theme */
    body.theme-blue {
      --tune-accent: #7dd3fc;
      --bg-gradient:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.14) 0%, rgba(0, 0, 0, 0) 45%),
        linear-gradient(160deg, #0a1120 0%, #22334f 22%, #4a6285 38%, #1a2a45 52%, #56719a 68%, #16233c 84%, #060b16 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 3px);
      --card-bg: linear-gradient(155deg, #2c3f5e 0%, #16233c 40%, #3d5578 62%, #101b30 100%);
      --card-shadow-color: rgba(148, 190, 233, 0.5);
      --btn-layouts: linear-gradient(180deg, #c8daf0 0%, #6b8ab5 28%, #2d4568 55%, #5f7ba6 82%, #1c2f4d 100%);
      --btn-select: linear-gradient(180deg, #b8cce6 0%, #5c7aa8 30%, #24395c 58%, #4c689a 85%, #16273f 100%);
      --btn-mode: linear-gradient(180deg, #a6c8f2 0%, #4c74ad 30%, #1e3a66 58%, #3f639f 85%, #122645 100%);
      --btn-mode-active: linear-gradient(180deg, #e8f4ff 0%, #7dd3fc 35%, #0e7490 65%, #38bdf8 100%);
      --btn-edit: linear-gradient(180deg, #bcd6f2 0%, #5e84b8 30%, #27466f 58%, #4e72a8 85%, #16294a 100%);
      --btn-edit-active: linear-gradient(180deg, #dff6ff 0%, #67e8f9 35%, #0891b2 65%, #22d3ee 100%);
      --btn-export: linear-gradient(180deg, #aac4e4 0%, #4f74a6 30%, #1f3a60 58%, #416399 85%, #132542 100%);
      --btn-import: linear-gradient(180deg, #eef6ff 0%, #9cc3ec 30%, #4a719f 60%, #7ea3ce 85%, #2b4568 100%);
      --btn-import-text: #0b1730;
      --btn-clear: linear-gradient(180deg, #93a3b8 0%, #55657d 32%, #2a3648 60%, #4a5a72 88%, #1a2331 100%);
      --btn-bright: linear-gradient(180deg, #cfe4f8 0%, #7aa5cf 30%, #33547e 60%, #6089b8 85%, #1d3454 100%);
      --btn-reset: linear-gradient(180deg, #f3b0b0 0%, #c05252 32%, #7f1d1d 60%, #a83c3c 88%, #4c1010 100%);
      --btn-victory: linear-gradient(180deg, #c3d9f4 0%, #5f8cc4 30%, #274d80 58%, #4f7cb8 85%, #142c50 100%);
      --btn-active-glow: rgba(148, 210, 255, 0.75);
      --btn-active-text: #ffffff;
    }
    body.theme-blue .header {
      color: #e8f2fc;
      text-shadow:
        0 1px 0 #ffffff,
        0 -1px 0 #5c7aa8,
        0 3px 5px rgba(0, 0, 0, 0.7),
        0 0 18px rgba(148, 210, 255, 0.55);
    }
    body.theme-blue #blueCanvas { display: block; }

    /* Blood Red — vampire / horror. Mouse-follow blood glow over blackened steel 🧛 */
    body.theme-red {
      --tune-accent: #dc2626;
      --bg-gradient:
        radial-gradient(800px circle at var(--mouse-x, 50vw) var(--mouse-y, 50vh), rgba(220, 38, 38, 0.45) 0%, transparent 60%),
        linear-gradient(135deg, #050505 0%, #171717 25%, #7f1d1d 50%, #3f0d0d 75%, #000000 100%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 2px, transparent 2px, transparent 8px);
      /* Still reads black, but with a blood-warm metallic gradient */
      --card-bg: linear-gradient(145deg, #1a0e0e 0%, #2e1a1a 45%, #060303 100%);
      --card-shadow-color: rgba(220, 38, 38, 0.7);
      /* Crimson version of the sweeping metallic streak */
      --card-shine: linear-gradient(105deg, transparent 38%, rgba(248, 113, 113, 0.42) 50%, transparent 62%);
      transition: none; /* instant mouse tracking */
      --btn-layouts: linear-gradient(135deg, #2b2b2f 0%, #08080a 100%);
      --btn-select: linear-gradient(135deg, #7f1d1d 0%, #350808 100%);
      --btn-mode: linear-gradient(135deg, #1c1c20 0%, #050506 100%);
      --btn-mode-active: linear-gradient(135deg, #991b1b 0%, #450a0a 100%);
      --btn-edit: linear-gradient(135deg, #7f1d1d 0%, #3f0d0d 100%);
      --btn-edit-active: linear-gradient(135deg, #b91c1c 0%, #5c1010 100%);
      --btn-export: linear-gradient(135deg, #232326 0%, #08080a 100%);
      --btn-import: linear-gradient(135deg, #8b1a1a 0%, #3a0808 100%);
      --btn-import-text: #ffffff;
      --btn-clear: linear-gradient(135deg, #1c1c1f 0%, #060607 100%);
      --btn-bright: linear-gradient(135deg, #2e2e33 0%, #0c0c0e 100%);
      --btn-reset: linear-gradient(135deg, #b91c1c 0%, #5c1010 100%);
      --btn-victory: linear-gradient(135deg, #7f1d1d 0%, #350808 100%);
      --btn-active-glow: rgba(220, 38, 38, 0.75);
      --btn-active-text: #ffffff;
    }

    /* Blood-glow BINGO lettering on the red theme */
    body.theme-red .header {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6), 0 0 16px rgba(220, 38, 38, 0.85);
    }

    /* ============ Basic Theme: grey background, classic buttons, blue card ============ */
    body.theme-basic {
      --tune-accent: #0e7490;
      --bg-gradient: linear-gradient(160deg, #b7bdc7 0%, #8e95a1 100%);
      --card-bg: rgba(0, 155, 227, 0.85);
      --card-shadow-color: rgba(0, 155, 227, 0.4);
      --btn-layouts: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%);
      --btn-select: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --btn-mode: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
      --btn-mode-active: linear-gradient(135deg, #ff007f 0%, #9f1239 100%);
      --btn-edit: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --btn-edit-active: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --btn-export: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --btn-import: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
      --btn-import-text: #1a1a1a;
      --btn-clear: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      --btn-bright: linear-gradient(135deg, #64748b 0%, #334155 100%);
      --btn-reset: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
      --btn-victory: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      --btn-active-glow: rgba(255, 0, 127, 0.6);
      --btn-active-text: #ffffff;
    }

    /* Darker corner text for readability on the light grey Basic background */
    body.theme-basic .top-date { color: rgba(25, 30, 40, 0.55); }
    body.theme-basic .bottom-credit { color: rgba(25, 30, 40, 0.42); }

    /* Dynamic Sakura Blossom Theme - Saturated */
    body.theme-sakura {
      --tune-accent: #f472b6;
      --bg-gradient: linear-gradient(135deg, #5c1e4b 0%, #9e2a5b 30%, #d84b78 55%, #7a2a6b 80%, #3a114a 100%);
      --card-bg: rgba(255, 182, 193, 0.25);
      --card-shadow-color: rgba(255, 182, 193, 0.5);
      --btn-layouts: linear-gradient(135deg, #f472b6 0%, #be185d 100%);
      --btn-select: linear-gradient(135deg, #c084fc 0%, #7e22ce 100%);
      --btn-mode: linear-gradient(135deg, #e879f9 0%, #a21caf 100%);
      --btn-mode-active: linear-gradient(135deg, #ff007f 0%, #9f1239 100%);
      --btn-edit: linear-gradient(135deg, #f9a8d4 0%, #db2777 100%);
      --btn-edit-active: linear-gradient(135deg, #d946ef 0%, #86198f 100%);
      --btn-export: linear-gradient(135deg, #ec4899 0%, #9d174d 100%);
      --btn-import: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
      --btn-import-text: #4a044e;
      --btn-clear: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
      --btn-bright: linear-gradient(135deg, #f0abfc 0%, #a21caf 100%);
      --btn-reset: linear-gradient(135deg, #be123c 0%, #881337 100%);
      --btn-victory: linear-gradient(135deg, #f472b6 0%, #9d174d 100%);
      --btn-active-glow: rgba(255, 0, 127, 0.6);
      --btn-active-text: #ffffff;
    }

    /* ============ Aquarium: freshwater planted community tank ============ */
    body.theme-aqua {
      --tune-accent: #2dd4bf;
      --bg-gradient: linear-gradient(180deg, #7fd1b5 0%, #3aa48b 30%, #1f7a6a 62%, #0b453f 100%);
      --card-bg: linear-gradient(145deg, rgba(23, 128, 111, 0.55) 0%, rgba(9, 72, 66, 0.62) 100%);
      --card-shadow-color: rgba(45, 212, 191, 0.55);
      --btn-layouts: linear-gradient(135deg, #2dd4bf 0%, #0f766e 100%);
      --btn-select: linear-gradient(135deg, #4ade80 0%, #15803d 100%);
      --btn-mode: linear-gradient(135deg, #14b8a6 0%, #115e59 100%);
      --btn-mode-active: linear-gradient(135deg, #fbbf24 0%, #b45309 100%);

      --btn-mode: linear-gradient(135deg, #3a3450 0%, #17141f 100%);
      --btn-mode-active: linear-gradient(135deg, #ffc83c 0%, #b06a12 100%);
      --btn-edit: linear-gradient(135deg, #be6eff 0%, #5b2a8f 100%);
      --btn-edit-active: linear-gradient(135deg, #e0b0ff 0%, #8b45cc 100%);
      --btn-export: linear-gradient(135deg, #1f7ba8 0%, #0c3550 100%);
      --btn-import: linear-gradient(135deg, #ffe9b0 0%, #e8b44a 100%);
      --btn-import-text: #2a1a08;
      --btn-clear: linear-gradient(135deg, #4a4558 0%, #201d2a 100%);
      --btn-bright: linear-gradient(135deg, #50ebaa 0%, #14795a 100%);
      --btn-reset: linear-gradient(135deg, #ff5a3c 0%, #8c1f0c 100%);
      --btn-victory: linear-gradient(135deg, #ffb02e 0%, #a3490a 100%);
      --btn-active-glow: rgba(255, 60, 110, 0.8);
      --btn-active-text: #ffffff;
    }
    body.theme-timessquare .header {
      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.9),
        0 0 14px rgba(255, 60, 110, 0.8),
        0 0 28px rgba(70, 190, 255, 0.45);
    }
    body.theme-timessquare .top-date { color: rgba(255, 220, 200, 0.75); }
    body.theme-timessquare .bottom-credit { color: rgba(255, 210, 190, 0.55); }

    /* Background Animation Canvas Element */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      display: none;
    }

    body.theme-sakura #sakuraCanvas { display: block; }
    body.theme-retro #vaporwaveBg { display: block; }
    body.theme-retro-dark #vaporwaveBg { display: block; }
    body.theme-pink #pinkCanvas { display: block; }
    body.theme-green #luckyCanvas { display: block; }
    body.theme-red #redCanvas { display: block; }
    body.theme-aqua #aquaCanvas { display: block; }
    body.theme-portal #portalBg { display: block; }
    body.theme-space #spaceCanvas { display: block; }
    body.theme-city #cityCanvas { display: block; }
    body.theme-drive #driveCanvas { display: block; }
    body.theme-orbit #orbitCanvas { display: block; }
    body.theme-backrooms #backroomsCanvas { display: block; }
    body.theme-ocean #oceanCanvas { display: block; }
    body.theme-greenhouse #greenhouseCanvas { display: block; }
    body.theme-origami #origamiCanvas { display: block; }
    body.theme-timessquare #timesSquareCanvas { display: block; }

    /* Vaporwave Custom CSS */
    #vaporwaveBg .svg-defs {
        position: absolute;
        width: 0;
        height: 0;
        pointer-events: none;
    }

    #vaporwaveBg .sun {
        position: absolute;
        top: 40%;
        left: 50%;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: linear-gradient(to bottom, var(--vapor-yellow) 0%, var(--vapor-pink) 100%);
        box-shadow: 0 0 100px var(--vapor-pink);
        z-index: 1;
        /* Pixel-based stripes so the mask can tile and scroll seamlessly.
           Animating mask-position replaces the old feTurbulence heat filter —
           same "hot" shimmer, a fraction of the render cost. */
        -webkit-mask-image: repeating-linear-gradient(to bottom, black 0px, black 40px, transparent 40px, transparent 52px);
        mask-image: repeating-linear-gradient(to bottom, black 0px, black 40px, transparent 40px, transparent 52px);
        animation: sunPulse 6s ease-in-out infinite, sunHeat 2s linear infinite;
    }

    @keyframes sunHeat {
        0% { -webkit-mask-position: 0 0; mask-position: 0 0; }
        100% { -webkit-mask-position: 0 -52px; mask-position: 0 -52px; }
    }

    @keyframes sunPulse {
        0% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -53%) scale(1.03); } 
        100% { transform: translate(-50%, -50%) scale(1); }
    }

    #vaporwaveBg .grid-container {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 40%;
        background: linear-gradient(to bottom, var(--arizona-cyan) 0%, #1a4242 100%);
        perspective: 600px;
        /* Horizon must sit at the top edge of this band, so the vanishing
           point goes to the top (default 50% 50% pushed the plane out of view) */
        perspective-origin: 50% 0%;
        z-index: 2;
        overflow: hidden;
        box-shadow: inset 0 80px 100px var(--arizona-cyan);
    }

    /* Renamed from .grid — it was colliding with the bingo card's .grid styles */
    #vaporwaveBg .vapor-grid {
        position: absolute;
        top: 0;
        left: -50%;
        width: 200%;
        /* 190% keeps the near edge of the plane in front of the camera;
           at 300% the closest rows passed behind the eye and got clipped */
        height: 190%;
        background-image:
            linear-gradient(to right, var(--grid-color) 2px, transparent 2px),
            linear-gradient(to bottom, var(--grid-color) 2px, transparent 2px);
        background-size: 50px 50px;
        transform: rotateX(75deg);
        transform-origin: top;
        animation: moveGrid 1.2s linear infinite;
    }

    @keyframes moveGrid {
        0% { background-position: 0px 0px; }
        100% { background-position: 0px 50px; }
    }

    /* Branch Sway Animations.
       Scale / resting tilt / sway amplitude are CSS vars so the JS-built
       branch clones can each sway differently; the defaults reproduce the
       original two branches' motion exactly. */
    @keyframes swayLeft {
        0%, 100% { transform: scale(var(--br-scale, 0.75)) rotate(var(--br-rot, 0deg)); }
        50% { transform: scale(var(--br-scale, 0.75)) rotate(calc(var(--br-rot, 0deg) + var(--br-amp, 1.5deg))); }
    }

    @keyframes swayRight {
        0%, 100% { transform: scale(var(--br-scale, 0.75)) rotate(var(--br-rot, 0deg)); }
        50% { transform: scale(var(--br-scale, 0.75)) rotate(calc(var(--br-rot, 0deg) - var(--br-amp, 1.5deg))); }
    }

    #vaporwaveBg .branch {
        position: absolute;
        z-index: 3;
        pointer-events: none;
    }
    
    #vaporwaveBg .branch-left {
        top: -40px;
        left: -40px;
        width: 500px;
        transform-origin: top left;
        animation: swayLeft 5s ease-in-out infinite;
    }

    #vaporwaveBg .branch-right {
        top: -40px;
        right: -40px;
        width: 500px;
        transform-origin: top right;
        animation: swayRight 6s ease-in-out infinite;
    }

    #vaporwavePetals {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 4;
        pointer-events: none;
    }

    /* ============ Portal Lab scenery ============
       Big white wall panels via repeating seam gradients, a concrete floor
       with a hazard stripe, and two elliptical portals. Each portal is an
       overflow-hidden ellipse holding an oversized square conic-gradient
       that spins — the clipping is what turns the spin into a swirl. */
    #portalBg {
        background:
            radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.55) 0%, transparent 55%),
            repeating-linear-gradient(0deg, transparent 0px, transparent 136px, rgba(96, 102, 112, 0.22) 136px, rgba(96, 102, 112, 0.22) 140px),
            repeating-linear-gradient(90deg, transparent 0px, transparent 136px, rgba(96, 102, 112, 0.22) 136px, rgba(96, 102, 112, 0.22) 140px),
            linear-gradient(180deg, #eef0f3 0%, #d3d7dd 55%, #b6bcc5 100%);
    }

    #portalBg .lab-floor {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 16%;
        background: linear-gradient(180deg, #9aa1ab 0%, #6f7681 100%);
        box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    #portalBg .lab-stripe {
        position: absolute;
        bottom: 16%;
        width: 100%;
        height: 13px;
        background: repeating-linear-gradient(45deg, #f2b705 0px, #f2b705 16px, #23262b 16px, #23262b 32px);
        opacity: 0.85;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    #portalBg .portal {
        position: absolute;
        width: clamp(120px, 12vw, 180px);
        height: clamp(220px, 42vh, 320px);
        border-radius: 50%;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #05070c 0%, #10141d 62%, #171c26 100%);
        box-shadow: 0 0 44px 12px var(--portal-glow), 0 34px 70px rgba(0, 0, 0, 0.28);
        animation: portalPulse 4.5s ease-in-out infinite;
    }

    /* The swirl: a big rotating square of conic light, clipped by the ellipse */
    #portalBg .portal-swirl {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 380px;
        height: 380px;
        margin: -190px 0 0 -190px;
        background: conic-gradient(from 0deg,
            transparent 0deg, var(--portal-col) 60deg, #ffffff 105deg, var(--portal-col) 150deg,
            transparent 215deg, var(--portal-col) 290deg, transparent 360deg);
        filter: blur(8px);
        opacity: 0.8;
        animation: portalSpin 5s linear infinite;
    }

    /* Dark event-horizon core + bright inner rim drawn above the swirl */
    #portalBg .portal-core {
        position: absolute;
        inset: 12%;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, #04060a 0%, #0c1018 55%, rgba(12, 16, 24, 0) 82%);
    }
    #portalBg .portal::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow: inset 0 0 26px 7px var(--portal-glow);
        pointer-events: none;
    }

    #portalBg .portal-blue {
        --portal-col: #38bdf8;
        --portal-glow: rgba(56, 189, 248, 0.75);
        left: 10%;
        top: 22%;
        transform: rotate(-4deg);
    }

    #portalBg .portal-orange {
        --portal-col: #fb923c;
        --portal-glow: rgba(251, 146, 60, 0.8);
        right: 10%;
        top: 28%;
        transform: rotate(4deg);
        animation-delay: 2.2s; /* pulse out of phase with the blue portal */
    }

    @keyframes portalSpin {
        to { transform: rotate(360deg); }
    }

    /* Brightness pulse only — transforms stay free for the static tilt */
    @keyframes portalPulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.2); }
    }

    /* A watchful turret on the lab floor */
    .turret {
      position: absolute;
      right: 15%;
      bottom: 12.5%;
      width: 64px;
      height: 100px;
      z-index: 1;
    }
    .turret-body {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      height: 76px;
      background: radial-gradient(ellipse at 35% 28%, #ffffff, #e3e7ec 50%, #b9c0c9 100%);
      border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
      box-shadow: inset -5px -7px 12px rgba(90, 100, 115, 0.35), 0 5px 12px rgba(40, 50, 70, 0.3);
    }
    .turret-stripe {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 48px;
      background: linear-gradient(180deg, #2a2f38, #171b22);
      border-radius: 8px;
    }
    .turret-eye {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff2d2d;
      animation: turretEye 2.6s ease-in-out infinite;
    }
    @keyframes turretEye {
      0%, 100% { opacity: 0.55; box-shadow: 0 0 5px 2px rgba(255, 45, 45, 0.5); }
      50%      { opacity: 1;    box-shadow: 0 0 11px 4px rgba(255, 45, 45, 0.9); }
    }
    .turret-wing {
      position: absolute;
      top: 24px;
      width: 17px;
      height: 40px;
      background: linear-gradient(180deg, #f2f4f7, #c4cad3);
      border-radius: 6px;
      box-shadow: inset -2px -3px 5px rgba(90, 100, 115, 0.3);
    }
    .turret-wing-l { left: -9px; transform: rotate(-8deg); }
    .turret-wing-r { right: -9px; transform: rotate(8deg); }
    .turret-leg {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 3px;
      height: 28px;
      background: #8a919c;
      border-radius: 2px;
      transform-origin: top center;
    }
    .turret-leg-l { transform: translateX(-15px) rotate(20deg); }
    .turret-leg-r { transform: translateX(12px) rotate(-20deg); }
    .turret-leg-b { transform: translateX(-1px); height: 26px; opacity: 0.7; }
    .turret-laser {
      position: absolute;
      top: 31px;
      right: 54px;
      width: min(38vw, 420px);
      height: 2px;
      transform-origin: right center;
      background: linear-gradient(270deg, rgba(255, 45, 45, 0.5), rgba(255, 45, 45, 0));
      animation: turretScan 7s ease-in-out infinite;
    }
    @keyframes turretScan {
      0%, 100% { transform: rotate(3.5deg); opacity: 0.55; }
      50%      { transform: rotate(-4.5deg); opacity: 0.35; }
    }

    #portalDust {
        position: absolute;
        inset: 0;
    }

    /* Top Left Date */
    .top-date {
      position: absolute;
      top: 24px;
      left: 24px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      user-select: none;
      z-index: 2;
    }

    /* Top Right Theme Dropdown */
    select.btn-theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      width: auto;
      height: auto;
      appearance: none;
      -webkit-appearance: none;
      background-color: rgba(15, 17, 21, 0.85);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      color: #ffffff !important;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 10px 34px 10px 18px;
      font-size: 0.85rem !important;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
      opacity: 0.75;
      transition: opacity 0.3s ease, transform 0.2s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    select.btn-theme-toggle option {
      background-color: #1e293b;
      color: #ffffff;
      font-weight: 600;
    }

    select.btn-theme-toggle:hover {
      opacity: 1;
      transform: translateY(-2px);
      background-color: rgba(0, 0, 0, 0.95);
    }

    /* Bottom Left Credit Tagline */
    .bottom-credit {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.30);
      user-select: none;
      z-index: 2;
    }

    /* Initial Circular Preloader Screen */
    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0c0e;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loader-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* ============ Themed Background-Load Transitions ============
       Each theme gets its own "curtain": a veil in the theme's colors, an
       optional sweeping streak, and optional falling/rising glyphs. The new
       background is swapped in behind it while the veil is at full opacity. */
    .theme-transition {
      position: fixed;
      inset: 0;
      z-index: 900;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      --tt-dur: 800ms;
    }
    .theme-transition.active { opacity: 1; }

    .tt-veil,
    .tt-streak,
    .tt-particles {
      position: absolute;
      inset: 0;
    }

    .tt-veil {
      opacity: 0;
      background: #0b0c0e;
    }
    .theme-transition.active .tt-veil {
      animation: ttVeil var(--tt-dur) ease-in-out forwards;
    }
    @keyframes ttVeil {
      0%   { opacity: 0; }
      40%  { opacity: 0.97; }
      62%  { opacity: 0.97; }
      100% { opacity: 0; }
    }

    /* Horizontal light streak — the "shine" swap used by the metallic themes */
    .tt-streak {
      opacity: 0;
      background-size: 250% 100%;
      background-repeat: no-repeat;
      background-position: -70% 0;
    }
    .theme-transition.active .tt-streak {
      animation: ttStreak var(--tt-dur) ease-in-out forwards;
    }
    @keyframes ttStreak {
      0%   { background-position: -70% 0; opacity: 0; }
      25%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { background-position: 170% 0; opacity: 0; }
    }

    /* Basic — plain white fade, no sheen */
    .tt-basic .tt-veil   { background: #ffffff; }
    .tt-basic .tt-streak { display: none; }

    /* Monochrome — silver streak over brushed black steel */
    .tt-mono .tt-veil    { background: linear-gradient(135deg, #111215 0%, #2a2e35 50%, #08090a 100%); }
    .tt-mono .tt-streak  { background-image: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.85) 50%, transparent 58%); }

    /* Blue Metallic — blue shine */
    .tt-blue .tt-veil    { background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 50%, #0f172a 100%); }
    .tt-blue .tt-streak  { background-image: linear-gradient(105deg, transparent 40%, rgba(147, 197, 253, 0.9) 50%, transparent 60%); }

    /* Green Metallic — emerald shine */
    .tt-green .tt-veil   { background: linear-gradient(135deg, #022c22 0%, #047857 50%, #022c22 100%); }
    .tt-green .tt-streak { background-image: linear-gradient(105deg, transparent 40%, rgba(167, 243, 208, 0.9) 50%, transparent 60%); }

    /* Blood Red — lightning strike on black */
    .tt-red .tt-veil { background: radial-gradient(circle at 50% 35%, #1a0606 0%, #000000 70%); }

    /* The streak layer becomes the sky flash that accompanies the bolt */
    .tt-red .tt-streak {
      background-image: radial-gradient(ellipse at 50% 15%, rgba(255, 255, 255, 0.95) 0%, rgba(191, 219, 254, 0.4) 32%, transparent 72%);
      background-size: 100% 100%;
      background-position: center;
    }
    .theme-transition.tt-red.active .tt-streak {
      animation: ttFlash var(--tt-dur) linear forwards;
    }
    @keyframes ttFlash {
      0%, 14%  { opacity: 0; }
      18%      { opacity: 0.9; }
      24%      { opacity: 0.05; }
      31%      { opacity: 0.75; }
      44%      { opacity: 0.1; }
      58%, 100% { opacity: 0; }
    }

    /* The bolt itself — only drawn for the red theme */
    .tt-bolt {
      position: absolute;
      top: 0;
      left: 50%;
      height: 100%;
      width: min(45vh, 60vw);
      display: none;
      opacity: 0;
      transform: translateX(-50%);
      overflow: visible;
    }
    .tt-red .tt-bolt { display: block; }
    .theme-transition.tt-red.active .tt-bolt {
      animation: ttBolt var(--tt-dur) linear forwards;
    }
    .tt-bolt path {
      fill: #ffffff;
      filter: drop-shadow(0 0 14px rgba(219, 234, 254, 0.95))
              drop-shadow(0 0 42px rgba(96, 165, 250, 0.7))
              drop-shadow(0 0 70px rgba(220, 38, 38, 0.55));
    }
    @keyframes ttBolt {
      0%, 13%  { opacity: 0; transform: translateX(-50%) scaleY(0.82); }
      17%      { opacity: 1; transform: translateX(-50%) scaleY(1); }
      23%      { opacity: 0.1; transform: translateX(-50%) scaleY(1); }
      30%      { opacity: 1; transform: translateX(-50%) scaleY(1); }
      42%      { opacity: 0.85; transform: translateX(-50%) scaleY(1); }
      56%      { opacity: 0.2; transform: translateX(-50%) scaleY(1); }
      68%, 100% { opacity: 0; transform: translateX(-50%) scaleY(1); }
    }

    /* Pink — pastel wash, hearts do the work */
    .tt-pink .tt-veil    { background: linear-gradient(-45deg, #ffd1e8 0%, #ffaad4 35%, #f3b8ff 70%, #c1e7ff 100%); }

    /* Cherry Blossom — dusk gradient with falling petals */
    .tt-sakura .tt-veil  { background: linear-gradient(135deg, #5c1e4b 0%, #d84b78 55%, #3a114a 100%); }

    /* Arizona Vaporwave — sunset wash with magenta scanlines rolling down */
    .tt-retro .tt-veil   { background: linear-gradient(180deg, #85d1c9 0%, #ff007f 60%, #1a4242 100%); }
    .tt-retro .tt-streak {
      background-image: repeating-linear-gradient(0deg, rgba(255, 0, 170, 0.45) 0px, rgba(255, 0, 170, 0.45) 2px, transparent 2px, transparent 10px);
      background-size: 100% 100%;
      background-position: 0 0;
    }
    .theme-transition.tt-retro.active .tt-streak {
      animation: ttScan var(--tt-dur) linear forwards;
    }
    .tt-retro-dark .tt-veil   { background: linear-gradient(180deg, #14162e 0%, #7209b7 55%, #07070f 100%); }
    .tt-retro-dark .tt-streak {
      background-image: repeating-linear-gradient(0deg, rgba(199, 125, 255, 0.5) 0px, rgba(199, 125, 255, 0.5) 2px, transparent 2px, transparent 10px);
      background-size: 100% 100%;
      background-position: 0 0;
    }
    .theme-transition.tt-retro-dark.active .tt-streak {
      animation: ttScan var(--tt-dur) linear forwards;
    }
    @keyframes ttScan {
      0%   { background-position: 0 0; opacity: 0; }
      25%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { background-position: 0 120px; opacity: 0; }
    }

    /* Aquarium — sink into teal water, bubbles rise through it */
    .tt-aqua .tt-veil    { background: linear-gradient(180deg, #66c2a5 0%, #1f7a6a 45%, #073531 100%); }

    /* Portal Lab — clean white flash with a blue/orange dual streak */
    .tt-portal .tt-veil  { background: linear-gradient(135deg, #eceef1 0%, #c8ccd4 50%, #f2f3f5 100%); }
    .tt-portal .tt-streak {
      background-image: linear-gradient(105deg,
        transparent 30%, rgba(56, 189, 248, 0.85) 43%, transparent 52%,
        rgba(251, 146, 60, 0.85) 61%, transparent 74%);
    }

    /* Deep Space — cut to black, pixel stars drift up */
    .tt-space .tt-veil   { background: radial-gradient(circle at 50% 40%, #0b1026 0%, #000000 75%); }

    /* Night Drive — dusk-purple wash with a passing-headlight sweep */
    .tt-city .tt-veil    { background: linear-gradient(180deg, #0d1026 0%, #2a1a3d 55%, #08090f 100%); }
    .tt-city .tt-streak  { background-image: linear-gradient(105deg, transparent 40%, rgba(255, 196, 100, 0.9) 50%, transparent 60%); }

    /* In Orbit — cut to black space with a thin sunrise streak over the limb */
    .tt-orbit .tt-veil   { background: radial-gradient(circle at 50% 72%, #0a1230 0%, #000000 70%); }
    .tt-orbit .tt-streak { background-image: linear-gradient(105deg, transparent 44%, rgba(191, 219, 254, 0.9) 50%, transparent 56%); }

    /* The Backrooms — sodium-yellow wash with a failing fluorescent stutter
       (borrows the Blood Red lightning's flash timing) */
    .tt-back .tt-veil    { background: linear-gradient(180deg, #b3a04e 0%, #877636 55%, #3a3110 100%); }
    .tt-back .tt-streak  {
      background-image: radial-gradient(ellipse at 50% 6%, rgba(255, 246, 200, 0.95) 0%, rgba(240, 220, 150, 0.35) 40%, transparent 75%);
      background-size: 100% 100%;
      background-position: center;
    }
    .theme-transition.tt-back.active .tt-streak {
      animation: ttFlash var(--tt-dur) linear forwards;
    }

    /* Open Ocean — plunge from surface light down into deep blue */
    .tt-ocean .tt-veil   { background: linear-gradient(180deg, #7cc3e8 0%, #1d6fa5 40%, #04263f 100%); }
    .tt-leaf .tt-veil    { background: linear-gradient(180deg, #eaf5e6 0%, #a9c9a0 100%); }
    .tt-leaf .tt-streak  { background-image: linear-gradient(100deg, transparent 40%, rgba(255, 250, 214, 0.85) 50%, transparent 60%); }
    .tt-neon .tt-veil    { background: linear-gradient(180deg, #0a0a14 0%, #3a1c3c 55%, #08080e 100%); }
    .tt-neon .tt-streak  {
      background-image:
        repeating-linear-gradient(101deg, rgba(198, 216, 245, 0.3) 0px, rgba(198, 216, 245, 0.3) 1px, transparent 1px, transparent 9px),
        linear-gradient(100deg, transparent 38%, rgba(255, 60, 110, 0.5) 47%, rgba(70, 190, 255, 0.45) 54%, transparent 64%);
    }
    .tt-fold .tt-veil    { background: linear-gradient(135deg, #fdfaf3 0%, #e8dfc9 100%); }
    .tt-fold .tt-streak  { background-image: linear-gradient(135deg, transparent 46%, rgba(120, 110, 90, 0.35) 49.8%, rgba(255, 255, 255, 0.95) 50.2%, transparent 55%); }

    /* Glyph particles (hearts, petals, shamrocks) */
    .tt-particle {
      position: absolute;
      top: 100%;
      line-height: 1;
      opacity: 0;
      will-change: transform, opacity;
      animation: ttRise var(--tt-dur) ease-out forwards;
    }
    @keyframes ttRise {
      0%   { transform: translateY(0) scale(0.45) rotate(0deg); opacity: 0; }
      25%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { transform: translateY(-118vh) scale(1.15) rotate(var(--spin, 40deg)); opacity: 0; }
    }

    .tt-particle.fall {
      top: -70px;
      animation-name: ttFall;
    }
    @keyframes ttFall {
      0%   { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
      25%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { transform: translateY(118vh) scale(1.1) rotate(var(--spin, 220deg)); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .theme-transition { --tt-dur: 300ms; }
      .theme-transition .tt-particle,
      .theme-transition .tt-streak,
      .theme-transition .tt-bolt { display: none; }
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #00f0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Main App Layout */
    .app-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vw, 40px);
      width: 100%;
      max-width: 850px;
      margin-top: 20px;
      z-index: 2;
    }

    /* Responsive Bingo Card */
    .bingo-card {
      position: relative;
      width: clamp(280px, 80vw, 420px);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: clamp(12px, 3.5vw, 22px);
      padding: clamp(10px, 2.8vw, 20px);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.6),
        0 0 20px var(--card-shadow-color),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      user-select: none;
      flex-shrink: 0;
      transition: background 0.5s ease, box-shadow 0.5s ease, border-color 0.3s ease;
    }

    .bingo-card.editing-mode {
      border: 2px solid #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.6);
    }

    .header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      font-weight: 900;
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: clamp(1px, 0.8vw, 4px);
      margin-bottom: clamp(6px, 1.5vw, 12px);
      font-family: 'Arial Black', 'Trebuchet MS', 'Arial', sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(2px, 0.6vw, 4px);
      background-color: rgba(0, 0, 0, 0.15);
      border: clamp(2px, 0.6vw, 4px) solid transparent;
      border-radius: 6px;
      overflow: hidden;
    }

    .cell {
      background-color: #ffffff;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 4vw, 2rem);
      font-weight: 800;
      color: #000000;
      cursor: pointer;
      position: relative;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
      padding: 2px;
      text-align: center;
    }

    .cell.free {
      color: #009be3;
      font-size: clamp(0.75rem, 2.6vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .cell.target {
      box-shadow: inset 0 0 0 clamp(3px, 0.9vw, 4.5px) var(--target-color);
      z-index: 2;
    }

    .cell input.edit-input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: #0d1117;
      outline: none;
      text-transform: uppercase;
      padding: 0;
      margin: 0;
    }

    .cell input.edit-input:focus {
      background: rgba(250, 204, 21, 0.25);
    }

    /* Translucent Dabber Marks.
       Every style reads --dabber-opacity and --dabber-scale so the sliders
       in the control panel affect all six of them uniformly. */
    body[data-dabber="circle"] .cell.marked::after {
      content: '';
      position: absolute;
      width: calc(70% * var(--dabber-scale));
      height: calc(70% * var(--dabber-scale));
      background-color: var(--dabber-color);
      opacity: var(--dabber-opacity);
      border-radius: 50%;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    /* Star / heart / diamond share one rule; only the glyph differs */
    body[data-dabber="star"] .cell.marked::after,
    body[data-dabber="heart"] .cell.marked::after,
    body[data-dabber="diamond"] .cell.marked::after {
      position: absolute;
      font-size: calc(clamp(1.8rem, 6vw, 2.8rem) * var(--dabber-scale));
      color: var(--dabber-color);
      opacity: var(--dabber-opacity);
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
      pointer-events: none;
    }
    body[data-dabber="star"] .cell.marked::after { content: '★'; }
    body[data-dabber="heart"] .cell.marked::after { content: '♥'; }
    body[data-dabber="diamond"] .cell.marked::after { content: '◆'; }

    body[data-dabber="stamp"] .cell.marked::after {
      content: '';
      position: absolute;
      width: calc(65% * var(--dabber-scale));
      height: calc(65% * var(--dabber-scale));
      background-color: var(--dabber-color);
      opacity: var(--dabber-opacity);
      border: calc(3px * var(--dabber-scale)) solid var(--dabber-color);
      border-radius: 4px;
      transform: rotate(-12deg);
      box-shadow: 0 0 6px var(--dabber-color);
      pointer-events: none;
    }

    body[data-dabber="crosshair"] .cell.marked::after {
      content: '🎯';
      position: absolute;
      font-size: calc(clamp(1.4rem, 5vw, 2.2rem) * var(--dabber-scale));
      opacity: var(--dabber-opacity);
      line-height: 1;
      filter: drop-shadow(0 0 3px var(--dabber-color));
      pointer-events: none;
    }

    /* Background brightness veil — sits above the background and its effect
       canvases (z-index 0) but below the card and controls (z-index 2), so
       only the backdrop dims or lifts, never the card itself. */
    .brightness-veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: var(--bg-veil-color);
      opacity: var(--bg-veil-opacity);
      transition: opacity 0.15s linear, background-color 0.15s linear;
    }

    /* Compact slider rows for dabber tuning + the backdrop brightness */
    .tune-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 9px 9px 10px;
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .tune-row {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
    }

    .tune-label {
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      width: 54px;
      flex-shrink: 0;
      user-select: none;
    }

    /* The backdrop label carries a ☀/🌙/🔆 icon, so it needs a little more room */
    .tune-label--wide { width: 66px; }

    .tune-val {
      font-size: 0.56rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      width: 30px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    input[type="range"].tune-range {
      flex: 1;
      min-width: 0;
      height: 16px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--tune-accent);
      background: transparent;
    }

    /* Readable slider text on the pink theme's light frosted panel */
    body.theme-pink .tune-group {
      background: rgba(255, 255, 255, 0.35);
      border-color: rgba(255, 255, 255, 0.6);
    }
    body.theme-pink .tune-label { color: rgba(168, 13, 100, 0.85); }
    body.theme-pink .tune-val { color: #a80d64; }

    /* Side Control Panel — sized ~15% down from the original 230px build,
       same spot in the layout, everything inside scaled to match. */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 196px;
      align-items: stretch;
      background: rgba(20, 22, 28, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .selector-row {
      display: flex;
      gap: 7px;
      align-items: center;
      width: 100%;
    }

    .selector-row > select.btn-select,
    .selector-row > button {
      flex: 1;
      min-width: 0;
      width: auto;
    }

    /* Rainbow color-wheel chip — the swatch always shows the RGB wheel
       rather than the picked color; the real <input> sits invisible on top. */
    .color-chip {
      position: relative;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      overflow: hidden;
      background: linear-gradient(135deg, #2a2d35 0%, #131519 100%);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .color-chip::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: conic-gradient(from 90deg,
        #ff0000, #ff8a00, #ffee00, #48ff00, #00ff8a,
        #00e5ff, #2b5cff, #8a00ff, #ff00c8, #ff0000);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    .color-chip::after {
      content: '';
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: rgba(18, 20, 24, 0.92);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      pointer-events: none;
    }

    .color-chip:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    .color-chip input[type="color"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }

    button, label.btn-file, select.btn-select, select.btn-layouts {
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      height: 36px;
      padding: 0 12px;
      font-size: 0.72rem !important;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      outline: none;
    }

    button:hover, label.btn-file:hover, select.btn-select:hover, select.btn-layouts:hover {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }

    button:active, label.btn-file:active, select.btn-select:active, select.btn-layouts:active {
      transform: translateY(0);
    }

    .btn-mode { background: var(--btn-mode); }
    .btn-mode.active {
      background: var(--btn-mode-active);
      box-shadow: 0 0 14px var(--btn-active-glow);
    }

    .btn-edit { background: var(--btn-edit); }
    .btn-edit.active {
      background: var(--btn-edit-active);
      box-shadow: 0 0 14px var(--btn-active-glow);
    }

    .btn-mode.active, .btn-edit.active {
      color: var(--btn-active-text) !important;
    }

    .btn-export { background: var(--btn-export); }
    .btn-import {
      background: var(--btn-import);
      color: var(--btn-import-text) !important;
      text-shadow: none;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    /* Shared dropdown chrome; gradient layered UNDER the arrow so both show */
    select.btn-layouts, select.btn-select {
      appearance: none;
      -webkit-appearance: none;
      background-color: transparent;
      text-align-last: center;
      background-repeat: no-repeat, no-repeat;
      background-position: right 8px center, center;
      background-size: 16px, 100% 100%;
      padding-right: 24px;
    }
    select.btn-layouts {
      background-image: var(--select-arrow), var(--btn-layouts);
    }
    select.btn-select {
      background-image: var(--select-arrow), var(--btn-select);
    }
    select.btn-layouts option, select.btn-select option {
      background-color: #1e293b;
      color: #ffffff;
    }

    .btn-clear { background: var(--btn-clear); }
    .btn-bright { background: var(--btn-bright); }
    .btn-reset { background: var(--btn-reset); }

    /* ================= Monochrome: polished metal buttons =================
       Each control gets three background layers, top to bottom:
         1. the dropdown arrow (selects only)
         2. a moving specular highlight, parked off the left edge
         3. the tone gradient that gives the metal its shape
       Hovering slides layer 2 across the face for the sheen. */
    body.theme-mono {
      --metal-sheen: linear-gradient(102deg,
        transparent 34%,
        rgba(255, 255, 255, 0.10) 43%,
        rgba(255, 255, 255, 0.55) 49%,
        rgba(255, 255, 255, 0.18) 54%,
        transparent 64%);
      --metal-sheen-red: linear-gradient(102deg,
        transparent 34%,
        rgba(255, 220, 220, 0.14) 43%,
        rgba(255, 235, 235, 0.65) 49%,
        rgba(255, 190, 190, 0.22) 54%,
        transparent 64%);
    }

    body.theme-mono button,
    body.theme-mono label.btn-file,
    body.theme-mono select.btn-layouts,
    body.theme-mono select.btn-select {
      border: 1px solid rgba(255, 255, 255, 0.14);
      /* Bevel: bright top lip, dark underside, deep drop shadow */
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.32),
        inset 0 -1px 0 rgba(0, 0, 0, 0.85),
        inset 0 0 12px rgba(0, 0, 0, 0.55),
        0 4px 14px rgba(0, 0, 0, 0.65);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      transition: background-position 0.55s ease, transform 0.2s ease,
                  box-shadow 0.2s ease, opacity 0.2s ease;
    }

    body.theme-mono button:hover,
    body.theme-mono label.btn-file:hover,
    body.theme-mono select.btn-layouts:hover,
    body.theme-mono select.btn-select:hover {
      opacity: 1;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(0, 0, 0, 0.85),
        inset 0 0 12px rgba(0, 0, 0, 0.45),
        0 6px 18px rgba(0, 0, 0, 0.75);
    }

    /* Two-layer controls: sheen over tone */
    body.theme-mono button,
    body.theme-mono label.btn-file {
      background-repeat: no-repeat, no-repeat;
      background-size: 220% 100%, 100% 100%;
      background-position: -60% 0, center;
    }
    body.theme-mono button:hover,
    body.theme-mono label.btn-file:hover {
      background-position: 160% 0, center;
    }

    body.theme-mono .btn-mode        { background-image: var(--metal-sheen), var(--btn-mode); }
    body.theme-mono .btn-mode.active { background-image: var(--metal-sheen), var(--btn-mode-active); }
    body.theme-mono .btn-edit        { background-image: var(--metal-sheen), var(--btn-edit); }
    body.theme-mono .btn-edit.active { background-image: var(--metal-sheen), var(--btn-edit-active); }
    body.theme-mono .btn-export      { background-image: var(--metal-sheen), var(--btn-export); }
    body.theme-mono .btn-import      { background-image: var(--metal-sheen), var(--btn-import); }
    body.theme-mono .btn-clear       { background-image: var(--metal-sheen), var(--btn-clear); }
    body.theme-mono .btn-bright      { background-image: var(--metal-sheen), var(--btn-bright); }
    body.theme-mono .btn-victory     { background-image: var(--metal-sheen), var(--btn-victory); }

    /* Reset: same metal treatment, red alloy */
    body.theme-mono .btn-reset {
      background-image: var(--metal-sheen-red), var(--btn-reset);
      border-color: rgba(255, 170, 170, 0.22);
    }
    body.theme-mono .btn-reset:hover {
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 220, 0.5),
        inset 0 -1px 0 rgba(0, 0, 0, 0.85),
        inset 0 0 12px rgba(0, 0, 0, 0.4),
        0 6px 20px rgba(180, 30, 30, 0.5);
    }

    /* Active Mode / Edit buttons keep their glow on top of the bevel */
    body.theme-mono .btn-mode.active,
    body.theme-mono .btn-edit.active {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 0 rgba(0, 0, 0, 0.85),
        inset 0 0 12px rgba(0, 0, 0, 0.4),
        0 0 16px var(--btn-active-glow),
        0 4px 14px rgba(0, 0, 0, 0.65);
    }

    /* Three-layer controls: arrow over sheen over tone */
    body.theme-mono select.btn-layouts,
    body.theme-mono select.btn-select {
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-size: 16px, 220% 100%, 100% 100%;
      background-position: right 8px center, -60% 0, center;
    }
    body.theme-mono select.btn-layouts:hover,
    body.theme-mono select.btn-select:hover {
      background-position: right 8px center, 160% 0, center;
    }
    body.theme-mono select.btn-layouts {
      background-image: var(--select-arrow), var(--metal-sheen), var(--btn-layouts);
    }
    body.theme-mono select.btn-select {
      background-image: var(--select-arrow), var(--metal-sheen), var(--btn-select);
    }

    body.theme-mono select.btn-layouts option,
    body.theme-mono select.btn-select option {
      background-color: #0d0d10;
    }

    .btn-victory {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: auto;
      height: auto;
      background: var(--btn-victory);
      color: #ffffff !important;
      padding: 7px 13px;
      font-size: 0.72rem !important;
      border-radius: 50px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 10;
      opacity: 0.5;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }
    .btn-victory:hover { opacity: 1; }

    /* Small, transparent hide/unhide toggle, tucked right above Victory. */
    .btn-hide-ui {
      position: fixed;
      bottom: 62px;
      right: 24px;
      width: 30px;
      height: 30px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff !important;
      font-size: 0.85rem !important;
      border-radius: 50%;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 10;
      opacity: 0.32;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: opacity 0.3s ease, transform 0.2s ease, background 0.2s ease;
    }
    .btn-hide-ui:hover { opacity: 1; background: rgba(255, 255, 255, 0.2); }
    .btn-hide-ui.active { opacity: 0.75; }

    /* While hidden, only the card/controls vanish — the theme picker, date,
       credit line, and the two floating corner buttons stay put so the
       player can always get back in. */
    body.ui-hidden .app-container { display: none; }

    /* The card becomes a free-floating, draggable window once picked up.
       touch-action must be none *before* the gesture starts — a mobile
       browser decides whether a swipe is a scroll at touch-down, so setting
       it only while .dragging is applied is always one beat too late. */
    .bingo-card {
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .bingo-card .grid { cursor: default; }
    .bingo-card.dragging {
      cursor: grabbing;
      transition: none !important;
    }

    #fileInput { display: none; }

    .status-msg {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
      height: 20px;
      text-align: center;
      z-index: 2;
    }

    /* Overlay & Victory Modal */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .winner-card {
      background: linear-gradient(135deg, #1e1b4b, #311042);
      border: 2px solid #ff007f;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 0, 127, 0.5);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .overlay.show .winner-card { transform: scale(1); }
    .winner-title {
      font-family: 'Arial Black', sans-serif;
      font-size: 3.5rem;
      background: linear-gradient(180deg, #fff 0%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 10px 0;
    }
    .winner-desc {
      font-size: 1.2rem;
      color: #e2e8f0;
      margin-bottom: 24px;
    }
    #confettiCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @media (max-width: 680px) {
      .app-container { flex-direction: column; }
      .controls { width: clamp(280px, 80vw, 420px); }
      .top-date { top: 12px; left: 16px; }
      select.btn-theme-toggle { top: 12px; right: 16px; }
      .bottom-credit { bottom: 12px; left: 16px; }
    }

        { id: "22", text: "22", marked: false, target: false },
        { id: "23", text: "45", marked: false, target: false },
        { id: "24", text: "59", marked: false, target: false },
        { id: "25", text: "61", marked: false, target: false }
      ]
    };

    let currentMode = 'mark'; 
    let isEditingCard = false;

    // Interactive Mouse Coordinates for Red Theme
    document.addEventListener('mousemove', (e) => {
      if (document.body.classList.contains('theme-red')) {
        document.body.style.setProperty('--mouse-x', `${e.clientX}px`);
        document.body.style.setProperty('--mouse-y', `${e.clientY}px`);
      }

    window.addEventListener('load', () => {
      setTimeout(() => {
        const preloader = document.getElementById('preloader');
        if (preloader) preloader.classList.add('fade-out');

    document.addEventListener('DOMContentLoaded', () => {
      const dateEl = document.getElementById('currentDate');
      const now = new Date();
      dateEl.innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
