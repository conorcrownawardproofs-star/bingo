      ctx.globalCompositeOperation = 'lighter';
      for (const e of s.emitters) {
        const depth = h - streetY;
        const bands = 20;
        for (let i = 0; i < bands; i++) {
          const f = i / bands;
          const yy = streetY + f * depth * 0.92;
          const wob = Math.sin(t * 0.0022 + f * 7 + e.x * 0.01) * (5 + f * 26);
          const wid = e.w * (0.55 + f * 0.9);
          const a = e.a * (1 - f) * (1 - f) * 0.5;
          if (a <= 0.004) continue;
          ctx.fillStyle = 'rgba(' + e.rgb + ', ' + a + ')';
          ctx.fillRect(e.x - wid / 2 + wob, yy, wid, depth / bands * 1.5);
        }
      }
      ctx.restore();

      /* ---------- puddles: standing water with rain rings ---------- */
      for (const p of s.puddles) {
        const pos = tsRoad(s, p.d, p.off);
        const prx = p.rx * w * pos.sc, pry = prx * 0.22;
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, prx, pry, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = 'rgba(30, 34, 58, 0.5)';
        ctx.fillRect(pos.x - prx, pos.y - pry, prx * 2, pry * 2);
        // the sky and signs sitting in the water
        ctx.globalCompositeOperation = 'lighter';
        for (const e of s.emitters) {
          if (Math.abs(e.x - pos.x) > prx * 2.6) continue;
          ctx.fillStyle = 'rgba(' + e.rgb + ', ' + (e.a * 0.24) + ')';
          const wob = Math.sin(t * 0.003 + e.x) * prx * 0.12;
          ctx.fillRect(e.x - prx * 0.3 + wob, pos.y - pry, prx * 0.6, pry * 2);
        }
        ctx.restore();
        // expanding rings from drops landing in it
        p.nextRing -= 16;
        if (p.nextRing <= 0) {
          p.rings.push({ r: 0, a: 1, ox: (Math.random() - 0.5) * prx * 1.2 });
          p.nextRing = 220 + Math.random() * 420;
        }
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, prx, pry, 0, 0, Math.PI * 2);
        ctx.clip();
        for (let i = p.rings.length - 1; i >= 0; i--) {
          const r = p.rings[i];
          r.r += 0.5; r.a -= 0.018;
          if (r.a <= 0) { p.rings.splice(i, 1); continue; }
          ctx.strokeStyle = 'rgba(190, 210, 255, ' + r.a * 0.5 + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(pos.x + r.ox, pos.y, r.r * prx * 0.09, r.r * pry * 0.09, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
        // rim highlight
        ctx.strokeStyle = 'rgba(150, 175, 230, 0.13)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, prx, pry, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      /* ---------- steam venting off a manhole ---------- */
      {
        const mh = tsRoad(s, 0.44, -0.14);
        ctx.fillStyle = 'rgba(10, 10, 16, 0.8)';
        ctx.beginPath();
        ctx.ellipse(mh.x, mh.y, 15 * mh.sc, 4.5 * mh.sc, 0, 0, Math.PI * 2);
        ctx.fill();
        for (const st of s.steam) {
          st.p += 0.0022 * st.sc;
          if (st.p > 1) { st.p = 0; st.sway = Math.random() * 6.28; }
          const rise = st.p;
          const sx = mh.x + Math.sin(t * 0.0012 + st.sway) * 26 * rise * st.sc;
          const sy = mh.y - rise * h * 0.17 * st.sc;
          const rad = (10 + rise * 40) * mh.sc * st.sc;
          const a = (1 - rise) * 0.16;
          const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad);
          sg.addColorStop(0, 'rgba(226, 208, 226, ' + a + ')');
          sg.addColorStop(1, 'rgba(200, 180, 210, 0)');
          ctx.fillStyle = sg;
          ctx.beginPath();
          ctx.arc(sx, sy, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      /* ---------- traffic ---------- */
      s.taxis.sort((a, b5) => a.d - b5.d);      // far cars drawn first
      for (const car of s.taxis) {
        car.d += car.spd * (car.lane === -1 ? 1 : -1);
        if (car.d > 1.12) car.d = 0.02;
        if (car.d < 0.02) car.d = 1.12;
        const p = tsRoad(s, car.d, car.laneOff);
        const sc = p.sc;
        if (sc < 0.05) continue;
        const bw = 62 * sc, bh = 26 * sc;
        const approaching = car.lane === -1;

        // headlight wash thrown onto the wet road
        if (approaching) {
          const cg = ctx.createLinearGradient(p.x, p.y, p.x, p.y + 150 * sc);
          cg.addColorStop(0, 'rgba(255, 238, 200, 0.3)');
          cg.addColorStop(1, 'rgba(255, 238, 200, 0)');
          ctx.fillStyle = cg;
          ctx.beginPath();
          ctx.moveTo(p.x - bw * 0.45, p.y);
          ctx.lineTo(p.x + bw * 0.45, p.y);
          ctx.lineTo(p.x + bw * 1.5, p.y + 150 * sc);
          ctx.lineTo(p.x - bw * 1.5, p.y + 150 * sc);
          ctx.closePath();
          ctx.fill();
        }

        const body = car.kind === 'taxi' ? '#f2b829' : 'hsl(' + car.hue + ', 22%, 26%)';
        ctx.fillStyle = body;
        tsRoundRect(ctx, p.x - bw / 2, p.y - bh, bw, bh, 4 * sc);
        ctx.fill();
        ctx.fillStyle = car.kind === 'taxi' ? '#e0a81f' : 'hsl(' + car.hue + ', 20%, 20%)';
        tsRoundRect(ctx, p.x - bw * 0.34, p.y - bh * 1.62, bw * 0.68, bh * 0.7, 3 * sc);
        ctx.fill();
        ctx.fillStyle = 'rgba(120, 170, 210, 0.5)';   // glass
        tsRoundRect(ctx, p.x - bw * 0.29, p.y - bh * 1.54, bw * 0.58, bh * 0.5, 2 * sc);
        ctx.fill();
        if (car.kind === 'taxi' && sc > 0.35) {        // roof light
          ctx.fillStyle = '#fff0c0';
          ctx.fillRect(p.x - bw * 0.1, p.y - bh * 1.85, bw * 0.2, bh * 0.22);
        }
        // wheels
        ctx.fillStyle = '#0a0a0d';
        ctx.beginPath();
        ctx.ellipse(p.x - bw * 0.3, p.y, bw * 0.1, bh * 0.16, 0, 0, Math.PI * 2);
        ctx.ellipse(p.x + bw * 0.3, p.y, bw * 0.1, bh * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();

        if (approaching) {
          ctx.fillStyle = 'rgba(255, 245, 214, 0.95)';
          ctx.shadowColor = '#fff2c8'; ctx.shadowBlur = 16 * sc;
          ctx.beginPath();
          ctx.ellipse(p.x - bw * 0.33, p.y - bh * 0.42, 4 * sc, 3 * sc, 0, 0, Math.PI * 2);
          ctx.ellipse(p.x + bw * 0.33, p.y - bh * 0.42, 4 * sc, 3 * sc, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          emit(p.x, p.y, bw * 1.2, '255, 240, 200', 0.3 * Math.min(1, sc));
        } else {
          ctx.fillStyle = 'rgba(255, 70, 60, 0.95)';
          ctx.shadowColor = '#ff3b30'; ctx.shadowBlur = 14 * sc;
          ctx.beginPath();
          ctx.ellipse(p.x - bw * 0.34, p.y - bh * 0.5, 3.4 * sc, 2.6 * sc, 0, 0, Math.PI * 2);
          ctx.ellipse(p.x + bw * 0.34, p.y - bh * 0.5, 3.4 * sc, 2.6 * sc, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          emit(p.x, p.y, bw, '255, 70, 60', 0.26 * Math.min(1, sc));
        }
        // spray kicked off the tyres
        if (sc > 0.4) {
          ctx.fillStyle = 'rgba(190, 200, 225, 0.1)';
          for (let i = 0; i < 5; i++) {
            const sxp = p.x + (Math.random() - 0.5) * bw * 1.1;
            ctx.beginPath();
            ctx.ellipse(sxp, p.y + Math.random() * 5 * sc, 5 * sc, 2 * sc, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      /* ---------- pedestrians under umbrellas ---------- */
      s.walkers.sort((a, b6) => a.d - b6.d);
      for (const wk of s.walkers) {
        wk.d += wk.spd;
        if (wk.d > 1.1) wk.d = 0.05;
        if (wk.d < 0.05) wk.d = 1.1;
        const p = tsRoad(s, wk.d, wk.side * wk.off);
        const sc = p.sc * 0.85;
        if (sc < 0.05) continue;
        wk.bob += 0.06 * (0.5 + sc);
        const bobY = Math.abs(Math.sin(wk.bob)) * 2 * sc;
        const px = p.x, py = p.y - bobY;
        const bodyH = 52 * sc;

        ctx.fillStyle = wk.coat;                    // coat + legs silhouette
        tsRoundRect(ctx, px - 7 * sc, py - bodyH, 14 * sc, bodyH * 0.68, 4 * sc);
        ctx.fill();
        ctx.strokeStyle = wk.coat;
        ctx.lineWidth = 4 * sc;
        ctx.lineCap = 'round';
        const stride = Math.sin(wk.bob) * 6 * sc;
        ctx.beginPath();
        ctx.moveTo(px - 2 * sc, py - bodyH * 0.34);
        ctx.lineTo(px - 2 * sc + stride, py);
        ctx.moveTo(px + 2 * sc, py - bodyH * 0.34);
        ctx.lineTo(px + 2 * sc - stride, py);
        ctx.stroke();
        ctx.fillStyle = '#2b2530';                  // head
        ctx.beginPath();
        ctx.arc(px, py - bodyH - 4 * sc, 5 * sc, 0, Math.PI * 2);
        ctx.fill();

        if (wk.hasUmb) {
          const uy = py - bodyH - 16 * sc;
          const ur = 20 * sc;
          ctx.strokeStyle = '#1a1a20';
          ctx.lineWidth = 1.6 * sc;
          ctx.beginPath();
          ctx.moveTo(px, uy);
          ctx.lineTo(px, py - bodyH * 0.5);
          ctx.stroke();
          ctx.fillStyle = wk.umb;
          ctx.beginPath();
          ctx.moveTo(px - ur, uy);
          ctx.quadraticCurveTo(px, uy - ur * 1.15, px + ur, uy);
          // scalloped hem
          for (let i = 4; i >= 0; i--) {
            const ux = px - ur + (ur * 2) * (i / 5);
            ctx.quadraticCurveTo(ux + ur * 0.1, uy + 4 * sc, ux, uy);
          }
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';  // sheen off the wet canopy
          ctx.beginPath();
          ctx.moveTo(px - ur * 0.6, uy - ur * 0.25);
          ctx.quadraticCurveTo(px - ur * 0.2, uy - ur * 0.9, px + ur * 0.1, uy - ur * 0.3);
          ctx.closePath();
          ctx.fill();
          // rain sliding off the rim
          if (sc > 0.45) {
            ctx.strokeStyle = 'rgba(190, 210, 245, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
              const dx2 = px - ur + (i + 0.5) * (ur * 2 / 3);
              const dy2 = uy + ((t * 0.12 + i * 40) % 26) * sc;
              ctx.beginPath();
              ctx.moveTo(dx2, dy2);
              ctx.lineTo(dx2, dy2 + 6 * sc);
              ctx.stroke();
            }
          }
        }
      }

      /* ---------- rain, four layers deep ---------- */
      for (let li = 0; li < s.rainLayers.length; li++) {
        const layer = s.rainLayers[li];
        const cfg = layer.cfg;
        ctx.strokeStyle = 'rgba(198, 216, 245, ' + cfg.a + ')';
        ctx.lineWidth = li >= 2 ? 1.5 : 1;
        ctx.lineCap = 'butt';
        ctx.beginPath();
        for (const dr of layer.drops) {
          dr.y += cfg.spd * dr.s;
          dr.x += cfg.wob * dr.s;
          if (dr.y > h) { dr.y = -30; dr.x = Math.random() * (w + 200) - 100; }
          if (dr.x > w + 100) dr.x = -100;
          const len = cfg.len * dr.s;
          ctx.moveTo(dr.x, dr.y);
          ctx.lineTo(dr.x - cfg.wob * 1.6, dr.y + len);
        }
        ctx.stroke();
      }

      /* ---------- splashes where rain meets asphalt ---------- */
      if (s.splashes.length < 46 && Math.random() < 0.7) {
        const d = Math.random();
        const off = (Math.random() - 0.5) * 1.5;
        const pos = tsRoad(s, d, off);
        s.splashes.push({ x: pos.x, y: pos.y, sc: pos.sc, life: 1 });
      }
      for (let i = s.splashes.length - 1; i >= 0; i--) {
        const sp = s.splashes[i];
        sp.life -= 0.05;
        if (sp.life <= 0) { s.splashes.splice(i, 1); continue; }
        const gr = (1 - sp.life) * 9 * sp.sc;
        ctx.strokeStyle = 'rgba(200, 218, 250, ' + sp.life * 0.45 + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(sp.x, sp.y, gr, gr * 0.3, 0, 0, Math.PI * 2);
        ctx.stroke();
        if (sp.sc > 0.5) {                     // a couple of kicked-up droplets
          ctx.fillStyle = 'rgba(210, 226, 252, ' + sp.life * 0.5 + ')';
          ctx.fillRect(sp.x - gr * 0.7, sp.y - gr * 0.9 * sp.life, 1.2, 1.2);
          ctx.fillRect(sp.x + gr * 0.7, sp.y - gr * 0.8 * sp.life, 1.2, 1.2);
        }
      }

      /* ---------- final grade: haze into the distance, dark corners ---------- */
      const haze = ctx.createRadialGradient(vpX, vpY, 0, vpX, vpY, w * 0.55);
      haze.addColorStop(0, 'rgba(180, 130, 170, 0.14)');
      haze.addColorStop(1, 'rgba(180, 130, 170, 0)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, 0, w, h);

      const vig = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.32,
                                           w * 0.5, h * 0.5, Math.max(w, h) * 0.78);
      vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vig.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
    }

    const EFFECTS = {
      'theme-sakura': new PetalSystem('sakuraCanvas', 55, makeSakuraPetal),
      'theme-retro': new PetalSystem('vaporwavePetals', 80, makeVaporPetal),
      'theme-retro-dark': new PetalSystem('vaporwavePetals', 80, makeVaporPetalDark),
      'theme-pink': new PetalSystem('pinkCanvas', 60, makeHeartSpark),
      'theme-green': new PetalSystem('luckyCanvas', 45, makeShamrock),
      'theme-red': new PetalSystem('redCanvas', 55, makeBatEmber),
      'theme-blue': new PetalSystem('blueCanvas', 34, makeChromeOrb),
      'theme-aqua': new SceneSystem('aquaCanvas', buildAquarium, drawAquarium),
      'theme-portal': new PetalSystem('portalDust', 45, makeDustMote),
      'theme-space': new PetalSystem('spaceCanvas', 150, makePixelStar),
      'theme-city': new SceneSystem('cityCanvas', buildCityDrive, drawCityDrive),
      'theme-drive': new SceneSystem('driveCanvas', buildGwbDrive, drawGwbDrive),
      'theme-orbit': new SceneSystem('orbitCanvas', buildOrbit, drawOrbit),
      'theme-backrooms': new SceneSystem('backroomsCanvas', buildBackrooms, drawBackrooms),
      'theme-ocean': new SceneSystem('oceanCanvas', buildOcean, drawOcean),
      'theme-greenhouse': new SceneSystem('greenhouseCanvas', buildGreenhouse, drawGreenhouse),
      'theme-origami': new SceneSystem('origamiCanvas', buildOrigami, drawOrigami),
      'theme-timessquare': new SceneSystem('timesSquareCanvas', buildTimesSquare, drawTimesSquare)
    };

    // One shared resize handler for all effect canvases
    window.addEventListener('resize', () => {
      Object.values(EFFECTS).forEach(fx => fx.resize());
    });

  </script>
</body>
</html>
