          ctx.lineTo(px(side, kFar), py(h * yf, kFar));
          ctx.stroke();
        }
      }

      // Wall seams and ceiling-tile seams marching toward the dark
      for (const k of s.seams) {
        const a = 0.16 * (1 - k * 0.7);
        ctx.strokeStyle = `rgba(40, 32, 6, ${a})`;
        ctx.lineWidth = 1;
        for (const side of [0, w]) {
          ctx.beginPath();
          ctx.moveTo(px(side, k), py(0, k));
          ctx.lineTo(px(side, k), py(h, k));
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(px(0, k), py(0, k));
        ctx.lineTo(px(w, k), py(0, k));
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(40, 32, 6, 0.12)';
      for (const xf of [0.3, 0.5, 0.7]) {
        ctx.beginPath();
        ctx.moveTo(w * xf, 0);
        ctx.lineTo(px(w * xf, kFar), py(0, kFar));
        ctx.stroke();
      }

      // The far end falls away into black
      g = ctx.createRadialGradient(vp.x, vp.y, 4, vp.x, vp.y, Math.max(w, h) * 0.34);
      g.addColorStop(0, 'rgba(8, 6, 0, 0.92)');
      g.addColorStop(1, 'rgba(8, 6, 0, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // ...and sometimes something is standing in it
      const fig = s.figure;
      if (t > fig.next) {
        fig.visibleUntil = t + 1500;
        fig.next = t + 22000 + Math.random() * 32000;
        fig.off = (Math.random() - 0.5) * w * 0.05;
      }
      if (t < fig.visibleUntil) {
        const prog = 1 - (fig.visibleUntil - t) / 1500;
        const a = Math.sin(prog * Math.PI) * 0.75;
        const fk = 0.9;
        const floorY = py(h, fk);
        const fh = (py(h, fk) - py(0, fk)) * 0.46;
        const fx = vp.x + fig.off + Math.sin(t * 0.004) * 1.2;
        ctx.fillStyle = `rgba(14, 11, 1, ${a})`;
        ctx.beginPath();
        ctx.moveTo(fx - fh * 0.13, floorY);
        ctx.quadraticCurveTo(fx - fh * 0.16, floorY - fh * 0.62, fx - fh * 0.08, floorY - fh * 0.78);
        ctx.lineTo(fx + fh * 0.08, floorY - fh * 0.78);
        ctx.quadraticCurveTo(fx + fh * 0.16, floorY - fh * 0.62, fx + fh * 0.13, floorY);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.arc(fx, floorY - fh * 0.88, fh * 0.11, 0, Math.PI * 2);
        ctx.fill();
      }

      // Fluorescent rows, far to near, with pools of light on the carpet
      for (let i = s.rows.length - 1; i >= 0; i--) {
        const row = s.rows[i];
        const k = row.k;
        const scale = 1 - k;
        const len = scale * w * 0.1;
        const wid = scale * h * 0.032;
        const ceilY = py(0, k);
        const floorY = py(h, k);
        for (const p of row.panels) {
          const cxp = lerp(w * 0.5 + p.off * w * 0.36, vp.x, k);
          let b;
          if (p.dead) {
            b = Math.random() < 0.055 ? 0.85 : 0.05;   // strobing, mostly out
          } else {
            b = p.base + Math.sin(t * 0.02 + p.buzz) * 0.05 + (Math.random() - 0.5) * 0.07;
          }
          b = Math.max(0, Math.min(1, b)) * dim;

          // Halo on the ceiling around the fixture
          g = ctx.createRadialGradient(cxp, ceilY, 2, cxp, ceilY, len * 2.4);
          g.addColorStop(0, `rgba(255, 244, 195, ${b * 0.28})`);
          g.addColorStop(1, 'rgba(255, 244, 195, 0)');
          ctx.fillStyle = g;
          ctx.fillRect(cxp - len * 2.4, ceilY - wid * 3, len * 4.8, wid * 8);

          // The tube itself
          ctx.fillStyle = `rgba(30, 25, 6, ${0.55 * scale + 0.2})`;
          ctx.fillRect(cxp - len / 2 - 1.5, ceilY - 1.5, len + 3, wid + 3);
          ctx.fillStyle = `rgba(252, 243, 198, ${b})`;
          ctx.fillRect(cxp - len / 2, ceilY, len, wid);

          // Wet-carpet pool beneath it
          g = ctx.createRadialGradient(cxp, floorY, 2, cxp, floorY, len * 1.7);
          g.addColorStop(0, `rgba(255, 240, 180, ${b * 0.16})`);
          g.addColorStop(1, 'rgba(255, 240, 180, 0)');
          ctx.fillStyle = g;
          ctx.save();
          ctx.translate(cxp, floorY);
          ctx.scale(1, 0.32);
          ctx.beginPath();
          ctx.arc(0, 0, len * 1.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // Film grain crawling over everything
      ctx.save();
      ctx.globalAlpha = 0.55;
      const gx = Math.floor(Math.random() * 160), gy = Math.floor(Math.random() * 160);
      ctx.translate(-gx, -gy);
      ctx.fillStyle = ctx.createPattern(s.grain, 'repeat');
      ctx.fillRect(0, 0, w + 160, h + 160);
      ctx.restore();

      // Vignette, plus extra darkness while the power stutters
      g = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.35, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
      g.addColorStop(0, 'rgba(10, 8, 0, 0)');
      g.addColorStop(1, 'rgba(10, 8, 0, 0.58)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      if (dim < 1) {
        ctx.fillStyle = `rgba(0, 0, 0, ${(1 - dim) * 0.5})`;
        ctx.fillRect(0, 0, w, h);
      }
    }

    /* =====================================================================
       OPEN OCEAN — the mini giant tank. The waterline sits near the top:
       above it a hazy sky, a couple of small boats and a laden cargo ship;
       below it god rays, marine snow, an anchovy bait ball swirling as one
       animal, a ribbon school crossing mid-water, marlins that dart at the
       ball, and sharks patrolling the deep.
       ===================================================================== */

    function buildOcean(canvas) {
      const w = canvas.width, h = canvas.height;
      const waterY = h * 0.16;

      const clouds = Array.from({ length: 4 }, () => ({
        x: Math.random() * w,
        y: Math.random() * waterY * 0.45 + waterY * 0.08,
        s: Math.random() * 0.7 + 0.6,
        v: Math.random() * 0.05 + 0.02
      }));

      const rays = Array.from({ length: 6 }, () => ({
        x: Math.random() * w,
        width: Math.random() * 30 + 14,
        tilt: Math.random() * 0.16 - 0.08,
        phase: Math.random() * Math.PI * 2
      }));

      const snow = Array.from({ length: 70 }, () => ({
        x: Math.random() * w,
        y: waterY + Math.random() * (h - waterY),
        r: Math.random() * 1.4 + 0.4,
        v: Math.random() * 0.16 + 0.05,
        drift: Math.random() * Math.PI * 2
      }));

      const bubbles = Array.from({ length: 26 }, () => ({
        x: Math.random() * w,
        y: waterY + Math.random() * (h - waterY),
        r: Math.random() * 2.4 + 0.8,
        v: Math.random() * 0.5 + 0.25,
        wob: Math.random() * Math.PI * 2
      }));

      // Anchovy bait ball — 150 slivers swirling around a drifting centre
      const bait = {
        x: w * 0.32, y: h * 0.56,
        vx: 0.14, vy: 0.05,
        spook: 0,
        fish: Array.from({ length: 150 }, () => ({
          ang: Math.random() * Math.PI * 2,
          rad: Math.random() * 70 + 16,
          spd: Math.random() * 0.02 + 0.017,
          squash: Math.random() * 0.25 + 0.45,
          size: Math.random() * 3 + 4.5,
          shim: Math.random() * Math.PI * 2
        }))
      };

      // A ribbon school snaking across mid-water
      const ribbon = {
        y: h * 0.36, speed: 0.55, phase: Math.random() * Math.PI * 2,
        x: -34 * 22,
        fish: Array.from({ length: 34 }, (_, i) => ({
          lag: i * 22,
          off: (Math.random() - 0.5) * 26,
          size: Math.random() * 3 + 6
        }))
      };

      const marlins = [
        { x: w * 0.8, y: h * 0.45, dir: -1, speed: 1.25, size: 76, wob: 0, dart: 0, nextDart: 6000 },
        { x: w * 0.12, y: h * 0.68, dir: 1, speed: 1.05, size: 64, wob: Math.PI, dart: 0, nextDart: 13000 }
      ];

      const sharks = [
        { x: w * 0.2, y: h * 0.62, dir: -1, speed: 0.5, size: 92, sway: Math.PI * 0.7 },
        { x: w * 0.55, y: h * 0.8, dir: 1, speed: 0.42, size: 122, sway: 0 },
        { x: w * 0.85, y: h * 0.9, dir: -1, speed: 0.34, size: 155, sway: Math.PI * 1.3 }
      ];

      const boxTones = ['#c0392b', '#2471a3', '#1e8449', '#d68910', '#7d3c98', '#839192'];
      const cargo = {
        x: -Math.max(w * 0.42, 340) - 80,
        speed: 0.055,
        len: Math.max(w * 0.42, 340),
        phase: Math.random() * Math.PI * 2,
        stacks: Array.from({ length: 9 }, () => ({
          tiers: Math.floor(Math.random() * 2) + 2,
          tones: [0, 1, 2, 3].map(() => boxTones[Math.floor(Math.random() * boxTones.length)])
        }))
      };
      const boats = [
        { kind: 'fishing', x: w * 0.68, drift: 0.02, phase: Math.random() * Math.PI * 2 },
        { kind: 'sail', x: w * 0.3, drift: -0.015, phase: Math.random() * Math.PI * 2 }
      ];

      return { w, h, waterY, clouds, rays, snow, bubbles, bait, ribbon, marlins, sharks, cargo, boats };
    }

    function drawOcean(ctx, canvas, s, t) {
      const { w, h, waterY } = s;
      const waveAt = x => waterY + Math.sin(x * 0.012 + t * 0.0012) * 3 + Math.sin(x * 0.03 - t * 0.0019) * 1.6;
      ctx.clearRect(0, 0, w, h);

      // ---- Sky ----
      let g = ctx.createLinearGradient(0, 0, 0, waterY + 8);
      g.addColorStop(0, '#cfeafa');
      g.addColorStop(1, '#8fc9ea');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, waterY + 8);
      g = ctx.createRadialGradient(w * 0.18, 0, 4, w * 0.18, 0, waterY * 1.6);
      g.addColorStop(0, 'rgba(255, 250, 220, 0.85)');
      g.addColorStop(1, 'rgba(255, 250, 220, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, waterY + 8);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      for (const c of s.clouds) {
        c.x += c.v;
        if (c.x > w + 90) c.x = -90;
        for (const [dx, dy, r] of [[-26, 2, 15], [0, -5, 20], [26, 3, 14]]) {
          ctx.beginPath();
          ctx.ellipse(c.x + dx * c.s, c.y + dy * c.s, r * c.s, r * 0.55 * c.s, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ---- Vessels (drawn before the water fill so their hulls read as submerged) ----
      const cg = s.cargo;
      cg.x += cg.speed;
      if (cg.x > w + 120) cg.x = -cg.len - 160;
      const cgY = waveAt(cg.x + cg.len / 2) + Math.sin(t * 0.0008 + cg.phase) * 1.4;
      ctx.save();
      ctx.translate(cg.x + cg.len / 2, cgY);
      ctx.rotate(Math.sin(t * 0.0006 + cg.phase) * 0.006);
      const L = cg.len;
      // Anti-fouling hull below the waterline
      ctx.fillStyle = '#7b241c';
      ctx.beginPath();
      ctx.moveTo(-L / 2, 0);
      ctx.lineTo(L / 2 + 20, 0);
      ctx.lineTo(L / 2 - 4, 17);
      ctx.lineTo(-L / 2 + 22, 17);
      ctx.closePath();
      ctx.fill();
      // Freeboard
      ctx.fillStyle = '#1c2833';
      ctx.beginPath();
      ctx.moveTo(-L / 2 - 4, -15);
      ctx.lineTo(L / 2 + 30, -15);
      ctx.lineTo(L / 2 + 20, 1);
      ctx.lineTo(-L / 2, 1);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e74c3c';                        // boot stripe
      ctx.fillRect(-L / 2 - 1, -2.5, L + 26, 3);
      // Container stacks
      const bw = L * 0.068, bh = 8;
      for (let i = 0; i < cg.stacks.length; i++) {
        const st = cg.stacks[i];
        const bx = -L / 2 + 14 + i * bw * 1.06;
        for (let tier = 0; tier < st.tiers; tier++) {
          ctx.fillStyle = st.tones[tier];
          ctx.fillRect(bx, -15 - (tier + 1) * bh, bw, bh - 1);
        }
      }
      // Bridge castle aft, funnel, radar mast
      ctx.fillStyle = '#ecf0f1';
      ctx.fillRect(-L / 2 + 4, -48, L * 0.085, 33);
      ctx.fillStyle = '#5d6d7e';
      for (let win = 0; win < 3; win++) ctx.fillRect(-L / 2 + 7, -45 + win * 9, L * 0.085 - 6, 3);
      ctx.fillStyle = '#b03a2e';
      ctx.fillRect(-L / 2 + 8, -58, L * 0.04, 10);
      ctx.strokeStyle = '#34495e';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(L / 2 + 8, -15); ctx.lineTo(L / 2 + 8, -34);
      ctx.stroke();
      ctx.restore();
      // Bow foam
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      const bowX = cg.x + cg.len + 22;
      for (let f = 0; f < 3; f++) {
        ctx.beginPath();
        ctx.ellipse(bowX + f * 7, waveAt(bowX) + 1, 6 - f * 1.5, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const b of s.boats) {
        b.x += b.drift;
        if (b.x > w + 60) b.x = -60;
        if (b.x < -60) b.x = w + 60;
        const by = waveAt(b.x) + Math.sin(t * 0.0016 + b.phase) * 1.8;
        ctx.save();
        ctx.translate(b.x, by);
        ctx.rotate(Math.sin(t * 0.0014 + b.phase) * 0.03);
        if (b.kind === 'fishing') {
          ctx.fillStyle = '#21618c';                    // hull
          ctx.beginPath();
          ctx.moveTo(-26, -6); ctx.lineTo(26, -6); ctx.lineTo(19, 6); ctx.lineTo(-21, 6);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#f4f6f7';                    // wheelhouse
          ctx.fillRect(-14, -16, 15, 10);
          ctx.fillStyle = '#2e4053';
          ctx.fillRect(-11, -14, 5, 4);
          ctx.strokeStyle = '#4d5656';                  // boom
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(8, -6); ctx.lineTo(8, -24); ctx.lineTo(22, -12);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#f8f9f9';                    // hull
          ctx.beginPath();
          ctx.moveTo(-22, -4); ctx.lineTo(22, -4); ctx.lineTo(15, 5); ctx.lineTo(-17, 5);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#616a6b';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, -4); ctx.lineTo(0, -34);
          ctx.stroke();
          ctx.fillStyle = '#fdfefe';                    // main + jib
          ctx.beginPath();
          ctx.moveTo(1, -33); ctx.lineTo(1, -6); ctx.lineTo(19, -6);
          ctx.closePath(); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-1, -30); ctx.lineTo(-1, -6); ctx.lineTo(-15, -6);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }

      // ---- The water column ----
      ctx.beginPath();
      ctx.moveTo(0, waveAt(0));
      for (let x = 8; x <= w; x += 8) ctx.lineTo(x, waveAt(x));
      ctx.lineTo(w, h); ctx.lineTo(0, h);
      ctx.closePath();
      g = ctx.createLinearGradient(0, waterY, 0, h);
      g.addColorStop(0, 'rgba(110, 185, 220, 0.88)');
      g.addColorStop(0.16, 'rgba(35, 110, 160, 0.94)');
      g.addColorStop(0.55, 'rgba(10, 62, 105, 0.97)');
      g.addColorStop(1, 'rgba(3, 26, 48, 0.99)');
      ctx.fillStyle = g;
      ctx.fill();
      // Sun-catch along the swell
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, waveAt(0));
      for (let x = 8; x <= w; x += 8) ctx.lineTo(x, waveAt(x));
      ctx.stroke();

      // God rays swinging down from the surface
      ctx.fillStyle = '#dff3ff';
      for (const r of s.rays) {
        const sway = Math.sin(t * 0.00028 + r.phase) * w * 0.02;
        ctx.globalAlpha = 0.05 + Math.abs(Math.sin(t * 0.00038 + r.phase)) * 0.05;
        ctx.beginPath();
        ctx.moveTo(r.x + sway, waterY);
        ctx.lineTo(r.x + sway + r.width, waterY);
        ctx.lineTo(r.x + sway + r.width * 2.4 + w * r.tilt, h * 0.9);
        ctx.lineTo(r.x + sway - r.width * 1.5 + w * r.tilt, h * 0.9);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Marine snow sinking through the column
      ctx.fillStyle = 'rgba(220, 235, 245, 0.5)';
      for (const p of s.snow) {
        p.y += p.v;
        p.x += Math.sin(t * 0.0004 + p.drift) * 0.12;
        if (p.y > h) { p.y = waterY + 4; p.x = Math.random() * w; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ribbon school snaking left to right
      const rb = s.ribbon;
      rb.x += rb.speed;
      const tailX = rb.x - rb.fish[rb.fish.length - 1].lag;
      if (tailX > w + 40) {
        rb.x = -rb.fish[rb.fish.length - 1].lag - 40;
        rb.y = h * (0.28 + Math.random() * 0.2);
        rb.phase = Math.random() * Math.PI * 2;
      }
      for (const f of rb.fish) {
        const fx = rb.x - f.lag;
        if (fx < -20 || fx > w + 20) continue;
        const fy = rb.y + Math.sin(fx * 0.02 + rb.phase + t * 0.001) * 18 + f.off;
        const fl = f.size;
        ctx.fillStyle = '#8fa8bd';
        ctx.beginPath();
        ctx.moveTo(fx - fl * 0.7, fy);
        ctx.lineTo(fx - fl * 1.05, fy - fl * 0.3);
        ctx.lineTo(fx - fl * 1.05, fy + fl * 0.3);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(fx, fy, fl * 0.75, fl * 0.26, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#dde7ee';
        ctx.beginPath();
        ctx.ellipse(fx, fy + fl * 0.08, fl * 0.6, fl * 0.13, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // The bait ball: drifts, tightens, and flares away from marlins
      const bb = s.bait;
      bb.x += bb.vx; bb.y += bb.vy;
      if (bb.x < w * 0.16 || bb.x > w * 0.62) bb.vx *= -1;
      if (bb.y < h * 0.36 || bb.y > h * 0.74) bb.vy *= -1;
      let threat = 0;
      for (const m of s.marlins) {
        const d = Math.hypot(m.x - bb.x, m.y - bb.y);
        if (d < 170) threat = Math.max(threat, 1 - d / 170);
      }
      bb.spook += (threat - bb.spook) * 0.04;
      const radMul = 1 + bb.spook * 1.1;
      for (const f of bb.fish) {
        f.ang += f.spd * (1 + bb.spook * 1.4);
        const fx = bb.x + Math.cos(f.ang) * f.rad * radMul;
        const fy = bb.y + Math.sin(f.ang) * f.rad * radMul * f.squash;
        const tang = f.ang + Math.PI / 2;
        const shimmer = 0.3 + 0.7 * Math.abs(Math.sin(f.ang + f.shim + t * 0.0012));
        ctx.strokeStyle = `rgba(206, 220, 232, ${shimmer})`;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(fx - Math.cos(tang) * f.size * 0.5, fy - Math.sin(tang) * f.size * 0.5 * f.squash);
        ctx.lineTo(fx + Math.cos(tang) * f.size * 0.5, fy + Math.sin(tang) * f.size * 0.5 * f.squash);
        ctx.stroke();
      }

      // Marlins: cruise the blue, then dart at the ball
      for (const m of s.marlins) {
        m.wob += 0.05;
        if (t > m.nextDart && m.dart <= 0) {
          m.dart = 95;
          m.nextDart = t + 9000 + Math.random() * 13000;
          m.dir = bb.x > m.x ? 1 : -1;
        }
        let spd = m.speed;
        if (m.dart > 0) {
          m.dart--;
          spd = m.speed + 2.6;
          m.y += (bb.y - m.y) * 0.02;
        } else {
          m.y += Math.sin(m.wob) * 0.3;
        }
        m.x += spd * m.dir;
        if (m.x > w + 90) { m.x = w + 90; m.dir = -1; }
        if (m.x < -90) { m.x = -90; m.dir = 1; }
        m.y = Math.max(waterY + 60, Math.min(h * 0.82, m.y));
        const ml = m.size;
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.scale(m.dir, 1);
        ctx.rotate(Math.sin(m.wob) * 0.03);
        g = ctx.createLinearGradient(0, -ml * 0.14, 0, ml * 0.14);
        g.addColorStop(0, '#1b4f72');
        g.addColorStop(0.55, '#5d87a8');
        g.addColorStop(1, '#d5dee6');
        ctx.strokeStyle = '#123f5c';                     // the bill
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(ml * 0.36, -ml * 0.01);
        ctx.lineTo(ml * 0.66, -ml * 0.045);
        ctx.stroke();
        ctx.fillStyle = g;                               // body
        ctx.beginPath();
        ctx.ellipse(0, 0, ml * 0.4, ml * 0.115, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1b4f72';                       // dorsal sail
        ctx.beginPath();
        ctx.moveTo(-ml * 0.08, -ml * 0.09);
        ctx.quadraticCurveTo(ml * 0.02, -ml * 0.3, ml * 0.2, -ml * 0.1);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();                                 // sickle tail
        ctx.moveTo(-ml * 0.38, 0);
        ctx.quadraticCurveTo(-ml * 0.56, -ml * 0.02, -ml * 0.6, -ml * 0.2);
        ctx.quadraticCurveTo(-ml * 0.48, -ml * 0.03, -ml * 0.44, 0);
        ctx.quadraticCurveTo(-ml * 0.48, ml * 0.03, -ml * 0.6, ml * 0.18);
        ctx.quadraticCurveTo(-ml * 0.56, ml * 0.02, -ml * 0.38, 0);
        ctx.fill();
        ctx.fillStyle = '#0e2f45';                       // eye
        ctx.beginPath();
        ctx.arc(ml * 0.28, -ml * 0.025, ml * 0.026, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Sharks patrolling, biggest in the deepest water
      for (const sh of s.sharks) {
        sh.sway += 0.028;
        sh.x += sh.speed * sh.dir;
        sh.y += Math.sin(sh.sway) * 0.18;
        if (sh.x > w + sh.size && sh.dir > 0) sh.dir = -1;
        if (sh.x < -sh.size && sh.dir < 0) sh.dir = 1;
        const sl = sh.size;
        ctx.save();
        ctx.translate(sh.x, sh.y);
        ctx.scale(sh.dir, 1);
        ctx.rotate(Math.sin(sh.sway) * 0.035);
        g = ctx.createLinearGradient(0, -sl * 0.16, 0, sl * 0.14);
        g.addColorStop(0, '#5d6d7e');
        g.addColorStop(0.62, '#8b9aa8');
        g.addColorStop(0.72, '#cfd8de');
        g.addColorStop(1, '#dbe2e7');
        ctx.fillStyle = g;
        ctx.beginPath();                                 // body + caudal fin
        ctx.moveTo(sl * 0.52, 0);
        ctx.quadraticCurveTo(sl * 0.2, -sl * 0.155, -sl * 0.2, -sl * 0.095);
        ctx.lineTo(-sl * 0.46, -sl * 0.02);
        ctx.lineTo(-sl * 0.63, -sl * 0.19);
        ctx.lineTo(-sl * 0.54, 0);
        ctx.lineTo(-sl * 0.62, sl * 0.11);
        ctx.lineTo(-sl * 0.44, sl * 0.025);
        ctx.quadraticCurveTo(sl * 0.12, sl * 0.135, sl * 0.52, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#5d6d7e';                       // dorsal fin
        ctx.beginPath();
        ctx.moveTo(-sl * 0.02, -sl * 0.12);
        ctx.quadraticCurveTo(sl * 0.03, -sl * 0.3, sl * 0.13, -sl * 0.125);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#6d7c8b';                       // pectoral fin
        ctx.beginPath();
        ctx.moveTo(sl * 0.12, sl * 0.05);
        ctx.lineTo(-sl * 0.04, sl * 0.2);
        ctx.lineTo(-sl * 0.06, sl * 0.07);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(52, 63, 74, 0.55)';      // gill slits
        ctx.lineWidth = 1.4;
        for (let gi = 0; gi < 4; gi++) {
          ctx.beginPath();
          ctx.moveTo(sl * (0.24 - gi * 0.028), -sl * 0.055);
          ctx.lineTo(sl * (0.235 - gi * 0.028), sl * 0.045);
          ctx.stroke();
        }
        ctx.fillStyle = '#1c2833';                       // eye
        ctx.beginPath();
        ctx.arc(sl * 0.4, -sl * 0.045, sl * 0.02, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Bubbles working their way back to the surface
      ctx.strokeStyle = 'rgba(220, 240, 250, 0.55)';
      ctx.lineWidth = 1;
      for (const b of s.bubbles) {
        b.y -= b.v;
        b.wob += 0.03;
        b.x += Math.sin(b.wob) * 0.25;
        if (b.y < waterY + 6) { b.y = h - 6; b.x = Math.random() * w; }
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    /* ============================================================
       Greenhouse — glass panes and mullions, sunbeams full of dust,
       a shelf of potted succulents, hanging string-of-pearls, one
       unhurried butterfly, and the occasional condensation drip.
       ============================================================ */
    function buildGreenhouse(canvas) {
      const w = canvas.width, h = canvas.height;
      const rnd = (a, b) => a + Math.random() * (b - a);
      const motes = [];
      for (let i = 0; i < 90; i++) {
        motes.push({ x: Math.random() * w, y: Math.random() * h,
                     s: rnd(0.5, 1.6), ph: rnd(0, 6.28), dr: rnd(-0.08, 0.08) });
      }

      /* Nine procedural plant kinds, cycled across three shelves so the
         glasshouse reads as genuinely stocked rather than sparsely staged. */
      const kinds = ['echeveria', 'cactus', 'jade', 'snake', 'aloe',
                      'fern', 'pilea', 'haworthia', 'burro'];

      /* Three shelves at different depths: back (furthest, smallest,
         faintest — atmospheric perspective through humid glass), mid,
         and front (closest, largest, full contrast — the original shelf
         position, kept so existing saves/layouts still feel familiar). */
      const shelfDefs = [
        { y: h * 0.40, sc: 0.68, alpha: 0.76, density: 175 },
        { y: h * 0.63, sc: 0.85, alpha: 0.9,  density: 138 },
        { y: h * 0.85, sc: 1.0,  alpha: 1.0,  density: 108 }
      ];

      const plants = [];
      let ki = 0;
      const shelves = shelfDefs.map((sh, si) => {
        const minN = si === 0 ? 5 : si === 1 ? 6 : 7;
        const maxN = si === 0 ? 8 : si === 1 ? 10 : 13;
        const n = Math.max(minN, Math.min(maxN, Math.floor(w / sh.density)));
        for (let i = 0; i < n; i++) {
          const kind = kinds[ki % kinds.length]; ki++;
          plants.push({
            kind,
            x: w * (0.05 + 0.9 * (n === 1 ? 0.5 : i / (n - 1))) + rnd(-9, 9),
            shelfY: sh.y,
            sc: sh.sc * rnd(0.82, 1.18),
            alpha: sh.alpha,
            hue: rnd(-12, 12),
            bloom: Math.random() < 0.4,
            sway: rnd(0, 6.28)
          });
        }
        return { y: sh.y, sc: sh.sc, alpha: sh.alpha, n };
      });

      /* Ceiling-hung string-of-pearls, spread wider now there's more to fill. */
      const vines = [];
      const vN = 5;
      for (let i = 0; i < vN; i++) {
        vines.push({ x: w * (0.06 + 0.88 * i / (vN - 1)) + rnd(-10, 10),
                     len: h * rnd(0.14, 0.3), ph: rnd(0, 6) });
      }

      return {
        motes, plants, shelves, vines,
        fly: { x: w * 0.3, y: h * 0.4, tx: w * 0.6, ty: h * 0.7, hold: 0 },
        drip: { at: 5000, x: 0, y: 0, active: false },
        epoch: null
      };
    }

    function drawGreenhouse(ctx, canvas, s, t) {
      const w = canvas.width, h = canvas.height;
      if (s.epoch === null) s.epoch = t;
      const local = t - s.epoch;

      /* light through glass */
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#f2f9ec');
      sky.addColorStop(0.55, '#ddefd6');
      sky.addColorStop(1, '#c2ddb8');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      const sun = ctx.createRadialGradient(w * 0.18, h * 0.1, 0, w * 0.18, h * 0.1, h * 0.5);
      sun.addColorStop(0, 'rgba(255, 250, 214, 0.75)');
      sun.addColorStop(1, 'rgba(255, 250, 214, 0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, w, h);

      /* drifting cloud shadows */
      ctx.fillStyle = 'rgba(70, 100, 70, 0.05)';
      for (let i = 0; i < 3; i++) {
        const cx = ((t * 0.008 * (1 + i * 0.4)) + i * w * 0.5) % (w + 400) - 200;
        ctx.beginPath();
        ctx.ellipse(cx, h * (0.2 + i * 0.25), 220, 70, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      /* glass mullions */
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.lineWidth = 5;
      for (let i = 1; i < 5; i++) {
        ctx.beginPath(); ctx.moveTo(w * i / 5, 0); ctx.lineTo(w * i / 5, h); ctx.stroke();
      }
      for (let i = 1; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(0, h * i / 4); ctx.lineTo(w, h * i / 4); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(140, 165, 140, 0.5)';
      ctx.lineWidth = 1.5;
      for (let i = 1; i < 5; i++) {
        ctx.beginPath(); ctx.moveTo(w * i / 5 + 3, 0); ctx.lineTo(w * i / 5 + 3, h); ctx.stroke();
      }
      for (let i = 1; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(0, h * i / 4 + 3); ctx.lineTo(w, h * i / 4 + 3); ctx.stroke();
      }

      /* sunbeams */
      for (let i = 0; i < 3; i++) {
        const bx = w * (0.12 + i * 0.3);
        const a = 0.06 + 0.03 * Math.sin(t / 3800 + i * 2);
        ctx.fillStyle = 'rgba(255, 250, 200, ' + a + ')';
        ctx.beginPath();
        ctx.moveTo(bx, -20);
        ctx.lineTo(bx + 70, -20);
        ctx.lineTo(bx + 240, h + 20);
        ctx.lineTo(bx + 110, h + 20);
        ctx.closePath(); ctx.fill();
      }

      /* dust motes */
      for (const m of s.motes) {
        const mx = (m.x + t * 0.012 * m.dr * 10 + w) % w;
        const my = (m.y - t * 0.006 * m.s + h) % h;
        const tw = 0.35 + 0.35 * Math.sin(t / 700 + m.ph);
        ctx.fillStyle = 'rgba(255, 252, 230, ' + tw + ')';
        ctx.beginPath(); ctx.arc(mx, my, m.s, 0, Math.PI * 2); ctx.fill();
      }

      /* hanging vines: string-of-pearls, swaying */
      for (const v of s.vines) {
        const sway = Math.sin(t / 2600 + v.ph) * 10;
        ctx.strokeStyle = '#5c7a52';
        ctx.lineWidth = 1.5;
        for (let strand = -1; strand <= 1; strand++) {
          const sx = v.x + strand * 7;
          const sl = v.len * (1 - Math.abs(strand) * 0.22);
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.quadraticCurveTo(sx + sway * 0.5, sl * 0.5, sx + sway, sl);
          ctx.stroke();
          ctx.fillStyle = '#74a57f';
          for (let k = 1; k <= 9; k++) {
            const f = k / 9;
            const bx2 = sx + sway * f * f;
            const by2 = sl * f;
            ctx.beginPath(); ctx.arc(bx2, by2, 2.6 - f * 0.6, 0, Math.PI * 2); ctx.fill();
          }
        }
      }

      /* the shelves — back to front, each a plank with support brackets */
      for (const shelf of s.shelves) {
        const shY = shelf.y, sc = shelf.sc;
        ctx.save();
        ctx.globalAlpha = shelf.alpha;
        ctx.fillStyle = '#8a6b4a';
        ctx.fillRect(0, shY, w, 13 * sc);
        ctx.fillStyle = '#a5825c';
        ctx.fillRect(0, shY, w, 3 * sc);
        ctx.fillStyle = '#6e5238';
        for (let i = 0; i < 5; i++) {
          const bx = w * (0.1 + i * 0.2);
          ctx.beginPath();
          ctx.moveTo(bx, shY + 13 * sc); ctx.lineTo(bx + 14 * sc, shY + 13 * sc);
          ctx.lineTo(bx, shY + 34 * sc);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }

      /* potted plants across all shelves */
      for (const p of s.plants) {
        const sc = p.sc, px = p.x, base = p.shelfY;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = '#b5714e';                     // terracotta pot
        ctx.beginPath();
        ctx.moveTo(px - 17 * sc, base - 26 * sc);
        ctx.lineTo(px + 17 * sc, base - 26 * sc);
        ctx.lineTo(px + 12 * sc, base);
        ctx.lineTo(px - 12 * sc, base);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#c98257';
        ctx.fillRect(px - 19 * sc, base - 30 * sc, 38 * sc, 6 * sc);
        const top = base - 30 * sc;
        if (p.kind === 'echeveria') {
          for (let ring = 0; ring < 2; ring++) {
            const nL = 7 - ring * 2, rr = (13 - ring * 5) * sc;
            for (let i = 0; i < nL; i++) {
              const a = i / nL * Math.PI * 2 + ring * 0.4;
              ctx.fillStyle = ring ? '#8fbf95' : '#74a57f';
              ctx.save();
              ctx.translate(px + Math.cos(a) * rr * 0.5, top - 4 * sc + Math.sin(a) * rr * 0.3);
              ctx.rotate(a);
              ctx.beginPath();
              ctx.ellipse(rr * 0.4, 0, rr * 0.55, rr * 0.26, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          }
          ctx.fillStyle = '#e8a0a8';                   // pink tips
          ctx.beginPath(); ctx.arc(px, top - 6 * sc, 3 * sc, 0, Math.PI * 2); ctx.fill();
        } else if (p.kind === 'cactus') {
          ctx.fillStyle = '#5f8f5f';
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px - 8 * sc, top - 42 * sc, 16 * sc, 44 * sc, 8 * sc);
          else ctx.rect(px - 8 * sc, top - 42 * sc, 16 * sc, 44 * sc);
          ctx.fill();
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px + 6 * sc, top - 30 * sc, 12 * sc, 8 * sc, 4 * sc);
          else ctx.rect(px + 6 * sc, top - 30 * sc, 12 * sc, 8 * sc);
          ctx.fill();
          ctx.fillRect(px + 12 * sc, top - 30 * sc, 6 * sc, 18 * sc);
          ctx.strokeStyle = 'rgba(240, 245, 230, 0.8)';
          ctx.lineWidth = 1;
          for (let i = 0; i < 8; i++) {
            const sy = top - 38 * sc + i * 5 * sc;
            ctx.beginPath();
            ctx.moveTo(px - 8 * sc + (i % 2) * 8 * sc, sy);
            ctx.lineTo(px - 11 * sc + (i % 2) * 8 * sc, sy - 3 * sc);
            ctx.stroke();
          }
          if (p.bloom) {
            ctx.fillStyle = '#e87a9a';
            ctx.beginPath(); ctx.arc(px, top - 44 * sc, 4.5 * sc, 0, Math.PI * 2); ctx.fill();
          }
        } else if (p.kind === 'jade') {
          ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 4 * sc; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, top - 18 * sc); ctx.stroke();
          ctx.fillStyle = '#5f8f5f';
          const cls = [[-10, -22], [8, -26], [-2, -34], [12, -14], [-14, -12]];
          for (const c of cls) {
            ctx.beginPath();
            ctx.arc(px + c[0] * sc, top + c[1] * sc, 7 * sc, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (p.kind === 'snake') {
          for (let i = -2; i <= 2; i++) {
            const bh = (34 - Math.abs(i) * 7) * sc;
            ctx.fillStyle = i % 2 ? '#4f7a4f' : '#6f9c5f';
            ctx.beginPath();
            ctx.moveTo(px + i * 6 * sc - 3 * sc, top);
            ctx.quadraticCurveTo(px + i * 8 * sc, top - bh, px + i * 6 * sc + 1 * sc, top - bh);
            ctx.quadraticCurveTo(px + i * 8 * sc + 3 * sc, top - bh * 0.5, px + i * 6 * sc + 3 * sc, top);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#d9c86a'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(px + i * 6 * sc - 2 * sc, top - 2);
            ctx.quadraticCurveTo(px + i * 8 * sc, top - bh * 0.9, px + i * 6 * sc + 1 * sc, top - bh + 2);
            ctx.stroke();
          }
        } else if (p.kind === 'aloe') {
          ctx.fillStyle = '#6f9c6f';
          for (let i = -2; i <= 2; i++) {
            ctx.save();
            ctx.translate(px, top);
            ctx.rotate(i * 0.32);
            ctx.beginPath();
            ctx.moveTo(-4 * sc, 0);
            ctx.quadraticCurveTo(-2 * sc, -30 * sc, 0, -36 * sc);
            ctx.quadraticCurveTo(2 * sc, -30 * sc, 4 * sc, 0);
            ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        } else if (p.kind === 'fern') {
          const swayF = Math.sin(t / 1800 + p.sway) * 0.08;
          ctx.strokeStyle = '#3f6e46'; ctx.lineWidth = 1.4 * sc; ctx.lineCap = 'round';
          for (let i = -3; i <= 3; i++) {
            const a = i * 0.24 + swayF;
            const len = (30 - Math.abs(i) * 3) * sc;
            const fx = px + Math.sin(a) * len, fy = top - Math.cos(a) * len;
            ctx.beginPath(); ctx.moveTo(px, top); ctx.quadraticCurveTo(px + Math.sin(a) * len * 0.55,
              top - Math.cos(a) * len * 0.55, fx, fy); ctx.stroke();
            for (let k = 1; k <= 5; k++) {
              const f = k / 6;
              const midx = px + Math.sin(a) * len * f, midy = top - Math.cos(a) * len * f;
              const perp = a + Math.PI / 2;
              ctx.strokeStyle = '#4f8a58'; ctx.lineWidth = 1 * sc;
              ctx.beginPath();
              ctx.moveTo(midx, midy);
              ctx.lineTo(midx + Math.cos(perp) * 5 * sc * (1 - f), midy + Math.sin(perp) * 5 * sc * (1 - f));
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(midx, midy);
              ctx.lineTo(midx - Math.cos(perp) * 5 * sc * (1 - f), midy - Math.sin(perp) * 5 * sc * (1 - f));
              ctx.stroke();
              ctx.strokeStyle = '#3f6e46'; ctx.lineWidth = 1.4 * sc;
            }
          }
        } else if (p.kind === 'pilea') {
          ctx.strokeStyle = '#5c7a52'; ctx.lineWidth = 1.2 * sc;
          const coins = [[-9, -20], [8, -24], [0, -30], [-13, -10], [12, -12], [1, -14]];
          for (const c of coins) {
            const cx2 = px + c[0] * sc, cy2 = top + c[1] * sc;
            ctx.beginPath(); ctx.moveTo(px, top + 2 * sc); ctx.lineTo(cx2, cy2 + 4 * sc); ctx.stroke();
            ctx.fillStyle = '#6fae72';
            ctx.beginPath(); ctx.arc(cx2, cy2, 6 * sc, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath(); ctx.arc(cx2 - 1.6 * sc, cy2 - 1.6 * sc, 2 * sc, 0, Math.PI * 2); ctx.fill();
          }
        } else if (p.kind === 'haworthia') {
          for (let i = 0; i < 10; i++) {
            const a = i / 10 * Math.PI * 2;
            const len = 14 * sc;
            ctx.save();
            ctx.translate(px + Math.cos(a) * 3 * sc, top - 2 * sc + Math.sin(a) * 3 * sc);
            ctx.rotate(a + Math.PI / 2);
            ctx.fillStyle = '#3f7a56';
            ctx.beginPath();
            ctx.moveTo(-3 * sc, 0);
            ctx.lineTo(3 * sc, 0);
            ctx.lineTo(0, -len);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(220, 240, 220, 0.6)'; ctx.lineWidth = 0.8;
            ctx.beginPath();
            for (let sIdx = 1; sIdx <= 3; sIdx++) {
              const sy2 = -len * sIdx / 4;
              ctx.moveTo(-2.4 * sc * (1 - sIdx / 4), sy2);
              ctx.lineTo(2.4 * sc * (1 - sIdx / 4), sy2);
            }
            ctx.stroke();
            ctx.restore();
          }
        } else {                                       // burro's tail — trailing over the pot lip
          const swayB = Math.sin(t / 2200 + p.sway) * 6;
          for (let strand = -1; strand <= 1; strand++) {
            const sx = px + strand * 8 * sc;
            const sl = (26 + Math.abs(strand) * 4) * sc;
            ctx.strokeStyle = '#6b9c72'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(sx, base - 24 * sc);
            ctx.quadraticCurveTo(sx + swayB * 0.4 * sc, base - 6 * sc, sx + swayB * sc, base + sl * 0.55);
            ctx.stroke();
            ctx.fillStyle = '#8fc08f';
            for (let k = 1; k <= 7; k++) {
              const f = k / 7;
              const bx3 = sx + swayB * sc * f * f;
              const by3 = base - 24 * sc + sl * f * 0.8;
              ctx.beginPath(); ctx.arc(bx3, by3, (2.4 - f * 0.8) * sc, 0, Math.PI * 2); ctx.fill();
            }
          }
          ctx.fillStyle = '#74a57f';                   // a small rosette at the crown
          ctx.beginPath(); ctx.arc(px, top + 2 * sc, 5 * sc, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }

      /* humidity wisps near the nearest shelf */
      const frontShY = s.shelves[s.shelves.length - 1].y;
      for (let i = 0; i < 7; i++) {
        const cyc = (t / 9000 + i / 7) % 1;
        const wy = frontShY - cyc * h * 0.24;
        const wx = w * (0.08 + i * 0.14) + 18 * Math.sin(t / 1600 + i);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + 0.09 * (1 - cyc) + ')';
        ctx.beginPath(); ctx.ellipse(wx, wy, 34, 12, 0, 0, Math.PI * 2); ctx.fill();
      }

      /* one unhurried butterfly, now visiting all three shelves */
      const f = s.fly;
      if (f.hold > 0) {
        f.hold -= 16;
      } else {
        const dx = f.tx - f.x, dy = f.ty - f.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 8) {
          f.hold = 2200 + Math.random() * 2200;
          const target = s.plants[Math.floor(Math.random() * s.plants.length)];
          f.tx = target.x + (Math.random() - 0.5) * 30;
          f.ty = target.shelfY - 46 * target.sc - Math.random() * 26;
        } else {
          f.x += dx / dist * 1.1;
          f.y += dy / dist * 1.1 + Math.sin(t / 180) * 0.8;
        }
      }
      const flap = Math.sin(t / (f.hold > 0 ? 260 : 110));
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.fillStyle = '#e2955c';
      ctx.strokeStyle = '#8a4f2a'; ctx.lineWidth = 1;
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.rotate(side * flap * 0.6);
        ctx.beginPath();
        ctx.ellipse(side * 7, -2, 8, 5.5, side * 0.5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = '#4a3a2a';
      ctx.beginPath(); ctx.ellipse(0, 0, 2, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      /* condensation drip down a mullion */
      const dp = s.drip;
      if (!dp.active && local > dp.at) {
        dp.active = true;
        dp.x = w * (1 + Math.floor(Math.random() * 4)) / 5 + 1.5;
        dp.y = -6;
      }
      if (dp.active) {
        dp.y += 3.4;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(dp.x, Math.max(0, dp.y - 46));
        ctx.lineTo(dp.x, dp.y);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath(); ctx.arc(dp.x, dp.y, 2.6, 0, Math.PI * 2); ctx.fill();
        if (dp.y > h + 10) {
          dp.active = false;
          dp.at = local + 7000 + Math.random() * 9000;
        }
      }
    }

    /* ============================================================
       Paper Cranes — a folded-paper world. Rotating paper sun,
       faceted mountain ranges in parallax, a chevron river with a
       paper boat, and origami cranes crossing at their own pace.
       Everything casts the little offset shadow of cut paper.
       ============================================================ */
    function buildOrigami(canvas) {
      const w = canvas.width, h = canvas.height;
      const rnd = (a, b) => a + Math.random() * (b - a);

      /* paper grain tile */
      const tile = document.createElement('canvas');
      tile.width = 140; tile.height = 140;
      const tc = tile.getContext('2d');
      tc.fillStyle = 'rgba(0, 0, 0, 0)';
      for (let i = 0; i < 240; i++) {
        tc.fillStyle = Math.random() < 0.5 ? 'rgba(120, 108, 88, 0.05)' : 'rgba(255, 255, 255, 0.5)';
        tc.fillRect(Math.random() * 140, Math.random() * 140, rnd(0.5, 1.6), rnd(0.5, 1.2));
      }

      function ridge(count, amp, base) {
        const pts = [];
        const span = w * 1.5;
        for (let i = 0; i <= count; i++) {
          pts.push([span * i / count, base - (i % 2 ? amp * rnd(0.55, 1) : amp * rnd(0, 0.25))]);
        }
        return { pts, span, base };
      }

      const cranes = [];
      const pal = ['#fdfaf3', '#e07a5f', '#5f7a8a', '#81b29a', '#e6b655', '#fdfaf3'];
      for (let i = 0; i < 6; i++) {
        cranes.push({
          x: Math.random() * w, y: h * rnd(0.08, 0.5),
          sc: rnd(0.55, 1.2), spd: rnd(0.35, 1),
          ph: rnd(0, 6.28), col: pal[i], dir: Math.random() < 0.8 ? 1 : -1
        });
      }
      cranes.sort((a, b) => a.sc - b.sc);      // small (far) drawn first

      return {
        tile,
        layers: [
          { r: ridge(9, h * 0.13, h * 0.68), col: '#b9c6cf', spd: 0.0022 },
          { r: ridge(7, h * 0.17, h * 0.78), col: '#81b29a', spd: 0.005 },
          { r: ridge(6, h * 0.2, h * 0.9), col: '#5c6378', spd: 0.009 }
        ],
        cranes,
        clouds: [ { x: w * 0.2, y: h * 0.12, s: 1 },
                  { x: w * 0.6, y: h * 0.22, s: 0.7 },
                  { x: w * 0.9, y: h * 0.08, s: 0.85 } ],
        boat: { x: -60 },
        leaf: { at: 4000, x: 0, born: 0, active: false },
        epoch: null
      };
    }

    function drawOrigami(ctx, canvas, s, t) {
      const w = canvas.width, h = canvas.height;
      if (s.epoch === null) s.epoch = t;
      const local = t - s.epoch;

      const shade = (fn) => {                 // cut-paper shadow, then the shape
        ctx.save();
        ctx.translate(3, 5);
        ctx.globalAlpha = 0.16;
        fn('#3a352b');
        ctx.restore();
        fn(null);
      };

      /* the sheet itself */
      ctx.fillStyle = '#f6f1e7';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = ctx.createPattern(s.tile, 'repeat');
      ctx.fillRect(0, 0, w, h);

      /* rotating paper sun */
      const scx = w * 0.8, scy = h * 0.16, rot = t / 22000;
      shade((over) => {
        ctx.fillStyle = over || '#f2cc8f';
        for (let i = 0; i < 12; i++) {
          const a = rot + i / 12 * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(scx + Math.cos(a - 0.09) * 44, scy + Math.sin(a - 0.09) * 44);
          ctx.lineTo(scx + Math.cos(a) * 70, scy + Math.sin(a) * 70);
          ctx.lineTo(scx + Math.cos(a + 0.09) * 44, scy + Math.sin(a + 0.09) * 44);
          ctx.closePath(); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(scx, scy, 42, 0, Math.PI * 2); ctx.fill();
        if (!over) {
          ctx.fillStyle = '#e0b168';
          ctx.beginPath(); ctx.arc(scx + 6, scy + 8, 34, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#f2cc8f';
          ctx.beginPath(); ctx.arc(scx + 2, scy + 3, 33, 0, Math.PI * 2); ctx.fill();
        }
      });

      /* paper clouds */
      for (const c of s.clouds) {
        const cx = (c.x + t * 0.006 * c.s) % (w + 240) - 120;
        shade((over) => {
          ctx.fillStyle = over || '#fdfbf5';
          ctx.beginPath();
          ctx.arc(cx, c.y, 26 * c.s, Math.PI * 0.5, Math.PI * 1.5);
          ctx.arc(cx + 26 * c.s, c.y - 14 * c.s, 22 * c.s, Math.PI, Math.PI * 1.9);
          ctx.arc(cx + 58 * c.s, c.y - 8 * c.s, 20 * c.s, Math.PI * 1.2, Math.PI * 2);
          ctx.arc(cx + 74 * c.s, c.y, 18 * c.s, Math.PI * 1.5, Math.PI * 0.5);
          ctx.closePath(); ctx.fill();
        });
      }

      /* faceted mountain layers */
      const darken = { '#b9c6cf': '#9dabb6', '#81b29a': '#68937e', '#5c6378': '#484e60' };
      for (const L of s.layers) {
        const off = (t * L.spd) % (L.r.span - w);
        ctx.save();
        ctx.translate(-off, 0);
        shade((over) => {
          ctx.fillStyle = over || L.col;
          ctx.beginPath();
          ctx.moveTo(L.r.pts[0][0], h + 10);
          for (const p of L.r.pts) ctx.lineTo(p[0], p[1]);
          ctx.lineTo(L.r.pts[L.r.pts.length - 1][0], h + 10);
          ctx.closePath(); ctx.fill();
          if (!over) {
            ctx.fillStyle = darken[L.col];
            for (let i = 1; i < L.r.pts.length - 1; i += 2) {
              const pk = L.r.pts[i], nx = L.r.pts[i + 1];
              ctx.beginPath();
              ctx.moveTo(pk[0], pk[1]);
              ctx.lineTo(nx[0], nx[1]);
              ctx.lineTo(pk[0] + (nx[0] - pk[0]) * 0.35, Math.max(pk[1], nx[1]) + 30);
              ctx.closePath(); ctx.fill();
            }
          }
        });
        ctx.restore();
      }

      /* chevron river */
      const ry = h * 0.9;
      const rCols = ['#7fc4c9', '#5aa8ae', '#3d8c92'];
      for (let band = 0; band < 3; band++) {
        const by = ry + band * (h - ry) / 3;
        const bh2 = (h - ry) / 3 + 2;
        const phase = (t * (0.014 + band * 0.006)) % 56;
        ctx.fillStyle = rCols[band];
        ctx.beginPath();
        ctx.moveTo(-60, by + bh2);
        for (let x = -60 - phase; x < w + 60; x += 56) {
          ctx.lineTo(x + 28, by - 5);
          ctx.lineTo(x + 56, by + 4);
        }
        ctx.lineTo(w + 60, by + bh2);
        ctx.closePath(); ctx.fill();
      }

      /* the paper boat */
      const bt = s.boat;
      bt.x += 0.22;
      if (bt.x > w + 80) bt.x = -80;
      const bob = Math.sin(t / 900) * 3;
      const tilt = Math.sin(t / 1300) * 0.05;
      ctx.save();
      ctx.translate(bt.x, ry + 6 + bob);
      ctx.rotate(tilt);
      shade((over) => {
        ctx.fillStyle = over || '#fdfbf5';
        ctx.beginPath();                       // hull
        ctx.moveTo(-30, 0); ctx.lineTo(30, 0);
        ctx.lineTo(18, 12); ctx.lineTo(-18, 12);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();                       // sail
        ctx.moveTo(-14, 0); ctx.lineTo(0, -20); ctx.lineTo(14, 0);
        ctx.closePath(); ctx.fill();
        if (!over) {
          ctx.fillStyle = '#e4ddca';
          ctx.beginPath();
          ctx.moveTo(0, -20); ctx.lineTo(14, 0); ctx.lineTo(0, 0);
          ctx.closePath(); ctx.fill();
        }
      });
      ctx.restore();

      /* origami cranes */
      for (const cr of s.cranes) {
        cr.x += cr.spd * cr.dir;
        if (cr.dir > 0 && cr.x > w + 60) cr.x = -60;
        if (cr.dir < 0 && cr.x < -60) cr.x = w + 60;
        const flap = Math.sin(t / 280 * (0.7 + cr.spd * 0.5) + cr.ph);
        const cy = cr.y + Math.sin(t / 1100 + cr.ph) * 8 - flap * 3;
        ctx.save();
        ctx.translate(cr.x, cy);
        ctx.scale(cr.sc * cr.dir, cr.sc);
        const body = (over) => {
          /* far wing */
          ctx.save();
          ctx.translate(0, -2);
          ctx.rotate(0.35 - flap * 0.55);
          ctx.fillStyle = over || shadeCol(cr.col);
          ctx.beginPath();
          ctx.moveTo(-5, 0); ctx.lineTo(6, 0); ctx.lineTo(-4, -26);
          ctx.closePath(); ctx.fill();
          ctx.restore();
          /* body */
          ctx.fillStyle = over || cr.col;
          ctx.beginPath();
          ctx.moveTo(-16, 0); ctx.lineTo(0, -6); ctx.lineTo(14, 0); ctx.lineTo(0, 7);
          ctx.closePath(); ctx.fill();
          ctx.beginPath();                     // tail
          ctx.moveTo(-16, 0); ctx.lineTo(-27, -9); ctx.lineTo(-13, -2);
          ctx.closePath(); ctx.fill();
          ctx.beginPath();                     // neck + head
          ctx.moveTo(14, 0); ctx.lineTo(25, -12); ctx.lineTo(15, -2);
          ctx.closePath(); ctx.fill();
          if (!over) {
            ctx.fillStyle = '#e6b655';
            ctx.beginPath();
            ctx.moveTo(25, -12); ctx.lineTo(30, -12.5); ctx.lineTo(25, -9.5);
            ctx.closePath(); ctx.fill();
          }
          /* near wing */
          ctx.save();
          ctx.translate(0, -2);
          ctx.rotate(-0.2 + flap * 0.6);
          ctx.fillStyle = over || cr.col;
          ctx.beginPath();
          ctx.moveTo(-5, 0); ctx.lineTo(7, 0); ctx.lineTo(0, -30);
          ctx.closePath(); ctx.fill();
          if (!over) {
            ctx.strokeStyle = 'rgba(80, 70, 55, 0.3)';
            ctx.lineWidth = 0.8;
            ctx.beginPath(); ctx.moveTo(1, -1); ctx.lineTo(0, -28); ctx.stroke();
          }
          ctx.restore();
        };
        ctx.save();
        ctx.translate(2.4, 4);
        ctx.globalAlpha = 0.14;
        body('#3a352b');
        ctx.restore();
        body(null);
        ctx.restore();
      }

      /* the occasional drifting leaf of paper */
      const lf = s.leaf;
      if (!lf.active && local > lf.at) {
        lf.active = true;
        lf.born = local;
        lf.x = w * (0.15 + Math.random() * 0.7);
      }
      if (lf.active) {
        const age = (local - lf.born) / 1000;
        const ly = age * 46;
        const lx = lf.x + Math.sin(age * 1.7) * 34;
        const rotL = Math.sin(age * 2.1) * 0.9;
        if (ly > h * 0.92) {
          lf.active = false;
          lf.at = local + 8000 + Math.random() * 9000;
        } else {
          ctx.save();
          ctx.translate(lx, ly);
          ctx.rotate(rotL);
          ctx.fillStyle = 'rgba(58, 53, 43, 0.14)';
          ctx.fillRect(-5 + 2, -5 + 3, 11, 11);
          ctx.fillStyle = '#e07a5f';
          ctx.fillRect(-5.5, -5.5, 11, 11);
          ctx.fillStyle = '#c4604a';
          ctx.beginPath();
          ctx.moveTo(-5.5, -5.5); ctx.lineTo(5.5, 5.5); ctx.lineTo(-5.5, 5.5);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }

      /* helper: darker face of a crane's colour */
      function shadeCol(c) {
        const map = { '#fdfaf3': '#ddd5c2', '#e07a5f': '#b85a42', '#5f7a8a': '#48606e',
                      '#81b29a': '#68937e', '#e6b655': '#c2953a' };
        return map[c] || '#b0a890';
      }
    }

    /* ============================================================
       Times Square Rain — a rainy night on the island of Broadway.
       Two building facades rake away toward a vanishing point, every
       one of them wearing a live billboard: scrolling zipper tickers,
       LED walls, chasing marquee bulbs, cycling video ads. Everything
       that emits light registers itself as an emitter, and the wet
       asphalt smears all of it back up at the camera in wobbling
       vertical columns — that reflection pass is what actually sells
       "rain" more than the raindrops do. On top: taxis running the
       avenue in true perspective, umbrellas bobbing along both
       sidewalks, steam off a manhole, and four depth-layers of rain.
       ============================================================ */

    function tsOffscreen(W, H) {
      const c = document.createElement('canvas');
      c.width = Math.max(2, Math.round(W));
      c.height = Math.max(2, Math.round(H));
      return c;
    }

    function tsRoundRect(ctx, x, y, w, h, r) {
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    /* Paint an offscreen billboard onto a trapezoid by slicing it into
       vertical strips — cheap true perspective, no matrix math, and the
       content renderer never has to know it's being foreshortened. */
    function tsDrawTrapezoid(ctx, img, xL, tL, bL, xR, tR, bR, strips) {
      const n = strips || 26;
      const sw = img.width / n;
      for (let i = 0; i < n; i++) {
        const u0 = i / n, u1 = (i + 1) / n;
        const dx0 = xL + (xR - xL) * u0;
        const dx1 = xL + (xR - xL) * u1;
        const t0 = tL + (tR - tL) * u0;
        const b0 = bL + (bR - bL) * u0;
        const dh = b0 - t0;
        if (dh <= 0) continue;
        ctx.drawImage(img, i * sw, 0, sw + 0.6, img.height,
                      dx0, t0, (dx1 - dx0) + 0.8, dh);
      }
    }

    /* ---- Billboard content renderers ----
       Each fills its own offscreen canvas in its own pixel space. They
       return a dominant colour so the street reflection knows what to
       smear. Text is deliberately about Conor's Friday game rather than
       real Broadway advertisers. */

    const TS_TICKER_LINES = [
      'BINGO NIGHT \u2605 FRIDAY 4:00 PM \u2605 BREAK ROOM ',
      'FIVE IN A ROW WINS \u2605 FREE SPACE IS FREE \u2605 ',
      'TONIGHT ONLY \u2605 DAUB RESPONSIBLY \u2605 GOOD LUCK \u2605 '
    ];

    function tsRenderTicker(c, t, b) {
      const x = c.getContext('2d'), W = c.width, H = c.height;
      x.fillStyle = '#07070a';
      x.fillRect(0, 0, W, H);
      const fs = Math.floor(H * 0.52);
      x.font = 'bold ' + fs + 'px "Courier New", monospace';
      x.textBaseline = 'middle';
      const line = TS_TICKER_LINES[b.seed % TS_TICKER_LINES.length];
      const tw = x.measureText(line).width || W;
      const off = (t * 0.06 * b.spd) % tw;
      x.fillStyle = '#ffb02e';
      x.shadowColor = '#ff9500';
      x.shadowBlur = fs * 0.5;
      for (let k = -1; k < Math.ceil(W / tw) + 1; k++) {
        x.fillText(line, k * tw - off, H * 0.5);
      }
      x.shadowBlur = 0;
      // the dot-matrix grille the zipper is actually made of
      x.fillStyle = 'rgba(0, 0, 0, 0.35)';
      for (let gy = 0; gy < H; gy += 3) x.fillRect(0, gy, W, 1);
      for (let gx = 0; gx < W; gx += 3) x.fillRect(gx, 0, 1, H);
      return '255, 176, 46';
    }

    function tsRenderLedWall(c, t, b) {
      const x = c.getContext('2d'), W = c.width, H = c.height;
      x.fillStyle = '#08070d';
      x.fillRect(0, 0, W, H);
      const cell = Math.max(4, Math.round(H / 14));
      const cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
      const hueBase = b.hue;
      for (let r = 0; r < rows; r++) {
        for (let cIdx = 0; cIdx < cols; cIdx++) {
          // a travelling wave plus a per-cell shimmer
          const wave = Math.sin((cIdx * 0.4) - (t * 0.003 * b.spd) + r * 0.25 + b.seed);
          const sh = Math.sin(t * 0.01 + cIdx * 7.3 + r * 3.1) * 0.15;
          const v = Math.max(0, wave * 0.5 + 0.5 + sh);
          const hue = (hueBase + wave * 40 + r * 3) % 360;
          x.fillStyle = 'hsl(' + hue + ', 95%, ' + (12 + v * 52) + '%)';
          x.fillRect(cIdx * cell, r * cell, cell - 1, cell - 1);
        }
      }
      return b.rgb;
    }

    function tsRenderMarquee(c, t, b) {
      const x = c.getContext('2d'), W = c.width, H = c.height;
      const g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#2a0b16');
      g.addColorStop(1, '#12040a');
      x.fillStyle = g;
      x.fillRect(0, 0, W, H);
      // inner panel
      x.fillStyle = 'rgba(255, 60, 110, 0.14)';
      x.fillRect(W * 0.1, H * 0.16, W * 0.8, H * 0.68);
      const fs = Math.floor(H * 0.3);
      x.font = 'bold ' + fs + 'px "Arial Black", Impact, sans-serif';
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      const pulse = 0.72 + 0.28 * Math.sin(t * 0.004 + b.seed);
      x.fillStyle = 'rgba(255, 235, 245, ' + pulse + ')';
      x.shadowColor = '#ff2d78';
      x.shadowBlur = fs * 0.8;
      x.fillText('BINGO', W * 0.5, H * 0.42);
      x.font = 'bold ' + Math.floor(fs * 0.42) + 'px Arial, sans-serif';
      x.fillText('TONIGHT', W * 0.5, H * 0.68);
      x.shadowBlur = 0;
      x.textAlign = 'left';
      // chasing bulbs around the border
      const step = Math.max(9, Math.round(H * 0.16));
      const per = [];
      for (let px = 0; px < W; px += step) per.push([px, 3]);
      for (let py = 3; py < H; py += step) per.push([W - 3, py]);
      for (let px = W; px > 0; px -= step) per.push([px, H - 3]);
      for (let py = H; py > 0; py -= step) per.push([3, py]);
      const phase = Math.floor(t * 0.008 * b.spd);
      per.forEach((p, i) => {
        const on = (i + phase) % 3 === 0;
        x.fillStyle = on ? '#fff3c4' : 'rgba(120, 90, 60, 0.5)';
        if (on) { x.shadowColor = '#ffcf5c'; x.shadowBlur = 8; }
        x.beginPath();
        x.arc(p[0], p[1], on ? 2.6 : 1.7, 0, Math.PI * 2);
        x.fill();
        x.shadowBlur = 0;
      });
      return '255, 90, 140';
    }

    function tsRenderVideoAd(c, t, b) {
      const x = c.getContext('2d'), W = c.width, H = c.height;
      const SCENE = 4600;
      const idx = Math.floor(t / SCENE + b.seed) % 3;
      const local = (t + b.seed * SCENE) % SCENE;
      x.fillStyle = '#050509';
      x.fillRect(0, 0, W, H);
      if (idx === 0) {                       // scrolling colour bands
        const bands = 7;
        for (let i = 0; i < bands; i++) {
          const yy = ((i / bands) * H + (t * 0.03 * b.spd) % H) % H;
          const hue = (b.hue + i * 26) % 360;
          x.fillStyle = 'hsl(' + hue + ', 90%, 52%)';
          x.fillRect(0, yy - H / bands * 0.5, W, H / bands * 0.62);
        }
      } else if (idx === 1) {                // concentric pulse rings
        const cx2 = W * 0.5, cy2 = H * 0.5;
        for (let i = 6; i >= 0; i--) {
          const rr = ((t * 0.05 * b.spd + i * 30) % 160) / 160;
          x.strokeStyle = 'hsla(' + ((b.hue + i * 18) % 360) + ', 95%, 60%, ' + (1 - rr) + ')';
          x.lineWidth = Math.max(2, H * 0.05);
          x.beginPath();
          x.ellipse(cx2, cy2, rr * W * 0.62, rr * H * 0.62, 0, 0, Math.PI * 2);
          x.stroke();
        }
      } else {                               // big sweeping chevrons
        x.save();
        x.translate(-(t * 0.05 * b.spd) % (W * 0.4), 0);
        for (let i = 0; i < 8; i++) {
          x.fillStyle = 'hsl(' + ((b.hue + i * 14) % 360) + ', 88%, ' + (34 + (i % 2) * 24) + '%)';
          x.beginPath();
          const bx = i * W * 0.2;
          x.moveTo(bx, 0); x.lineTo(bx + W * 0.1, 0);
          x.lineTo(bx + W * 0.2, H); x.lineTo(bx + W * 0.1, H);
          x.closePath(); x.fill();
        }
        x.restore();
      }
      // quick white wipe as one spot hands off to the next
      if (local < 260) {
        x.fillStyle = 'rgba(255, 255, 255, ' + (1 - local / 260) * 0.85 + ')';
        x.fillRect(0, 0, W, H);
      }
      // screen scanlines + a faint vignette
      x.fillStyle = 'rgba(0, 0, 0, 0.18)';
      for (let gy = 0; gy < H; gy += 3) x.fillRect(0, gy, W, 1);
      return b.rgb;
    }

    function tsRenderNeonScript(c, t, b) {
      const x = c.getContext('2d'), W = c.width, H = c.height;
      x.fillStyle = '#0a0710';
      x.fillRect(0, 0, W, H);
      const flick = (Math.sin(t * 0.05 + b.seed) > 0.93 && Math.sin(t * 0.31) > 0) ? 0.35 : 1;
      const glow = (0.75 + 0.25 * Math.sin(t * 0.003 + b.seed)) * flick;
      x.strokeStyle = 'rgba(' + b.rgb + ', ' + glow + ')';
      x.shadowColor = 'rgb(' + b.rgb + ')';
      x.shadowBlur = H * 0.3;
      x.lineWidth = Math.max(2.5, H * 0.075);
      x.lineCap = 'round';
      x.lineJoin = 'round';
      // a looping neon squiggle — reads as script lettering at this size
      x.beginPath();
      const segs = 60;
      for (let i = 0; i <= segs; i++) {
        const u = i / segs;
        const px = W * (0.08 + u * 0.84);
        const py = H * (0.5 + 0.3 * Math.sin(u * Math.PI * 3.2 + b.seed));
        if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.stroke();
      // the tube's hot white core
      x.strokeStyle = 'rgba(255, 255, 255, ' + (0.55 * glow) + ')';
      x.shadowBlur = H * 0.12;
      x.lineWidth = Math.max(1, H * 0.026);
      x.stroke();
      x.shadowBlur = 0;
      return b.rgb;
    }

    const TS_RENDERERS = {
      ticker: tsRenderTicker,
      led: tsRenderLedWall,
      marquee: tsRenderMarquee,
      video: tsRenderVideoAd,
      neon: tsRenderNeonScript
    };

    function buildTimesSquare(canvas) {
      const w = canvas.width, h = canvas.height;
      const rnd = (a, b) => a + Math.random() * (b - a);
      const streetY = h * 0.60;          // where facades meet asphalt
      const vpX = w * 0.5, vpY = h * 0.53;

      // Facades rake back toward the vanishing point. u=0 is nearest the
      // camera (tall, off the top of frame), u=1 is deepest.
      const left = { nearX: -w * 0.04, farX: w * 0.355, nearTop: -h * 0.24,
                     nearBot: h * 0.95, farTop: h * 0.145, farBot: streetY - 1, side: -1 };
      const right = { nearX: w * 1.04, farX: w * 0.645, nearTop: -h * 0.24,
                      nearBot: h * 0.95, farTop: h * 0.145, farBot: streetY - 1, side: 1 };

      const kinds = ['video', 'ticker', 'led', 'marquee', 'neon'];
      const palettes = [
        { hue: 350, rgb: '255, 60, 110' }, { hue: 200, rgb: '70, 190, 255' },
        { hue: 45,  rgb: '255, 200, 60' }, { hue: 280, rgb: '190, 110, 255' },
        { hue: 150, rgb: '80, 235, 170' }, { hue: 15,  rgb: '255, 120, 60' }
      ];

      let seedCount = 0;
      const mk = (face, ua, ub, va, vb, kind, pIdx, res) => {
        const p = palettes[pIdx % palettes.length];
        const b = {
          face, ua, ub, va, vb, kind,
          hue: p.hue, rgb: p.rgb,
          seed: seedCount++, spd: rnd(0.7, 1.5),
          canvas: tsOffscreen(res[0], res[1])
        };
        return b;
      };

      // Left facade stack — nearest board is the huge one, then they
      // shrink and multiply as the wall recedes.
      const boards = [
        mk(left, 0.02, 0.30, 0.10, 0.44, 'video',   0, [230, 150]),
        mk(left, 0.02, 0.30, 0.50, 0.60, 'ticker',  2, [300, 34]),
        mk(left, 0.33, 0.55, 0.14, 0.40, 'led',     1, [190, 130]),
        mk(left, 0.33, 0.55, 0.46, 0.66, 'neon',    3, [190, 80]),
        mk(left, 0.58, 0.76, 0.18, 0.46, 'marquee', 0, [150, 110]),
        mk(left, 0.79, 0.95, 0.20, 0.44, 'video',   4, [120, 90]),

        mk(right, 0.02, 0.28, 0.08, 0.40, 'led',     3, [230, 160]),
        mk(right, 0.02, 0.28, 0.46, 0.56, 'ticker',  5, [300, 34]),
        mk(right, 0.31, 0.52, 0.12, 0.34, 'video',   1, [190, 120]),
        mk(right, 0.31, 0.52, 0.40, 0.62, 'marquee', 0, [190, 130]),
        mk(right, 0.55, 0.74, 0.16, 0.42, 'neon',    4, [160, 90]),
        mk(right, 0.77, 0.94, 0.18, 0.46, 'led',     2, [120, 90])
      ];

      // Flat billboards on the buildings that close off the far end
      const farBoards = [
        { x: w * 0.365, y: h * 0.20, w: w * 0.12, h: h * 0.16, kind: 'video',
          hue: 200, rgb: '70, 190, 255', seed: 40, spd: 1.1, canvas: tsOffscreen(130, 100) },
        { x: w * 0.50, y: h * 0.17, w: w * 0.13, h: h * 0.20, kind: 'led',
          hue: 350, rgb: '255, 60, 110', seed: 41, spd: 0.9, canvas: tsOffscreen(140, 120) },
        { x: w * 0.365, y: h * 0.38, w: w * 0.265, h: h * 0.035, kind: 'ticker',
          hue: 45, rgb: '255, 200, 60', seed: 42, spd: 1.3, canvas: tsOffscreen(320, 30) },
        { x: w * 0.40, y: h * 0.43, w: w * 0.085, h: h * 0.10, kind: 'neon',
          hue: 150, rgb: '80, 235, 170', seed: 43, spd: 1.0, canvas: tsOffscreen(100, 70) },
        { x: w * 0.515, y: h * 0.43, w: w * 0.095, h: h * 0.10, kind: 'marquee',
          hue: 280, rgb: '190, 110, 255', seed: 44, spd: 1.2, canvas: tsOffscreen(110, 80) }
      ];

      // Unlit window grid on the upper facades, a few flickering awake
      const windows = [];
      for (let i = 0; i < 90; i++) {
        windows.push({
          u: Math.random(), v: rnd(0.02, 0.12),
          face: Math.random() < 0.5 ? left : right,
          lit: Math.random() < 0.42, ph: rnd(0, 6.28), warm: Math.random() < 0.7
        });
      }

      // Rain in four depth layers: far drizzle to near streaks
      const rainLayers = [];
      const layerCfg = [
        { n: 150, spd: 7,  len: 9,  a: 0.13, wob: 0.6 },
        { n: 110, spd: 11, len: 15, a: 0.2,  wob: 0.9 },
        { n: 70,  spd: 16, len: 26, a: 0.28, wob: 1.3 },
        { n: 34,  spd: 24, len: 42, a: 0.34, wob: 1.8 }
      ];
      for (const cfg of layerCfg) {
        const drops = [];
        for (let i = 0; i < cfg.n; i++) {
          drops.push({ x: Math.random() * (w + 200) - 100, y: Math.random() * h,
                       s: rnd(0.75, 1.25) });
        }
        rainLayers.push({ cfg, drops });
      }

      const taxis = [];
      for (let i = 0; i < 5; i++) {
        taxis.push({
          d: Math.random(),                       // 0 = at the vanishing point
          lane: i % 2 === 0 ? -1 : 1,             // -1 approaches, +1 recedes
          laneOff: (i % 2 === 0 ? -1 : 1) * rnd(0.1, 0.22),
          spd: rnd(0.00019, 0.00034),
          kind: Math.random() < 0.72 ? 'taxi' : 'car',
          hue: rnd(0, 360)
        });
      }

      const walkers = [];
      for (let i = 0; i < 16; i++) {
        walkers.push({
          d: Math.random(), side: i % 2 === 0 ? -1 : 1,
          off: rnd(0.22, 0.38),
          spd: rnd(0.00011, 0.00023) * (Math.random() < 0.5 ? -1 : 1),
          umb: ['#c9303e', '#1f4d8f', '#2b2b33', '#3f7d4f', '#7a3f8f', '#c8a03a'][i % 6],
          coat: ['#1c1c22', '#2a2530', '#14202e', '#2e2018'][i % 4],
          bob: rnd(0, 6.28), hasUmb: Math.random() < 0.82
        });
      }

      const puddles = [];
      for (let i = 0; i < 7; i++) {
        puddles.push({
          d: rnd(0.25, 1), off: rnd(-0.45, 0.45),
          rx: rnd(0.05, 0.13), rings: [],
          nextRing: rnd(0, 900)
        });
      }

      const splashes = [];

      return {
        w, h, streetY, vpX, vpY, left, right,
        boards, farBoards, windows, rainLayers, taxis, walkers, puddles, splashes,
        emitters: [],
        steam: Array.from({ length: 14 }, () => ({
          p: Math.random(), sway: rnd(0, 6.28), sc: rnd(0.7, 1.4)
        })),
        light: { phase: 0, timer: 0 },
        epoch: null
      };
    }

    /* Position along a facade: u runs near->far, v runs top->bottom. */
    function tsFacadePt(f, u, v) {
      const x = f.nearX + (f.farX - f.nearX) * u;
      const top = f.nearTop + (f.farTop - f.nearTop) * u;
      const bot = f.nearBot + (f.farBot - f.nearBot) * u;
      return { x, y: top + (bot - top) * v, top, bot };
    }

    /* Road perspective: d=0 at the vanishing point, d=1 at the camera. */
    function tsRoad(s, d, off) {
      const p = Math.pow(d, 1.7);
      const y = s.vpY + (s.h * 1.02 - s.vpY) * p;
      const spread = 0.04 + p * 1.5;
      return { x: s.vpX + off * s.w * spread, y, sc: 0.06 + p * 1.25 };
    }

    function drawTimesSquare(ctx, canvas, s, t) {
      const w = canvas.width, h = canvas.height;
      const { streetY, vpX, vpY } = s;
      if (s.epoch === null) s.epoch = t;
      s.emitters.length = 0;
      const emit = (x, y, wd, rgb, a) => s.emitters.push({ x, y, w: wd, rgb, a });

      /* ---------- sky: low cloud lit orange from beneath by the signs ---------- */
      const sky = ctx.createLinearGradient(0, 0, 0, streetY);
      sky.addColorStop(0, '#0a0a14');
      sky.addColorStop(0.55, '#191428');
      sky.addColorStop(0.86, '#3a2440');
      sky.addColorStop(1, '#5c3348');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, streetY);
      // the sodium-orange glow bouncing off the overcast
      const glow = ctx.createRadialGradient(vpX, streetY, 0, vpX, streetY, h * 0.7);
      glow.addColorStop(0, 'rgba(255, 150, 90, 0.34)');
      glow.addColorStop(0.45, 'rgba(200, 90, 120, 0.14)');
      glow.addColorStop(1, 'rgba(120, 60, 140, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, streetY);
      // torn cloud bellies drifting
      for (let i = 0; i < 5; i++) {
        const cy2 = h * (0.04 + i * 0.045);
        const cx2 = ((t * 0.004 * (0.5 + i * 0.2)) + i * w * 0.4) % (w + 500) - 250;
        ctx.fillStyle = 'rgba(70, 48, 78, ' + (0.3 - i * 0.04) + ')';
        ctx.beginPath();
        ctx.ellipse(cx2, cy2, w * 0.3, h * 0.035, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      /* ---------- far buildings closing off the avenue ---------- */
      ctx.fillStyle = '#100d1c';
      const farTops = [0.155, 0.115, 0.175, 0.135, 0.165];
      for (let i = 0; i < 5; i++) {
        const bx = w * (0.355 + i * 0.058);
        ctx.fillRect(bx, h * farTops[i], w * 0.06, streetY - h * farTops[i]);
      }
      ctx.fillStyle = '#161228';
      ctx.fillRect(w * 0.355, h * 0.19, w * 0.29, streetY - h * 0.19);

      /* ---------- facade masonry ---------- */
      for (const f of [s.left, s.right]) {
        const a = tsFacadePt(f, 0, 0), b2 = tsFacadePt(f, 1, 0);
        ctx.fillStyle = '#0d0b16';
        ctx.beginPath();
        ctx.moveTo(a.x, a.top); ctx.lineTo(b2.x, b2.top);
        ctx.lineTo(b2.x, b2.bot); ctx.lineTo(a.x, a.bot);
        ctx.closePath();
        ctx.fill();
        // a rim of bounced light down the leading edge
        const edge = ctx.createLinearGradient(a.x, 0, b2.x, 0);
        edge.addColorStop(0, 'rgba(120, 80, 130, 0.16)');
        edge.addColorStop(1, 'rgba(120, 80, 130, 0)');
        ctx.fillStyle = edge;
        ctx.fill();
      }

      /* ---------- apartment windows above the signage ---------- */
      for (const win of s.windows) {
        const p = tsFacadePt(win.face, win.u, win.v);
        const depth = 1 - win.u;
        const ww = Math.max(1.5, 7 * (0.35 + depth * 0.8));
        const hh = ww * 1.4;
        let on = win.lit;
        if (Math.sin(t * 0.0004 + win.ph * 9) > 0.985) on = !on;
        if (on) {
          ctx.fillStyle = win.warm ? 'rgba(255, 208, 140, 0.75)' : 'rgba(180, 214, 255, 0.6)';
        } else {
          ctx.fillStyle = 'rgba(28, 26, 44, 0.9)';
        }
        ctx.fillRect(p.x - ww / 2, p.y, ww, hh);
      }

      /* ---------- rooftop water tower, because it's New York ---------- */
      {
        const p = tsFacadePt(s.left, 0.46, 0);
        const sc = 0.55;
        const bx = p.x, by = p.top;
        ctx.fillStyle = '#0b0912';
        ctx.beginPath();                       // legs
        ctx.fillRect(bx - 16 * sc, by - 14 * sc, 4 * sc, 16 * sc);
        ctx.fillRect(bx + 12 * sc, by - 14 * sc, 4 * sc, 16 * sc);
        ctx.beginPath();                       // tank
        ctx.moveTo(bx - 20 * sc, by - 14 * sc);
        ctx.lineTo(bx + 20 * sc, by - 14 * sc);
        ctx.lineTo(bx + 17 * sc, by - 52 * sc);
        ctx.lineTo(bx - 17 * sc, by - 52 * sc);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();                       // conical cap
        ctx.moveTo(bx - 21 * sc, by - 52 * sc);
        ctx.lineTo(bx + 21 * sc, by - 52 * sc);
        ctx.lineTo(bx, by - 68 * sc);
        ctx.closePath(); ctx.fill();
        // aircraft warning light
        const bl = Math.sin(t * 0.004) > 0.4 ? 1 : 0.1;
        ctx.fillStyle = 'rgba(255, 60, 60, ' + bl + ')';
        ctx.beginPath();
        ctx.arc(bx, by - 70 * sc, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }

      /* ---------- the billboards ---------- */
      for (const b of s.boards) {
        const rgb = TS_RENDERERS[b.kind](b.canvas, t, b);
        const L1 = tsFacadePt(b.face, b.ua, b.va), L2 = tsFacadePt(b.face, b.ua, b.vb);
        const R1 = tsFacadePt(b.face, b.ub, b.va), R2 = tsFacadePt(b.face, b.ub, b.vb);
        tsDrawTrapezoid(ctx, b.canvas, L1.x, L1.y, L2.y, R1.x, R1.y, R2.y);
        // a soft bloom halo so the sign bleeds into the wet air
        const mx = (L1.x + R1.x) / 2, my = (L1.y + L2.y) / 2;
        const bw = Math.abs(R1.x - L1.x), bh = Math.abs(L2.y - L1.y);
        const hg = ctx.createRadialGradient(mx, my, 0, mx, my, Math.max(bw, bh) * 0.95);
        hg.addColorStop(0, 'rgba(' + rgb + ', 0.2)');
        hg.addColorStop(1, 'rgba(' + rgb + ', 0)');
        ctx.fillStyle = hg;
        ctx.fillRect(mx - bw, my - bh, bw * 2, bh * 2.4);
        emit(mx, L2.y, bw, rgb, 0.5);
      }

      for (const b of s.farBoards) {
        const rgb = TS_RENDERERS[b.kind](b.canvas, t, b);
        ctx.drawImage(b.canvas, b.x, b.y, b.w, b.h);
        const hg = ctx.createRadialGradient(b.x + b.w / 2, b.y + b.h / 2, 0,
                                            b.x + b.w / 2, b.y + b.h / 2, Math.max(b.w, b.h));
        hg.addColorStop(0, 'rgba(' + rgb + ', 0.16)');
        hg.addColorStop(1, 'rgba(' + rgb + ', 0)');
        ctx.fillStyle = hg;
        ctx.fillRect(b.x - b.w * 0.5, b.y - b.h * 0.5, b.w * 2, b.h * 2);
        emit(b.x + b.w / 2, b.y + b.h, b.w, rgb, 0.34);
      }

      /* ---------- traffic signal on the near corner ---------- */
      s.light.timer += 16;
      if (s.light.timer > (s.light.phase === 1 ? 1500 : 5200)) {
        s.light.timer = 0;
        s.light.phase = (s.light.phase + 1) % 3;
      }
      {
        const lx = w * 0.19, ly = streetY - h * 0.115;
        ctx.fillStyle = '#0a0a0e';
        ctx.fillRect(lx - 1.5, ly, 3, h * 0.115);
        tsRoundRect(ctx, lx - 9, ly - 34, 18, 36, 3);
        ctx.fill();
        const cols = ['#ff3b30', '#ffcc00', '#34c759'];
        for (let i = 0; i < 3; i++) {
          const on = s.light.phase === i;
          ctx.fillStyle = on ? cols[i] : 'rgba(40, 40, 48, 0.9)';
          if (on) { ctx.shadowColor = cols[i]; ctx.shadowBlur = 14; }
          ctx.beginPath();
          ctx.arc(lx, ly - 27 + i * 11, 3.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        const lit = ['255, 59, 48', '255, 204, 0', '52, 199, 89'][s.light.phase];
        emit(lx, streetY, 26, lit, 0.42);
      }

      /* ---------- street lamps ---------- */
      for (let i = 0; i < 4; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        const d = 0.30 + Math.floor(i / 2) * 0.34;
        const p = tsRoad(s, d, side * 0.52);
        const lh = h * 0.2 * p.sc * 1.6;
        ctx.strokeStyle = '#0c0c12';
        ctx.lineWidth = Math.max(1, 3 * p.sc);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x, p.y - lh);
        ctx.quadraticCurveTo(p.x, p.y - lh - 10 * p.sc, p.x - side * 14 * p.sc, p.y - lh - 10 * p.sc);
        ctx.stroke();
        const hx = p.x - side * 14 * p.sc, hy = p.y - lh - 8 * p.sc;
        const lg = ctx.createRadialGradient(hx, hy, 0, hx, hy, 46 * p.sc);
        lg.addColorStop(0, 'rgba(255, 214, 150, 0.55)');
        lg.addColorStop(1, 'rgba(255, 214, 150, 0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.arc(hx, hy, 46 * p.sc, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 236, 190, 0.95)';
        ctx.beginPath();
        ctx.ellipse(hx, hy, 4 * p.sc, 2.4 * p.sc, 0, 0, Math.PI * 2);
        ctx.fill();
        emit(hx, p.y, 30 * p.sc, '255, 214, 150', 0.3);
      }

      /* ---------- wet asphalt ---------- */
      const road = ctx.createLinearGradient(0, streetY, 0, h);
      road.addColorStop(0, '#141220');
      road.addColorStop(0.35, '#0d0c15');
      road.addColorStop(1, '#08080e');
      ctx.fillStyle = road;
      ctx.fillRect(0, streetY, w, h - streetY);

      // sidewalks angling out from the vanishing point
      ctx.fillStyle = '#16141f';
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(vpX + side * w * 0.02, vpY);
        ctx.lineTo(vpX + side * w * 0.9, h);
        ctx.lineTo(vpX + side * w * 1.6, h);
        ctx.lineTo(vpX + side * w * 0.05, vpY);
        ctx.closePath();
        ctx.fill();
      }

      // lane dashes running to the vanishing point
      ctx.fillStyle = 'rgba(210, 200, 170, 0.16)';
      for (let i = 0; i < 9; i++) {
        const d0 = (i / 9 + ((t * 0.00006) % (1 / 9)));
        const a = tsRoad(s, d0, 0), b3 = tsRoad(s, Math.min(1, d0 + 0.045), 0);
        const wd = Math.max(1, 3 * a.sc);
        ctx.beginPath();
        ctx.moveTo(a.x - wd, a.y); ctx.lineTo(a.x + wd, a.y);
        ctx.lineTo(b3.x + wd * 1.6, b3.y); ctx.lineTo(b3.x - wd * 1.6, b3.y);
        ctx.closePath();
        ctx.fill();
      }

      // crosswalk bars near the camera
      ctx.fillStyle = 'rgba(220, 214, 190, 0.13)';
      for (let i = -5; i <= 5; i++) {
        const a = tsRoad(s, 0.62, i * 0.09), b4 = tsRoad(s, 0.72, i * 0.09);
        ctx.beginPath();
        ctx.moveTo(a.x - 4 * a.sc, a.y); ctx.lineTo(a.x + 4 * a.sc, a.y);
        ctx.lineTo(b4.x + 4 * b4.sc, b4.y); ctx.lineTo(b4.x - 4 * b4.sc, b4.y);
        ctx.closePath();
        ctx.fill();
      }

      /* ---------- the reflection pass: every emitter smeared downward ----------
         Drawn as stacked horizontal bands whose x wanders with time, which
         is what makes the asphalt read as rippling wet rather than glossy. */
      ctx.save();
