        cells: state
      };
    }

    function applyCardData(data) {
      if (!data || !Array.isArray(data.cells)) return false;
      
      if (data.dabber) {
        changeDabber(data.dabber);
        document.getElementById('dabberSelect').value = data.dabber;
      }

      if (data.dabberColor) {
        changeDabberColor(data.dabberColor);
        document.getElementById('dabberColorPicker').value = data.dabberColor;
      }

      // Older .bingo files predate the target color; fall back to the classic pink
      const targetColor = data.targetColor || localStorage.getItem('bingoTargetColor') || '#ff007f';
      changeTargetColor(targetColor);
      document.getElementById('targetColorPicker').value = targetColor;

      // Older .bingo files predate these — fall back to stored prefs, then defaults
      changeDabberOpacity(data.dabberOpacity !== undefined
        ? data.dabberOpacity : (localStorage.getItem('bingoDabberOpacity') || 55));
      changeDabberSize(data.dabberSize !== undefined
        ? data.dabberSize : (localStorage.getItem('bingoDabberSize') || 100));

      if (data.theme !== undefined) {
        applyTheme(data.theme);
      } else {
        applyTheme(DEFAULT_THEME);
      }

      renderGrid(data.cells);
      saveToLocalStorage();
      return true;
    }

    function saveToLocalStorage() {
      localStorage.setItem('bingoCardAutoSave', JSON.stringify(getCardData()));
    }

    function loadFromLocalStorage() {
      // Brightness is a per-screen viewing preference, not part of a card,
      // so it restores independently of any auto-save or imported file.
      changeBrightness(localStorage.getItem('bingoBrightness') || 100);

      // A full auto-save carries theme, dabber, color, and cells — apply once.
      const saved = localStorage.getItem('bingoCardAutoSave');
      if (saved) {
        try {
          if (applyCardData(JSON.parse(saved))) return;
        } catch (e) {
          console.error("Failed to load auto-save state", e);
        }
      }

      // Fallback: no valid auto-save, apply individually saved settings.
      const savedTheme = localStorage.getItem('bingoTheme');
      applyTheme(savedTheme !== null ? savedTheme : DEFAULT_THEME);

      const savedDabber = localStorage.getItem('bingoDabberStyle');
      if (savedDabber) {
        changeDabber(savedDabber);
        document.getElementById('dabberSelect').value = savedDabber;
      } else {
        changeDabber('stamp');
      }

      const savedColor = localStorage.getItem('bingoDabberColor');
      if (savedColor) {
        changeDabberColor(savedColor);
        document.getElementById('dabberColorPicker').value = savedColor;
      }

      const savedTargetColor = localStorage.getItem('bingoTargetColor');
      if (savedTargetColor) {
        changeTargetColor(savedTargetColor);
        document.getElementById('targetColorPicker').value = savedTargetColor;
      }

      changeDabberOpacity(localStorage.getItem('bingoDabberOpacity') || 55);
      changeDabberSize(localStorage.getItem('bingoDabberSize') || 100);
    }

    async function exportToFile() {
      if (isEditingCard) toggleEditCard();

      const cardData = getCardData();
      const jsonString = JSON.stringify(cardData, null, 2);
      const defaultFilename = `bingo-layout-${new Date().toISOString().slice(0, 10)}.bingo`;

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: defaultFilename,
            types: [{
              description: 'Bingo Layout File',
              accept: { 'application/json': ['.bingo', '.json'] },
            }],
          });
          const writable = await handle.createWritable();
          await writable.write(jsonString);
          await writable.close();
          showStatus('Layout saved successfully!');
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const blob = new Blob([jsonString], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = defaultFilename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);

      showStatus(`Saved: ${defaultFilename}`);
    }

    function importFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (applyCardData(data)) {
            showStatus(`Loaded "${file.name}"!`);
          } else {
            showStatus('Error: Invalid file format.');
          }
        } catch (err) {
          showStatus('Error reading file.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function clearDabs() {
      if (isEditingCard) toggleEditCard();

      // Clear all dabber marks between rounds, but keep the card layout
      // and any target pattern. FREE space stays dabbed.
      document.querySelectorAll('#bingoGrid .cell').forEach(cell => {
        cell.classList.toggle('marked', cell.classList.contains('free'));
      });

      saveToLocalStorage();
      showStatus('Dabs cleared — card kept!');
    }

    function resetCard() {
      if (isEditingCard) toggleEditCard();

      renderGrid(PRESET_LAYOUTS.CONOR);
      document.getElementById('layoutSelect').value = 'CONOR';
      saveToLocalStorage();
      showStatus('Reset to the default layout.');
    }

    function showStatus(msg) {
      const el = document.getElementById('statusMsg');
      el.innerText = msg;
      setTimeout(() => { el.innerText = ''; }, 3000);
    }

    function triggerVictory(manualClick = false) {
      const overlay = document.getElementById('victoryOverlay');
      if (overlay.classList.contains('show')) return; // already celebrating

      const targets = document.querySelectorAll('.cell.target');
      const descEl = document.getElementById('victoryDesc');

      if (targets.length === 0) {
        descEl.innerText = "Bonus Victory Unlocked!";
      } else {
        const markedCount = Array.from(targets).filter(cell => cell.classList.contains('marked')).length;
        if (markedCount === targets.length) {
          descEl.innerText = "Target pattern completed!";
        } else if (manualClick) {
          descEl.innerText = `Victory claimed! (${markedCount}/${targets.length} target spots marked)`;
        } else {
          return;
        }
      }

      overlay.classList.add('show');
      startConfetti();
    }

    // Quality of life: close the victory overlay with Escape or by
    // clicking anywhere outside the winner card.
    document.getElementById('victoryOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'victoryOverlay') closeVictory();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeVictory();
    });

    function closeVictory() {
      document.getElementById('victoryOverlay').classList.remove('show');
      stopConfetti();
    }

    let confettiAnimationId = null;
    let particles = [];

    function startConfetti() {
      stopConfetti(); // guard: never stack a second render loop
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#ff007f', '#00f0ff', '#facc15', '#10b981', '#a855f7'];
      particles = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: Math.random() * 3 + 2,
        speedX: Math.random() * 2 - 1,
        angle: Math.random() * 360
      }));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.angle += 2;
          if (p.y > canvas.height) p.y = -10;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.angle * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        confettiAnimationId = requestAnimationFrame(render);
      }
      render();
    }

    function stopConfetti() {
      if (confettiAnimationId) {
        cancelAnimationFrame(confettiAnimationId);
        confettiAnimationId = null;
      }
    }

    /* ---- Unified falling-petal engine ----
       One particle system drives both the Sakura and Vaporwave petals;
       each theme supplies its own petal factory (movement + draw style). */

    function makeSakuraPetal(w, h) {
      const colors = ['#ffb7c5', '#ff9ebb', '#ffe4e1', '#f3a4b5', '#ffd1dc'];
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 7 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: Math.random() * 1.5 + 0.8,
        speedX: Math.random() * 0.8 + 0.2,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 1.5,
        oscillation: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y += this.speedY;
          this.oscillation += 0.02;
          this.x += this.speedX + Math.sin(this.oscillation) * 0.7;
          this.angle += this.spin;
          if (this.y > h + 20) { this.y = -20; this.x = Math.random() * w; }
          if (this.x > w + 20) { this.x = -20; }
        },

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.angle * Math.PI) / 180);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = 0.8;
          ctx.beginPath();
          ctx.moveTo(0, -this.size);
          ctx.bezierCurveTo(this.size / 2, -this.size, this.size, -this.size / 3, this.size / 2, this.size);
          ctx.bezierCurveTo(0, this.size / 2, -this.size / 2, this.size / 2, -this.size / 2, this.size);
          ctx.bezierCurveTo(-this.size, -this.size / 3, -this.size / 2, -this.size, 0, -this.size);
          ctx.fill();
          ctx.restore();
        }
      };
    }

    function makeVaporPetal(w, h) {
      return {
        x: Math.random() * w,
        y: Math.random() * h - h,
        size: Math.random() * 0.4 + 0.2,
        speedY: Math.random() * 1.5 + 1,
        speedX: Math.random() * 2 - 1,
        rotation: Math.random() * 360,
        rotationSpeed: Math.random() * 2 - 1,
        sway: Math.random() * 0.02,
        angle: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y += this.speedY;
          this.angle += this.sway;
          this.x += this.speedX + Math.sin(this.angle) * 1.5;
          this.rotation += this.rotationSpeed;
          if (this.y > h + 20 || this.x > w + 20 || this.x < -20) {
            this.y = -20;
            this.x = Math.random() * w;
          }
        },

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.scale(this.size, this.size);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-10, -10, -14, -28, 0, -32);
          ctx.bezierCurveTo(14, -28, 10, -10, 0, 0);
          const grad = ctx.createLinearGradient(0, -32, 0, 0);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(1, '#ffc3cf'); /* lightened from #ff9eb0 */
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.restore();
        }
      };
    }

    /* Shared path helpers for the themed particles */
    function traceHeart(ctx, w, h) {
      const x = -w / 2, y = -h / 2;
      ctx.moveTo(x, y + h / 4);
      ctx.quadraticCurveTo(x, y, x + w / 4, y);
      ctx.quadraticCurveTo(x + w / 2, y, x + w / 2, y + h / 4);
      ctx.quadraticCurveTo(x + w / 2, y, x + (3 * w) / 4, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + h / 4);
      ctx.quadraticCurveTo(x + w, y + h / 2, x + (3 * w) / 4, y + (3 * h) / 4);
      ctx.lineTo(x + w / 2, y + h);
      ctx.lineTo(x + w / 4, y + (3 * h) / 4);
      ctx.quadraticCurveTo(x, y + h / 2, x, y + h / 4);
    }

    function traceSpark(ctx, r) {
      const k = r * 0.3;
      ctx.moveTo(0, -r);
      ctx.lineTo(k, -k);
      ctx.lineTo(r, 0);
      ctx.lineTo(k, k);
      ctx.lineTo(0, r);
      ctx.lineTo(-k, k);
      ctx.lineTo(-r, 0);
      ctx.lineTo(-k, -k);
      ctx.closePath();
    }

    /* Pink Girly: rising kawaii hearts + twinkling sparkles */
    function makeHeartSpark(w, h) {
      const isSpark = Math.random() < 0.3;
      const heartColors = ['#ff8fc7', '#ff5fa2', '#ffc2dd', '#ffffff', '#e0218a', '#ffb3f2'];
      return {
        kind: isSpark ? 'spark' : 'heart',
        x: Math.random() * w,
        y: Math.random() * h,
        size: isSpark ? Math.random() * 4 + 3 : Math.random() * 11 + 7,
        color: isSpark ? (Math.random() < 0.5 ? '#ffffff' : '#ffe066') : heartColors[Math.floor(Math.random() * heartColors.length)],
        speedY: isSpark ? Math.random() * 0.25 + 0.05 : Math.random() * 0.9 + 0.4,
        drift: Math.random() * 0.6 - 0.3,
        angle: Math.random() * 30 - 15,
        wobble: Math.random() * Math.PI * 2,
        twinkle: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y -= this.speedY;              // hearts float UP like bubbles
          this.wobble += 0.03;
          this.twinkle += 0.08;
          this.x += this.drift + Math.sin(this.wobble) * 0.5;
          if (this.y < -25) { this.y = h + 25; this.x = Math.random() * w; }
          if (this.x > w + 25) this.x = -25;
          if (this.x < -25) this.x = w + 25;
        },

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          if (this.kind === 'heart') {
            ctx.rotate(((this.angle + Math.sin(this.wobble) * 10) * Math.PI) / 180);
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            traceHeart(ctx, this.size, this.size);
            ctx.fill();
          } else {
            ctx.globalAlpha = 0.35 + Math.abs(Math.sin(this.twinkle)) * 0.65;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            traceSpark(ctx, this.size);
            ctx.fill();
          }
          ctx.restore();
        }
      };
    }

    /* Lucky Green: drifting shamrocks + gold glints */
    function makeShamrock(w, h) {
      const isGold = Math.random() < 0.22;
      const greens = ['#22c55e', '#16a34a', '#4ade80', '#15803d', '#86efac'];
      return {
        kind: isGold ? 'gold' : 'shamrock',
        x: Math.random() * w,
        y: Math.random() * h,
        size: isGold ? Math.random() * 4 + 3 : Math.random() * 8 + 8,
        color: isGold ? '#ffd970' : greens[Math.floor(Math.random() * greens.length)],
        speedY: isGold ? Math.random() * 0.2 + 0.05 : Math.random() * 0.8 + 0.5,
        drift: Math.random() * 0.5 - 0.25,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 1.2,
        wobble: Math.random() * Math.PI * 2,
        twinkle: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y += this.speedY;              // shamrocks fall gently
          this.wobble += 0.02;
          this.twinkle += 0.07;
          this.x += this.drift + Math.sin(this.wobble) * 0.6;
          this.angle += this.spin;
          if (this.y > h + 25) { this.y = -25; this.x = Math.random() * w; }
          if (this.x > w + 25) this.x = -25;
          if (this.x < -25) this.x = w + 25;
        },

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          if (this.kind === 'shamrock') {
            ctx.rotate((this.angle * Math.PI) / 180);
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = this.color;
            for (let i = 0; i < 3; i++) {
              ctx.save();
              ctx.rotate((i * 2 * Math.PI) / 3);
              ctx.translate(0, -this.size * 0.52);
              ctx.beginPath();
              traceHeart(ctx, this.size, this.size);
              ctx.fill();
              ctx.restore();
            }
            ctx.strokeStyle = this.color;
            ctx.lineWidth = Math.max(1, this.size * 0.12);
            ctx.beginPath();
            ctx.moveTo(0, this.size * 0.1);
            ctx.quadraticCurveTo(this.size * 0.25, this.size * 0.55, this.size * 0.45, this.size * 0.85);
            ctx.stroke();
          } else {
            ctx.globalAlpha = 0.3 + Math.abs(Math.sin(this.twinkle)) * 0.7;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            traceSpark(ctx, this.size);
            ctx.fill();
          }
          ctx.restore();
        }
      };
    }

    /* Blood Red: flapping bats + rising embers 🧛 */
    function makeBatEmber(w, h) {
      const isBat = Math.random() < 0.15;
      if (isBat) {
        return {
          x: Math.random() * w,
          baseY: Math.random() * h * 0.55 + h * 0.05,
          y: 0,
          dir: Math.random() < 0.5 ? 1 : -1,
          speed: Math.random() * 1.1 + 0.5,
          scale: Math.random() * 0.7 + 0.7,
          wing: Math.random() * Math.PI * 2,
          bob: Math.random() * Math.PI * 2,

          update(w, h) {
            this.x += this.speed * this.dir;
            this.wing += 0.28;
            this.bob += 0.02;
            this.y = this.baseY + Math.sin(this.bob) * 16;
            if (this.dir > 0 && this.x > w + 50) { this.x = -50; this.baseY = Math.random() * h * 0.55 + h * 0.05; }
            if (this.dir < 0 && this.x < -50) { this.x = w + 50; this.baseY = Math.random() * h * 0.55 + h * 0.05; }
          },

          draw(ctx) {
            const flap = Math.sin(this.wing) * 0.7 + 0.35;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale * this.dir, this.scale);
            ctx.fillStyle = '#161616';
            // body + ears
            ctx.beginPath();
            ctx.ellipse(0, 0, 3.4, 5.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-2.6, -4); ctx.lineTo(-1.4, -7.5); ctx.lineTo(-0.4, -4.4);
            ctx.moveTo(2.6, -4); ctx.lineTo(1.4, -7.5); ctx.lineTo(0.4, -4.4);
            ctx.fill();
            // wings
            for (const s of [-1, 1]) {
              ctx.save();
              ctx.scale(s, 1);
              ctx.beginPath();
              ctx.moveTo(2.4, -0.5);
              ctx.quadraticCurveTo(11, -9 * flap, 19, -3 * flap);
              ctx.quadraticCurveTo(14, 3.5, 10.5, 2.2);
              ctx.quadraticCurveTo(8, 5.5, 5.5, 3.2);
              ctx.quadraticCurveTo(4, 5.2, 2.4, 3);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            }
            // glowing eyes
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(-1.3, -2.2, 0.7, 0, Math.PI * 2);
            ctx.arc(1.3, -2.2, 0.7, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        };
      }
      const emberColors = ['#ef4444', '#f97316', '#dc2626', '#fca5a5'];
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 1.8 + 1.2,
        color: emberColors[Math.floor(Math.random() * emberColors.length)],
        speedY: Math.random() * 0.6 + 0.25,
        drift: Math.random() * 0.4 - 0.2,
        wobble: Math.random() * Math.PI * 2,
        flicker: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y -= this.speedY;              // embers rise
          this.wobble += 0.04;
          this.flicker += 0.15;
          this.x += this.drift + Math.sin(this.wobble) * 0.4;
          if (this.y < -10) { this.y = h + 10; this.x = Math.random() * w; }
        },

        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = 0.25 + Math.abs(Math.sin(this.flicker)) * 0.6;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      };
    }

    /* Portal Lab: lazy grey dust motes + the odd blue/orange energy fleck
       drifting up out of the portals */
    function makeDustMote(w, h) {
      const isSpark = Math.random() < 0.22;
      return {
        kind: isSpark ? 'spark' : 'mote',
        x: Math.random() * w,
        y: Math.random() * h,
        size: isSpark ? Math.random() * 2.2 + 1.4 : Math.random() * 1.6 + 0.8,
        color: isSpark ? (Math.random() < 0.5 ? '#38bdf8' : '#fb923c') : '#8a919c',
        vx: Math.random() * 0.3 - 0.15,
        vy: isSpark ? -(Math.random() * 0.25 + 0.1) : Math.random() * 0.12 + 0.03,
        wob: Math.random() * Math.PI * 2,
        tw: Math.random() * Math.PI * 2,

        update(w, h) {
          this.wob += 0.015;
          this.tw += 0.06;
          this.x += this.vx + Math.sin(this.wob) * 0.2;
          this.y += this.vy;
          if (this.y > h + 12) this.y = -12;
          if (this.y < -12) this.y = h + 12;
          if (this.x > w + 12) this.x = -12;
          if (this.x < -12) this.x = w + 12;
        },

        draw(ctx) {
          ctx.save();
          if (this.kind === 'spark') {
            ctx.globalAlpha = 0.25 + Math.abs(Math.sin(this.tw)) * 0.6;
            // Soft halo, then the fleck itself
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 2.4, 0, Math.PI * 2);
            ctx.globalAlpha *= 0.25;
            ctx.fill();
            ctx.globalAlpha = 0.35 + Math.abs(Math.sin(this.tw)) * 0.6;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      };
    }

    /* Deep Space: crisp pixel stars — squares and 4-point crosses snapped to
       whole pixels, drifting left on parallax with a CRT-style twinkle.
       ~4% of the slots are dormant shooting stars that streak by now and then. */
    function makePixelStar(w, h) {
      if (Math.random() < 0.04) {
        return {
          active: false,
          wait: Math.random() * 900 + 400,
          x: 0, y: 0, vx: 0, vy: 0, life: 0,

          update(w, h) {
            if (!this.active) {
              if (--this.wait <= 0) {
                this.active = true;
                this.vx = (Math.random() < 0.5 ? -1 : 1) * (Math.random() * 4 + 7);
                this.vy = Math.random() * 2.2 + 1.4;
                this.x = this.vx > 0 ? Math.random() * w * 0.4 : w - Math.random() * w * 0.4;
                this.y = Math.random() * h * 0.35;
                this.life = Math.random() * 26 + 30;
              }
              return;
            }
            this.x += this.vx;
            this.y += this.vy;
            if (--this.life <= 0 || this.x < -80 || this.x > w + 80 || this.y > h + 80) {
              this.active = false;
              this.wait = Math.random() * 1400 + 600;
            }
          },

          draw(ctx) {
            if (!this.active) return;
            // A fading trail of pixels behind the head
            for (let i = 0; i < 8; i++) {
              const px = (this.x - this.vx * i * 0.55) | 0;
              const py = (this.y - this.vy * i * 0.55) | 0;
              ctx.globalAlpha = Math.max(0, 0.9 - i * 0.12);
              ctx.fillStyle = i === 0 ? '#ffffff' : '#bcd7ff';
              ctx.fillRect(px, py, 3, 3);
            }
            ctx.globalAlpha = 1;
          }
        };
      }

      const size = Math.random() < 0.18 ? 4 : (Math.random() < 0.5 ? 2 : 3);
      const tints = ['#ffffff', '#ffffff', '#ffffff', '#cfe4ff', '#ffe9c9'];
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        size,
        cross: size === 4 && Math.random() < 0.7,
        color: tints[Math.floor(Math.random() * tints.length)],
        speedX: -(0.04 + size * 0.05 + Math.random() * 0.05), // bigger = closer = faster
        tw: Math.random() * Math.PI * 2,
        twSpeed: Math.random() * 0.06 + 0.03,

        update(w, h) {
          this.x += this.speedX;
          this.tw += this.twSpeed;
          if (this.x < -8) { this.x = w + 8; this.y = Math.random() * h; }
        },

        draw(ctx) {
          const glim = Math.abs(Math.sin(this.tw));
          const sx = this.x | 0, sy = this.y | 0, s = this.size;
          ctx.globalAlpha = 0.3 + glim * 0.7;
          ctx.fillStyle = this.color;
          if (this.cross) {
            // 4-point pixel sparkle; arms stretch at the twinkle's peak
            const arm = glim > 0.85 ? s + 2 : s;
            ctx.fillRect(sx - 1, sy - arm, 2, arm * 2);
            ctx.fillRect(sx - arm, sy - 1, arm * 2, 2);
            ctx.fillRect(sx - 1, sy - 1, 2, 2);
          } else {
            ctx.fillRect(sx, sy, s, s);
          }
          ctx.globalAlpha = 1;
        }
      };
    }

    /* Blue Metallic: chrome ball bearings drifting in zero-g with specular
       highlights and rim glints, tiny sparkle specks, and the occasional
       diagonal sheen sweeping across the screen. */
    function makeChromeOrb(w, h) {
      const roll = Math.random();
      if (roll < 0.06) {
        // A slow diagonal sheen sweep
        return {
          x: -w * 0.6, wait: Math.random() * 700 + 300, speed: Math.random() * 3 + 5,
          update(w, h) {
            if (this.wait > 0) { this.wait--; return; }
            this.x += this.speed;
            if (this.x > w * 1.6) { this.x = -w * 0.6; this.wait = Math.random() * 900 + 500; }
          },
          draw(ctx) {
            if (this.wait > 0) return;
            const chh = ctx.canvas.height;
            ctx.save();
            ctx.translate(this.x, 0);
            ctx.rotate(-0.32);
            const g = ctx.createLinearGradient(0, 0, 170, 0);
            g.addColorStop(0, 'rgba(255, 255, 255, 0)');
            g.addColorStop(0.5, 'rgba(220, 235, 255, 0.07)');
            g.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, -chh, 170, chh * 3);
            ctx.restore();
          }
        };
      }
      if (roll < 0.4) {
        // A tiny sparkle speck
        return {
          x: Math.random() * w, y: Math.random() * h,
          vx: Math.random() * 0.24 - 0.12, vy: Math.random() * 0.2 - 0.1,
          tw: Math.random() * Math.PI * 2, tws: Math.random() * 0.05 + 0.02,
          update(w, h) {
            this.x += this.vx; this.y += this.vy; this.tw += this.tws;
            if (this.x < -6) this.x = w + 6; if (this.x > w + 6) this.x = -6;
            if (this.y < -6) this.y = h + 6; if (this.y > h + 6) this.y = -6;
          },
          draw(ctx) {
            const a = Math.abs(Math.sin(this.tw));
            ctx.globalAlpha = 0.15 + a * 0.55;
            ctx.fillStyle = '#dcebff';
            ctx.fillRect(this.x - 1, this.y - 1, 2, 2);
            if (a > 0.9) {
              ctx.globalAlpha = (a - 0.9) * 6;
              ctx.fillRect(this.x - 4, this.y - 0.5, 8, 1);
              ctx.fillRect(this.x - 0.5, this.y - 4, 1, 8);
            }
            ctx.globalAlpha = 1;
          }
        };
      }
      // A chrome orb — smaller ones drift faster, like they weigh less
      const r = Math.random() * 20 + 7;
      return {
        r,
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() * 0.3 - 0.15) * (22 / r),
        vy: (Math.random() * 0.24 - 0.12) * (22 / r),
        bob: Math.random() * Math.PI * 2,
        tw: Math.random() * Math.PI * 2,
        update(w, h) {
          this.bob += 0.008;
          this.tw += 0.017;
          this.x += this.vx;
          this.y += this.vy + Math.sin(this.bob) * 0.08;
          const m = this.r + 4;
          if (this.x < -m) this.x = w + m; if (this.x > w + m) this.x = -m;
          if (this.y < -m) this.y = h + m; if (this.y > h + m) this.y = -m;
        },
        draw(ctx) {
          const { x, y, r } = this;
          const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
          g.addColorStop(0, '#f6faff');
          g.addColorStop(0.25, '#c2d4ea');
          g.addColorStop(0.6, '#5c7292');
          g.addColorStop(0.9, '#22334d');
          g.addColorStop(1, '#141f31');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          // Horizon reflection band across the lower half
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.clip();
          ctx.fillStyle = 'rgba(150, 185, 225, 0.22)';
          ctx.fillRect(x - r, y + r * 0.15, r * 2, r * 0.28);
          ctx.restore();
          // Specular dot
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.arc(x - r * 0.38, y - r * 0.42, Math.max(1, r * 0.13), 0, Math.PI * 2);
          ctx.fill();
          // Rim glint at the twinkle's peak
          const a = Math.abs(Math.sin(this.tw));
          if (a > 0.86) {
            const gx2 = x + r * 0.62, gy2 = y - r * 0.55;
            ctx.globalAlpha = (a - 0.86) * 7;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(gx2 - r * 0.3, gy2 - 1, r * 0.6, 2);
            ctx.fillRect(gx2 - 1, gy2 - r * 0.3, 2, r * 0.6);
            ctx.globalAlpha = 1;
          }
        }
      };
    }

    class PetalSystem {
      constructor(canvasId, count, makePetal) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        this.count = count;
        this.makePetal = makePetal;
        this.petals = [];
        this.animId = null;
        this.tick = this.tick.bind(this);
      }

      resize() {
        if (this.canvas) {
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;
        }
      }

      tick() {
        const { ctx, canvas } = this;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of this.petals) {
          p.update(canvas.width, canvas.height);
          p.draw(ctx);
        }
        this.animId = requestAnimationFrame(this.tick);
      }

      start() {
        if (!this.ctx || this.animId) return;
        this.resize();
        if (this.petals.length === 0) {
          this.petals = Array.from({ length: this.count }, () => this.makePetal(this.canvas.width, this.canvas.height));
        }
        this.tick();
      }

      stop() {
        if (this.animId) {
          cancelAnimationFrame(this.animId);
          this.animId = null;
        }
        if (this.ctx && this.canvas) {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    /* ---- SceneSystem ----
       Sibling of PetalSystem for full composed scenes (aquarium, night drive)
       rather than uniform particle swarms. Same start/stop/resize surface, so
       the EFFECTS registry treats both alike. buildState(canvas) returns the
       scene's world; drawFrame(ctx, canvas, state, t) paints one frame. */
    class SceneSystem {
      constructor(canvasId, buildState, drawFrame) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        this.buildState = buildState;
        this.drawFrame = drawFrame;
        this.state = null;
        this.animId = null;
        this.tick = this.tick.bind(this);
      }

      resize() {
        if (!this.canvas) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        // Rebuild a live scene so its layout fits the new viewport
        if (this.animId) this.state = this.buildState(this.canvas);
      }

      tick(now) {
        this.drawFrame(this.ctx, this.canvas, this.state, now);
        this.animId = requestAnimationFrame(this.tick);
      }

      start() {
        if (!this.ctx || this.animId) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.state = this.buildState(this.canvas);
        this.animId = requestAnimationFrame(this.tick);
      }

      stop() {
        if (this.animId) {
          cancelAnimationFrame(this.animId);
          this.animId = null;
        }
        if (this.ctx && this.canvas) {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    /* =====================================================================
       AQUARIUM — freshwater planted community tank.
       Stocking mirrors a proper 40-gallon community: a neon tetra school,
       glass catfish hovering in the current, mollies, corydoras working the
       sand (with the occasional dash to the surface for air), a bristlenose
       on the driftwood, cherry shrimp, a snail — over white sand with
       vallisneria, swords, an airstone column, and plants pearling.
       ===================================================================== */

    function buildAquarium(canvas) {
      const w = canvas.width, h = canvas.height;
      const sandTop = h * 0.88;

      const clump = (x, height, blades, colors, lw) => ({
        x, height, blades, lw,
        color: colors[Math.floor(Math.random() * colors.length)],
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.0007 + 0.0005
      });

      const backGreens = ['#1d6a51', '#20745a', '#286a4e'];
      const frontGreens = ['#2e9c6b', '#37b57c', '#2f8f5f', '#45c98a'];

      const dalmatianSpots = () => Array.from({ length: 9 }, () => ({
        dx: Math.random() * 1.4 - 0.7, dy: Math.random() * 0.6 - 0.3, r: Math.random() * 0.09 + 0.04
      }));
      const speckles = () => Array.from({ length: 8 }, () => ({
        dx: Math.random() * 1.4 - 0.7, dy: Math.random() * 0.5 - 0.35, r: Math.random() * 0.05 + 0.025
      }));

      return {
        w, h, sandTop,
        driftwood: { x: w * 0.17, y: sandTop + 8 },

        backPlants: Array.from({ length: 13 }, () =>
          clump(Math.random() * w, h * (Math.random() * 0.2 + 0.18), 3 + Math.floor(Math.random() * 3), backGreens, 3)),
        frontPlants: Array.from({ length: 8 }, () =>
          clump(Math.random() * w, h * (Math.random() * 0.28 + 0.24), 4 + Math.floor(Math.random() * 4), frontGreens, 5)),
        swords: [
          clump(w * 0.3 + Math.random() * w * 0.05, h * 0.24, 7, frontGreens, 9),
          clump(w * 0.68 + Math.random() * w * 0.05, h * 0.28, 8, frontGreens, 9)
        ],

        // The tetra school chases a slowly wandering shared center
        tetras: Array.from({ length: 12 }, () => ({
          x: w * (0.1 + Math.random() * 0.2), y: h * (0.35 + Math.random() * 0.2),
          vx: Math.random() * 1.2 - 0.6, vy: Math.random() * 0.4 - 0.2,
          size: Math.random() * 3.5 + 11.5, dir: 1, wob: Math.random() * Math.PI * 2
        })),

        glassCats: Array.from({ length: 6 }, (_, i) => ({
          hx: w * (0.12 + (i % 3) * 0.055) + Math.random() * w * 0.02,
          hy: h * (0.26 + Math.floor(i / 3) * 0.07) + Math.random() * h * 0.03,
          len: Math.random() * 9 + 32, bob: Math.random() * Math.PI * 2,
          wspd: Math.random() * 0.4 + 0.8
        })),

        mollies: [
          { x: w * 0.25, y: h * 0.3, dir: 1, speed: 0.42, size: 25, kind: 'black', wob: Math.random() * Math.PI * 2 },
          { x: w * 0.6, y: h * 0.62, dir: -1, speed: 0.36, size: 24, kind: 'black', wob: Math.random() * Math.PI * 2 },
          { x: w * 0.42, y: h * 0.48, dir: 1, speed: 0.4, size: 23, kind: 'black', wob: Math.random() * Math.PI * 2 },
          { x: w * 0.7, y: h * 0.55, dir: -1, speed: 0.38, size: 23, kind: 'dalmatian', spots: dalmatianSpots(), wob: Math.random() * Math.PI * 2 }
        ],

        guppies: Array.from({ length: 7 }, (_, i) => ({
          x: Math.random() * w * 0.7 + w * 0.15, y: h * (0.25 + Math.random() * 0.45),
          dir: Math.random() < 0.5 ? -1 : 1, speed: Math.random() * 0.35 + 0.5,
          size: Math.random() * 2.3 + 9.2, burst: 0,
          tail: ['#ff8a3c', '#3fa8ff', '#ff5470', '#ffd23c', '#9c6bff'][i % 5],
          wob: Math.random() * Math.PI * 2, flit: Math.random() * 400 + 100
        })),

        whiteSkirts: Array.from({ length: 5 }, () => ({
          x: Math.random() * w * 0.6 + w * 0.2, y: h * (0.45 + Math.random() * 0.25),
          dir: Math.random() < 0.5 ? -1 : 1, speed: Math.random() * 0.2 + 0.3,
          size: Math.random() * 3.5 + 17.3, wob: Math.random() * Math.PI * 2
        })),

        corys: Array.from({ length: 3 }, () => ({
          x: Math.random() * w * 0.8 + w * 0.1, y: sandTop - 7,
          dir: Math.random() < 0.5 ? -1 : 1,
          speed: Math.random() * 0.3 + 0.3, size: 31, spots: speckles(),
          bob: Math.random() * Math.PI * 2, mode: 'bottom', vy: 0,
          airTimer: Math.random() * 1400 + 900
        })),

        pleco: { tail: Math.random() * Math.PI * 2 },

        shrimp: Array.from({ length: 6 }, () => ({
          x: Math.random() * w * 0.7 + w * 0.15, dir: Math.random() < 0.5 ? -1 : 1,
          speed: Math.random() * 0.1 + 0.05, sc: Math.random() * 0.25 + 1.25,
          hop: 0, hopTimer: Math.random() * 500 + 200,
          bob: Math.random() * Math.PI * 2
        })),

        snails: Array.from({ length: 3 }, (_, i) => ({
          x: w * (0.25 + i * 0.22) + Math.random() * w * 0.08,
          dir: Math.random() < 0.5 ? -1 : 1,
          speed: Math.random() * 0.03 + 0.035,
          sc: Math.random() * 0.2 + 1.25
        })),

        bubbles: Array.from({ length: 30 }, (_, i) => {
          const pearl = i > 21; // last few are tiny pearling bubbles off the plants
          return {
            pearl,
            x: pearl ? Math.random() * w : w * 0.82 + Math.random() * 12 - 6,
            y: sandTop - Math.random() * (h * 0.7),
            r: pearl ? Math.random() * 0.7 + 0.7 : Math.random() * 2.4 + 1.1,
            speed: pearl ? Math.random() * 0.5 + 0.35 : Math.random() * 1.1 + 1.1,
            wob: Math.random() * Math.PI * 2
          };
        }),

        rays: Array.from({ length: 3 }, (_, i) => ({
          x: w * (0.2 + i * 0.3), width: w * (0.05 + Math.random() * 0.05),
          tilt: Math.random() * 0.16 - 0.08, phase: Math.random() * Math.PI * 2
        })),

        pebbles: Array.from({ length: 14 }, () => ({
          x: Math.random() * w, y: sandTop + 8 + Math.random() * (h - sandTop - 14),
          rx: Math.random() * 5 + 2.5, shade: Math.random() * 50 | 0
        }))
      };
    }

    function drawAquaPlant(ctx, p, sandTop, t, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = p.color;
      ctx.lineCap = 'round';
      ctx.lineWidth = p.lw;
      const swayBase = Math.sin(t * p.speed + p.phase);
      for (let i = 0; i < p.blades; i++) {
        const bx = p.x + (i - p.blades / 2) * (p.lw + 1.5);
        const hgt = p.height * (0.72 + ((i * 37) % 10) / 24);
        const sway = (swayBase + Math.sin(t * p.speed * 1.7 + p.phase + i)) * (hgt * 0.06);
        ctx.beginPath();
        ctx.moveTo(bx, sandTop + 4);
        ctx.quadraticCurveTo(bx + sway * 0.4, sandTop - hgt * 0.55, bx + sway, sandTop - hgt);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAquarium(ctx, canvas, s, t) {
      const { w, h, sandTop } = s;
      ctx.clearRect(0, 0, w, h);

      // Light rays filtering down from the surface
      for (const r of s.rays) {
        const sway = Math.sin(t * 0.0003 + r.phase) * w * 0.02;
        ctx.save();
        ctx.globalAlpha = 0.07 + Math.abs(Math.sin(t * 0.0004 + r.phase)) * 0.05;
        ctx.fillStyle = '#f5ffe9';
        ctx.beginPath();
        ctx.moveTo(r.x + sway, -10);
        ctx.lineTo(r.x + sway + r.width, -10);
        ctx.lineTo(r.x + sway + r.width * 2.6 + w * r.tilt, h * 0.75);
        ctx.lineTo(r.x + sway - r.width * 1.6 + w * r.tilt, h * 0.75);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Driftwood (three tapering strokes + a stub branch)
      const dw = s.driftwood;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#4e3421';
      ctx.lineWidth = 15;
      ctx.beginPath();
      ctx.moveTo(dw.x - w * 0.02, dw.y);
      ctx.quadraticCurveTo(w * 0.2, h * 0.72, w * 0.33, h * 0.56);
      ctx.stroke();
      ctx.strokeStyle = '#5b3e28';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(w * 0.24, h * 0.71);
      ctx.quadraticCurveTo(w * 0.3, h * 0.64, w * 0.36, h * 0.62);
      ctx.stroke();
      ctx.strokeStyle = '#6b4a30';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(w * 0.28, h * 0.655);
      ctx.quadraticCurveTo(w * 0.31, h * 0.6, w * 0.31, h * 0.55);
      ctx.stroke();
      ctx.restore();

      // Background plants behind the fish
      for (const p of s.backPlants) drawAquaPlant(ctx, p, sandTop, t, 0.75);

      // White sand + pebbles
      const sandGrad = ctx.createLinearGradient(0, sandTop, 0, h);
      sandGrad.addColorStop(0, '#efe9da');
      sandGrad.addColorStop(1, '#cfc4ab');
      ctx.fillStyle = sandGrad;
      ctx.fillRect(0, sandTop, w, h - sandTop);
      for (const pb of s.pebbles) {
        ctx.fillStyle = `rgb(${150 + pb.shade}, ${140 + pb.shade}, ${125 + pb.shade})`;
        ctx.beginPath();
        ctx.ellipse(pb.x, pb.y, pb.rx, pb.rx * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---- Fish ----
      // Mollies cruise mid-water
      for (const m of s.mollies) {
        m.wob += 0.02;
        m.x += m.speed * m.dir;
        m.y += Math.sin(m.wob) * 0.25;
        if (m.x > w - 40 && m.dir > 0) m.dir = -1;
        if (m.x < 40 && m.dir < 0) m.dir = 1;
        const L = m.size;
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.scale(m.dir, 1);
        ctx.fillStyle = m.kind === 'black' ? '#15181c' : '#e8ecef';
        // Fan tail, then rounded body over it
        ctx.beginPath();
        ctx.moveTo(-L * 0.42, 0);
        ctx.lineTo(-L * 0.72, -L * 0.26);
        ctx.quadraticCurveTo(-L * 0.8, 0, -L * 0.72, L * 0.26);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.48, L * 0.24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath(); // dorsal
        ctx.moveTo(-L * 0.18, -L * 0.2);
        ctx.quadraticCurveTo(0, -L * 0.46, L * 0.14, -L * 0.2);
        ctx.closePath();
        ctx.fill();
        if (m.kind === 'dalmatian') {
          ctx.fillStyle = '#22262b';
          for (const sp of m.spots) {
            ctx.beginPath();
            ctx.arc(sp.dx * L * 0.4, sp.dy * L * 0.4, sp.r * L, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.fillStyle = m.kind === 'black' ? '#c9d2d8' : '#1a1e23';
        ctx.beginPath();
        ctx.arc(L * 0.32, -L * 0.04, L * 0.055, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Guppies flitting about behind their fancy tails
      for (const g of s.guppies) {
        g.wob += 0.06;
        if (--g.flit <= 0) {
          g.flit = Math.random() * 420 + 140;
          if (Math.random() < 0.4) g.dir *= -1;
          g.burst = 26;
        }
        const spd = g.speed + (g.burst > 0 ? (g.burst--, 1.3) : 0);
        g.x += spd * g.dir;
        g.y += Math.sin(g.wob) * 0.5;
        if (g.x > w - 30 && g.dir > 0) g.dir = -1;
        if (g.x < 30 && g.dir < 0) g.dir = 1;
        if (g.y < h * 0.15) g.y = h * 0.15;
        if (g.y > sandTop - 30) g.y = sandTop - 30;
        const L = g.size;
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.scale(g.dir, 1);
        ctx.fillStyle = g.tail; // the big fan tail
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(-L * 0.32, 0);
        ctx.quadraticCurveTo(-L * 1.15, -L * 0.62, -L * 1.28, -L * 0.1);
        ctx.quadraticCurveTo(-L * 1.34, 0, -L * 1.28, L * 0.1);
        ctx.quadraticCurveTo(-L * 1.15, L * 0.62, -L * 0.32, 0);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#d6dde2'; // slim body
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.42, L * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = g.tail; // dorsal flag in the tail colour
        ctx.beginPath();
        ctx.moveTo(-L * 0.05, -L * 0.12);
        ctx.quadraticCurveTo(-L * 0.3, -L * 0.42, -L * 0.42, -L * 0.12);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.28, -L * 0.02, L * 0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // White skirt tetras drifting mid-water
      for (const ws of s.whiteSkirts) {
        ws.wob += 0.025;
        ws.x += ws.speed * ws.dir;
        ws.y += Math.sin(ws.wob) * 0.3;
        if (ws.x > w - 40 && ws.dir > 0) ws.dir = -1;
        if (ws.x < 40 && ws.dir < 0) ws.dir = 1;
        const L = ws.size;
        ctx.save();
        ctx.translate(ws.x, ws.y);
        ctx.scale(ws.dir, 1);
        ctx.fillStyle = 'rgba(206, 216, 224, 0.7)'; // the flowing skirt fin
        ctx.beginPath();
        ctx.moveTo(L * 0.05, L * 0.16);
        ctx.quadraticCurveTo(-L * 0.2, L * 0.66, -L * 0.5, L * 0.3);
        ctx.lineTo(-L * 0.38, L * 0.08);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(216, 226, 234, 0.75)'; // tail
        ctx.beginPath();
        ctx.moveTo(-L * 0.42, 0);
        ctx.lineTo(-L * 0.64, -L * 0.2);
        ctx.lineTo(-L * 0.64, L * 0.2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#dde5ea'; // deep pale body
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.44, L * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120, 132, 142, 0.5)'; // faint shoulder bars
        ctx.lineWidth = L * 0.06;
        ctx.beginPath();
        ctx.moveTo(L * 0.16, -L * 0.24);
        ctx.lineTo(L * 0.14, L * 0.22);
        ctx.moveTo(L * 0.02, -L * 0.27);
        ctx.lineTo(0, L * 0.26);
        ctx.stroke();
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.3, -L * 0.06, L * 0.055, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Neon tetra school, steering toward a wandering shared center
      // School center dwells on the flanks (the card owns the middle),
      // crossing quickly when it changes sides
      const cx = w * (0.5 + 0.34 * Math.tanh(3 * Math.sin(t * 0.00006)));
      const cy = h * (0.42 + 0.12 * Math.sin(t * 0.00004 + 2));
      for (const f of s.tetras) {
        f.vx += (cx - f.x) * 0.00045 + (Math.random() - 0.5) * 0.03;
        f.vy += (cy - f.y) * 0.00045 + (Math.random() - 0.5) * 0.02;
        f.vx *= 0.985; f.vy *= 0.985;
        const sp = Math.hypot(f.vx, f.vy);
        if (sp > 1.4) { f.vx *= 1.4 / sp; f.vy *= 1.4 / sp; }
        f.x += f.vx; f.y += f.vy;
        if (Math.abs(f.vx) > 0.15) f.dir = f.vx > 0 ? 1 : -1;
        f.wob += 0.1;

        const L = f.size;
        ctx.save();
        ctx.translate(f.x, f.y + Math.sin(f.wob) * 0.6);
        ctx.scale(f.dir, 1);
        ctx.fillStyle = '#c9d6d9'; // silver body
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.5, L * 0.21, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(228, 238, 243, 0.8)'; // tail
        ctx.beginPath();
        ctx.moveTo(-L * 0.48, 0);
        ctx.lineTo(-L * 0.7, -L * 0.17);
        ctx.lineTo(-L * 0.7, L * 0.17);
        ctx.closePath();
        ctx.fill();
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#3fd4ff'; // the neon stripe
        ctx.lineWidth = L * 0.13;
        ctx.beginPath();
        ctx.moveTo(L * 0.44, -L * 0.04);
        ctx.lineTo(-L * 0.14, -L * 0.05);
        ctx.stroke();
        ctx.strokeStyle = '#ff4646'; // red rear stripe
        ctx.beginPath();
        ctx.moveTo(-L * 0.48, L * 0.06);
        ctx.lineTo(0, L * 0.05);
        ctx.stroke();
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.34, -L * 0.03, L * 0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Glass catfish: translucent ribbon bodies hovering into the current
      for (const g of s.glassCats) {
        g.bob += 0.012;
        const gx = g.hx + Math.sin(g.bob) * 14;
        const gy = g.hy + Math.sin(g.bob * 1.6) * 8;
        const N = 8;
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const frac = i / N;
          pts.push({
            x: gx - frac * g.len,
            y: gy + Math.sin(t * 0.008 * g.wspd + i * 0.85) * frac * 3,
            half: 4.6 * (1 - frac) + 0.4
          });
        }
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0].x + 3, pts[0].y);
        for (const p of pts) ctx.lineTo(p.x, p.y - p.half);
        for (let i = N; i >= 0; i--) ctx.lineTo(pts[i].x, pts[i].y + pts[i].half);
        ctx.closePath();
        ctx.fillStyle = 'rgba(223, 233, 238, 0.26)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(88, 108, 120, 0.55)'; // the visible spine
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (const p of pts) ctx.lineTo(p.x, p.y);
        ctx.stroke();
        for (let i = 1; i < N - 1; i++) { // little bone ticks
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y - pts[i].half * 0.55);
          ctx.lineTo(pts[i].x, pts[i].y + pts[i].half * 0.55);
          ctx.stroke();
        }
        ctx.fillStyle = '#10151a'; // eye + barbels
        ctx.beginPath();
        ctx.arc(gx + 1.5, gy - 0.5, 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(200, 214, 222, 0.7)';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(gx + 2.5, gy);
        ctx.lineTo(gx + 11, gy - 4);
        ctx.moveTo(gx + 2.5, gy + 1);
        ctx.lineTo(gx + 10, gy + 3);
        ctx.stroke();
        ctx.restore();
      }

      // Corydoras working the sand — with the occasional dash up for air
      for (const c of s.corys) {
        c.bob += 0.05;
        if (c.mode === 'bottom') {
          c.x += c.speed * c.dir;
          if (c.x > w * 0.9) c.dir = -1;
          if (c.x < w * 0.1) c.dir = 1;
          if (--c.airTimer <= 0) { c.mode = 'up'; c.vy = -9; }
        } else if (c.mode === 'up') {
          c.vy *= 0.988;
          if (c.x > 30 && c.x < w - 30) c.x += c.dir * 1.6;
          if (c.vy > -0.8 || c.y < 14) {
            c.mode = 'down';
            c.vy = Math.max(c.vy, -0.5); // gulp taken — don't sail off-screen
          }
        } else {
          c.vy = Math.min(c.vy + 0.05, 1.4);
        }
        let cyPos;
        if (c.mode === 'bottom') {
          c.y = sandTop - 7;
          cyPos = c.y + Math.sin(c.bob) * 1.2;
        } else {
          c.y += c.vy;
          if (c.mode === 'down' && c.y >= sandTop - 7) {
            c.y = sandTop - 7;
            c.mode = 'bottom';
            c.airTimer = Math.random() * 1600 + 1100;
          }
          cyPos = c.y;
        }
        const L = c.size;
        ctx.save();
        ctx.translate(c.x, cyPos);
        ctx.scale(c.dir, 1);
        ctx.fillStyle = '#d9c49a';
        ctx.beginPath(); // arched back, flat belly, snout down
        ctx.moveTo(L * 0.5, L * 0.12);
        ctx.quadraticCurveTo(L * 0.3, -L * 0.4, -L * 0.15, -L * 0.32);
        ctx.quadraticCurveTo(-L * 0.5, -L * 0.18, -L * 0.52, L * 0.1);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(214, 224, 230, 0.75)'; // tail
        ctx.beginPath();
        ctx.moveTo(-L * 0.48, 0);
        ctx.lineTo(-L * 0.7, -L * 0.2);
        ctx.lineTo(-L * 0.68, L * 0.14);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#4a4234'; // speckles
        for (const sp of c.spots) {
          ctx.beginPath();
          ctx.arc(sp.dx * L * 0.4, sp.dy * L * 0.3 - L * 0.08, Math.max(0.6, sp.r * L), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = '#b09a72'; // barbels
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(L * 0.46, L * 0.1);
        ctx.lineTo(L * 0.56, L * 0.2);
        ctx.moveTo(L * 0.4, L * 0.12);
        ctx.lineTo(L * 0.47, L * 0.24);
        ctx.stroke();
        ctx.fillStyle = '#171512';
        ctx.beginPath();
        ctx.arc(L * 0.28, -L * 0.12, L * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Bristlenose pleco suckered onto the driftwood
      const pl = s.pleco;
      pl.tail += 0.015;
      ctx.save();
      ctx.translate(w * 0.255, h * 0.685);
      ctx.rotate(-0.62);
      const PL = 35;
      ctx.fillStyle = '#42301f';
      ctx.beginPath(); // flat-bellied wedge body
      ctx.moveTo(PL * 0.5, 0);
      ctx.quadraticCurveTo(PL * 0.2, -PL * 0.3, -PL * 0.3, -PL * 0.16);
      ctx.quadraticCurveTo(-PL * 0.55 + Math.sin(pl.tail) * 1.6, -PL * 0.05, -PL * 0.52 + Math.sin(pl.tail) * 2, PL * 0.1);
      ctx.lineTo(PL * 0.45, PL * 0.09);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#5d452c'; // splayed pectorals
      ctx.beginPath();
      ctx.ellipse(PL * 0.08, PL * 0.1, PL * 0.2, PL * 0.09, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(PL * 0.08, -PL * 0.16, PL * 0.18, PL * 0.08, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7a6242'; // mottling
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.arc((i * 53 % 26) - 13, ((i * 31 % 12) - 6) * 0.6, 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = '#7a6242'; // the bristles
      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(PL * 0.46, i * 1.3);
        ctx.quadraticCurveTo(PL * 0.56, i * 2 - 1, PL * 0.62, i * 2.6);
        ctx.stroke();
      }
      ctx.fillStyle = '#14110d';
      ctx.beginPath();
      ctx.arc(PL * 0.24, -PL * 0.1, 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Cherry shrimp picking across the sand
      for (const sh of s.shrimp) {
        sh.bob += 0.08;
        if (--sh.hopTimer <= 0) { sh.hop = 6; sh.hopTimer = Math.random() * 600 + 260; sh.dir = Math.random() < 0.5 ? -1 : 1; }
        if (sh.hop > 0) { sh.hop -= 0.25; sh.x += sh.dir * 1.4; }
        else sh.x += sh.dir * sh.speed;
        if (sh.x > w * 0.92) sh.dir = -1;
        if (sh.x < w * 0.08) sh.dir = 1;
        const sy = sandTop + 2 - (sh.hop > 0 ? Math.sin((6 - sh.hop) / 6 * Math.PI) * 9 : 0);
        ctx.save();
        ctx.translate(sh.x, sy);
        ctx.scale(sh.dir * sh.sc, sh.sc);
        ctx.strokeStyle = '#e34646';
        ctx.fillStyle = '#e34646';
        ctx.lineWidth = 2.6;
        ctx.lineCap = 'round';
        ctx.beginPath(); // comma-curved body
        ctx.arc(0, -2.5, 4, -0.2, Math.PI * 0.75);
        ctx.stroke();
        ctx.beginPath(); // tail fan
        ctx.moveTo(-3.4, 0.8);
        ctx.lineTo(-5.6, -0.6);
        ctx.lineTo(-4.6, 2);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 0.6; // legs + antennae
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.moveTo(1.5 - i * 1.3, 0.5);
          ctx.lineTo(1.2 - i * 1.3, 2.6);
        }
        ctx.moveTo(3.8, -3.5); ctx.lineTo(9, -6);
        ctx.moveTo(3.8, -3); ctx.lineTo(9.5, -3.6);
        ctx.stroke();
        ctx.restore();
      }

      // The snails, each on its own schedule
      for (const sn of s.snails) {
        sn.x += sn.speed * sn.dir;
        if (sn.x > w * 0.85) sn.dir = -1;
        if (sn.x < w * 0.15) sn.dir = 1;
        ctx.save();
        ctx.translate(sn.x, sandTop + 4);
        ctx.scale(sn.dir * sn.sc, sn.sc);
        ctx.fillStyle = '#e3c49c'; // foot
        ctx.beginPath();
        ctx.ellipse(1.5, 2.5, 7.5, 2.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c98f3f'; // shell
        ctx.beginPath();
        ctx.arc(-1, -3, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8a5c22';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc(-1, -3, 4, 0.5, Math.PI * 1.9);
        ctx.stroke();
        ctx.strokeStyle = '#e3c49c'; // antennae
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(6.5, 0.8); ctx.lineTo(9.5, -3);
        ctx.moveTo(7.2, 1.2); ctx.lineTo(10.5, -1);
        ctx.stroke();
        ctx.restore();
      }

      // Foreground planting: swords + vallisneria in front of the fish
      for (const p of s.swords) drawAquaPlant(ctx, p, sandTop, t, 0.95);
      for (const p of s.frontPlants) drawAquaPlant(ctx, p, sandTop, t, 0.9);

      // Bubbles: the airstone column + pearling off the plants
      for (const b of s.bubbles) {
        b.wob += 0.05;
        b.y -= b.speed;
        b.x += Math.sin(b.wob) * (b.pearl ? 0.15 : 0.4);
        if (b.y < -8) {
          b.y = sandTop - 2;
          b.x = b.pearl ? Math.random() * w : w * 0.82 + Math.random() * 12 - 6;
          if (b.pearl) b.y = sandTop - Math.random() * h * 0.35; // off a leaf, not the sand
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.28, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* =====================================================================
       NIGHT DRIVE — first-person city cruise.
       Sky with moon, stars and a blinking red-eye flight; three parallax
       skyline layers with lit windows and antenna beacons; a perspective
       road with lane dashes and streetlights rushing past; a car ahead on
       its taillights, oncoming headlights; then the cab: dashboard, glowing
       gauges, a steering wheel that leans into the curves, and a rearview
       mirror with traffic falling behind.
       ===================================================================== */

    /* Shared night sky: gradient, moon, twinkling stars, and a red-eye flight.
       Used by both City Nights and Night Drive. */
    function drawNightSky(ctx, s, t, w, h, horizon, rate = 1) {
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, '#04060f');
      sky.addColorStop(0.45, '#0d1230');
      sky.addColorStop(0.75, '#2a1745');
      sky.addColorStop(0.92, '#5b2a52');
      sky.addColorStop(1, '#8a4358');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, horizon + 2);

      // Moon with a soft halo
      const mx = w * 0.78, my = h * 0.13;
      const halo = ctx.createRadialGradient(mx, my, 6, mx, my, 70);
      halo.addColorStop(0, 'rgba(235, 240, 255, 0.5)');
      halo.addColorStop(1, 'rgba(235, 240, 255, 0)');
      ctx.fillStyle = halo;
      ctx.fillRect(mx - 70, my - 70, 140, 140);
      ctx.fillStyle = '#e8ecf7';
      ctx.beginPath();
      ctx.arc(mx, my, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(178, 188, 210, 0.55)';
      for (const [cdx, cdy, cr] of [[-5, -3, 3], [4, 5, 2.4], [6, -6, 1.8]]) {
        ctx.beginPath();
        ctx.arc(mx + cdx, my + cdy, cr, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const st of s.stars) {
        st.tw += 0.04 * rate;
        ctx.globalAlpha = 0.25 + Math.abs(Math.sin(st.tw)) * 0.6;
        ctx.fillStyle = '#e8edf7';
        ctx.fillRect(st.x | 0, st.y | 0, st.s, st.s);
      }
      ctx.globalAlpha = 1;

      // A red-eye flight crossing the sky
      const pn = s.plane;
      pn.x += 0.3 * rate * pn.dir;
      pn.blink += 0.09 * rate;
      if (pn.x > w + 80) { pn.x = -80; pn.y = h * (0.04 + Math.random() * 0.07); }
      ctx.fillStyle = 'rgba(190, 198, 214, 0.65)';
      ctx.fillRect(pn.x, pn.y, 8, 2);
      if (Math.sin(pn.blink) > 0.55) {
        ctx.fillStyle = '#ff5252';
        ctx.fillRect(pn.x + 8, pn.y, 2, 2);
      }
      if (Math.sin(pn.blink * 0.37) > 0.985) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(pn.x + 3, pn.y - 1, 3, 3);
      }
    }

    function makeSkylineLayer(w, h, opts) {
      const buildings = [];
      let x = 0;
      while (x < w * 1.5 + 240) {
        const bw = opts.wMin + Math.random() * (opts.wMax - opts.wMin);
        const bh = h * (opts.hMin + Math.random() * (opts.hMax - opts.hMin));
        const b = { x, w: bw, h: bh, antenna: Math.random() < opts.antenna, blink: Math.random() * Math.PI * 2 };
        if (opts.windows) {
          b.cols = Math.max(1, Math.floor(bw / 17));
          b.rows = Math.max(2, Math.floor(bh / 21));
          b.lit = Array.from({ length: b.cols * b.rows }, () => Math.random() < opts.lit);
        }
        buildings.push(b);
        x += bw + Math.random() * 16 + 5;
      }
      return { buildings, span: x, offset: Math.random() * x, speed: opts.speed, color: opts.color, win: opts.win };
    }

    function buildCityDrive(canvas) {
      const w = canvas.width, h = canvas.height;
      const horizon = h * 0.5;
      return {
        w, h, horizon,
        stars: Array.from({ length: 60 }, () => ({
          x: Math.random() * w, y: Math.random() * horizon * 0.7,
          s: Math.random() < 0.3 ? 2 : 1, tw: Math.random() * Math.PI * 2
        })),
        layers: [
          makeSkylineLayer(w, h, { speed: 0.12, wMin: 26, wMax: 70, hMin: 0.05, hMax: 0.15, color: '#171d3a', windows: true, win: 'rgba(90, 110, 175, 0.55)', lit: 0.2, antenna: 0.04 }),
          makeSkylineLayer(w, h, { speed: 0.3, wMin: 40, wMax: 100, hMin: 0.1, hMax: 0.26, color: '#0e1226', windows: true, win: '#f6c453', lit: 0.3, antenna: 0.1 }),
          makeSkylineLayer(w, h, { speed: 0.62, wMin: 60, wMax: 150, hMin: 0.16, hMax: 0.34, color: '#070912', windows: true, win: '#8fd4ff', lit: 0.16, antenna: 0.14 })
        ],
        plane: { x: -60, y: h * 0.07, dir: 1, blink: 0 },
        roadOff: 0,
        signBig: { active: false, x: 0, kind: 0, timer: 300 },
        signSmall: { active: false, x: 0, kind: 0, timer: 140 }
      };
    }

    function drawCityDrive(ctx, canvas, s, t) {
      const { w, h, horizon } = s;

      ctx.clearRect(0, 0, w, h);
      drawNightSky(ctx, s, t, w, h, horizon);

      // --- Skyline layers, far to near ---
      for (const layer of s.layers) {
        layer.offset += layer.speed;
        const baseX = -(layer.offset % layer.span);
        for (const pass of [baseX, baseX + layer.span]) {
          for (const b of layer.buildings) {
            const px = pass + b.x;
            if (px > w + 60 || px + b.w < -60) continue;
            ctx.fillStyle = layer.color;
            ctx.fillRect(px, horizon - b.h, b.w, b.h + 2);
            if (b.lit) {
              ctx.fillStyle = layer.win;
              for (let ci = 0; ci < b.cols; ci++) {
                for (let ri = 0; ri < b.rows; ri++) {
                  if (!b.lit[ri * b.cols + ci]) continue;
                  // A rare window flickers on/off as its office empties out
                  if (Math.sin(t * 0.001 + ci * 7 + ri * 13 + b.x) > 0.998) continue;
                  ctx.fillRect(px + 4 + ci * (b.w - 8) / b.cols, horizon - b.h + 5 + ri * (b.h - 8) / b.rows, 2.5, 3.5);
                }
              }
            }
            if (b.antenna) {
              b.blink += 0.012;
              ctx.strokeStyle = 'rgba(120, 130, 155, 0.8)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(px + b.w / 2, horizon - b.h);
              ctx.lineTo(px + b.w / 2, horizon - b.h - 14);
              ctx.stroke();
              if (Math.sin(b.blink * 6) > 0) {
                ctx.fillStyle = '#ff3b3b';
                ctx.beginPath();
                ctx.arc(px + b.w / 2, horizon - b.h - 15, 1.6, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        }
      }

      // Warm haze where the streets meet the sky
      const haze = ctx.createLinearGradient(0, horizon - 44, 0, horizon);
      haze.addColorStop(0, 'rgba(138, 67, 88, 0)');
      haze.addColorStop(1, 'rgba(160, 84, 96, 0.3)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizon - 44, w, 44);

      // --- Side-on highway streaming past in the foreground ---
      const speed = 9;
      s.roadOff += speed;
      const railY = h * 0.565;
      const roadTop = h * 0.605;

      // Dark embankment between the waterfront and the rail
      ctx.fillStyle = '#0b0e18';
      ctx.fillRect(0, horizon, w, railY - horizon);

      // Asphalt
      const roadGrad = ctx.createLinearGradient(0, roadTop, 0, h);
      roadGrad.addColorStop(0, '#181a24');
      roadGrad.addColorStop(1, '#0a0b10');
      ctx.fillStyle = roadGrad;
      ctx.fillRect(0, roadTop, w, h - roadTop);

      // Edge + shoulder lines
      ctx.fillStyle = 'rgba(230, 232, 240, 0.75)';
      ctx.fillRect(0, roadTop + 8, w, 3);
      ctx.fillRect(0, h - 14, w, 3);

      // Lane dashes streaming past
      ctx.fillStyle = '#e8e8ee';
      for (const laneY of [h * 0.735, h * 0.865]) {
        for (let x = -(s.roadOff % 130); x < w; x += 130) {
          ctx.fillRect(x, laneY, 74, 4);
        }
      }

      // Faint speed streaks on the tarmac
      ctx.fillStyle = 'rgba(200, 210, 230, 0.05)';
      for (let i = 0; i < 6; i++) {
        const sx = w - ((s.roadOff * 1.35 + i * 337) % (w + 220)) + 110;
        ctx.fillRect(sx, roadTop + 20 + (i * 83 % (h - roadTop - 40)), 90, 2);
      }

      // Roadside signs gliding by (drawn behind the guardrail).
      // Big boards rotate on a ~12-15s cycle; small signs on a ~6s cycle.
      const drawPost = (px2, topY, pw2) => {
        ctx.fillStyle = '#3a404c';
        ctx.fillRect(px2, topY, pw2, railY - topY + 10);
      };

      const sg = s.signBig;
      if (!sg.active) {
        if (--sg.timer <= 0) { sg.active = true; sg.x = w + 180; }
      } else {
        sg.x -= speed;
        if (sg.x < -440) {
          sg.active = false;
          sg.kind = (sg.kind + 1) % 4; // rotate through the four big boards
          sg.timer = 560 + Math.random() * 160; // next pass lands ~12-15s apart
        }
      }
      if (sg.active) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (sg.kind === 0) {
          // Big green board
          const pw = 310, ph = 96, px = sg.x, py = railY - 172;
          drawPost(px + 34, py + ph, 6);
          drawPost(px + pw - 40, py + ph, 6);
          ctx.fillStyle = '#0d6b35';
          ctx.strokeStyle = '#f2f4f8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 7); else ctx.rect(px, py, pw, ph);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 24px Arial, sans-serif';
          ctx.fillText('Welcome to Manhattan!', px + pw / 2, py + 32);
          ctx.font = 'italic 21px Georgia, serif';
          ctx.fillText('\u201CHello Gorgeous!\u201D', px + pw / 2, py + 67);
        } else if (sg.kind === 1) {
          // I-278 interstate shield
          const sw2 = 96, sh2 = 104, px = sg.x + 80, py = railY - 178;
          drawPost(px + sw2 / 2 - 3, py + sh2 - 4, 6);
          const shield = (inset) => {
            const x0 = px + inset, y0 = py + inset, ww = sw2 - inset * 2, hh = sh2 - inset * 2;
            ctx.beginPath();
            ctx.moveTo(x0, y0 + 8);
            ctx.quadraticCurveTo(x0 + ww / 2, y0 - 6, x0 + ww, y0 + 8);
            ctx.lineTo(x0 + ww, y0 + hh * 0.48);
            ctx.quadraticCurveTo(x0 + ww, y0 + hh * 0.82, x0 + ww / 2, y0 + hh);
            ctx.quadraticCurveTo(x0, y0 + hh * 0.82, x0, y0 + hh * 0.48);
            ctx.closePath();
          };
          shield(0);
          ctx.fillStyle = '#f2f4f8';
          ctx.fill();
          ctx.save();
          shield(4);
          ctx.clip();
          ctx.fillStyle = '#1d4fa1';
          ctx.fillRect(px, py, sw2, sh2);
          ctx.fillStyle = '#c8262d';
          ctx.fillRect(px, py, sw2, 30);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px Arial, sans-serif';
          ctx.fillText('INTERSTATE', px + sw2 / 2, py + 20);
          ctx.font = 'bold 38px Arial, sans-serif';
          ctx.fillText('278', px + sw2 / 2, py + 68);
          ctx.restore();
        } else if (sg.kind === 2) {
          // George Washington Bridge / I-95 North
          const pw = 320, ph = 96, px = sg.x, py = railY - 172;
          drawPost(px + 34, py + ph, 6);
          drawPost(px + pw - 40, py + ph, 6);
          ctx.fillStyle = '#0d6b35';
          ctx.strokeStyle = '#f2f4f8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 7); else ctx.rect(px, py, pw, ph);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 22px Arial, sans-serif';
          ctx.fillText('George Washington Bridge', px + pw / 2, py + 30);
          ctx.font = 'bold 24px Arial, sans-serif';
          ctx.fillText('\u2191 I-95 NORTH', px + pw / 2, py + 66);
        } else {
          // Distance board
          const pw = 290, ph = 100, px = sg.x, py = railY - 176;
          drawPost(px + 34, py + ph, 6);
          drawPost(px + pw - 40, py + ph, 6);
          ctx.fillStyle = '#0d6b35';
          ctx.strokeStyle = '#f2f4f8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 7); else ctx.rect(px, py, pw, ph);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 23px Arial, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('Yonkers', px + 26, py + 32);
          ctx.fillText('New York City', px + 26, py + 70);
          ctx.textAlign = 'right';
          ctx.fillText('1', px + pw - 26, py + 32);
          ctx.fillText('11', px + pw - 26, py + 70);
        }
        ctx.restore();
      }

      const sm = s.signSmall;
      if (!sm.active) {
        // Hold briefly if a big board is about to spawn on top of us
        const bigCrowding = sg.active && sg.x > w - 340;
        if (!bigCrowding && --sm.timer <= 0) { sm.active = true; sm.x = w + 140; }
      } else {
        sm.x -= speed;
        if (sm.x < -220) {
          sm.active = false;
          sm.kind = 1 - sm.kind;
          sm.timer = 120 + Math.random() * 35; // next pass ~6s after this one
        }
      }
      if (sm.active) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (sm.kind === 0) {
          // Speed limit
          const pw2 = 54, ph2 = 66, px = sm.x + 40, py = railY - 106;
          drawPost(px + pw2 / 2 - 3, py + ph2 - 3, 6);
          ctx.fillStyle = '#f2f4f8';
          ctx.strokeStyle = '#1a1d24';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(px, py, pw2, ph2, 5); else ctx.rect(px, py, pw2, ph2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#1a1d24';
          ctx.font = 'bold 11px Arial, sans-serif';
          ctx.fillText('SPEED', px + pw2 / 2, py + 13);
          ctx.fillText('LIMIT', px + pw2 / 2, py + 26);
          ctx.font = 'bold 27px Arial, sans-serif';
          ctx.fillText('50', px + pw2 / 2, py + 48);
        } else {
          // Yellow diamond: curve ahead
          const d2 = 62, cx2 = sm.x + 70, cy2 = railY - 108;
          drawPost(cx2 - 3, cy2 + d2 * 0.6, 6);
          ctx.save();
          ctx.translate(cx2, cy2);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = '#f2c744';
          ctx.strokeStyle = '#1a1d24';
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(-d2 / 2, -d2 / 2, d2, d2, 7); else ctx.rect(-d2 / 2, -d2 / 2, d2, d2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          ctx.strokeStyle = '#1a1d24'; // the curving arrow
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(cx2 - 8, cy2 + 15);
          ctx.quadraticCurveTo(cx2 - 9, cy2 - 4, cx2 + 6, cy2 - 9);
          ctx.stroke();
          ctx.fillStyle = '#1a1d24';
          ctx.beginPath();
          ctx.moveTo(cx2 + 14, cy2 - 11);
          ctx.lineTo(cx2 + 2, cy2 - 16);
          ctx.lineTo(cx2 + 4, cy2 - 2);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      // Guardrail over the sign posts: uprights, then the W-beam rails
      ctx.fillStyle = '#343a46';
      for (let x = -(s.roadOff % 92); x < w; x += 92) {
        ctx.fillRect(x, railY - 8, 6, 24);
      }
      ctx.fillStyle = '#5c6472';
      ctx.fillRect(0, railY - 7, w, 6);
      ctx.fillStyle = '#4a515e';
      ctx.fillRect(0, railY + 2, w, 5);
      ctx.fillStyle = 'rgba(205, 215, 232, 0.3)';
      ctx.fillRect(0, railY - 7, w, 1.5);
    }

    /* =====================================================================
       NIGHT DRIVE — first-person run up to the George Washington Bridge.
       Same cab, road and streetlights; the skyline is swapped for the GWB
       looming ahead with lit cables, a low Manhattan shoreline behind it,
       and dark trees rushing past on both shoulders.
       ===================================================================== */

    function buildGwbDrive(canvas) {
      const w = canvas.width, h = canvas.height;
      const horizon = h * 0.5;
      const shoreline = [];
      let sx2 = 0;
      while (sx2 < w * 0.46) {
        const bw = 14 + Math.random() * 30;
        const bh = 10 + Math.random() * 34;
        shoreline.push({
          x: sx2, w: bw, h: bh,
          lit: Array.from({ length: Math.max(1, Math.floor(bw * bh / 150)) }, () => ({
            dx: Math.random() * (bw - 4) + 2, dy: Math.random() * (bh - 6) + 3
          }))
        });
        sx2 += bw + Math.random() * 8 + 2;
      }
      return {
        w, h, horizon, shoreline,
        shoreTrees: Array.from({ length: 42 }, () => ({
          x: Math.random() * w * 0.5, r: Math.random() * 11 + 5
        })),
        cliffs: (() => {
          const pts = [];
          let cx3 = w * 0.545;
          while (cx3 < w + 40) {
            pts.push({ x: cx3, top: 24 + Math.random() * 26 });
            cx3 += 24 + Math.random() * 28;
          }
          return pts;
        })(),
        loneTower: {
          x: w * 0.86, w: 20, h: 88,
          lit: Array.from({ length: 14 }, () => ({
            dx: Math.random() * 16 + 2, dy: Math.random() * 80 + 4
          }))
        },
        waves: Array.from({ length: 14 }, () => ({
          fx: Math.random(), fy: Math.random(),
          len: Math.random() * 18 + 12, ph: Math.random() * Math.PI * 2
        })),
        stars: Array.from({ length: 60 }, () => ({
          x: Math.random() * w, y: Math.random() * horizon * 0.7,
          s: Math.random() < 0.3 ? 2 : 1, tw: Math.random() * Math.PI * 2
        })),
        plane: { x: -60, y: h * 0.07, dir: 1, blink: 0 },
        tufts: Array.from({ length: 26 }, () => ({
          p: Math.random(), side: Math.random() < 0.5 ? -1 : 1,
          lat: Math.random(), size: Math.random() * 0.7 + 0.6,
          shade: ['#0d1a12', '#101f16', '#0b1710'][Math.floor(Math.random() * 3)]
        })),
        trees: Array.from({ length: 32 }, () => {
          const blobs = Array.from({ length: 6 }, () => ({
            ox: Math.random() * 2 - 0.45,     // biased outward, away from the road
            oy: -(Math.random() * 0.9),
            rf: Math.random() * 0.45 + 0.5
          }));
          return {
            p: Math.random(), side: Math.random() < 0.5 ? -1 : 1,
            jit: Math.random() * 200,
            size: Math.random() * 0.7 + 0.9,
            shade: ['#07130c', '#0a1a10', '#0d2014'][Math.floor(Math.random() * 3)],
            blobs,
            inner: Math.min(...blobs.map(b => b.ox - b.rf)) // innermost edge, in r units
          };
        }),
        dashes: Array.from({ length: 10 }, (_, i) => ({ p: i / 10 })),
        poles: Array.from({ length: 6 }, (_, i) => ({ p: i / 6 })),
        carAhead: { sway: Math.random() * Math.PI * 2 },
        oncoming: { active: false, p: 0, timer: 260 },
        deckTraffic: Array.from({ length: 16 }, () => ({
          f: Math.random(), dir: Math.random() < 0.5 ? -1 : 1,
          speed: Math.random() * 0.0005 + 0.0004,
          deck: Math.random() < 0.5 ? 1 : 0,
          truck: Math.random() < 0.25
        }))
      };
    }

    function drawGwbDrive(ctx, canvas, s, t) {
      const { w, h, horizon } = s;
      const curve = Math.sin(t * 0.000065) * 70; // the road's slow S-bends
      const xc = (u) => w / 2 + curve * Math.pow(Math.max(0, 1 - u), 1.5);
      const half = (u) => 3 + (w * 0.46 - 3) * Math.pow(u, 1.7);
      const Y = (u) => horizon + (h - horizon) * u * u;

      ctx.clearRect(0, 0, w, h);
      drawNightSky(ctx, s, t, w, h, horizon, 0.5);

      // Left bank: the darker city shore — low blocks with trees between
      for (const b of s.shoreline) {
        ctx.fillStyle = '#0a0e1e';
        ctx.fillRect(b.x, horizon - b.h, b.w, b.h + 1);
        ctx.fillStyle = 'rgba(140, 158, 205, 0.3)';
