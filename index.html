    /* ---- Vaporwave branch multiplier ----
       Ten branches per corner instead of one: the two hand-placed originals
       stay on top, and nine clones per side <use> the same artwork at
       different sizes, tilts, depths and sway timings. Hand-tuned configs
       (not random) so the canopy looks the same on every load.
       off = distance past the corner edge; op < 1 pushes a branch "back". */
    const BRANCH_CLONES = [
      { w: 560, top: -70,  off: -90,  rot: -6,  scale: 0.85, amp: 1.2, dur: 6.4, delay: 0.8, op: 0.45 },
      { w: 520, top: -110, off: -30,  rot: 4,   scale: 0.80, amp: 1.1, dur: 7.1, delay: 1.1, op: 0.40 },
      { w: 470, top: -30,  off: -120, rot: 10,  scale: 0.70, amp: 1.6, dur: 5.6, delay: 2.1, op: 0.55 },
      { w: 430, top: 30,   off: -60,  rot: 22,  scale: 0.66, amp: 1.8, dur: 4.8, delay: 1.3, op: 0.70 },
      { w: 390, top: -85,  off: 40,   rot: -14, scale: 0.60, amp: 2.0, dur: 5.2, delay: 0.3, op: 0.75 },
      { w: 350, top: 85,   off: -70,  rot: 32,  scale: 0.55, amp: 2.2, dur: 4.4, delay: 1.7, op: 0.80 },
      { w: 320, top: 5,    off: 70,   rot: 8,   scale: 0.50, amp: 1.9, dur: 5.9, delay: 2.6, op: 0.85 },
      { w: 300, top: 150,  off: -45,  rot: 44,  scale: 0.50, amp: 2.4, dur: 4.2, delay: 0.6, op: 0.80 },
      { w: 360, top: -15,  off: 115,  rot: -3,  scale: 0.55, amp: 1.5, dur: 6.7, delay: 3.0, op: 0.65 }
    ];

    function buildVaporwaveBranches() {
      const bg = document.getElementById('vaporwaveBg');
      if (!bg) return;
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const sides = [
        { artId: '#branchLeftArt',  cls: 'branch-left',  edge: 'left',  anchor: bg.querySelector('.branch-left') },
        { artId: '#branchRightArt', cls: 'branch-right', edge: 'right', anchor: bg.querySelector('.branch-right') }
      ];

      sides.forEach((side, s) => {
        BRANCH_CLONES.forEach((c) => {
          const svg = document.createElementNS(SVG_NS, 'svg');
          svg.setAttribute('viewBox', '0 0 500 400');
          svg.setAttribute('class', `branch ${side.cls}`);
          svg.setAttribute('aria-hidden', 'true');

          const use = document.createElementNS(SVG_NS, 'use');
          use.setAttribute('href', side.artId);
          svg.appendChild(use);

          svg.style.width = c.w + 'px';
          svg.style.top = c.top + 'px';
          svg.style[side.edge] = c.off + 'px';
          svg.style.opacity = c.op;
          svg.style.setProperty('--br-scale', c.scale);
          // Mirror the tilt on the right so the two corners don't move in lockstep
          svg.style.setProperty('--br-rot', (s === 0 ? c.rot : -c.rot) + 'deg');
          svg.style.setProperty('--br-amp', c.amp + 'deg');
          svg.style.animationDuration = (c.dur + s * 0.45).toFixed(2) + 's';
          // Negative delays start each branch mid-sway, so nothing sits
          // frozen waiting for its first cycle.
          svg.style.animationDelay = '-' + (c.delay + s * 0.9).toFixed(2) + 's';

          // Insert before the original so the hand-placed branch stays on top
          bg.insertBefore(svg, side.anchor);
        });
      });
    }

    let themeSwapTimer = null;
    let themeSwapEndTimer = null;

    /* Build the falling/rising glyphs for a transition, if the theme uses any */
    function buildTransitionParticles(cfg, host) {
      if (!cfg.glyphs.length) return;

      const frag = document.createDocumentFragment();
      for (let i = 0; i < TT_PARTICLES; i++) {
        const p = document.createElement('span');
        p.className = cfg.mode === 'fall' ? 'tt-particle fall' : 'tt-particle';
        p.textContent = cfg.glyphs[Math.floor(Math.random() * cfg.glyphs.length)];
        p.style.left = (Math.random() * 94 + 1) + '%';
        p.style.fontSize = (Math.random() * 20 + 18) + 'px';
        // Keep delay + duration inside TT_DURATION so nothing is cut off mid-flight
        const dur = Math.round(Math.random() * 150 + 560);
        p.style.animationDuration = dur + 'ms';
        p.style.animationDelay = Math.round(Math.random() * (TT_DURATION - dur)) + 'ms';
        p.style.setProperty('--spin', Math.round(Math.random() * 400 - 200) + 'deg');
        frag.appendChild(p);
      }
      host.appendChild(frag);
    }

    // Runs the themed curtain, then swaps the background behind it.
    // Rapid changes re-arm both timers; only the final theme applies.
    function selectTheme(targetTheme) {
      const cfg = THEME_TRANSITIONS[targetTheme] || THEME_TRANSITIONS[DEFAULT_THEME];
      const tt = document.getElementById('themeTransition');
      const host = document.getElementById('ttParticles');

      // Mirror the CSS reduced-motion override so the swap still lands behind the veil
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const duration = reduced ? 300 : TT_DURATION;
      const applyAt = reduced ? 140 : TT_APPLY_AT;

      clearTimeout(themeSwapTimer);
      clearTimeout(themeSwapEndTimer);

      // Strip the classes and force a reflow so the animations restart cleanly
      host.replaceChildren();
      tt.className = 'theme-transition';
      void tt.offsetWidth;
      tt.className = `theme-transition ${cfg.cls} active`;
      buildTransitionParticles(cfg, host);

      themeSwapTimer = setTimeout(() => applyTheme(targetTheme), applyAt);
      themeSwapEndTimer = setTimeout(() => {
        tt.classList.remove('active');
        host.replaceChildren();
      }, duration);
    }

    /* Mouse-wheel theme scrubbing over the dropdown.
       A native <select> popup is drawn by the OS and can't be scripted, so the
       wheel steps the selection itself; the theme applies once the wheel rests. */
    (function attachThemeWheel() {
      const sel = document.getElementById('themeSelect');
      if (!sel) return;

      let wheelTimer = null;
      let accum = 0;

      sel.addEventListener('wheel', (e) => {
        e.preventDefault();

        // Normalize line/page scrolling to pixel-ish units
        const raw = e.deltaMode === 1 ? e.deltaY * 16
                  : e.deltaMode === 2 ? e.deltaY * 100
                  : e.deltaY;

        if (!raw) return;                                        // horizontal / no-op scroll
        if (accum !== 0 && (accum > 0) !== (raw > 0)) accum = 0; // direction flip
        accum += raw;
        if (Math.abs(accum) < 12) return;

        const step = accum > 0 ? 1 : -1;
        accum = 0;

        let idx = THEMES.findIndex(t => t.id === sel.value);
        if (idx < 0) idx = 0;
        idx = (idx + step + THEMES.length) % THEMES.length;
        sel.value = THEMES[idx].id;

        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => selectTheme(sel.value), 200);
      }, { passive: false });
    })();

    function applyTheme(themeId) {
      const themeObj = THEMES.find(t => t.id === themeId) || THEMES[0];
      currentThemeIndex = THEMES.indexOf(themeObj);

      THEMES.forEach(t => { if (t.id) document.body.classList.remove(t.id); });
      document.body.classList.remove('theme-mono');

      if (themeObj.id) {
        document.body.classList.add(themeObj.id);
      } else {
        // Monochrome has no palette class of its own (it rides the :root
        // defaults), but it still needs a hook for the card shine.
        document.body.classList.add('theme-mono');
      }

      // Default the mouse coordinates for the red theme in case mouse hasn't moved
      if (themeObj.id === 'theme-red') {
          document.body.style.setProperty('--mouse-x', `${window.innerWidth / 2}px`);
          document.body.style.setProperty('--mouse-y', `${window.innerHeight / 2}px`);
      }

      document.getElementById('themeSelect').value = themeObj.id;
      localStorage.setItem('bingoTheme', themeObj.id);

      // Keep the auto-save in sync, otherwise a theme picked after the last
      // card interaction would revert on reload (the auto-save's theme wins).
      const savedCard = localStorage.getItem('bingoCardAutoSave');
      if (savedCard) {
        try {
          const d = JSON.parse(savedCard);
          d.theme = themeObj.id;
          localStorage.setItem('bingoCardAutoSave', JSON.stringify(d));
        } catch (e) { /* corrupt save; ignore */ }
      }

      Object.values(EFFECTS).forEach(fx => fx.stop());
      if (EFFECTS[themeObj.id]) EFFECTS[themeObj.id].start();
    }

    function renderGrid(cellDataArray) {
      const gridContainer = document.getElementById('bingoGrid');
      const frag = document.createDocumentFragment();

      cellDataArray.forEach((item) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.id = item.id;

        if (item.text.trim().toUpperCase() === 'FREE') {
          cell.classList.add('free');
        }
        if (item.marked) cell.classList.add('marked');
        if (item.target) cell.classList.add('target');

        cell.innerText = item.text;
        frag.appendChild(cell);
      });

      gridContainer.innerHTML = '';
      gridContainer.appendChild(frag);
    }

    // Single delegated pair of listeners instead of 50 per-cell listeners
    // recreated on every render.
    (function attachGridListeners() {
      const gridContainer = document.getElementById('bingoGrid');

      gridContainer.addEventListener('click', (e) => {
        const cell = e.target.closest('.cell');
        if (!cell || isEditingCard) return;
        cell.classList.toggle(currentMode === 'mark' ? 'marked' : 'target');
        saveToLocalStorage();
        checkAutoVictory();
      });

      gridContainer.addEventListener('contextmenu', (e) => {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        e.preventDefault();
        if (isEditingCard) return;
        cell.classList.toggle('target');
        saveToLocalStorage();
        checkAutoVictory();
      });
    })();

    // ---- Card + menu drag: grab the card (anywhere but a grid cell or an
    // in-progress edit-mode input) and the whole panel — card and control
    // buttons together — follows as one unit, dropped anywhere on screen.
    // Dragging the *panel* (not just the card) keeps them glued together
    // instead of the controls re-centering on their own once the card
    // leaves the flex row. The panel's on-screen size is frozen at the
    // instant a drag begins, so nothing snaps or reflows at pickup. The
    // dropped position persists across reloads. ----
    (function setupCardDrag() {
      const card = document.getElementById('bingoCardElement');
      const panel = document.querySelector('.app-container');
      if (!card || !panel) return;
      let dragging = false, moved = false;
      let startX = 0, startY = 0, origLeft = 0, origTop = 0;

      function blocked(target) {
        return !!(target.closest('.grid') || target.closest('input'));
      }

      // Keep a grabbable slice of the *card* on screen rather than demanding
      // the whole panel fit. On a phone the stacked card+controls panel is
      // taller than the viewport, and the old whole-panel rule collapsed to
      // "top must be 0", which is why it wouldn't move vertically at all.
      const KEEP = 64;
      function clamp(left, top) {
        const cardRect = card.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();
        const offX = cardRect.left - panelRect.left;   // card's offset inside
        const offY = cardRect.top - panelRect.top;     // the panel (constant)
        const cw = cardRect.width, ch = cardRect.height;
        const minLeft = KEEP - offX - cw;
        const maxLeft = window.innerWidth - KEEP - offX;
        const minTop = KEEP - offY - ch;
        const maxTop = window.innerHeight - KEEP - offY;
        return [
          Math.min(Math.max(left, minLeft), Math.max(minLeft, maxLeft)),
          Math.min(Math.max(top, minTop), Math.max(minTop, maxTop))
        ];
      }

      // Freeze the panel's current rendered box exactly as-is, then switch
      // it to fixed positioning at that same box — card and controls keep
      // whatever spacing/centering they already had, nothing resizes.
      function pinToFixed() {
        const rect = panel.getBoundingClientRect();
        panel.style.position = 'fixed';
        panel.style.margin = '0';
        panel.style.width = rect.width + 'px';
        panel.style.maxWidth = 'none';
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
        panel.style.zIndex = '5';
        panel.style.left = rect.left + 'px';
        panel.style.top = rect.top + 'px';
        return rect;
      }

      function beginDrag(clientX, clientY, target) {
        if (blocked(target)) return false;
        const rect = pinToFixed();
        startX = clientX; startY = clientY;
        origLeft = rect.left; origTop = rect.top;
        dragging = true; moved = false;
        card.classList.add('dragging');
        return true;
      }

      function moveDrag(clientX, clientY) {
        if (!dragging) return;
        const dx = clientX - startX, dy = clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        const [left, top] = clamp(origLeft + dx, origTop + dy);
        panel.style.left = left + 'px';
        panel.style.top = top + 'px';
      }

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        card.classList.remove('dragging');
        if (moved) {
          localStorage.setItem('bingoPanelPos', JSON.stringify({ left: panel.style.left, top: panel.style.top }));
        }
      }

      // Pointer Events handle mouse, touch and stylus through one path.
      // The old split mouse/touch version couldn't work on a phone: its
      // touchstart was passive (so it could never claim the gesture) and
      // touch-action was only set *after* a drag began, by which time the
      // browser had already committed the swipe to scrolling. Capturing the
      // pointer also keeps the drag alive when the finger outruns the card.
      let activePointer = null;

      card.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (!beginDrag(e.clientX, e.clientY, e.target)) return;
        activePointer = e.pointerId;
        try { card.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
        e.preventDefault();
      });

      card.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activePointer) return;
        moveDrag(e.clientX, e.clientY);
        e.preventDefault();
      });

      function releasePointer(e) {
        if (e.pointerId !== activePointer) return;
        try { card.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
        activePointer = null;
        endDrag();
      }
      card.addEventListener('pointerup', releasePointer);
      card.addEventListener('pointercancel', releasePointer);

      window.addEventListener('resize', () => {
        if (panel.style.position !== 'fixed') return;
        const [left, top] = clamp(parseFloat(panel.style.left) || 0, parseFloat(panel.style.top) || 0);
        panel.style.left = left + 'px';
        panel.style.top = top + 'px';
      });

      // Drop every inline override so the panel falls back into its normal
      // centered flex layout, and forget the saved drop point.
      window.resetPanelPosition = function () {
        dragging = false;
        activePointer = null;
        card.classList.remove('dragging');
        panel.style.position = '';
        panel.style.left = '';
        panel.style.top = '';
        panel.style.right = '';
        panel.style.bottom = '';
        panel.style.margin = '';
        panel.style.width = '';
        panel.style.maxWidth = '';
        panel.style.zIndex = '';
        localStorage.removeItem('bingoPanelPos');
      };

      // Restore a dropped position from a previous visit, clamped in case
      // the viewport is now smaller than it was.
      const saved = localStorage.getItem('bingoPanelPos');
      if (saved) {
        try {
          const pos = JSON.parse(saved);
          const preRect = panel.getBoundingClientRect();
          panel.style.position = 'fixed';
          panel.style.margin = '0';
          panel.style.width = preRect.width + 'px';
          panel.style.maxWidth = 'none';
          panel.style.right = 'auto';
          panel.style.bottom = 'auto';
          panel.style.zIndex = '5';
          panel.style.left = pos.left;
          panel.style.top = pos.top;
          const [left, top] = clamp(parseFloat(pos.left) || 0, parseFloat(pos.top) || 0);
          panel.style.left = left + 'px';
          panel.style.top = top + 'px';
        } catch (e) {
          console.error('Failed to restore panel position', e);
        }
      }
    })();

    // ---- Hide/unhide toggle for the card + controls panel ----
    let uiHidden = false;
    function toggleUIVisibility() {
      uiHidden = !uiHidden;
      document.body.classList.toggle('ui-hidden', uiHidden);
      const btn = document.getElementById('hideUiBtn');
      btn.textContent = uiHidden ? '🙈' : '👁️';
      btn.classList.toggle('active', uiHidden);
      const label = uiHidden ? 'Show bingo card & controls' : 'Hide bingo card & controls';
      btn.title = label;
      btn.setAttribute('aria-label', label);
      localStorage.setItem('bingoUiHidden', uiHidden ? '1' : '0');
    }
    (function restoreUiHiddenState() {
      if (localStorage.getItem('bingoUiHidden') === '1') toggleUIVisibility();
    })();

    function loadPresetLayout(key) {
      if (!PRESET_LAYOUTS[key]) return;
      if (isEditingCard) toggleEditCard();

      const cleanPreset = PRESET_LAYOUTS[key].map(cell => ({
        ...cell,
        marked: cell.text.toUpperCase() === 'FREE',
        target: false
      }));

      renderGrid(cleanPreset);
      saveToLocalStorage();
      showStatus(key === 'CONOR' ? 'Loaded default layout (Conor)!' : `Loaded "${key}" layout!`);
    }

    // The closed dropdown reads "Layouts: Default"; while the menu is open,

    (function initLayoutSelect() {
      const sel = document.getElementById('layoutSelect');
      const conorOpt = document.getElementById('conorOption');
      const showName = () => { conorOpt.textContent = 'Conor'; };
      const showLabel = () => { if (sel.value === 'CONOR') conorOpt.textContent = 'Layouts: Default'; };
      sel.addEventListener('mousedown', showName);

    function toggleEditCard() {
      const btn = document.getElementById('toggleEditBtn');
      const bingoCard = document.getElementById('bingoCardElement');
      const cells = document.querySelectorAll('.cell');

      isEditingCard = !isEditingCard;

      if (isEditingCard) {
        btn.innerText = 'Save Layout';
        btn.classList.add('active');
        bingoCard.classList.add('editing-mode');
        showStatus('Editing Mode: Type cell values below');

        cells.forEach(cell => {
          const currentText = cell.innerText.trim();
          cell.innerText = '';
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'edit-input';
          input.value = currentText;

          input.addEventListener('focus', () => input.select());
          cell.appendChild(input);
        });
      } else {
        btn.innerText = 'Edit Card Layout';
        btn.classList.remove('active');
        bingoCard.classList.remove('editing-mode');

        cells.forEach(cell => {
          const input = cell.querySelector('input.edit-input');
          if (input) {
            const val = input.value.trim() || '';
            cell.innerText = val;
            if (val.toUpperCase() === 'FREE') cell.classList.add('free');
            else cell.classList.remove('free');
          }
        });

        saveToLocalStorage();
        showStatus('Layout updated & saved!');
      }
    }

    function toggleMode() {
      if (isEditingCard) toggleEditCard();

      const btn = document.getElementById('toggleToolBtn');
      if (currentMode === 'mark') {
        currentMode = 'target';
        btn.innerText = 'Mode: Set Target';
        btn.classList.add('active');
      } else {
        currentMode = 'mark';
        btn.innerText = 'Mode: Mark Spot';
        btn.classList.remove('active');
      }
    }

    function changeDabber(style) {
      document.body.setAttribute('data-dabber', style);
      localStorage.setItem('bingoDabberStyle', style);
    }

    function changeDabberColor(colorHex) {
      document.documentElement.style.setProperty('--dabber-color', colorHex);
      localStorage.setItem('bingoDabberColor', colorHex);
    }

    function changeTargetColor(colorHex) {
      document.documentElement.style.setProperty('--target-color', colorHex);
      localStorage.setItem('bingoTargetColor', colorHex);
    }

    const clampPct = (v, lo, hi, fallback) => {
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : fallback;
    };

    function changeDabberOpacity(value) {
      const pct = clampPct(value, 10, 100, 55);
      document.documentElement.style.setProperty('--dabber-opacity', (pct / 100).toFixed(2));
      document.getElementById('dabberOpacityVal').textContent = pct + '%';
      document.getElementById('dabberOpacity').value = pct;
      localStorage.setItem('bingoDabberOpacity', String(pct));
    }

    function changeDabberSize(value) {
      const pct = clampPct(value, 50, 140, 100);
      document.documentElement.style.setProperty('--dabber-scale', (pct / 100).toFixed(2));
      document.getElementById('dabberSizeVal').textContent = pct + '%';
      document.getElementById('dabberSize').value = pct;
      localStorage.setItem('bingoDabberSize', String(pct));
    }

    /* 100 = untouched. Below that we lay black over the background, above it
       white — the veil only covers the backdrop, never the card or controls.
       Driven by the Backdrop slider (40–160%). */
    function changeBrightness(value) {
      const pct = clampPct(value, 40, 160, 100);
      const root = document.documentElement.style;

      if (pct < 100) {
        root.setProperty('--bg-veil-color', '#000000');
        root.setProperty('--bg-veil-opacity', (((100 - pct) / 60) * 0.85).toFixed(3));
      } else if (pct > 100) {
        root.setProperty('--bg-veil-color', '#ffffff');
        root.setProperty('--bg-veil-opacity', (((pct - 100) / 60) * 0.5).toFixed(3));
      } else {
        root.setProperty('--bg-veil-opacity', '0');
      }

      const slider = document.getElementById('backdropRange');
      const valEl = document.getElementById('backdropVal');
      const labelEl = document.getElementById('backdropLabel');
      if (slider) slider.value = pct;
      if (valEl) valEl.textContent = pct + '%';
      if (labelEl) labelEl.textContent = (pct < 100 ? '🌙' : pct > 100 ? '🔆' : '☀') + ' Backdrop';

      localStorage.setItem('bingoBrightness', String(pct));
    }

    function checkAutoVictory() {
      const targets = document.querySelectorAll('.cell.target');
      if (targets.length === 0) return;

      const allTargetsMarked = Array.from(targets).every(cell => cell.classList.contains('marked'));
      if (allTargetsMarked) {
        triggerVictory(false);
      }
    }

    function getCardData() {
      const state = [];
      document.querySelectorAll('.cell').forEach(cell => {
        let cellText = '';
        if (isEditingCard) {
          const input = cell.querySelector('input.edit-input');
          cellText = input ? input.value.trim() : cell.innerText.trim();
        } else {
          cellText = cell.innerText.trim();
        }

        state.push({
          id: cell.dataset.id,
          text: cellText,
          marked: cell.classList.contains('marked'),
          target: cell.classList.contains('target')
        });
      });

      return {
        version: "2.0",
        dabber: document.body.getAttribute('data-dabber') || 'stamp',
        dabberColor: getComputedStyle(document.documentElement).getPropertyValue('--dabber-color').trim() || '#04ff00',
        targetColor: getComputedStyle(document.documentElement).getPropertyValue('--target-color').trim() || '#ff007f',
        dabberOpacity: clampPct(document.getElementById('dabberOpacity').value, 10, 100, 55),
        dabberSize: clampPct(document.getElementById('dabberSize').value, 50, 140, 100),
        theme: THEMES[currentThemeIndex].id,
        timestamp: new Date().toISOString(),
        cells: state
      };
    }

    function applyCardData(data) {
      if (!data || !Array.isArray(data.cells)) return false;
      
      if (data.dabber) {
        changeDabber(data.dabber);
        document.getElementById('dabberSelect').value = data.dabber;
      }

      if (data.dabberColor) {
        changeDabberColor(data.dabberColor);
        document.getElementById('dabberColorPicker').value = data.dabberColor;
      }

      // Older .bingo files predate the target color; fall back to the classic pink
      const targetColor = data.targetColor || localStorage.getItem('bingoTargetColor') || '#ff007f';
      changeTargetColor(targetColor);
      document.getElementById('targetColorPicker').value = targetColor;

      // Older .bingo files predate these — fall back to stored prefs, then defaults
      changeDabberOpacity(data.dabberOpacity !== undefined
        ? data.dabberOpacity : (localStorage.getItem('bingoDabberOpacity') || 55));
      changeDabberSize(data.dabberSize !== undefined
        ? data.dabberSize : (localStorage.getItem('bingoDabberSize') || 100));

      if (data.theme !== undefined) {
        applyTheme(data.theme);
      } else {
        applyTheme(DEFAULT_THEME);
      }

      renderGrid(data.cells);
      saveToLocalStorage();
      return true;
    }

    function saveToLocalStorage() {
      localStorage.setItem('bingoCardAutoSave', JSON.stringify(getCardData()));
    }

    function loadFromLocalStorage() {
      // Brightness is a per-screen viewing preference, not part of a card,
      // so it restores independently of any auto-save or imported file.
      changeBrightness(localStorage.getItem('bingoBrightness') || 100);

      // A full auto-save carries theme, dabber, color, and cells — apply once.
      const saved = localStorage.getItem('bingoCardAutoSave');
      if (saved) {
        try {
          if (applyCardData(JSON.parse(saved))) return;
        } catch (e) {
          console.error("Failed to load auto-save state", e);
        }
      }

      // Fallback: no valid auto-save, apply individually saved settings.
      const savedTheme = localStorage.getItem('bingoTheme');
      applyTheme(savedTheme !== null ? savedTheme : DEFAULT_THEME);

      const savedDabber = localStorage.getItem('bingoDabberStyle');
      if (savedDabber) {
        changeDabber(savedDabber);
        document.getElementById('dabberSelect').value = savedDabber;
      } else {
        changeDabber('stamp');
      }

      const savedColor = localStorage.getItem('bingoDabberColor');
      if (savedColor) {
        changeDabberColor(savedColor);
        document.getElementById('dabberColorPicker').value = savedColor;
      }

      const savedTargetColor = localStorage.getItem('bingoTargetColor');
      if (savedTargetColor) {
        changeTargetColor(savedTargetColor);
        document.getElementById('targetColorPicker').value = savedTargetColor;
      }

      changeDabberOpacity(localStorage.getItem('bingoDabberOpacity') || 55);
      changeDabberSize(localStorage.getItem('bingoDabberSize') || 100);
    }

    async function exportToFile() {
      if (isEditingCard) toggleEditCard();

      const cardData = getCardData();
      const jsonString = JSON.stringify(cardData, null, 2);
      const defaultFilename = `bingo-layout-${new Date().toISOString().slice(0, 10)}.bingo`;

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: defaultFilename,
            types: [{
              description: 'Bingo Layout File',
              accept: { 'application/json': ['.bingo', '.json'] },
            }],
          });
          const writable = await handle.createWritable();
          await writable.write(jsonString);
          await writable.close();
          showStatus('Layout saved successfully!');
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const blob = new Blob([jsonString], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = defaultFilename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);

      showStatus(`Saved: ${defaultFilename}`);
    }

    function importFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (applyCardData(data)) {
            showStatus(`Loaded "${file.name}"!`);
          } else {
            showStatus('Error: Invalid file format.');
          }
        } catch (err) {
          showStatus('Error reading file.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function clearDabs() {
      if (isEditingCard) toggleEditCard();

      // Clear all dabber marks between rounds, but keep the card layout
      // and any target pattern. FREE space stays dabbed.
      document.querySelectorAll('#bingoGrid .cell').forEach(cell => {
        cell.classList.toggle('marked', cell.classList.contains('free'));
      });

      saveToLocalStorage();
      showStatus('Dabs cleared — card kept!');
    }

    function resetCard() {
      if (isEditingCard) toggleEditCard();

      renderGrid(PRESET_LAYOUTS.CONOR);
      document.getElementById('layoutSelect').value = 'CONOR';
      // A reset should put the card back where it started, too — otherwise a
      // card dragged into a corner stays there looking broken after a reset.
      if (typeof resetPanelPosition === 'function') resetPanelPosition();
      saveToLocalStorage();
      showStatus('Reset to the default layout and position.');
    }

    function showStatus(msg) {
      const el = document.getElementById('statusMsg');
      el.innerText = msg;
      setTimeout(() => { el.innerText = ''; }, 3000);
    }

    function triggerVictory(manualClick = false) {
      const overlay = document.getElementById('victoryOverlay');
      if (overlay.classList.contains('show')) return; // already celebrating

      const targets = document.querySelectorAll('.cell.target');
      const descEl = document.getElementById('victoryDesc');

      if (targets.length === 0) {
        descEl.innerText = "Bonus Victory Unlocked!";
      } else {
        const markedCount = Array.from(targets).filter(cell => cell.classList.contains('marked')).length;
        if (markedCount === targets.length) {
          descEl.innerText = "Target pattern completed!";
        } else if (manualClick) {
          descEl.innerText = `Victory claimed! (${markedCount}/${targets.length} target spots marked)`;
        } else {
          return;
        }
      }

      overlay.classList.add('show');
      startConfetti();
    }

    // Quality of life: close the victory overlay with Escape or by
    // clicking anywhere outside the winner card.
    document.getElementById('victoryOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'victoryOverlay') closeVictory();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeVictory();
    });

    function closeVictory() {
      document.getElementById('victoryOverlay').classList.remove('show');
      stopConfetti();
    }

    let confettiAnimationId = null;
    let particles = [];

    function startConfetti() {
      stopConfetti(); // guard: never stack a second render loop
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#ff007f', '#00f0ff', '#facc15', '#10b981', '#a855f7'];
      particles = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: Math.random() * 3 + 2,
        speedX: Math.random() * 2 - 1,
        angle: Math.random() * 360
      }));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.angle += 2;
          if (p.y > canvas.height) p.y = -10;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.angle * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        confettiAnimationId = requestAnimationFrame(render);
      }
      render();
    }

    function stopConfetti() {
      if (confettiAnimationId) {
        cancelAnimationFrame(confettiAnimationId);
        confettiAnimationId = null;
      }
    }

    /* ---- Unified falling-petal engine ----
       One particle system drives both the Sakura and Vaporwave petals;
       each theme supplies its own petal factory (movement + draw style). */

    function makeSakuraPetal(w, h) {
      const colors = ['#ffb7c5', '#ff9ebb', '#ffe4e1', '#f3a4b5', '#ffd1dc'];
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 7 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: Math.random() * 1.5 + 0.8,
        speedX: Math.random() * 0.8 + 0.2,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 1.5,
        oscillation: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y += this.speedY;
          this.oscillation += 0.02;
          this.x += this.speedX + Math.sin(this.oscillation) * 0.7;
          this.angle += this.spin;
          if (this.y > h + 20) { this.y = -20; this.x = Math.random() * w; }
          if (this.x > w + 20) { this.x = -20; }
        },

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.angle * Math.PI) / 180);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = 0.8;
          ctx.beginPath();
          ctx.moveTo(0, -this.size);
          ctx.bezierCurveTo(this.size / 2, -this.size, this.size, -this.size / 3, this.size / 2, this.size);
          ctx.bezierCurveTo(0, this.size / 2, -this.size / 2, this.size / 2, -this.size / 2, this.size);
          ctx.bezierCurveTo(-this.size, -this.size / 3, -this.size / 2, -this.size, 0, -this.size);
          ctx.fill();
          ctx.restore();
        }
      };
    }

    function makeVaporPetal(w, h) {
      return {
        x: Math.random() * w,
        y: Math.random() * h - h,
        size: Math.random() * 0.4 + 0.2,
        speedY: Math.random() * 1.5 + 1,
        speedX: Math.random() * 2 - 1,
        rotation: Math.random() * 360,
        rotationSpeed: Math.random() * 2 - 1,
        sway: Math.random() * 0.02,
        angle: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y += this.speedY;
          this.angle += this.sway;
          this.x += this.speedX + Math.sin(this.angle) * 1.5;
          this.rotation += this.rotationSpeed;
          if (this.y > h + 20 || this.x > w + 20 || this.x < -20) {
            this.y = -20;
            this.x = Math.random() * w;
          }
        },

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.scale(this.size, this.size);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-10, -10, -14, -28, 0, -32);
          ctx.bezierCurveTo(14, -28, 10, -10, 0, 0);
          const grad = ctx.createLinearGradient(0, -32, 0, 0);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(1, '#ffc3cf'); /* lightened from #ff9eb0 */
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.restore();
        }
      };
    }

    /* Same falling petals as the daylight desert, but catching moonlight
       instead of sun — cool violet edges over a pale core, and a faint
       glow so they still read against a near-black sky. */
    function makeVaporPetalDark(w, h) {
      const p = makeVaporPetal(w, h);
      p.glow = Math.random() * 0.35 + 0.35;
      p.draw = function (ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.scale(this.size, this.size);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-10, -10, -14, -28, 0, -32);
        ctx.bezierCurveTo(14, -28, 10, -10, 0, 0);
        const grad = ctx.createLinearGradient(0, -32, 0, 0);
        grad.addColorStop(0, '#e8dcff');
        grad.addColorStop(0.55, '#c77dff');
        grad.addColorStop(1, '#7209b7');
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(199, 125, 255, ' + this.glow + ')';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();
      };
      return p;
    }

    /* Shared path helpers for the themed particles */
    function traceHeart(ctx, w, h) {
      const x = -w / 2, y = -h / 2;
      ctx.moveTo(x, y + h / 4);
      ctx.quadraticCurveTo(x, y, x + w / 4, y);
      ctx.quadraticCurveTo(x + w / 2, y, x + w / 2, y + h / 4);
      ctx.quadraticCurveTo(x + w / 2, y, x + (3 * w) / 4, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + h / 4);
      ctx.quadraticCurveTo(x + w, y + h / 2, x + (3 * w) / 4, y + (3 * h) / 4);
      ctx.lineTo(x + w / 2, y + h);
      ctx.lineTo(x + w / 4, y + (3 * h) / 4);
      ctx.quadraticCurveTo(x, y + h / 2, x, y + h / 4);
    }

    function traceSpark(ctx, r) {
      const k = r * 0.3;
      ctx.moveTo(0, -r);
      ctx.lineTo(k, -k);
      ctx.lineTo(r, 0);
      ctx.lineTo(k, k);
      ctx.lineTo(0, r);
      ctx.lineTo(-k, k);
      ctx.lineTo(-r, 0);
      ctx.lineTo(-k, -k);
      ctx.closePath();
    }

    /* Pink Girly: rising kawaii hearts + twinkling sparkles */
    function makeHeartSpark(w, h) {
      const isSpark = Math.random() < 0.3;
      const heartColors = ['#ff8fc7', '#ff5fa2', '#ffc2dd', '#ffffff', '#e0218a', '#ffb3f2'];
      return {
        kind: isSpark ? 'spark' : 'heart',
        x: Math.random() * w,
        y: Math.random() * h,
        size: isSpark ? Math.random() * 4 + 3 : Math.random() * 11 + 7,
        color: isSpark ? (Math.random() < 0.5 ? '#ffffff' : '#ffe066') : heartColors[Math.floor(Math.random() * heartColors.length)],
        speedY: isSpark ? Math.random() * 0.25 + 0.05 : Math.random() * 0.9 + 0.4,
        drift: Math.random() * 0.6 - 0.3,
        angle: Math.random() * 30 - 15,
        wobble: Math.random() * Math.PI * 2,
        twinkle: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y -= this.speedY;              // hearts float UP like bubbles
          this.wobble += 0.03;
          this.twinkle += 0.08;
          this.x += this.drift + Math.sin(this.wobble) * 0.5;
          if (this.y < -25) { this.y = h + 25; this.x = Math.random() * w; }
          if (this.x > w + 25) this.x = -25;
          if (this.x < -25) this.x = w + 25;
        },

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          if (this.kind === 'heart') {
            ctx.rotate(((this.angle + Math.sin(this.wobble) * 10) * Math.PI) / 180);
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            traceHeart(ctx, this.size, this.size);
            ctx.fill();
          } else {
            ctx.globalAlpha = 0.35 + Math.abs(Math.sin(this.twinkle)) * 0.65;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            traceSpark(ctx, this.size);
            ctx.fill();
          }
          ctx.restore();
        }
      };
    }

    /* Lucky Green: drifting shamrocks + gold glints */
    function makeShamrock(w, h) {
      const isGold = Math.random() < 0.22;
      const greens = ['#22c55e', '#16a34a', '#4ade80', '#15803d', '#86efac'];
      return {
        kind: isGold ? 'gold' : 'shamrock',
        x: Math.random() * w,
        y: Math.random() * h,
        size: isGold ? Math.random() * 4 + 3 : Math.random() * 8 + 8,
        color: isGold ? '#ffd970' : greens[Math.floor(Math.random() * greens.length)],
        speedY: isGold ? Math.random() * 0.2 + 0.05 : Math.random() * 0.8 + 0.5,
        drift: Math.random() * 0.5 - 0.25,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 1.2,
        wobble: Math.random() * Math.PI * 2,
        twinkle: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y += this.speedY;              // shamrocks fall gently
          this.wobble += 0.02;
          this.twinkle += 0.07;
          this.x += this.drift + Math.sin(this.wobble) * 0.6;
          this.angle += this.spin;
          if (this.y > h + 25) { this.y = -25; this.x = Math.random() * w; }
          if (this.x > w + 25) this.x = -25;
          if (this.x < -25) this.x = w + 25;
        },

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          if (this.kind === 'shamrock') {
            ctx.rotate((this.angle * Math.PI) / 180);
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = this.color;
            for (let i = 0; i < 3; i++) {
              ctx.save();
              ctx.rotate((i * 2 * Math.PI) / 3);
              ctx.translate(0, -this.size * 0.52);
              ctx.beginPath();
              traceHeart(ctx, this.size, this.size);
              ctx.fill();
              ctx.restore();
            }
            ctx.strokeStyle = this.color;
            ctx.lineWidth = Math.max(1, this.size * 0.12);
            ctx.beginPath();
            ctx.moveTo(0, this.size * 0.1);
            ctx.quadraticCurveTo(this.size * 0.25, this.size * 0.55, this.size * 0.45, this.size * 0.85);
            ctx.stroke();
          } else {
            ctx.globalAlpha = 0.3 + Math.abs(Math.sin(this.twinkle)) * 0.7;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            traceSpark(ctx, this.size);
            ctx.fill();
          }
          ctx.restore();
        }
      };
    }

    /* Blood Red: flapping bats + rising embers 🧛 */
    function makeBatEmber(w, h) {
      const isBat = Math.random() < 0.15;
      if (isBat) {
        return {
          x: Math.random() * w,
          baseY: Math.random() * h * 0.55 + h * 0.05,
          y: 0,
          dir: Math.random() < 0.5 ? 1 : -1,
          speed: Math.random() * 1.1 + 0.5,
          scale: Math.random() * 0.7 + 0.7,
          wing: Math.random() * Math.PI * 2,
          bob: Math.random() * Math.PI * 2,

          update(w, h) {
            this.x += this.speed * this.dir;
            this.wing += 0.28;
            this.bob += 0.02;
            this.y = this.baseY + Math.sin(this.bob) * 16;
            if (this.dir > 0 && this.x > w + 50) { this.x = -50; this.baseY = Math.random() * h * 0.55 + h * 0.05; }
            if (this.dir < 0 && this.x < -50) { this.x = w + 50; this.baseY = Math.random() * h * 0.55 + h * 0.05; }
          },

          draw(ctx) {
            const flap = Math.sin(this.wing) * 0.7 + 0.35;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale * this.dir, this.scale);
            ctx.fillStyle = '#161616';
            // body + ears
            ctx.beginPath();
            ctx.ellipse(0, 0, 3.4, 5.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-2.6, -4); ctx.lineTo(-1.4, -7.5); ctx.lineTo(-0.4, -4.4);
            ctx.moveTo(2.6, -4); ctx.lineTo(1.4, -7.5); ctx.lineTo(0.4, -4.4);
            ctx.fill();
            // wings
            for (const s of [-1, 1]) {
              ctx.save();
              ctx.scale(s, 1);
              ctx.beginPath();
              ctx.moveTo(2.4, -0.5);
              ctx.quadraticCurveTo(11, -9 * flap, 19, -3 * flap);
              ctx.quadraticCurveTo(14, 3.5, 10.5, 2.2);
              ctx.quadraticCurveTo(8, 5.5, 5.5, 3.2);
              ctx.quadraticCurveTo(4, 5.2, 2.4, 3);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            }
            // glowing eyes
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(-1.3, -2.2, 0.7, 0, Math.PI * 2);
            ctx.arc(1.3, -2.2, 0.7, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        };
      }
      const emberColors = ['#ef4444', '#f97316', '#dc2626', '#fca5a5'];
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 1.8 + 1.2,
        color: emberColors[Math.floor(Math.random() * emberColors.length)],
        speedY: Math.random() * 0.6 + 0.25,
        drift: Math.random() * 0.4 - 0.2,
        wobble: Math.random() * Math.PI * 2,
        flicker: Math.random() * Math.PI * 2,

        update(w, h) {
          this.y -= this.speedY;              // embers rise
          this.wobble += 0.04;
          this.flicker += 0.15;
          this.x += this.drift + Math.sin(this.wobble) * 0.4;
          if (this.y < -10) { this.y = h + 10; this.x = Math.random() * w; }
        },

        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = 0.25 + Math.abs(Math.sin(this.flicker)) * 0.6;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      };
    }

    /* Portal Lab: lazy grey dust motes + the odd blue/orange energy fleck
       drifting up out of the portals */
    function makeDustMote(w, h) {
      const isSpark = Math.random() < 0.22;
      return {
        kind: isSpark ? 'spark' : 'mote',
        x: Math.random() * w,
        y: Math.random() * h,
        size: isSpark ? Math.random() * 2.2 + 1.4 : Math.random() * 1.6 + 0.8,
        color: isSpark ? (Math.random() < 0.5 ? '#38bdf8' : '#fb923c') : '#8a919c',
        vx: Math.random() * 0.3 - 0.15,
        vy: isSpark ? -(Math.random() * 0.25 + 0.1) : Math.random() * 0.12 + 0.03,
        wob: Math.random() * Math.PI * 2,
        tw: Math.random() * Math.PI * 2,

        update(w, h) {
          this.wob += 0.015;
          this.tw += 0.06;
          this.x += this.vx + Math.sin(this.wob) * 0.2;
          this.y += this.vy;
          if (this.y > h + 12) this.y = -12;
          if (this.y < -12) this.y = h + 12;
          if (this.x > w + 12) this.x = -12;
          if (this.x < -12) this.x = w + 12;
        },

        draw(ctx) {
          ctx.save();
          if (this.kind === 'spark') {
            ctx.globalAlpha = 0.25 + Math.abs(Math.sin(this.tw)) * 0.6;
            // Soft halo, then the fleck itself
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 2.4, 0, Math.PI * 2);
            ctx.globalAlpha *= 0.25;
            ctx.fill();
            ctx.globalAlpha = 0.35 + Math.abs(Math.sin(this.tw)) * 0.6;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      };
    }

    /* Deep Space: crisp pixel stars — squares and 4-point crosses snapped to
       whole pixels, drifting left on parallax with a CRT-style twinkle.
       ~4% of the slots are dormant shooting stars that streak by now and then. */
    function makePixelStar(w, h) {
      if (Math.random() < 0.04) {
        return {
          active: false,
          wait: Math.random() * 900 + 400,
          x: 0, y: 0, vx: 0, vy: 0, life: 0,

          update(w, h) {
            if (!this.active) {
              if (--this.wait <= 0) {
                this.active = true;
                this.vx = (Math.random() < 0.5 ? -1 : 1) * (Math.random() * 4 + 7);
                this.vy = Math.random() * 2.2 + 1.4;
                this.x = this.vx > 0 ? Math.random() * w * 0.4 : w - Math.random() * w * 0.4;
                this.y = Math.random() * h * 0.35;
                this.life = Math.random() * 26 + 30;
              }
              return;
            }
            this.x += this.vx;
            this.y += this.vy;
            if (--this.life <= 0 || this.x < -80 || this.x > w + 80 || this.y > h + 80) {
              this.active = false;
              this.wait = Math.random() * 1400 + 600;
            }
          },

          draw(ctx) {
            if (!this.active) return;
            // A fading trail of pixels behind the head
            for (let i = 0; i < 8; i++) {
              const px = (this.x - this.vx * i * 0.55) | 0;
              const py = (this.y - this.vy * i * 0.55) | 0;
              ctx.globalAlpha = Math.max(0, 0.9 - i * 0.12);
              ctx.fillStyle = i === 0 ? '#ffffff' : '#bcd7ff';
              ctx.fillRect(px, py, 3, 3);
            }
            ctx.globalAlpha = 1;
          }
        };
      }

      const size = Math.random() < 0.18 ? 4 : (Math.random() < 0.5 ? 2 : 3);
      const tints = ['#ffffff', '#ffffff', '#ffffff', '#cfe4ff', '#ffe9c9'];
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        size,
        cross: size === 4 && Math.random() < 0.7,
        color: tints[Math.floor(Math.random() * tints.length)],
        speedX: -(0.04 + size * 0.05 + Math.random() * 0.05), // bigger = closer = faster
        tw: Math.random() * Math.PI * 2,
        twSpeed: Math.random() * 0.06 + 0.03,

        update(w, h) {
          this.x += this.speedX;
          this.tw += this.twSpeed;
          if (this.x < -8) { this.x = w + 8; this.y = Math.random() * h; }
        },

        draw(ctx) {
          const glim = Math.abs(Math.sin(this.tw));
          const sx = this.x | 0, sy = this.y | 0, s = this.size;
          ctx.globalAlpha = 0.3 + glim * 0.7;
          ctx.fillStyle = this.color;
          if (this.cross) {
            // 4-point pixel sparkle; arms stretch at the twinkle's peak
            const arm = glim > 0.85 ? s + 2 : s;
            ctx.fillRect(sx - 1, sy - arm, 2, arm * 2);
            ctx.fillRect(sx - arm, sy - 1, arm * 2, 2);
            ctx.fillRect(sx - 1, sy - 1, 2, 2);
          } else {
            ctx.fillRect(sx, sy, s, s);
          }
          ctx.globalAlpha = 1;
        }
      };
    }

    /* Blue Metallic: chrome ball bearings drifting in zero-g with specular
       highlights and rim glints, tiny sparkle specks, and the occasional
       diagonal sheen sweeping across the screen. */
    function makeChromeOrb(w, h) {
      const roll = Math.random();
      if (roll < 0.06) {
        // A slow diagonal sheen sweep
        return {
          x: -w * 0.6, wait: Math.random() * 700 + 300, speed: Math.random() * 3 + 5,
          update(w, h) {
            if (this.wait > 0) { this.wait--; return; }
            this.x += this.speed;
            if (this.x > w * 1.6) { this.x = -w * 0.6; this.wait = Math.random() * 900 + 500; }
          },
          draw(ctx) {
            if (this.wait > 0) return;
            const chh = ctx.canvas.height;
            ctx.save();
            ctx.translate(this.x, 0);
            ctx.rotate(-0.32);
            const g = ctx.createLinearGradient(0, 0, 170, 0);
            g.addColorStop(0, 'rgba(255, 255, 255, 0)');
            g.addColorStop(0.5, 'rgba(220, 235, 255, 0.07)');
            g.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, -chh, 170, chh * 3);
            ctx.restore();
          }
        };
      }
      if (roll < 0.4) {
        // A tiny sparkle speck
        return {
          x: Math.random() * w, y: Math.random() * h,
          vx: Math.random() * 0.24 - 0.12, vy: Math.random() * 0.2 - 0.1,
          tw: Math.random() * Math.PI * 2, tws: Math.random() * 0.05 + 0.02,
          update(w, h) {
            this.x += this.vx; this.y += this.vy; this.tw += this.tws;
            if (this.x < -6) this.x = w + 6; if (this.x > w + 6) this.x = -6;
            if (this.y < -6) this.y = h + 6; if (this.y > h + 6) this.y = -6;
          },
          draw(ctx) {
            const a = Math.abs(Math.sin(this.tw));
            ctx.globalAlpha = 0.15 + a * 0.55;
            ctx.fillStyle = '#dcebff';
            ctx.fillRect(this.x - 1, this.y - 1, 2, 2);
            if (a > 0.9) {
              ctx.globalAlpha = (a - 0.9) * 6;
              ctx.fillRect(this.x - 4, this.y - 0.5, 8, 1);
              ctx.fillRect(this.x - 0.5, this.y - 4, 1, 8);
            }
            ctx.globalAlpha = 1;
          }
        };
      }
      // A chrome orb — smaller ones drift faster, like they weigh less
      const r = Math.random() * 20 + 7;
      return {
        r,
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() * 0.3 - 0.15) * (22 / r),
        vy: (Math.random() * 0.24 - 0.12) * (22 / r),
        bob: Math.random() * Math.PI * 2,
        tw: Math.random() * Math.PI * 2,
        update(w, h) {
          this.bob += 0.008;
          this.tw += 0.017;
          this.x += this.vx;
          this.y += this.vy + Math.sin(this.bob) * 0.08;
          const m = this.r + 4;
          if (this.x < -m) this.x = w + m; if (this.x > w + m) this.x = -m;
          if (this.y < -m) this.y = h + m; if (this.y > h + m) this.y = -m;
        },
        draw(ctx) {
          const { x, y, r } = this;
          const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
          g.addColorStop(0, '#f6faff');
          g.addColorStop(0.25, '#c2d4ea');
          g.addColorStop(0.6, '#5c7292');
          g.addColorStop(0.9, '#22334d');
          g.addColorStop(1, '#141f31');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          // Horizon reflection band across the lower half
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.clip();
          ctx.fillStyle = 'rgba(150, 185, 225, 0.22)';
          ctx.fillRect(x - r, y + r * 0.15, r * 2, r * 0.28);
          ctx.restore();
          // Specular dot
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.arc(x - r * 0.38, y - r * 0.42, Math.max(1, r * 0.13), 0, Math.PI * 2);
          ctx.fill();
          // Rim glint at the twinkle's peak
          const a = Math.abs(Math.sin(this.tw));
          if (a > 0.86) {
            const gx2 = x + r * 0.62, gy2 = y - r * 0.55;
            ctx.globalAlpha = (a - 0.86) * 7;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(gx2 - r * 0.3, gy2 - 1, r * 0.6, 2);
            ctx.fillRect(gx2 - 1, gy2 - r * 0.3, 2, r * 0.6);
            ctx.globalAlpha = 1;
          }
        }
      };
    }

    class PetalSystem {
      constructor(canvasId, count, makePetal) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        this.count = count;
        this.makePetal = makePetal;
        this.petals = [];
        this.animId = null;
        this.tick = this.tick.bind(this);
      }

      resize() {
        if (this.canvas) {
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;
        }
      }

      tick() {
        const { ctx, canvas } = this;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of this.petals) {
          p.update(canvas.width, canvas.height);
          p.draw(ctx);
        }
        this.animId = requestAnimationFrame(this.tick);
      }

      start() {
        if (!this.ctx || this.animId) return;
        this.resize();
        if (this.petals.length === 0) {
          this.petals = Array.from({ length: this.count }, () => this.makePetal(this.canvas.width, this.canvas.height));
        }
        this.tick();
      }

      stop() {
        if (this.animId) {
          cancelAnimationFrame(this.animId);
          this.animId = null;
        }
        if (this.ctx && this.canvas) {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    /* ---- SceneSystem ----
       Sibling of PetalSystem for full composed scenes (aquarium, night drive)
       rather than uniform particle swarms. Same start/stop/resize surface, so
       the EFFECTS registry treats both alike. buildState(canvas) returns the
       scene's world; drawFrame(ctx, canvas, state, t) paints one frame. */
    class SceneSystem {
      constructor(canvasId, buildState, drawFrame) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        this.buildState = buildState;
        this.drawFrame = drawFrame;
        this.state = null;
        this.animId = null;
        this.tick = this.tick.bind(this);
      }

      resize() {
        if (!this.canvas) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        // Rebuild a live scene so its layout fits the new viewport
        if (this.animId) this.state = this.buildState(this.canvas);
      }

      tick(now) {
        this.drawFrame(this.ctx, this.canvas, this.state, now);
        this.animId = requestAnimationFrame(this.tick);
      }

      start() {
        if (!this.ctx || this.animId) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.state = this.buildState(this.canvas);
        this.animId = requestAnimationFrame(this.tick);
      }

      stop() {
        if (this.animId) {
          cancelAnimationFrame(this.animId);
          this.animId = null;
        }
        if (this.ctx && this.canvas) {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    /* =====================================================================
       AQUARIUM — freshwater planted community tank.
       Stocking mirrors a proper 40-gallon community: a neon tetra school,
       glass catfish hovering in the current, mollies, corydoras working the
       sand (with the occasional dash to the surface for air), a bristlenose
       on the driftwood, cherry shrimp, a snail — over white sand with
       vallisneria, swords, an airstone column, and plants pearling.
       ===================================================================== */

    function buildAquarium(canvas) {
      const w = canvas.width, h = canvas.height;
      const sandTop = h * 0.88;

      const clump = (x, height, blades, colors, lw) => ({
        x, height, blades, lw,
        color: colors[Math.floor(Math.random() * colors.length)],
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.0007 + 0.0005
      });

      const backGreens = ['#1d6a51', '#20745a', '#286a4e'];
      const frontGreens = ['#2e9c6b', '#37b57c', '#2f8f5f', '#45c98a'];

      const dalmatianSpots = () => Array.from({ length: 9 }, () => ({
        dx: Math.random() * 1.4 - 0.7, dy: Math.random() * 0.6 - 0.3, r: Math.random() * 0.09 + 0.04
      }));
      const speckles = () => Array.from({ length: 8 }, () => ({
        dx: Math.random() * 1.4 - 0.7, dy: Math.random() * 0.5 - 0.35, r: Math.random() * 0.05 + 0.025
      }));

      return {
        w, h, sandTop,
        driftwood: { x: w * 0.17, y: sandTop + 8 },

        backPlants: Array.from({ length: 13 }, () =>
          clump(Math.random() * w, h * (Math.random() * 0.2 + 0.18), 3 + Math.floor(Math.random() * 3), backGreens, 3)),
        frontPlants: Array.from({ length: 8 }, () =>
          clump(Math.random() * w, h * (Math.random() * 0.28 + 0.24), 4 + Math.floor(Math.random() * 4), frontGreens, 5)),
        swords: [
          clump(w * 0.3 + Math.random() * w * 0.05, h * 0.24, 7, frontGreens, 9),
          clump(w * 0.68 + Math.random() * w * 0.05, h * 0.28, 8, frontGreens, 9)
        ],

        // The tetra school flocks — spawned already spread out so it starts
        // as a shoal rather than resolving out of one stacked pile
        tetras: Array.from({ length: 14 }, () => ({
          x: w * (0.12 + Math.random() * 0.5), y: h * (0.3 + Math.random() * 0.3),
          vx: Math.random() * 1.2 - 0.6, vy: Math.random() * 0.4 - 0.2,
          size: Math.random() * 3.5 + 11.5, dir: 1, wob: Math.random() * Math.PI * 2
        })),

        // Harlequin rasboras: loose copper shoal, that black wedge on the flank
        rasboras: Array.from({ length: 8 }, () => ({
          x: Math.random() * w * 0.7 + w * 0.15, y: h * (0.32 + Math.random() * 0.3),
          vx: Math.random() * 0.9 - 0.45, vy: Math.random() * 0.3 - 0.15,
          size: Math.random() * 3 + 14, dir: 1, wob: Math.random() * Math.PI * 2
        })),

        // A dwarf gourami, unbothered, trailing its two feelers
        gourami: {
          x: w * 0.55, y: h * 0.42, dir: -1, speed: 0.26, size: 40,
          wob: Math.random() * Math.PI * 2, vy: 0, targetY: h * 0.42, turnTimer: 600
        },

        // Otocinclus rasping algae off the glass and driftwood
        otos: Array.from({ length: 3 }, (_, i) => ({
          x: w * (0.2 + i * 0.3), y: h * (0.3 + Math.random() * 0.35),
          dir: Math.random() < 0.5 ? -1 : 1, size: 21,
          rasp: Math.random() * Math.PI * 2,
          restTimer: Math.random() * 900 + 400, moving: Math.random() < 0.5,
          vx: 0, vy: 0
        })),

        glassCats: Array.from({ length: 6 }, (_, i) => ({
          hx: w * (0.12 + (i % 3) * 0.055) + Math.random() * w * 0.02,
          hy: h * (0.26 + Math.floor(i / 3) * 0.07) + Math.random() * h * 0.03,
          len: Math.random() * 9 + 32, bob: Math.random() * Math.PI * 2,
          wspd: Math.random() * 0.4 + 0.8
        })),

        mollies: [
          { x: w * 0.25, y: h * 0.3, dir: 1, speed: 0.42, size: 25, kind: 'black', wob: Math.random() * Math.PI * 2 },
          { x: w * 0.6, y: h * 0.62, dir: -1, speed: 0.36, size: 24, kind: 'black', wob: Math.random() * Math.PI * 2 },
          { x: w * 0.42, y: h * 0.48, dir: 1, speed: 0.4, size: 23, kind: 'black', wob: Math.random() * Math.PI * 2 },
          { x: w * 0.7, y: h * 0.55, dir: -1, speed: 0.38, size: 23, kind: 'dalmatian', spots: dalmatianSpots(), wob: Math.random() * Math.PI * 2 }
        ],

        guppies: Array.from({ length: 7 }, (_, i) => ({
          x: Math.random() * w * 0.7 + w * 0.15, y: h * (0.25 + Math.random() * 0.45),
          dir: Math.random() < 0.5 ? -1 : 1, speed: Math.random() * 0.35 + 0.5,
          size: Math.random() * 2.3 + 9.2, burst: 0,
          tail: ['#ff8a3c', '#3fa8ff', '#ff5470', '#ffd23c', '#9c6bff'][i % 5],
          wob: Math.random() * Math.PI * 2, flit: Math.random() * 400 + 100
        })),

        whiteSkirts: Array.from({ length: 5 }, () => ({
          x: Math.random() * w * 0.6 + w * 0.2, y: h * (0.45 + Math.random() * 0.25),
          dir: Math.random() < 0.5 ? -1 : 1, speed: Math.random() * 0.2 + 0.3,
          size: Math.random() * 3.5 + 17.3, wob: Math.random() * Math.PI * 2
        })),

        corys: Array.from({ length: 3 }, () => ({
          x: Math.random() * w * 0.8 + w * 0.1, y: sandTop - 7,
          dir: Math.random() < 0.5 ? -1 : 1,
          speed: Math.random() * 0.3 + 0.3, size: 31, spots: speckles(),
          bob: Math.random() * Math.PI * 2, mode: 'bottom', vy: 0,
          airTimer: Math.random() * 1400 + 900
        })),

        pleco: { tail: Math.random() * Math.PI * 2 },

        shrimp: Array.from({ length: 6 }, () => ({
          x: Math.random() * w * 0.7 + w * 0.15, dir: Math.random() < 0.5 ? -1 : 1,
          speed: Math.random() * 0.1 + 0.05, sc: Math.random() * 0.25 + 1.25,
          hop: 0, hopTimer: Math.random() * 500 + 200,
          bob: Math.random() * Math.PI * 2
        })),

        snails: Array.from({ length: 3 }, (_, i) => ({
          x: w * (0.25 + i * 0.22) + Math.random() * w * 0.08,
          dir: Math.random() < 0.5 ? -1 : 1,
          speed: Math.random() * 0.03 + 0.035,
          sc: Math.random() * 0.2 + 1.25
        })),

        bubbles: Array.from({ length: 30 }, (_, i) => {
          const pearl = i > 21; // last few are tiny pearling bubbles off the plants
          return {
            pearl,
            x: pearl ? Math.random() * w : w * 0.82 + Math.random() * 12 - 6,
            y: sandTop - Math.random() * (h * 0.7),
            r: pearl ? Math.random() * 0.7 + 0.7 : Math.random() * 2.4 + 1.1,
            speed: pearl ? Math.random() * 0.5 + 0.35 : Math.random() * 1.1 + 1.1,
            wob: Math.random() * Math.PI * 2
          };
        }),

        rays: Array.from({ length: 3 }, (_, i) => ({
          x: w * (0.2 + i * 0.3), width: w * (0.05 + Math.random() * 0.05),
          tilt: Math.random() * 0.16 - 0.08, phase: Math.random() * Math.PI * 2
        })),

        pebbles: Array.from({ length: 14 }, () => ({
          x: Math.random() * w, y: sandTop + 8 + Math.random() * (h - sandTop - 14),
          rx: Math.random() * 5 + 2.5, shade: Math.random() * 50 | 0
        }))
      };
    }

    function drawAquaPlant(ctx, p, sandTop, t, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = p.color;
      ctx.lineCap = 'round';
      ctx.lineWidth = p.lw;
      const swayBase = Math.sin(t * p.speed + p.phase);
      for (let i = 0; i < p.blades; i++) {
        const bx = p.x + (i - p.blades / 2) * (p.lw + 1.5);
        const hgt = p.height * (0.72 + ((i * 37) % 10) / 24);
        const sway = (swayBase + Math.sin(t * p.speed * 1.7 + p.phase + i)) * (hgt * 0.06);
        ctx.beginPath();
        ctx.moveTo(bx, sandTop + 4);
        ctx.quadraticCurveTo(bx + sway * 0.4, sandTop - hgt * 0.55, bx + sway, sandTop - hgt);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAquarium(ctx, canvas, s, t) {
      const { w, h, sandTop } = s;
      ctx.clearRect(0, 0, w, h);

      // Light rays filtering down from the surface
      for (const r of s.rays) {
        const sway = Math.sin(t * 0.0003 + r.phase) * w * 0.02;
        ctx.save();
        ctx.globalAlpha = 0.07 + Math.abs(Math.sin(t * 0.0004 + r.phase)) * 0.05;
        ctx.fillStyle = '#f5ffe9';
        ctx.beginPath();
        ctx.moveTo(r.x + sway, -10);
        ctx.lineTo(r.x + sway + r.width, -10);
        ctx.lineTo(r.x + sway + r.width * 2.6 + w * r.tilt, h * 0.75);
        ctx.lineTo(r.x + sway - r.width * 1.6 + w * r.tilt, h * 0.75);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Driftwood (three tapering strokes + a stub branch)
      const dw = s.driftwood;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#4e3421';
      ctx.lineWidth = 15;
      ctx.beginPath();
      ctx.moveTo(dw.x - w * 0.02, dw.y);
      ctx.quadraticCurveTo(w * 0.2, h * 0.72, w * 0.33, h * 0.56);
      ctx.stroke();
      ctx.strokeStyle = '#5b3e28';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(w * 0.24, h * 0.71);
      ctx.quadraticCurveTo(w * 0.3, h * 0.64, w * 0.36, h * 0.62);
      ctx.stroke();
      ctx.strokeStyle = '#6b4a30';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(w * 0.28, h * 0.655);
      ctx.quadraticCurveTo(w * 0.31, h * 0.6, w * 0.31, h * 0.55);
      ctx.stroke();
      ctx.restore();

      // Background plants behind the fish
      for (const p of s.backPlants) drawAquaPlant(ctx, p, sandTop, t, 0.75);

      // White sand + pebbles
      const sandGrad = ctx.createLinearGradient(0, sandTop, 0, h);
      sandGrad.addColorStop(0, '#efe9da');
      sandGrad.addColorStop(1, '#cfc4ab');
      ctx.fillStyle = sandGrad;
      ctx.fillRect(0, sandTop, w, h - sandTop);
      for (const pb of s.pebbles) {
        ctx.fillStyle = `rgb(${150 + pb.shade}, ${140 + pb.shade}, ${125 + pb.shade})`;
        ctx.beginPath();
        ctx.ellipse(pb.x, pb.y, pb.rx, pb.rx * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---- Fish ----
      // Mollies cruise mid-water
      for (const m of s.mollies) {
        m.wob += 0.02;
        m.x += m.speed * m.dir;
        m.y += Math.sin(m.wob) * 0.25;
        if (m.x > w - 40 && m.dir > 0) m.dir = -1;
        if (m.x < 40 && m.dir < 0) m.dir = 1;
        const L = m.size;
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.scale(m.dir, 1);
        ctx.fillStyle = m.kind === 'black' ? '#15181c' : '#e8ecef';
        // Fan tail, then rounded body over it
        ctx.beginPath();
        ctx.moveTo(-L * 0.42, 0);
        ctx.lineTo(-L * 0.72, -L * 0.26);
        ctx.quadraticCurveTo(-L * 0.8, 0, -L * 0.72, L * 0.26);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.48, L * 0.24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath(); // dorsal
        ctx.moveTo(-L * 0.18, -L * 0.2);
        ctx.quadraticCurveTo(0, -L * 0.46, L * 0.14, -L * 0.2);
        ctx.closePath();
        ctx.fill();
        if (m.kind === 'dalmatian') {
          ctx.fillStyle = '#22262b';
          for (const sp of m.spots) {
            ctx.beginPath();
            ctx.arc(sp.dx * L * 0.4, sp.dy * L * 0.4, sp.r * L, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.fillStyle = m.kind === 'black' ? '#c9d2d8' : '#1a1e23';
        ctx.beginPath();
        ctx.arc(L * 0.32, -L * 0.04, L * 0.055, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Guppies flitting about behind their fancy tails
      for (const g of s.guppies) {
        g.wob += 0.06;
        if (--g.flit <= 0) {
          g.flit = Math.random() * 420 + 140;
          if (Math.random() < 0.4) g.dir *= -1;
          g.burst = 26;
        }
        const spd = g.speed + (g.burst > 0 ? (g.burst--, 1.3) : 0);
        g.x += spd * g.dir;
        g.y += Math.sin(g.wob) * 0.5;
        if (g.x > w - 30 && g.dir > 0) g.dir = -1;
        if (g.x < 30 && g.dir < 0) g.dir = 1;
        if (g.y < h * 0.15) g.y = h * 0.15;
        if (g.y > sandTop - 30) g.y = sandTop - 30;
        const L = g.size;
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.scale(g.dir, 1);
        ctx.fillStyle = g.tail; // the big fan tail
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(-L * 0.32, 0);
        ctx.quadraticCurveTo(-L * 1.15, -L * 0.62, -L * 1.28, -L * 0.1);
        ctx.quadraticCurveTo(-L * 1.34, 0, -L * 1.28, L * 0.1);
        ctx.quadraticCurveTo(-L * 1.15, L * 0.62, -L * 0.32, 0);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#d6dde2'; // slim body
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.42, L * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = g.tail; // dorsal flag in the tail colour
        ctx.beginPath();
        ctx.moveTo(-L * 0.05, -L * 0.12);
        ctx.quadraticCurveTo(-L * 0.3, -L * 0.42, -L * 0.42, -L * 0.12);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.28, -L * 0.02, L * 0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // White skirt tetras drifting mid-water
      for (const ws of s.whiteSkirts) {
        ws.wob += 0.025;
        ws.x += ws.speed * ws.dir;
        ws.y += Math.sin(ws.wob) * 0.3;
        if (ws.x > w - 40 && ws.dir > 0) ws.dir = -1;
        if (ws.x < 40 && ws.dir < 0) ws.dir = 1;
        const L = ws.size;
        ctx.save();
        ctx.translate(ws.x, ws.y);
        ctx.scale(ws.dir, 1);
        ctx.fillStyle = 'rgba(206, 216, 224, 0.7)'; // the flowing skirt fin
        ctx.beginPath();
        ctx.moveTo(L * 0.05, L * 0.16);
        ctx.quadraticCurveTo(-L * 0.2, L * 0.66, -L * 0.5, L * 0.3);
        ctx.lineTo(-L * 0.38, L * 0.08);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(216, 226, 234, 0.75)'; // tail
        ctx.beginPath();
        ctx.moveTo(-L * 0.42, 0);
        ctx.lineTo(-L * 0.64, -L * 0.2);
        ctx.lineTo(-L * 0.64, L * 0.2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#dde5ea'; // deep pale body
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.44, L * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120, 132, 142, 0.5)'; // faint shoulder bars
        ctx.lineWidth = L * 0.06;
        ctx.beginPath();
        ctx.moveTo(L * 0.16, -L * 0.24);
        ctx.lineTo(L * 0.14, L * 0.22);
        ctx.moveTo(L * 0.02, -L * 0.27);
        ctx.lineTo(0, L * 0.26);
        ctx.stroke();
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.3, -L * 0.06, L * 0.055, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Neon tetra school — proper flocking.
      // These used to each home in on one shared point with no awareness of
      // each other, so all twelve piled onto the same coordinate and swam as
      // one overlapping smear. Now each fish balances its neighbours
      // (separation / alignment / cohesion) and only *weakly* follows the
      // wandering school center, so the shoal holds real spacing and shape,
      // banks together, and drifts as a body.
      // School center dwells on the flanks (the card owns the middle),
      // crossing quickly when it changes sides
      const cx = w * (0.5 + 0.34 * Math.tanh(3 * Math.sin(t * 0.00006)));
      const cy = h * (0.42 + 0.12 * Math.sin(t * 0.00004 + 2));
      const NEIGH2 = 165 * 165;   // how far a tetra looks for schoolmates
      const PERSONAL = 46;        // below this they actively push apart
      for (const f of s.tetras) {
        let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, n = 0;
        for (const o of s.tetras) {
          if (o === f) continue;
          const dx = o.x - f.x, dy = o.y - f.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > NEIGH2) continue;
          const d = Math.sqrt(d2) || 0.0001;
          if (d < PERSONAL) {          // crowding — shove away, hardest when closest
            const push = (PERSONAL - d) / PERSONAL;
            sepX -= (dx / d) * push;
            sepY -= (dy / d) * push;
          }
          aliX += o.vx; aliY += o.vy;  // match the neighbours' heading
          cohX += o.x;  cohY += o.y;   // and stay with their center of mass
          n++;
        }
        if (n) {
          aliX /= n; aliY /= n; cohX /= n; cohY /= n;
          f.vx += sepX * 0.115 + (aliX - f.vx) * 0.05 + (cohX - f.x) * 0.00055;
          f.vy += sepY * 0.115 + (aliY - f.vy) * 0.05 + (cohY - f.y) * 0.00055;
        }
        // The wandering center is a hint, not a magnet
        f.vx += (cx - f.x) * 0.00016 + (Math.random() - 0.5) * 0.05;
        f.vy += (cy - f.y) * 0.00016 + (Math.random() - 0.5) * 0.04;
        // Keep the shoal off the glass
        const M = 26;
        if (f.x < M) f.vx += (M - f.x) * 0.004;
        if (f.x > w - M) f.vx -= (f.x - (w - M)) * 0.004;
        if (f.y < h * 0.16) f.vy += (h * 0.16 - f.y) * 0.004;
        if (f.y > sandTop - 20) f.vy -= (f.y - (sandTop - 20)) * 0.006;

        f.vx *= 0.985; f.vy *= 0.985;
        let sp = Math.hypot(f.vx, f.vy);
        if (sp > 1.5) { f.vx *= 1.5 / sp; f.vy *= 1.5 / sp; sp = 1.5; }
        if (sp < 0.32) {                // never fully stall mid-water
          const a = Math.atan2(f.vy, f.vx || 0.001);
          f.vx = Math.cos(a) * 0.32; f.vy = Math.sin(a) * 0.32;
        }
        f.x += f.vx; f.y += f.vy;
        if (Math.abs(f.vx) > 0.15) f.dir = f.vx > 0 ? 1 : -1;
        f.wob += 0.1;

        const L = f.size;
        ctx.save();
        ctx.translate(f.x, f.y + Math.sin(f.wob) * 0.6);
        ctx.scale(f.dir, 1);
        ctx.fillStyle = '#c9d6d9'; // silver body
        ctx.beginPath();
        ctx.ellipse(0, 0, L * 0.5, L * 0.21, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(228, 238, 243, 0.8)'; // tail
        ctx.beginPath();
        ctx.moveTo(-L * 0.48, 0);
        ctx.lineTo(-L * 0.7, -L * 0.17);
        ctx.lineTo(-L * 0.7, L * 0.17);
        ctx.closePath();
        ctx.fill();
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#3fd4ff'; // the neon stripe
        ctx.lineWidth = L * 0.13;
        ctx.beginPath();
        ctx.moveTo(L * 0.44, -L * 0.04);
        ctx.lineTo(-L * 0.14, -L * 0.05);
        ctx.stroke();
        ctx.strokeStyle = '#ff4646'; // red rear stripe
        ctx.beginPath();
        ctx.moveTo(-L * 0.48, L * 0.06);
        ctx.lineTo(0, L * 0.05);
        ctx.stroke();
        ctx.fillStyle = '#10151a';
        ctx.beginPath();
        ctx.arc(L * 0.34, -L * 0.03, L * 0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Harlequin rasboras — same flocking rules as the tetras but a looser,
      // slower shoal that hangs a little higher in the water
      const rcx = w * (0.5 - 0.3 * Math.tanh(3 * Math.sin(t * 0.00005 + 1.4)));
